<style>
/* Layout: one centred "stage" column like a lit set; scene unfolds line by line; remote-control bar pinned to the bottom. Deliberately single dark look (night-time Lagos, kerosene lamp). */
:root{
  --night:#0e1120; --stage:#161a2c; --stage2:#1d2238; --rule:#2b3150;
  --ink:#efe8db; --muted:#a3a0b4; --faint:#6e6c82;
  --lamp:#e9a23b; --lamp-ink:#1b1306; --blood:#d0525a; --ok:#7fd49a;
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --slug:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:10px 16px 8px}
.hrow{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,26px);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--rule);background:var(--stage);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--lamp)}
.score{font-family:var(--slug);font-size:12px;color:var(--muted)}
.score b{color:var(--lamp)}
.ticks{max-width:820px;margin:8px auto 0;display:grid;grid-template-columns:repeat(38,1fr);gap:2px}
.ticks button{height:6px;border:0;border-radius:2px;background:var(--rule);padding:0}
.ticks button.seen{background:color-mix(in srgb,var(--lamp) 45%,var(--rule))}
.ticks button.now{background:var(--lamp)}

main{max-width:820px;margin:0 auto;padding:24px 16px}
.scenehead{padding-block:8px 18px;border-bottom:1px dashed var(--rule);margin-bottom:18px}
.scenehead .num{font-family:var(--slug);color:var(--lamp);font-size:13px;letter-spacing:.12em}
.scenehead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.scenehead .slug{font-family:var(--slug);font-size:13px;color:var(--muted);text-transform:uppercase}
.scenehead .slug span{color:var(--faint)}
.scenehead.enter h2{animation:rise .7s ease both}
@keyframes rise{from{opacity:.2;transform:translateY(8px);letter-spacing:.04em}to{opacity:1;transform:none}}

.feed{display:flex;flex-direction:column;gap:14px}
.it{transition:opacity .3s, transform .3s;opacity:.55}
.it.cur{opacity:1}
.it.fresh{animation:appear .45s ease both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.act{font-style:italic;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 14px;max-width:62ch}
.it.cur.act{border-left-color:var(--lamp);color:var(--ink)}
.line{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--slug);font-weight:700;font-size:13px;color:var(--night);background:var(--c)}
.bub{min-width:0}
.who{font-family:var(--slug);font-weight:700;font-size:12.5px;letter-spacing:.08em;color:var(--c)}
.who em{font-style:normal;color:var(--faint);font-weight:400;margin-left:6px}
.say{background:var(--stage);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:10px 14px;margin-top:4px;font-size:17px;max-width:62ch}
.it.cur .say{border-color:var(--c);background:var(--stage2);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 8px 30px -12px color-mix(in srgb,var(--c) 50%,transparent)}
.dir{color:var(--faint);font-style:italic;font-size:14px}
.word.spoken{color:var(--c)}
.narr .say{background:transparent;border:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);border-radius:0;font-family:var(--display);font-size:20px;line-height:1.35;padding:12px 2px}
.narr .av{background:transparent;border:1px solid var(--lamp);color:var(--lamp)}
.it.cur.narr .say{box-shadow:none;background:transparent;border-color:var(--lamp)}
.card{align-self:center;text-align:center;background:#0a0c16;border:1px solid var(--blood);border-radius:12px;padding:16px 20px;max-width:520px;width:100%}
.card small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.16em;color:var(--blood);margin-bottom:6px}
.card p{margin:0;font-family:var(--slug);font-size:18px;font-weight:700}
.card.paper{background:#f1e7cf;border-color:#c9b98f;color:#2a2318}
.card.paper small{color:#8a6d2c}
.card.mw{background:transparent;border-color:var(--lamp);border-style:dashed}.card.mw small{color:var(--lamp)}
.titlecard{text-align:center;font-family:var(--display);font-size:clamp(22px,5vw,32px);color:var(--lamp);padding:28px 0;letter-spacing:.02em;text-wrap:balance}

.endbox{margin-top:26px;border:1px solid var(--rule);background:var(--stage);border-radius:16px;padding:18px}
.endbox h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.endbox p{margin:0 0 12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{background:var(--stage2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:left}
.opt:hover{border-color:var(--lamp)}
.opt.pick{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 18%,var(--stage2))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{background:var(--lamp);color:var(--lamp-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.count{font-family:var(--slug);font-size:12px;color:var(--faint)}
.reveal{margin-top:18px;border-radius:14px;padding:14px 16px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--stage))}
.reveal.miss{border-color:var(--blood);background:color-mix(in srgb,var(--blood) 10%,var(--stage))}
.reveal b{font-family:var(--slug);letter-spacing:.1em;font-size:12px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--stage) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dk{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.ctl button{background:var(--stage2);border:1px solid var(--rule);border-radius:999px;width:44px;height:44px;display:grid;place-items:center}
.ctl button:hover{border-color:var(--lamp)}
.ctl .play{width:60px;height:60px;background:var(--lamp);border:0;color:var(--lamp-ink)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl .play svg{width:26px;height:26px}
.opts2{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.opts2 label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts2 select{background:var(--stage2);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:3px 6px;font:inherit}
.nowline{font-family:var(--slug);font-size:12px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.drawer{position:fixed;inset:0;z-index:10;display:flex;justify-content:flex-end;background:rgba(5,6,12,.6)}
.drawer .pane{width:min(420px,100%);height:100%;background:var(--stage);border-left:1px solid var(--rule);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
.pane h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sl{display:flex;flex-direction:column;gap:2px}
.sl button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px}
.sl button:hover{background:var(--stage2)}
.sl button.now{background:color-mix(in srgb,var(--lamp) 16%,transparent)}
.sl .n{font-family:var(--slug);color:var(--lamp);font-size:12px}
.sl .t{min-width:0}
.sl .tm{font-family:var(--slug);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sl .seen .t::after{content:" ✓";color:var(--ok);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--night);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.hint{color:var(--faint);font-size:13px;text-align:center;margin-top:28px}
kbd{font-family:var(--slug);border:1px solid var(--rule);border-radius:4px;padding:0 4px;font-size:12px}
@media (max-width:520px){.score{display:none}.say{font-size:16px}.line{grid-template-columns:34px 1fr;gap:10px}.av{width:34px;height:34px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

rever. 1998.\""}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "quietly"}, {"s": "Papa. What did you do?"}]}]}, {"n": 3, "title": "THE WOMAN IN WHITE", "slug": "INT. BARRISTER OKONKWO'S CHAMBERS — WAITING ROOM — 9:55 AM", "time": "1:04–1:19", "items": [{"k": "act", "t": "Old law books and a ceiling fan. Geoffrey walks in. One woman sits alone: OLIVIA HART (31), in a perfect white suit and sunglasses, completely still. He gives her a polite nod."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Good morning. I guess you're waiting for the barrister too?"}]}, {"k": "act", "t": "She lowers her sunglasses slowly, looks him up and down, then puts them back on and turns her face away without a word."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "to himself, sitting"}, {"s": "…Good morning to you too."}]}, {"k": "act", "t": "He sits as far from her as possible. Silence. The fan ticks."}]}, {"n": 4, "title": "\"YOUR FATHER IS A THIEF\"", "slug": "INT. BARRISTER OKONKWO'S OFFICE — CONTINUOUS", "time": "1:19–2:29", "items": [{"k": "act", "t": "BARRISTER CHIOMA OKONKWO sits behind a desk piled with files. Geoffrey and Olivia sit facing her, three chairs apart."}, {"k": "line", "who": "BARRISTER OKONKWO", "tag": "", "segs": [{"s": "Mr. Durose, I'll be direct. Durose Holdings never belonged to your father. It belonged to my client's father, Elias Hart."}, {"d": "She gestures to Olivia."}, {"s": "Ms. Olivia Hart."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "laughing in disbelief"}, {"s": "No. No, that's not correct. My father founded Durose Holdings. I've seen the documents my whole life."}]}, {"k": "line", "who": "BARRISTER OKONKWO", "tag": "", "segs": [{"s": "We have records showing Elias Hart registered the company in 1996. Your father was an employee. Three days after Mr. Hart died, ownership was transferred entirely to Jacob Durose."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "standing, voice rising"}, {"s": "That's a lie! My father built that company with his hands! I have the documents!"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "standing too, removing her sunglasses"}, {"s": "Why are you shouting?"}, {"d": "cold"}, {"s": "It's MY father's company. Your father is a thief. He took everything my father built."}]}, {"k": "act", "t": "Geoffrey freezes. He knows that voice."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "slowly"}, {"s": "You're the woman who called me."}, {"d": "stepping toward her, shaking"}, {"s": "Don't you ever say that about my father again."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "not moving an inch"}, {"s": "What will you do? Slap me?"}, {"d": "beat"}, {"s": "Like your father slapped me when I was nine years old?"}]}, {"k": "act", "t": "Silence. Geoffrey's face goes blank."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "barely audible"}, {"s": "What?"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "You heard me, Mr. Durose."}]}, {"k": "act", "t": "Geoffrey looks from Olivia to the barrister, completely lost. He picks up his jacket."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "to the barrister"}, {"s": "I'll get back to you."}]}, {"k": "act", "t": "He walks out. Olivia watches him go, and for a split second her hard face cracks."}]}, {"n": 5, "title": "\"WHAT ARE YOU HIDING, MAMA?\"", "slug": "INT. DUROSE MANSION, IKOYI — SITTING ROOM — EVENING", "time": "2:29–3:19", "items": [{"k": "act", "t": "A huge, silent house with a large oil portrait of JACOB DUROSE on the wall. MRS. ADUNNI DUROSE (62), elegant, reads her Bible. Geoffrey storms in."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Mama. A woman came to a lawyer's office today and told me Papa is not the owner of Durose Holdings. That Papa stole it from a man called Elias Hart."}, {"d": "beat"}, {"s": "Is there anything you're hiding from me?"}]}, {"k": "line", "who": "MRS. DUROSE", "tag": "", "segs": [{"d": "closing the Bible slowly"}, {"s": "Since the day I married your father, he owned that building. He and Elias Hart worked together before. But the company was his."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "She says Papa slapped her. When she was nine."}]}, {"k": "act", "t": "Mrs. Durose's hand tightens on the Bible. A tiny pause."}, {"k": "line", "who": "MRS. DUROSE", "tag": "", "segs": [{"s": "Your father had a temper. You know that."}, {"d": "She looks away."}, {"s": "But he was not a thief."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "staring at the portrait"}, {"s": "Then why do I feel like everybody in this house is lying to me?"}]}, {"k": "act", "t": "He walks out. His mother looks up at the portrait of her husband, and she looks afraid."}]}, {"n": 6, "title": "THE DOCUMENTS", "slug": "INT. JACOB DUROSE'S OLD OFFICE — NIGHT", "time": "3:19–3:30", "items": [{"k": "act", "t": "The dusty office from Part One. Geoffrey pulls files from a steel cabinet and finds a leather folder marked \"CERTIFICATE OF INCORPORATION — DUROSE HOLDINGS — 1996 — FOUNDER: JACOB DUROSE.\""}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "relieved, almost laughing"}, {"s": "There. There it is. Papa, I knew it."}]}, {"k": "act", "t": "He holds it up to the lamp. His father's signature. A government seal. He doesn't see the tiny smudge under the founder's name."}]}, {"n": 7, "title": "FORGED", "slug": "INT. BARRISTER OKONKWO'S OFFICE — NEXT DAY", "time": "3:30–3:57", "items": [{"k": "act", "t": "Geoffrey and his lawyer, MR. BANJO, sit across from Olivia and Barrister Okonkwo. Geoffrey slides the leather folder across the table."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "My father's certificate. 1996. Founder: Jacob Durose. Read it."}]}, {"k": "act", "t": "Olivia barely glances at it."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "It's fake."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "It has a government seal!"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "So does every fake in Lagos."}, {"d": "She slides it to Barrister Okonkwo."}, {"s": "Check it."}]}, {"k": "act", "t": "The barrister holds the paper under a small UV lamp. Under the purple light, a second name glows faintly beneath \"JACOB DUROSE,\" scraped away and typed over: \"ELIAS HART.\""}, {"k": "line", "who": "BARRISTER OKONKWO", "tag": "", "segs": [{"d": "quietly"}, {"s": "The original name was removed and typed over, Mr. Durose. This document is forged."}]}, {"k": "act", "t": "Geoffrey stares at the glowing letters. He can't speak."}, {"k": "line", "who": "MR. BANJO", "tag": "", "segs": [{"d": "whispering"}, {"s": "Sir… I think we should go."}]}, {"k": "act", "t": "Geoffrey stands slowly, as if he's aged ten years, and walks out. Olivia watches him and doesn't look like she's won anything."}]}, {"n": 8, "title": "LOCKDOWN", "slug": "EXT. DUROSE HOLDINGS HEADQUARTERS, IKOYI — MORNING", "time": "3:57–4:33", "items": [{"k": "act", "t": "Court officials and police tape seal the glass doors. A notice is pasted on them: \"SEALED BY ORDER OF THE HIGH COURT OF LAGOS STATE.\" Staff stand outside, confused. Geoffrey's car pulls up, and right behind it, Donald's Range Rover and Michael's G-Wagon."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "jumping out"}, {"s": "Geoffrey! What is this? The banks just froze Three Boys Ventures! Durose Holdings carries a third of everything we own together!"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "My studio's account is frozen too! I have a crew of two hundred waiting to be paid!"}]}, {"k": "line", "who": "COURT OFFICIAL", "tag": "", "segs": [{"s": "Sirs, the court has sealed this company pending a claim of ownership. The claimant says Jacob Durose was never the owner."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "turning slowly to Geoffrey"}, {"s": "Never the owner?"}]}, {"k": "act", "t": "Geoffrey looks at the sealed doors, at his father's name on the gate and at his brothers. He doesn't say a word. He gets back into his car and drives away."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Geoffrey! GEOFFREY!"}]}]}, {"n": 9, "title": "\"WHO WANTS TO FALL IN LOVE?\"", "slug": "INT. GEOFFREY'S HOUSE, BANANA ISLAND — NIGHT", "time": "4:33–5:18", "items": [{"k": "act", "t": "Geoffrey sits in the dark with a drink. Donald and Michael let themselves in. Geoffrey tells them everything."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "A forged certificate. My father's handwriting, over another man's name. Twenty-two years, and I've been sitting in a stolen chair."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "gently"}, {"s": "You didn't know."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "pacing"}, {"s": "Knowing doesn't matter to the banks, Michael. We have billions tied to that company."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "laughing bitterly"}, {"s": "And her. Olivia Hart. She called my father a thief to my face."}, {"d": "He raises his glass."}, {"s": "This is why I'm grateful for that vow. Who on God's earth wants to fall in love? With a woman like that? Rude. Proud. Cruel."}, {"d": "beat"}, {"s": "Thank God for rule four."}]}, {"k": "act", "t": "Behind him, Donald and Michael slowly look at each other. Donald has a size thirty-eight heel hidden in his kitchen. Michael has \"Script Supervisor\" calling him at 2 a.m. They already know about each other. Neither says a word."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "clearing his throat"}, {"s": "…Yes. Rule four. Very… important rule."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "sipping his drink"}, {"s": "Very."}]}]}, {"n": 10, "title": "THE WOMAN WHO RAISED HER", "slug": "INT. OLIVIA'S PENTHOUSE, IKOYI — NIGHT", "time": "5:18–5:58", "items": [{"k": "act", "t": "Olivia sits on the balcony, her heels kicked off. MAMA GRACE (58), gentle, brings her tea."}, {"k": "line", "who": "MAMA GRACE", "tag": "", "segs": [{"s": "You won today. Why do you look like you lost?"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "staring at the city"}, {"s": "Because of his face, Mama, when the lawyer showed him the forgery. He really didn't know."}, {"d": "beat"}, {"s": "I watched something die in his eyes."}]}, {"k": "line", "who": "MAMA GRACE", "tag": "", "segs": [{"s": "You've waited twenty-two years for the truth, my daughter."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "I wanted the truth. I didn't want to break a man who was lied to the same way I was."}, {"d": "She sets down the tea."}, {"s": "I'm going to see him."}]}, {"k": "line", "who": "MAMA GRACE", "tag": "", "segs": [{"s": "At this hour?"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Tomorrow."}, {"d": "beat"}, {"s": "Before I lose my courage."}]}]}, {"n": 11, "title": "THE SLAP", "slug": "INT. GEOFFREY'S HOUSE — FRONT DOOR / SITTING ROOM — NEXT DAY", "time": "5:58–7:45", "items": [{"k": "act", "t": "A knock. Geoffrey opens the door, unshaven and in a T-shirt. Olivia stands there without the sunglasses or the white suit, just a simple dress."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "stunned"}, {"s": "How do you know where I live?"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "I asked a friend who knows a friend. This is Lagos."}, {"d": "beat"}, {"s": "May I come in?"}]}, {"k": "act", "t": "Inside, they sit at opposite ends of the sofa."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "I came to say I'm sorry. For \"thief.\" I was angry for twenty-two years and I threw all of it at you."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "quietly"}, {"s": "It's alright."}, {"d": "beat"}, {"s": "But I need to ask you something. You said my father slapped you. When?"}]}, {"k": "act", "t": "She looks at her hands for a long moment."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "I was nine. I found your father alone in Papa's office, going through Papa's papers. I said, \"Uncle Jacob, why are you touching Papa's things?\""}, {"d": "beat"}, {"s": "He slapped me so hard I fell. Then he whispered, \"If you ever tell your father, you'll regret the day you were born.\""}, {"d": "beat"}, {"s": "Papa died three weeks later. I never told anyone."}]}, {"k": "act", "t": "Geoffrey closes his eyes. His jaw shakes."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I'm sorry."}, {"d": "His voice breaks."}, {"s": "I'm so sorry my father did that to you. I didn't know. I swear to God, I didn't know."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "I know."}, {"d": "beat"}, {"s": "My father lied to me too, Geoffrey. He beat the woman who raised me. He hid things from me my whole childhood."}, {"d": "She smiles sadly."}, {"s": "I forgot you might be going through the same thing. I'm sorry for that too."}]}, {"k": "act", "t": "A long silence. Two children of liars, sitting on one sofa."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Then let's stop guessing. Let's go to the bottom of this. Both of us. Whatever the truth is, even if it's ugly."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "after a beat"}, {"s": "I know where to start. There's an old man, Baba Sule. He cleaned my father's office when Papa was alive. He saw everything."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Then we'll go and see Baba Sule."}]}]}, {"n": 12, "title": "\"BROTHER, YOU MADE A VOW\"", "slug": "EXT. THREE BOYS VENTURES — CAR PARK, IKOYI — MORNING", "time": "7:45–9:17", "items": [{"k": "act", "t": "Donald and Michael stand by their cars. Geoffrey arrives with a travel bag."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I'm going on a trip. A few days. I need to clear my head."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "exploding"}, {"s": "A TRIP? The banks have frozen us and you're going on a TRIP? Do you know how much WE put into that company?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Donald, calm down. Calm down."}, {"d": "to Geoffrey"}, {"s": "What kind of trip? Vacation?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I'm going to prove the company belongs to my father. That's all. I'm going to get it back for all of us."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "relaxing"}, {"s": "Okay. Okay, that's good. Is that all?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "That's all."}]}, {"k": "act", "t": "A huge black SUV glides into the car park. The rear window slides down. Olivia leans out, smiling."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Geoffrey! I'm here. Are you ready?"}]}, {"k": "act", "t": "Donald and Michael turn very, very slowly to look at Geoffrey."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "dangerously quiet"}, {"s": "Brother. You made a vow."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Calm down. Calm down! I'm not doing anything with her. We're going to find the truth, that's all."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "\"We\"? You and the woman who froze our accounts?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Are you about to sell the company to her? Is that it?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I'm not selling anything! I'm still in the vow. No woman can shake me."}, {"d": "firm"}, {"s": "I'm proving this business belongs to my father. Nothing more. I know my father. I believe him."}]}, {"k": "act", "t": "A long, tense beat."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Fine. Just stay in touch with us."}]}, {"k": "act", "t": "Donald gets into his car and slams the door without another word. Michael follows. Geoffrey walks to the SUV and gets in beside Olivia."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "watching the cars leave"}, {"s": "Wow. Is that how your friends talk to you?"}, {"d": "beat"}, {"s": "That's toxic, Geoffrey. Nobody should talk to you like that."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "quietly"}, {"s": "They're my brothers. That's just how they talk."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "quietly"}, {"s": "That's not an answer."}]}]}, {"n": 13, "title": "BABA SULE", "slug": "EXT. BABA SULE'S COMPOUND, ABEOKUTA — DAY", "time": "9:17–10:17", "items": [{"k": "act", "t": "A small, neat compound under a mango tree. BABA SULE (70s) sits on a bench with a walking stick. Olivia kneels to greet him in the traditional way. Geoffrey bows."}, {"k": "line", "who": "BABA SULE", "tag": "", "segs": [{"d": "squinting"}, {"s": "Olivia? Little Olivia Hart?"}, {"d": "He laughs and takes her face in his hands."}, {"s": "You used to steal sugar from the office tea tray!"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "laughing"}, {"s": "Baba, you never reported me."}]}, {"k": "line", "who": "BABA SULE", "tag": "", "segs": [{"d": "turning to Geoffrey and going cold"}, {"s": "And this one has his father's face."}, {"d": "beat"}, {"s": "Jacob's son."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Yes, Baba. I've come for the truth. Even if it's about my father."}]}, {"k": "line", "who": "BABA SULE", "tag": "", "segs": [{"d": "after a long pause"}, {"s": "I left that office because Jacob Durose fired me. Two weeks after Elias died. He said I was \"too old to clean.\""}, {"d": "He taps his stick."}, {"s": "I was forty-eight."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Were they partners, Baba? My father and Mr. Hart?"}]}, {"k": "line", "who": "BABA SULE", "tag": "", "segs": [{"s": "Partners?"}, {"d": "He laughs sadly."}, {"s": "My son, Elias Hart owned that company. Your father was his clerk. He worked like a donkey for fifteen years, and every year Elias promised him shares. \"Next year, Jacob.\""}, {"d": "beat"}, {"s": "He never gave him one."}]}, {"k": "act", "t": "Geoffrey sits down slowly on the bench. He takes out the photograph: \"Jacob & Elias. Partners forever. 1998.\""}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "whispering"}, {"s": "He wrote \"partners\" on a photograph. And never on a contract."}]}]}, {"n": 14, "title": "A HOME OF LIES", "slug": "INT. SMALL RESTAURANT, ABEOKUTA — EVENING", "time": "10:17–11:31", "items": [{"k": "act", "t": "A quiet local restaurant with plates of amala and ewedu and a ceiling fan. Geoffrey and Olivia eat, and for the first time they're relaxed."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "You eat amala like a man who's never seen food."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I grew up in Ajegunle before my father got rich. Amala was a Sunday luxury."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "surprised"}, {"s": "You? Ajegunle? I thought you were born with a silver spoon."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Plastic spoon. The silver one arrived when I was fifteen, the week my father said \"something happened.\""}, {"d": "beat"}, {"s": "Now I know what happened. Your father died."}]}, {"k": "act", "t": "Olivia puts down her spoon."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Want to know the biggest lie of my life? The woman who raised me isn't my mother. At fifteen, I found a lawyer's letter in Papa's drawer. My real mother died giving birth to me. And my grandfather had left me an island in the Lekki lagoon. Papa hid both from me."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "softly"}, {"s": "Fifteen. That's when my father's lies began, and yours ended."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "We grew up in two houses full of lies, Geoffrey. Different houses. Same lies."}]}, {"k": "act", "t": "A comfortable silence falls between them."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "clearing his throat"}, {"s": "Would you… like to hang out some more? After this?"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "raising an eyebrow, smiling"}, {"s": "Are we not hanging out right now?"}]}]}, {"n": 15, "title": "THE SHOES", "slug": "EXT. ABEOKUTA STREET — NIGHT", "time": "11:31–11:52", "items": [{"k": "act", "t": "A long road under streetlights. They walk slowly back to the hotel, talking and laughing. Olivia winces with every step. Her very high heels are killing her."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "You're limping."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "I'm fine. CEOs don't limp."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "stopping"}, {"s": "Sit."}]}, {"k": "act", "t": "He sits her down on a low wall, kneels and takes off his own shoes and socks."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Geoffrey, what are you doing?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "gently removing her heels and slipping his shoes onto her feet"}, {"s": "They're too big. But they're flat."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "And you?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "standing barefoot on the road, holding her heels"}, {"s": "I grew up in Ajegunle. My feet remember."}]}, {"k": "act", "t": "They walk on. She shuffles in his giant shoes, laughing. He walks barefoot beside her, carrying her heels. She can't stop smiling."}]}, {"n": 16, "title": "\"I THINK I'M FALLING\"", "slug": "INT. HOTEL — OLIVIA'S ROOM / GEOFFREY'S ROOM — NIGHT — SPLIT SCREEN", "time": "11:52–12:34", "items": [{"k": "act", "t": "LEFT: Olivia lies on the bed, still wearing his shoes, on the phone with her best friend KEMI."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Kemi. He gave me his shoes. He walked home barefoot. A billionaire, barefoot on the road in Abeokuta."}]}, {"k": "line", "who": "KEMI", "tag": "ON PHONE", "segs": [{"s": "Olivia Hart. Are you smiling? I can HEAR you smiling!"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "covering her face"}, {"s": "I think… I think I'm falling in love with him, Kemi. The son of the man who slapped me. What is wrong with me?"}]}, {"k": "act", "t": "RIGHT: Geoffrey stands at the bathroom mirror, staring at himself."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "to his reflection"}, {"s": "You are NOT falling for this girl."}, {"d": "beat"}, {"s": "She's beautiful. She's brilliant. She understands you without a word."}, {"d": "He grips the sink."}, {"s": "And you made a vow. With your brothers."}]}, {"k": "act", "t": "He looks down at his dusty bare feet and smiles anyway."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "…Oh, God."}]}]}, {"n": 17, "title": "THE PRISON GATE", "slug": "EXT. AGODI CORRECTIONAL CENTRE, IBADAN — WAITING AREA — DAY", "time": "12:34–13:22", "items": [{"k": "act", "t": "A dusty waiting area with long benches. Baba Sule told them that Elias Hart's personal assistant, Mr. Ayo Lawal, has been in this prison for twenty-two years. Olivia and Geoffrey sit and wait. Geoffrey's phone rings: DONALD."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "standing"}, {"s": "Excuse me. I have to take this."}]}, {"k": "act", "t": "He walks to the far end of the yard."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Donald."}]}, {"k": "line", "who": "DONALD", "tag": "ON PHONE", "segs": [{"s": "Where are you? Have you proved it yet? Have you shown that girl the company is your father's?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I'm working on it. Calm down."}]}, {"k": "line", "who": "DONALD", "tag": "ON PHONE", "segs": [{"s": "I'm serious, Geoffrey. She picked you up in her car. Same hotel. Are you dating her?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I am NOT dating her! I'm still in the vow!"}, {"d": "beat"}, {"s": "And Donald? I hate the way you talk to me. You don't know how to talk to me."}]}, {"k": "line", "who": "DONALD", "tag": "ON PHONE", "segs": [{"d": "scoffing"}, {"s": "Oh. Oh, now she's told you that too? \"Toxic\"? I can hear her words in your mouth, Geoffrey—"}]}, {"k": "act", "t": "Geoffrey hangs up and switches the phone off."}]}, {"n": 18, "title": "CORPORAL IRO", "slug": "EXT. PRISON WAITING AREA — CONTINUOUS", "time": "13:22–14:04", "items": [{"k": "act", "t": "A prison officer, CORPORAL IRO, sits down far too close to Olivia."}, {"k": "line", "who": "CORPORAL IRO", "tag": "", "segs": [{"s": "Fine girl. You're too beautiful for this kind of place. Give me your number. I'll make sure you see your person quickly."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "moving away"}, {"s": "No, thank you."}]}, {"k": "line", "who": "CORPORAL IRO", "tag": "", "segs": [{"d": "grabbing her wrist"}, {"s": "Ah-ah! Why are you forming? Just your number—"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Leave me alone! Get your hands off me!"}]}, {"k": "act", "t": "Across the yard, Geoffrey turns at her scream. He runs, grabs the officer by the collar, pulls him off Olivia and shoves him hard to the ground."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Don't you EVER touch her!"}]}, {"k": "act", "t": "Whistles blow. Four officers rush in and tackle Geoffrey to the ground, beating him with batons."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Stop! STOP! He was protecting me! Let him go!"}]}, {"k": "line", "who": "CORPORAL IRO", "tag": "", "segs": [{"d": "dusting himself off, sneering"}, {"s": "He assaulted an officer of the state. He'll sleep inside today. And tomorrow. And the day after."}]}, {"k": "act", "t": "They drag Geoffrey away. He looks back at Olivia, bleeding from his lip."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "calling out"}, {"s": "Are you hurt? Olivia! Are you hurt?"}]}, {"k": "act", "t": "The steel gate clangs shut."}]}, {"n": 19, "title": "THREE DAYS", "slug": "INT. PRISON CELL — NIGHT / INT. OLIVIA'S SUV — NIGHT — INTERCUT", "time": "14:04–14:32", "items": [{"k": "act", "t": "A crowded, dark cell. Geoffrey sits against the wall with bruises on his face, still barefoot because they took his shoes at the gate."}, {"k": "act", "t": "In her SUV, Olivia is on the phone, crying and furious, while her BODYGUARD drives."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Uncle Rotimi, please. They've had him for a day. They're beating him. I don't care who you call. Call the Controller-General. Call the governor. Call God!"}]}, {"k": "line", "who": "UNCLE ROTIMI", "tag": "ON PHONE", "segs": [{"s": "Calm down, my daughter. I know the Controller. I'll make the call tonight. But who is this man to you?"}]}, {"k": "act", "t": "Olivia doesn't answer."}]}, {"n": 20, "title": "BROTHERS AT WAR", "slug": "INT. THREE BOYS VENTURES — BOARDROOM — DAY — DAY THREE", "time": "14:32–16:22", "items": [{"k": "act", "t": "Donald paces with his phone to his ear while Michael sits."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Third day. Not one call."}, {"d": "He throws the phone down."}, {"s": "I KNEW it. He's fallen for her."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Calm down, Donald. Geoffrey won't do that. Not with the business on the line."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Geoffrey has the softest heart of the three of us! You know it! A woman like that eats a soft heart for breakfast!"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "standing"}, {"s": "Okay, he does. And so what?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "narrowing his eyes"}, {"s": "Oh. Oh, I see what you're doing. You're defending him because you've got your own girl. \"Script Supervisor.\""}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "not missing a beat"}, {"s": "And what's Emma to you?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "freezing"}, {"s": "…What? You think I'm falling for Emma?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I don't know. You tell me."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I can't have this conversation with you right now."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Oh, really? Then have THIS one. If this business falls, you'll owe me and Geoffrey, because we put more money into Durose than you did. You did nothing but take Emma on fancy dates!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "When have you EVER seen me on a date with Emma?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I haven't. But it looks like that's where we're heading, Chairman."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "grabbing his keys"}, {"s": "I can't do this with you, Michael."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Why not? Do it with me!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "This is nonsense!"}]}, {"k": "act", "t": "He storms out."}, {"k": "act", "t": "INT. DONALD'S CAR — MOMENTS LATER. Donald grips the wheel, breathing hard."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "to himself"}, {"s": "He knows. He knows about Emma."}, {"d": "beat"}, {"s": "No. He's guessing. Michael always guesses."}, {"d": "He hits the steering wheel."}, {"s": "Are they going to find out? Are they going to find out I'm dating Emma?"}]}, {"k": "act", "t": "His phone lights up: \"E. Reardon.\" He stares at it, then answers softly."}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"s": "Hi, you."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "quietly"}, {"s": "Emma. Am I becoming the man who stops his brother from being happy, just so nobody finds out I'm happy too?"}]}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"d": "gently"}, {"s": "You're becoming a man who's scared."}, {"d": "beat"}, {"s": "But Donald, from the outside those look exactly the same."}]}, {"k": "act", "t": "Donald closes his eyes."}]}, {"n": 21, "title": "RELEASED", "slug": "EXT. AGODI CORRECTIONAL CENTRE — GATE — NIGHT", "time": "16:22–16:47", "items": [{"k": "act", "t": "The gate opens. Geoffrey limps out, bruised and filthy, and still barefoot. Olivia runs to him. Uncle Rotimi stands by the cars."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "rushing to him"}, {"s": "Look what they did to you. Look what I did to you."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "weakly smiling"}, {"s": "You didn't do anything."}, {"d": "beat"}, {"s": "Did he touch you again? After I was gone?"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "crying"}, {"s": "Three days in a cell, and that's your first question?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "It's the only question."}]}, {"k": "act", "t": "His knees buckle. She catches him."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "shouting"}, {"s": "Hospital! NOW!"}]}]}, {"n": 22, "title": "\"SHE'S NOT MY WOMAN\"", "slug": "INT. PRIVATE HOSPITAL ROOM, IBADAN — DAY", "time": "16:47–17:50", "items": [{"k": "act", "t": "Geoffrey lies in bed with a drip in his arm. Olivia sits beside him, spoon-feeding him pepper soup she cooked herself."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I can feed myself."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "You can't even lift a cup. Open."}]}, {"k": "act", "t": "He opens his mouth obediently. A NURSE enters and checks his vitals."}, {"k": "line", "who": "NURSE", "tag": "", "segs": [{"s": "How are you feeling today, sir?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Better, thank you. Just some painkillers, please."}]}, {"k": "act", "t": "Olivia steps out to take a call. The nurse lowers her voice and smiles."}, {"k": "line", "who": "NURSE", "tag": "", "segs": [{"s": "Sir, I've worked here eleven years. I have never seen a woman take care of a man the way your woman takes care of you."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "quickly"}, {"s": "Ah, she's not my woman."}]}, {"k": "line", "who": "NURSE", "tag": "", "segs": [{"d": "hands on hips"}, {"s": "Are you sure? She cooked that soup at five this morning. And she's slept in that chair two nights."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "We're… just friends."}]}, {"k": "line", "who": "NURSE", "tag": "", "segs": [{"d": "leaving"}, {"s": "Hmm. Okay, sir. \"Friends.\""}]}, {"k": "act", "t": "Olivia returns and sits. She is quiet for a moment."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "I'm sorry. I put you in danger. You went to prison because of me."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "You didn't."}, {"d": "beat"}, {"s": "My father taught me many wrong things. My mother taught me one right one: a man doesn't stand there while a woman is touched against her will."}, {"d": "beat"}, {"s": "I'd do it again."}]}, {"k": "act", "t": "Her eyes fill up. She squeezes his hand."}]}, {"n": 23, "title": "THE ESCAPE FROM THE HOSPITAL", "slug": "INT. HOSPITAL ROOM — NIGHT", "time": "17:50–18:20", "items": [{"k": "act", "t": "Olivia picks up her bag."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Tomorrow I'm going back to the prison. Alone. I'll see Mr. Lawal myself. You need to rest."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "trying to sit up"}, {"s": "No. No, I'm coming with you."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Geoffrey, you can barely sit up!"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I'm not letting you walk back into that place alone."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "blushing slightly, firm"}, {"s": "You're staying in this bed. That's final. Goodnight."}]}, {"k": "act", "t": "She leaves. Later, the nurse turns off the light."}, {"k": "line", "who": "NURSE", "tag": "", "segs": [{"s": "Sleep now, sir. Doctor's orders."}]}, {"k": "act", "t": "The door closes. In the dark, Geoffrey's phone lights up his face. He looks at the drip in his arm, then at the door. He pulls the tape off and slides the drip out, wincing. He pulls on his clothes, limps to the window and slips out."}]}, {"n": 24, "title": "MR. LAWAL", "slug": "INT. AGODI CORRECTIONAL CENTRE — VISITING ROOM — NEXT MORNING", "time": "18:20–19:48", "items": [{"k": "act", "t": "Olivia sits alone at a scratched table. The door opens behind her, and she turns. It's Geoffrey, pale, bruised and leaning on the door frame."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "standing, shocked"}, {"s": "What are you doing here?! You're supposed to be in hospital!"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I told you. There's no way I'm letting you walk in here alone."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "half angry, half melting"}, {"s": "You're impossible."}]}, {"k": "act", "t": "Another door opens. Two guards bring in MR. AYO LAWAL (60s), thin and grey in a faded prison uniform. He sits and squints at Olivia."}, {"k": "line", "who": "MR. LAWAL", "tag": "", "segs": [{"s": "Who are you? What do you want from me?"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "softly"}, {"s": "I'm Olivia, sir. Elias Hart's daughter."}]}, {"k": "act", "t": "Mr. Lawal's face crumples. His hands shake."}, {"k": "line", "who": "MR. LAWAL", "tag": "", "segs": [{"s": "Olivia? Little Olivia?"}, {"d": "He reaches for her hands."}, {"s": "You've grown. You've grown so much."}, {"d": "urgently"}, {"s": "Tell me you took your father's company back from that wicked man. Tell me you did it."}]}, {"k": "act", "t": "Olivia and Geoffrey freeze."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Which wicked man, sir?"}]}, {"k": "line", "who": "MR. LAWAL", "tag": "", "segs": [{"s": "Jacob Durose!"}, {"d": "His voice rises."}, {"s": "When your father died, I went to tell the lawyers the papers had been changed. Jacob had me arrested first. Forged cheques in my desk."}, {"d": "He's crying."}, {"s": "Twenty-two years, my daughter, for a crime I never committed."}]}, {"k": "act", "t": "Silence. Olivia covers her mouth. Geoffrey stands up slowly."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "gently"}, {"s": "Mr. Lawal. This is Geoffrey."}, {"d": "beat"}, {"s": "Jacob's son."}]}, {"k": "act", "t": "Mr. Lawal stares at Geoffrey with fear, then anger. Geoffrey walks around the table, kneels on the prison floor in front of the old man and takes his shaking hands."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Sir. I'm so sorry for what my father did to you."}, {"d": "His voice breaks."}, {"s": "I can't give you back twenty-two years. But I swear on my life, I'll get you out. Please forgive me."}]}, {"k": "act", "t": "A long, long silence. Then Mr. Lawal places a trembling hand on Geoffrey's head, like a blessing."}, {"k": "line", "who": "MR. LAWAL", "tag": "", "segs": [{"d": "crying"}, {"s": "You're not your father, my son."}, {"d": "beat"}, {"s": "Listen. Elias told me he'd finally make Jacob a partner, but I never saw the paper. And Jacob never destroyed anything. Too proud. Look in the old cabinet at his lodge in the Ogun forest."}]}]}, {"n": 25, "title": "A HUG IN THE CAR PARK", "slug": "EXT. PRISON CAR PARK — DAY", "time": "19:48–20:26", "items": [{"k": "act", "t": "Olivia helps Geoffrey toward the SUV. She is shaking with emotion."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "We have to get that old man out. Today. He's too old for that place."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Of course. But first we need the documents, to prove my father forged—"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "stopping him"}, {"s": "No. The documents can wait. A man's life can't."}, {"d": "beat"}, {"s": "My lawyer will get him out. And you're going back to that hospital. Right now."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Olivia—"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Your company matters, Geoffrey. Your father's name matters. But your life comes first."}]}, {"k": "act", "t": "Then, without warning, she wraps her arms around him in a quick, tight hug. She lets go and gets into the car before he can react."}, {"k": "act", "t": "Geoffrey stands frozen in the car park, still feeling the hug."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "whispering to himself"}, {"s": "Have I found my lady?"}]}]}, {"n": 26, "title": "\"THE WAY YOU CARE FOR HIM\"", "slug": "EXT. AGODI CORRECTIONAL CENTRE — GATE — EVENING — TWO DAYS LATER", "time": "20:26–21:07", "items": [{"k": "act", "t": "The gate opens. Mr. Lawal walks out in new clothes and blinks at the sky. Olivia and Barrister Okonkwo wait for him. He grabs Olivia's hands."}, {"k": "line", "who": "MR. LAWAL", "tag": "", "segs": [{"s": "Free. After twenty-two years. God bless you, my daughter."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Thank Geoffrey. He's paying for your lawyer. And your house. And your pension."}]}, {"k": "line", "who": "MR. LAWAL", "tag": "", "segs": [{"d": "studying her face, smiling"}, {"s": "Olivia. Are you sure there's nothing between you and that boy?"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "too fast"}, {"s": "What do you mean?"}]}, {"k": "line", "who": "MR. LAWAL", "tag": "", "segs": [{"s": "I'm an old man. I've been in a cell for twenty-two years. But I'm not blind."}, {"d": "beat"}, {"s": "The way you two care for each other. That's not business."}, {"d": "He pats her hand."}, {"s": "Go to him. Life is too short to stay in prison by choice."}]}]}, {"n": 27, "title": "THE INTRUDERS", "slug": "INT. GEOFFREY'S HOUSE — DAY — ONE WEEK LATER", "time": "21:07–22:28", "items": [{"k": "act", "t": "Geoffrey, discharged and still bruised, unlocks his front door. Olivia is beside him, carrying his bag. She insisted on seeing him home safely. The door swings open. Donald and Michael are sitting in his living room."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "startled"}, {"s": "Jesus! What are you doing in my house? How did you even get my key?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "standing"}, {"s": "Is that really the question you should be asking right now?"}, {"d": "beat"}, {"s": "What happened to the business? Did you prove to this girl that it's yours?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Donald, please. Stop it. Can't you see I'm not well?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I can see you've been gone two weeks and you've come home with HER."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "stepping forward"}, {"s": "Is this how you talk to him? He just came out of hospital. He deserves respect."}, {"d": "beat"}, {"s": "And what business are you talking about? What do you mean \"OUR\" business?"}]}, {"k": "act", "t": "Donald stares at her. Then he laughs coldly."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Oh. You didn't tell her?"}, {"d": "to Geoffrey"}, {"s": "You didn't tell her we're partners? I suppose you were busy falling in love."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "shaking"}, {"s": "Donald. Get out of my house."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "to Olivia"}, {"s": "That company isn't yours yet. And if you think you can use your father's business to get to us through Geoffrey's soft heart, it won't happen."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "grabbing Donald's arm"}, {"s": "Okay. Okay, Donald, it's enough. Let's go. Let's go NOW."}]}, {"k": "act", "t": "Michael pulls Donald toward the door. Geoffrey catches Michael's sleeve."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "low, hurt"}, {"s": "How did you allow this, Michael?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "sadly"}, {"s": "Brother, I don't know what's wrong with Donald these days."}]}, {"k": "act", "t": "They leave. The door shuts. Silence."}]}, {"n": 28, "title": "\"WHAT VOW?\"", "slug": "INT. GEOFFREY'S HOUSE — CONTINUOUS", "time": "22:28–23:25", "items": [{"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "quietly"}, {"s": "What vow, Geoffrey? What partnership?"}, {"d": "beat"}, {"s": "Tell me the truth."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "sitting heavily"}, {"s": "Donald and Michael own part of Durose through our partnership. The court froze them too."}, {"d": "beat"}, {"s": "And years ago, the three of us vowed on a rooftop never to fall in love."}]}, {"k": "act", "t": "Olivia goes very still."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "So all this time, when you defended me, gave me your shoes, went to prison for me… you were what? Keeping your vow? Protecting your partners' money?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "No. Olivia, that's not—"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "standing, her voice breaking"}, {"s": "Do you think I WANTED to fall in love with you? With Jacob Durose's son?"}, {"d": "beat"}, {"s": "Is that how you've been looking at me? As a threat to your vow? A woman trying to \"get to you\"?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "standing"}, {"s": "Olivia, please—"}]}, {"k": "act", "t": "She walks out. He limps after her to the gate, but her BODYGUARD steps between them."}, {"k": "line", "who": "BODYGUARD", "tag": "", "segs": [{"s": "Sir. Madam said no."}]}, {"k": "act", "t": "The SUV drives away. Geoffrey stands at his gate, alone again."}]}, {"n": 29, "title": "MICHAEL COMES", "slug": "INT. GEOFFREY'S HOUSE — NIGHT — DAYS LATER", "time": "23:25–24:49", "items": [{"k": "act", "t": "Curtains closed, food untouched. Geoffrey hasn't left the house in days. Michael lets himself in and sits beside him."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I'm sorry, brother. For Donald. For everything he said."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "staring at nothing"}, {"s": "It's fine. It's what I signed up for, isn't it? I made a vow. This is what it costs."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "No. We made that vow like hungry boys from Ajegunle, afraid of losing anything. We didn't grow up with love. We grew up with hardship."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "slowly turning"}, {"s": "What are you trying to say, Michael?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "We're getting old. We've worked hard. We need a little love in our lives."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "staring at him"}, {"s": "Michael. Please don't tell me you've found a woman."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "smiling"}, {"s": "I've found one. Her name is Sophia. She shows me love. She completes me. I don't know how she does it, but she makes my whole life turn."}, {"d": "beat"}, {"s": "I'd sell my studio tomorrow for her."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "stunned"}, {"s": "\"Script Supervisor.\""}, {"d": "beat"}, {"s": "Does Donald know?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Not yet. And don't you tell him."}, {"d": "beat"}, {"s": "Donald is scared, Geoffrey. That's his wahala, not yours. Don't let his fear make your decisions."}, {"d": "He stands."}, {"s": "Where is Olivia right now?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "a sudden realisation"}, {"s": "…She said she'd look for the documents. Alone. At my father's lodge."}, {"d": "He grabs his keys."}, {"s": "Michael, that lodge has been empty for years. There are wild dogs in that forest."}]}]}, {"n": 30, "title": "THE LODGE", "slug": "EXT/INT. JACOB DUROSE'S LODGE, OGUN FOREST — NIGHT", "time": "24:49–25:01", "items": [{"k": "act", "t": "An old, abandoned lodge deep in the forest, with dust everywhere. Olivia pushes the creaking door open with her phone torch. In the study, a tall old wooden cabinet stands in the corner. She pulls its doors open."}, {"k": "act", "t": "A deep growl comes from the dark space beside the cabinet. A HUGE DOG, as big as a calf and starving, rises slowly, its teeth bared and its eyes shining in the torchlight."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "backing away, whispering"}, {"s": "No. No, no, no…"}]}, {"k": "act", "t": "The dog lunges. Olivia screams and runs, through the corridor and out the back door into the trees, with the dog barking and snapping right behind her."}, {"k": "act", "t": "Headlights sweep the trees as Geoffrey's car skids to a stop outside. He hears her scream and runs into the lodge. By the door, in an old umbrella stand, is his father's heavy carved walking stick. He grabs it."}, {"k": "act", "t": "Olivia trips on a root and falls hard. The dog leaps at her—"}, {"k": "act", "t": "Geoffrey jumps between them, swinging the heavy stick with a roar. CRACK. It slams into the ground right in front of the dog's face. He swings again and again, shouting and standing over her."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "GET BACK! GET AWAY FROM HER!"}]}, {"k": "act", "t": "The huge dog yelps, turns and runs off into the dark forest. Silence. Olivia lies on the ground, shaking. Geoffrey stands over her, breathing hard, with the walking stick still raised."}]}, {"n": 31, "title": "AFTER THE CHASE", "slug": "EXT. LODGE — BACK GARDEN — CONTINUOUS", "time": "25:01–25:49", "items": [{"k": "act", "t": "Geoffrey drops the stick and kneels beside her. He checks her arms and her face."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Are you hurt? Did it bite you? Olivia, talk to me!"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "shaking"}, {"s": "I'm okay. I'm okay."}, {"d": "beat"}, {"s": "What are you doing here?"}, {"d": "She looks at the stick on the grass."}, {"s": "And since when are you a lion?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "quietly, picking up the stick"}, {"s": "It's my father's. He used it every day of his old age. He always said, \"A Durose must protect what is his.\""}, {"d": "beat"}, {"s": "For once, I agree with him."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "crying now"}, {"s": "I'm sorry. For walking out. For what I said."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I'm sorry I was stupid enough to let you come here alone."}]}, {"k": "act", "t": "He helps her up. Without a word, they hold each other in a tight, silent hug in the moonlight."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "whispering"}, {"s": "I hope you're okay."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "against his shoulder"}, {"s": "I am now."}, {"d": "beat"}, {"s": "The cabinet. Whatever your father hid, it's in that cabinet."}]}]}, {"n": 32, "title": "THE TRUTH", "slug": "INT. LODGE — STUDY — NIGHT", "time": "25:49–27:42", "items": [{"k": "act", "t": "At the bottom of the old wooden cabinet, Geoffrey pulls up a loose wooden panel. Underneath is a steel box. Inside are two papers and an old VHS tape labelled in Jacob's handwriting: \"FOR GEOFFREY. WHEN I'M GONE.\""}, {"k": "act", "t": "They play it on an old TV and VCR in the corner. JACOB DUROSE, older and tired, sits in this same room and speaks to the camera."}, {"k": "line", "who": "JACOB DUROSE", "tag": "ON TAPE", "segs": [{"s": "Geoffrey. If you're watching this, you've found the truth."}, {"d": "beat"}, {"s": "Elias Hart owned this company. I was his clerk for fifteen years. I missed your birthdays for him. Every December he promised me shares, and every December he gave me nothing."}]}, {"k": "line", "who": "JACOB DUROSE", "tag": "ON TAPE", "segs": [{"s": "When his heart failed at his desk, I didn't kill him, my son. God is my witness. But I felt cheated. Fifteen years, and not a kobo. So that same night, I changed the papers. I made it one hundred percent Durose, as if it had always been mine. When his assistant tried to stop me, I sent an innocent man to prison. And once, I slapped a little girl who saw me."}]}, {"k": "act", "t": "Olivia's hand goes to her mouth."}, {"k": "line", "who": "JACOB DUROSE", "tag": "ON TAPE", "segs": [{"d": "holding up a paper to the camera"}, {"s": "Then, weeks later, clearing his desk, I found this. A new certificate. Signed by Elias the week he died. Sixty percent Hart. Forty percent Durose."}, {"d": "His voice breaks."}, {"s": "He'd finally had a change of heart. He was going to give me forty percent. He just never lived to tell me."}]}, {"k": "line", "who": "JACOB DUROSE", "tag": "ON TAPE", "segs": [{"s": "I stole sixty percent from a man who had finally decided to be fair. And I was too proud and too ashamed to undo it."}, {"d": "beat"}, {"s": "I gave you everything, Geoffrey. Except the truth. I'm sorry."}]}, {"k": "act", "t": "The tape crackles to static. Geoffrey lifts the two papers out of the box. One is the real certificate: \"ELIAS HART — 60% · JACOB DUROSE — 40%\", with Elias's signature. Under it is a copy of the forged certificate: \"JACOB DUROSE — 100%\"."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "very softly"}, {"s": "Sixty, forty."}, {"d": "beat"}, {"s": "So Papa did mean to give him something."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "And my father had a right to forty percent. Not a hundred."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "We were both wrong, Geoffrey. You thought it was all yours. I thought your father had no right to anything."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "staring at the two papers"}, {"s": "Our fathers lied to us from both sides."}]}]}, {"n": 33, "title": "SEVENTY, THIRTY", "slug": "INT. LODGE — STUDY — CONTINUOUS", "time": "27:42–29:43", "items": [{"k": "act", "t": "Dawn light creeps through the dusty window. They sit on the floor beside the cabinet with the real certificate between them."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "So legally, sixty percent of Durose Holdings belongs to the Hart family. To me."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Sixty percent of the company as it was in 1996. Two offices and four trucks."}, {"d": "beat"}, {"s": "I've run it for twelve years, Olivia. It's forty times bigger now. My sweat is in it. My brothers' money is in it. Hundreds of families eat from it."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "And my father's name was scraped off it."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I know. And I won't defend that. But I won't pretend I didn't build it either."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "folding her arms"}, {"s": "Fifty-fifty."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Eighty-twenty."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "laughing in disbelief"}, {"s": "Eighty? Your father forged it!"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "And I didn't."}, {"d": "beat"}, {"s": "Seventy-thirty. Seventy for the man who built it into what it is today. Thirty for the man who started it. And his name goes back on the gate, beside my father's."}]}, {"k": "act", "t": "She thinks about it for a long time."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "Seventy-thirty."}, {"d": "beat"}, {"s": "And Hart goes first on the gate."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "after a beat, smiling"}, {"s": "…Hart and Durose."}]}, {"k": "act", "t": "They shake hands. Then she doesn't let go of his hand."}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "And my thirty percent, I don't want it."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "What?"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "I have more than I can spend. My thirty percent goes to charity. The Elias Hart Foundation, for children who grew up like you did in Ajegunle."}, {"d": "beat"}, {"s": "And it looks after Mr. Lawal for the rest of his life. Twenty-two years. It's the least my father's name owes him."}]}, {"k": "act", "t": "Geoffrey is deeply moved."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "We've settled the company."}, {"d": "beat"}, {"s": "But there's one thing I can't put a percentage on."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"s": "What?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "You."}, {"d": "beat"}, {"s": "Tell me you don't see what I see. We grew up in the same lies, Olivia. You're the first true thing I've ever found."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "tears falling"}, {"s": "You don't mean it. You made a vow."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I don't care about any vow."}, {"d": "beat"}, {"s": "I'd walk barefoot from here to Lagos."}, {"d": "softly"}, {"s": "I mean it with everything I have."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "whispering"}, {"s": "You mean that?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Yes."}]}, {"k": "act", "t": "No more words are needed. She walks into his arms, and they hold each other in a long, tight hug as the sun comes up through the dusty window."}]}, {"n": 34, "title": "THE PROMISE KEPT", "slug": "INT. THREE BOYS VENTURES — BOARDROOM — DAY", "time": "29:43–30:59", "items": [{"k": "act", "t": "Donald sits at the head of the table and Michael on the side. Geoffrey walks in, calm, with a leather folder. Donald stands."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I hope you've come with good news."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I have. I promised you I'd get the company back."}, {"d": "He slides the folder across."}, {"s": "The court has lifted the seal. The banks have unfrozen us. Every naira you two put in is safe."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "jumping up"}, {"s": "GEOFFREY!"}, {"d": "He grabs him in a hug."}, {"s": "I knew it!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "reading the papers, slowly"}, {"s": "Seventy percent Durose. Thirty percent Hart."}, {"d": "He looks up."}, {"s": "So the company wasn't all your father's."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "No. Elias Hart founded it, and he'd meant to give my father forty percent before he died. My father took a hundred instead."}, {"d": "beat"}, {"s": "Olivia and I agreed on seventy-thirty, for twelve years of my work. The company will be called Hart and Durose. And her thirty percent goes to charity, to the Elias Hart Foundation."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "stunned"}, {"s": "She gave away thirty percent? Just like that?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "She only ever wanted the truth, Donald. You thought she wanted to get to us. She didn't."}]}, {"k": "act", "t": "Donald looks down, ashamed, and says nothing."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "And one more thing."}, {"d": "He takes a breath."}, {"s": "I broke the vow. I'm in love with Olivia Hart."}]}, {"k": "act", "t": "Silence. Michael grins. Donald slowly closes the folder, stands, and walks out of the boardroom without a word."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "calling after him"}, {"s": "Donald!"}, {"d": "beat; to Geoffrey, softly"}, {"s": "Give him time. He's not fighting you, brother. He's fighting himself."}]}]}, {"n": 35, "title": "HART & DUROSE", "slug": "MONTAGE — LAGOS — WEEKS LATER", "time": "30:59–31:29", "items": [{"k": "act", "t": "Michael and Sophia on the beach at Badagry, laughing as she reads him a new script and he actually listens."}, {"k": "act", "t": "The headquarters gate in Ikoyi. Workers lift a huge new sign into place: \"HART & DUROSE HOLDINGS — FOUNDED 1996 BY ELIAS HART & JACOB DUROSE.\" Staff clap. Mr. Lawal, in a new suit, wipes his eyes. Mrs. Durose holds Olivia's hand. Geoffrey cuts the ribbon, still the boss and still running the company he built."}, {"k": "act", "t": "Inside, a big cheque reads \"THE ELIAS HART FOUNDATION — 30% OF HART & DUROSE HOLDINGS.\" Olivia signs it with a smile."}, {"k": "act", "t": "Days later, Olivia visits the office. Geoffrey opens every door for her and brings her amala on Fridays. Colleagues whisper and smile."}, {"k": "line", "who": "AMAKA", "tag": "", "segs": [{"d": "Olivia's PA, leaning in"}, {"s": "Madam, I see the way you care for him. Like he hung the moon."}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "smiling"}, {"s": "You know I do, Amaka."}]}, {"k": "act", "t": "EXT. LAGOON — SUNSET. A small boat, Olivia's island and a table for two. Geoffrey kneels on the sand with a simple ring."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Our fathers gave us a company full of lies. I want to give you a home full of truth."}, {"d": "beat"}, {"s": "Olivia Hart, will you marry me?"}]}, {"k": "line", "who": "OLIVIA", "tag": "", "segs": [{"d": "laughing and crying"}, {"s": "On my own island? Yes. Yes!"}]}]}, {"n": 36, "title": "THE
