/* Guessing games: asked at the end of scene `at`, answered when scene `rev` finishes */
const POLLS = [];

const $ = id => document.getElementById(id);
const store = {get(k,d){try{const v=localStorage.getItem("go_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("go_"+k,JSON.stringify(v))}catch(e){}}};

let si = store.get("si",0), li = 0, playing = false, runId = 0;
let seen = new Set(store.get("seen",[0]));
let answers = store.get("ans",{});
const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
if(!synth){ $("optVoice").checked=false; $("optVoice").disabled=true; $("optAct").disabled=true; }
["optVoice","optAct","optPolls","optSpeed"].forEach(id=>{const v=store.get(id,null); if(v!==null){ if($(id).type==="checkbox"){ if(!$(id).disabled) $(id).checked=v;} else $(id).value=v; } $(id).addEventListener("change",()=>{store.set(id,$(id).type==="checkbox"?$(id).checked:$(id).value); if(id==="optVoice"&&!$(id).checked&&synth) synth.cancel();});});
const speed = () => parseFloat($("optSpeed").value);

/* voices */
let VO = {f:null,m:null,n:null};
function pickVoices(){
  if(!synth) return;
  const vs = synth.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!vs.length) return;
  const fem=/female|samantha|karen|moira|tessa|zira|susan|hazel|serena|victoria|fiona|libby|sonia|aria|jenny|ezinne|abeo|google uk english female|natasha|catherine/i;
  const mal=/male|daniel|david|mark|alex|george|rishi|fred|guy|ryan|thomas|oliver|arthur|google uk english male|william|james/i;
  const ng = vs.filter(v=>/NG/i.test(v.lang));
  const pool = ng.length>=2?ng.concat(vs):vs;
  VO.f = pool.find(v=>fem.test(v.name)&&!/\bmale\b/i.test(v.name.replace(/female/i,""))) || pool[0];
  VO.m = pool.find(v=>mal.test(v.name)&&!/female/i.test(v.name)) || pool.find(v=>v!==VO.f) || pool[0];
  VO.n = pool.find(v=>/en-GB/i.test(v.lang)&&mal.test(v.name)&&!/female/i.test(v.name)) || VO.m;
}
if(synth){ pickVoices(); synth.onvoiceschanged = pickVoices; }

function chunks(t){ return (t.match(/[^.!?…]+[.!?…]*["”’)]*\s*/g)||[t]).map(s=>s.trim()).filter(Boolean); }
function speak(text, who, myRun, onWord){
  return new Promise(async res=>{
    const [,g,p] = cast(who);
    const parts = chunks(text);
    for(const part of parts){
      if(myRun!==runId) return res(false);
      await new Promise(r=>{
        const u = new SpeechSynthesisUtterance(part.replace(/naira/gi,"nyra"));
        u.voice = who==="NARRATOR"||who==="_ACT"? VO.n : (g==="f"?VO.f:VO.m);
        u.pitch = who==="_ACT"?0.95:Math.min(2,Math.max(0.1,p));
        u.rate = (who==="_ACT"?1.08:who==="NARRATOR"?0.9:1) * speed();
        let done=false; const fin=()=>{if(!done){done=true;clearTimeout(to);r();}};
        const to=setTimeout(fin, 2500 + part.split(/\s+/).length*650/speed());
        u.onend=fin; u.onerror=fin;
        u.onboundary=e=>{ if(onWord && e.name!=="sentence") onWord(); };
        synth.speak(u);
      });
    }
    res(myRun===runId);
  });
}
const wait = (ms,myRun)=>new Promise(r=>setTimeout(()=>r(myRun===runId),ms));
const words = t => t.split(/\s+/).filter(Boolean).length;

function lineText(it){
  if(it.k==="line") return it.segs.filter(s=>s.s).map(s=>s.s).join(" ");
  if(it.k==="card") return (it.who==="ON PAPER"?"The note reads: ":it.who==="MEANWHILE"?"Meanwhile. ":"On screen: ")+it.t;
  return it.t;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function initials(w){ if(w==="NARRATOR") return "◉"; return w.replace(/^(YOUNG|DR\.|MRS\.|INSPECTOR) /,"").split(/\s+/).map(x=>x[0]).join("").slice(0,2); }

function renderItem(it,i){
  const d=document.createElement("div"); d.className="it"; d.dataset.i=i;
  if(it.k==="act"){ d.classList.add("act"); d.textContent=it.t; }
  else if(it.k==="line"){
    const [c]=cast(it.who); d.classList.add("line"); if(it.who==="NARRATOR") d.classList.add("narr");
    d.style.setProperty("--c",c);
    const body = it.segs.map(s=> s.d?`<span class="dir">(${esc(s.d)})</span> `: s.s.split(/(\s+)/).map(w=>/\S/.test(w)?`<span class="word">${esc(w)}</span>`:w).join("")+" ").join("");
    d.innerHTML=`<div class="av" aria-hidden="true">${initials(it.who)}</div><div class="bub"><div class="who">${esc(it.who)}${it.tag?`<em>${esc(it.tag)}</em>`:""}</div><div class="say">${body}</div></div>`;
  }
  else if(it.k==="card"){ d.classList.add("card"); if(it.who==="ON PAPER") d.classList.add("paper"); if(it.who==="MEANWHILE") d.classList.add("mw"); d.innerHTML=`<small>${it.who==="ON PAPER"?"WRITTEN NOTE":it.who==="MEANWHILE"?"MEANWHILE":"ON SCREEN"}</small><p>${esc(it.t)}</p>`; }
  else { d.classList.add("titlecard"); d.textContent=it.t; }
  d.addEventListener("click",()=>{ const was=playing; stop(); li=i; draw(); if(was) play(); });
  return d;
}

function drawHead(anim){
  const s=SCENES[si];
  const h=$("head"); h.className="scenehead"+(anim?" enter":"");
  h.innerHTML=`<div class="num">SCENE ${s.n} OF ${SCENES.length} · ${esc(s.time)}</div><h2>${esc(s.title)}</h2><div class="slug">${esc(s.slug)}</div>`;
}
function draw(anim){
  const s=SCENES[si], feed=$("feed");
  const have = feed.dataset.si==si ? feed.children.length : 0;
  if(feed.dataset.si!=si){ feed.innerHTML=""; feed.dataset.si=si; drawHead(true); }
  while(feed.children.length>li+1) feed.lastChild.remove();
  for(let i=feed.children.length;i<=li;i++){ const el=renderItem(s.items[i],i); if(i>=have) el.classList.add("fresh"); feed.appendChild(el); }
  [...feed.children].forEach((el,i)=>el.classList.toggle("cur",i===li));
  drawEnd(); ticks(); list();
  const cur=feed.children[li]; if(cur) cur.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  const it=s.items[li]; $("nowTxt").textContent=`Scene ${s.n} · ${it.k==="line"?it.who+": ":""}${lineText(it)}`.slice(0,140);
  store.set("si",si);
}
function atEnd(){ return li>=SCENES[si].items.length-1; }

function pollFor(n){ return $("optPolls").checked ? POLLS.find(p=>p.at===n && answers[p.id]===undefined) : null; }
function revealsFor(n){ return POLLS.filter(p=>p.rev===n && answers[p.id]!==undefined); }
function updateScore(){
  const done=POLLS.filter(p=>answers[p.id]!==undefined && seen.has(SCENES.findIndex(s=>s.n===p.rev)) && revealedOnce.has(p.id));
  const right=done.filter(p=>answers[p.id]===p.a).length;
  $("score").innerHTML=done.length?`Detective score <b>${right}/${done.length}</b>`:"";
}
let revealedOnce = new Set(store.get("rev",[]));

let countdown=null;
function drawEnd(){
  const box=$("end"); box.innerHTML=""; clearInterval(countdown);
  if(!atEnd()) return;
  const n=SCENES[si].n;
  revealsFor(n).forEach(p=>{
    revealedOnce.add(p.id); store.set("rev",[...revealedOnce]);
    const ok=answers[p.id]===p.a;
    const r=document.createElement("div"); r.className="reveal"+(ok?"":" miss");
    r.innerHTML=`<b>${ok?"YOU CALLED IT":"PLOT TWIST"}</b><div>You guessed “${esc(p.o[answers[p.id]])}”. ${esc(p.why)}</div>`;
    box.appendChild(r);
  });
  updateScore();
  const p=pollFor(n);
  if(p){
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<h3>${esc(p.q)}</h3><p>Lock in your guess. The answer comes later in the story.</p><div class="opts">${p.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div class="row"><button class="btn ghost" id="skipPoll">Skip</button><span class="count" id="cd"></span></div>`;
    box.appendChild(b);
    b.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ answers[p.id]=+o.dataset.i; store.set("ans",answers); o.classList.add("pick"); toast("Guess locked in. Keep watching…"); setTimeout(()=>{ if(playing) nextScene(true); else drawEnd(); },700); });
    $("skipPoll").onclick=()=>{ answers[p.id]=-1; store.set("ans",answers); nextScene(playing); };
    if(playing){ let t=15; $("cd").textContent=`Story continues in ${t}s`; countdown=setInterval(()=>{ t--; if($("cd")) $("cd").textContent=`Story continues in ${t}s`; if(t<=0){ clearInterval(countdown); if(answers[p.id]===undefined){answers[p.id]=-1;store.set("ans",answers);} if(playing) nextScene(true);} },1000); }
    return;
  }
  if(si<SCENES.length-1){
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<p>Up next · Scene ${SCENES[si+1].n}</p><h3>${esc(SCENES[si+1].title)}</h3><div class="row"><button class="btn" id="goNext">Continue</button></div>`;
    box.appendChild(b); $("goNext").onclick=()=>nextScene(playing);
  } else {
    const right=POLLS.filter(p=>answers[p.id]===p.a).length;
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<h3>The end of the trilogy</h3><p>You guessed ${right} of ${POLLS.length} twists correctly.</p><div class="row"><button class="btn" id="restart">Watch again from Scene 1</button></div>`;
    box.appendChild(b); $("restart").onclick=()=>{ answers={}; store.set("ans",answers); revealedOnce=new Set(); store.set("rev",[]); goScene(0); };
  }
}

function goScene(i, keepPlaying){ const was=keepPlaying??playing; stop(); si=Math.max(0,Math.min(SCENES.length-1,i)); li=0; seen.add(si); store.set("seen",[...seen]); draw(true); window.scrollTo({top:0}); if(was) play(); }
function nextScene(keep){ if(si<SCENES.length-1) goScene(si+1,keep); else stop(); }

async function runLoop(){
  const my=++runId;
  while(my===runId){
    const s=SCENES[si], it=s.items[li];
    const text=lineText(it);
    const useVoice = $("optVoice").checked && synth && (it.k!=="act" || $("optAct").checked);
    let ok;
    if(useVoice){
      const who = it.k==="line"? it.who : "_ACT";
      const el=$("feed").children[li]; const ws=el?[...el.querySelectorAll(".word")]:[]; let wi=0;
      ok = await speak(text, who, my, ()=>{ if(ws[wi]) ws[wi++].classList.add("spoken"); });
      if(ok) ws.forEach(w=>w.classList.add("spoken"));
      ok = ok && await wait(250/speed(),my);
    } else {
      ok = await wait(Math.max(1400, words(text)*(it.k==="act"?230:300))/speed() + 400, my);
    }
    if(!ok) return;
    if(!atEnd()){ li++; draw(); continue; }
    if(pollFor(s.n)) return; // poll handles continuation with countdown
    if(si>=SCENES.length-1){ stop(); return; }
    if(!(await wait(1800,my))) return;
    nextScene(true); return;
  }
}

let lock=null;
async function play(){ playing=true; setIcon(); try{ lock = await navigator.wakeLock?.request("screen"); }catch(e){} if(atEnd() && pollFor(SCENES[si].n)){ drawEnd(); return; } if(atEnd()&&si<SCENES.length-1){ nextScene(true); return; } drawEnd(); runLoop(); }
function stop(){ playing=false; runId++; clearInterval(countdown); if(synth) synth.cancel(); setIcon(); try{lock?.release();}catch(e){} lock=null; const c=$("cd"); if(c) c.textContent=""; }
function setIcon(){ $("playIco").innerHTML = playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>'; $("bPlay").setAttribute("aria-label",playing?"Pause":"Play"); }

function step(d){ const was=playing; stop(); const s=SCENES[si];
  if(d>0){ if(!atEnd()) li++; else if(!pollFor(s.n)) { nextScene(was); return; } }
  else { if(li>0) li--; else if(si>0){ goScene(si-1,false); li=SCENES[si].items.length-1; draw(); } }
  draw(); if(was) play(); }

function ticks(){ const t=$("ticks"); if(!t.children.length){ SCENES.forEach((s,i)=>{const b=document.createElement("button"); b.title=`Scene ${s.n}: ${s.title}`; b.setAttribute("aria-label",b.title); b.onclick=()=>goScene(i); t.appendChild(b);}); }
  [...t.children].forEach((b,i)=>{ b.className=(i===si?"now":seen.has(i)?"seen":""); }); }
function list(){ const l=$("sl"); if(!l.children.length){ SCENES.forEach((s,i)=>{ const b=document.createElement("button"); b.innerHTML=`<span class="n">${String(s.n).padStart(2,"0")}</span><span class="t">${esc(s.title)}</span><span class="tm">${esc(s.time.split("–")[0].split(" ")[0])}</span>`; b.onclick=()=>{ $("drawer").hidden=true; goScene(i); }; l.appendChild(b); }); }
  [...l.children].forEach((b,i)=>{ b.classList.toggle("now",i===si); b.classList.toggle("seen",seen.has(i)&&i!==si); }); }

let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2200); }

$("bPlay").onclick=()=> playing?stop():play();
$("bNext").onclick=()=>step(1); $("bPrev").onclick=()=>step(-1);
$("bNextS").onclick=()=>nextScene(playing); $("bPrevS").onclick=()=>goScene(si-1);
$("openList").onclick=()=>{ $("drawer").hidden=false; const n=$("sl").querySelector(".now"); n&&n.scrollIntoView({block:"center"}); };
$("closeList").onclick=()=>$("drawer").hidden=true;
$("drawer").onclick=e=>{ if(e.target.id==="drawer") $("drawer").hidden=true; };
document.addEventListener("keydown",e=>{
  if(e.target.closest("select,input")) return;
  if(e.code==="Space"){ e.preventDefault(); playing?stop():play(); }
  else if(e.key==="ArrowRight") step(1); else if(e.key==="ArrowLeft") step(-1);
  else if(e.key==="Escape") $("drawer").hidden=true;
});
document.addEventListener("visibilitychange",async()=>{ if(playing && document.visibilityState==="visible"){ try{ lock=await navigator.wakeLock?.request("screen"); }catch(e){} } });

if(si>=SCENES.length) si=0;
seen.add(si);
draw(true);
if(si>0) toast(`Welcome back. You're on Scene ${SCENES[si].n}.`);
</script>
