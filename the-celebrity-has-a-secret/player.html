<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one centred "stage" column like a lit set; scene unfolds line by line; remote-control bar pinned to the bottom. Deliberately single dark look (night-time Lagos, kerosene lamp). */
:root{
  --night:#0e1120; --stage:#161a2c; --stage2:#1d2238; --rule:#2b3150;
  --ink:#efe8db; --muted:#a3a0b4; --faint:#6e6c82;
  --lamp:#e9a23b; --lamp-ink:#1b1306; --blood:#d0525a; --ok:#7fd49a;
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --slug:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:10px 16px 8px}
.hrow{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,26px);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--rule);background:var(--stage);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--lamp)}
.score{font-family:var(--slug);font-size:12px;color:var(--muted)}
.score b{color:var(--lamp)}
.ticks{max-width:820px;margin:8px auto 0;display:grid;grid-template-columns:repeat(46,1fr);gap:2px}
.ticks button{height:6px;border:0;border-radius:2px;background:var(--rule);padding:0}
.ticks button.seen{background:color-mix(in srgb,var(--lamp) 45%,var(--rule))}
.ticks button.now{background:var(--lamp)}

main{max-width:820px;margin:0 auto;padding:24px 16px}
.scenehead{padding-block:8px 18px;border-bottom:1px dashed var(--rule);margin-bottom:18px}
.scenehead .num{font-family:var(--slug);color:var(--lamp);font-size:13px;letter-spacing:.12em}
.scenehead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.scenehead .slug{font-family:var(--slug);font-size:13px;color:var(--muted);text-transform:uppercase}
.scenehead .slug span{color:var(--faint)}
.scenehead.enter h2{animation:rise .7s ease both}
@keyframes rise{from{opacity:.2;transform:translateY(8px);letter-spacing:.04em}to{opacity:1;transform:none}}

.feed{display:flex;flex-direction:column;gap:14px}
.it{transition:opacity .3s, transform .3s;opacity:.55}
.it.cur{opacity:1}
.it.fresh{animation:appear .45s ease both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.act{font-style:italic;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 14px;max-width:62ch}
.it.cur.act{border-left-color:var(--lamp);color:var(--ink)}
.line{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--slug);font-weight:700;font-size:13px;color:var(--night);background:var(--c)}
.bub{min-width:0}
.who{font-family:var(--slug);font-weight:700;font-size:12.5px;letter-spacing:.08em;color:var(--c)}
.who em{font-style:normal;color:var(--faint);font-weight:400;margin-left:6px}
.say{background:var(--stage);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:10px 14px;margin-top:4px;font-size:17px;max-width:62ch}
.it.cur .say{border-color:var(--c);background:var(--stage2);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 8px 30px -12px color-mix(in srgb,var(--c) 50%,transparent)}
.dir{color:var(--faint);font-style:italic;font-size:14px}
.word.spoken{color:var(--c)}
.narr .say{background:transparent;border:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);border-radius:0;font-family:var(--display);font-size:20px;line-height:1.35;padding:12px 2px}
.narr .av{background:transparent;border:1px solid var(--lamp);color:var(--lamp)}
.it.cur.narr .say{box-shadow:none;background:transparent;border-color:var(--lamp)}
.card{align-self:center;text-align:center;background:#0a0c16;border:1px solid var(--blood);border-radius:12px;padding:16px 20px;max-width:520px;width:100%}
.card small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.16em;color:var(--blood);margin-bottom:6px}
.card p{margin:0;font-family:var(--slug);font-size:18px;font-weight:700}
.card.paper{background:#f1e7cf;border-color:#c9b98f;color:#2a2318}
.card.paper small{color:#8a6d2c}
.card.mw{background:transparent;border-color:var(--lamp);border-style:dashed}.card.mw small{color:var(--lamp)}
.titlecard{text-align:center;font-family:var(--display);font-size:clamp(22px,5vw,32px);color:var(--lamp);padding:28px 0;letter-spacing:.02em;text-wrap:balance}

.endbox{margin-top:26px;border:1px solid var(--rule);background:var(--stage);border-radius:16px;padding:18px}
.endbox h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.endbox p{margin:0 0 12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{background:var(--stage2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:left}
.opt:hover{border-color:var(--lamp)}
.opt.pick{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 18%,var(--stage2))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{background:var(--lamp);color:var(--lamp-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.count{font-family:var(--slug);font-size:12px;color:var(--faint)}
.reveal{margin-top:18px;border-radius:14px;padding:14px 16px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--stage))}
.reveal.miss{border-color:var(--blood);background:color-mix(in srgb,var(--blood) 10%,var(--stage))}
.reveal b{font-family:var(--slug);letter-spacing:.1em;font-size:12px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--stage) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dk{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.ctl button{background:var(--stage2);border:1px solid var(--rule);border-radius:999px;width:44px;height:44px;display:grid;place-items:center}
.ctl button:hover{border-color:var(--lamp)}
.ctl .play{width:60px;height:60px;background:var(--lamp);border:0;color:var(--lamp-ink)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl .play svg{width:26px;height:26px}
.opts2{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.opts2 label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts2 select{background:var(--stage2);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:3px 6px;font:inherit}
.nowline{font-family:var(--slug);font-size:12px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.drawer{position:fixed;inset:0;z-index:10;display:flex;justify-content:flex-end;background:rgba(5,6,12,.6)}
.drawer .pane{width:min(420px,100%);height:100%;background:var(--stage);border-left:1px solid var(--rule);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
.pane h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sl{display:flex;flex-direction:column;gap:2px}
.sl button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px}
.sl button:hover{background:var(--stage2)}
.sl button.now{background:color-mix(in srgb,var(--lamp) 16%,transparent)}
.sl .n{font-family:var(--slug);color:var(--lamp);font-size:12px}
.sl .t{min-width:0}
.sl .tm{font-family:var(--slug);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sl .seen .t::after{content:" ✓";color:var(--ok);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--night);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.hint{color:var(--faint);font-size:13px;text-align:center;margin-top:28px}
kbd{font-family:var(--slug);border:1px solid var(--rule);border-radius:4px;padding:0 4px;font-size:12px}
@media (max-width:520px){.score{display:none}.say{font-size:16px}.line{grid-template-columns:34px 1fr;gap:10px}.av{width:34px;height:34px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const SCENES = [{"n": 1, "title": "PERFORMER TONIGHT", "slug": "INT. EKO GRAND ARENA, LAGOS — BACKSTAGE CORRIDOR — NIGHT", "time": "0:00–0:27", "items": [{"k": "act", "t": "Darkness. A heartbeat of bass thumps through the walls. Slowly, light rises on a long backstage corridor: black walls, cables taped to the floor and crew in headsets rushing past. The camera drifts to a closed white door. In the centre is a gold star, and under it a polished brass plate: \"SIENNA VALE — PERFORMER TONIGHT.\" Somewhere far away, 40,000 people are chanting a name we can't make out yet. The camera pushes closer to the brass plate. A hand in a black headset glove knocks twice."}, {"k": "line", "who": "STAGE MANAGER", "tag": "KOLA", "segs": [{"s": "Miss Vale! Thirty minutes to stage. Thirty minutes!"}]}, {"k": "line", "who": "SIENNA", "tag": "O.S., BEHIND THE DOOR", "segs": [{"s": "Thank you, Kola."}]}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"d": "into his headset, walking away"}, {"s": "She's awake, she's calm, she's coming. Tell the band to breathe."}]}]}, {"n": 2, "title": "ONLY HER LIPS", "slug": "INT. SIENNA'S DRESSING ROOM, EKO GRAND ARENA — CONTINUOUS", "time": "0:27–1:19", "items": [{"k": "act", "t": "A glowing mirror framed with round bulbs. Makeup brushes are laid out like surgical tools, and perfume bottles catch the light. Every shot here is from behind, from the side or in close-up, and her face is never fully seen. We see the back of her neck and a silk robe in champagne gold. A makeup artist's brush sweeps across a cheekbone, out of focus. In the mirror, only one thing is sharp: a pair of full lips being painted deep red, slowly, perfectly. A WIG STYLIST lowers a long, glossy, platinum-blonde wig onto her head, adjusts the lace at the temples and smooths it down. FUNKE, the makeup artist, steps back to admire her work. TOBI (26), her assistant, slim and fashionable with a tote bag on each shoulder, leans on the door frame, eating a biscuit."}, {"k": "line", "who": "FUNKE", "tag": "", "segs": [{"s": "Don't press your lips together yet. Let it set."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "If I don't press my lips together, I can't tell you you're a genius."}]}, {"k": "line", "who": "FUNKE", "tag": "", "segs": [{"d": "laughing"}, {"s": "Then hum it."}]}, {"k": "line", "who": "WIG STYLIST", "tag": "SADE", "segs": [{"s": "Lace is invisible. Wind can blow, God can blow. This wig is not moving."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "I have your in-ear monitors, your water, your throat spray and three emergency biscuits."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Three?"}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "There were four. The sound check was emotional."}]}, {"k": "act", "t": "Her lips curve into a smile in the mirror. A rack appears: a gold-and-crystal stage gown. Two dressers lift it. We see only the silk robe sliding off one shoulder, and then the gown shimmering into place. Hands do up a long zip. A stylist fastens diamond drops on each ear."}, {"k": "line", "who": "MARA", "tag": "O.S.", "segs": [{"s": "Twenty minutes, Sienna."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I heard Kola the first time, Mara."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "I'm saying it with love."}]}]}, {"n": 3, "title": "THE WALK", "slug": "INT. BACKSTAGE CORRIDOR → STAGE WINGS — MOMENTS LATER", "time": "1:19–1:51", "items": [{"k": "act", "t": "Low angle, floor level. A pair of gold, crystal-studded stiletto heels steps out of the dressing room onto black concrete. Click. Click. Click. Each step lands on the beat of the bass pumping through the walls. The camera tracks the shoes down the corridor. Crew members flatten against the walls to let her pass, and someone whispers \"Wow.\" The roar of the crowd grows with every step. DANIEL, her security lead, big and calm in a black suit, walks one step behind her. At the end of the corridor, the stage wings glow with blue and gold light. Kola waits with a countdown on his tablet. The camera rises slowly up the gown and stops at her red lips. Her face is still hidden by the shadow of the curtain."}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Sixty seconds. Band's in. Lights on your mark."}]}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "I'll be at stage left the whole time. Nobody comes up those stairs."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "You say that every night."}]}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "And every night it's true."}]}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Five. Four. Three…"}]}, {"k": "act", "t": "Blackout. The crowd screams into the dark."}]}, {"n": 4, "title": "FOREVER IN LOVE", "slug": "INT. EKO GRAND ARENA — MAIN STAGE — CONTINUOUS", "time": "1:51–2:56", "items": [{"k": "act", "t": "Total darkness, then one white spotlight snaps on at centre stage. Smoke curls through the beam. Slowly, she walks into the light, and for the first time we see SIENNA VALE (32) in full: a stunning Black woman with long platinum-blonde hair, striking grey eyes and the gold gown blazing. The arena explodes. 40,000 phone lights rise like stars. Wide shots of the crowd show young women crying, a man holding up a sign that reads \"MARRY ME SIENNA\", and a girl on her father's shoulders screaming. Sienna lifts the microphone. Silence falls. A soft piano begins."}, {"k": "line", "who": "SIENNA", "tag": "SINGING", "segs": [{"d": "soft, sweet, fairytale-princess voice"}, {"s": "You want me… now and forever…"}]}, {"k": "line", "who": "SIENNA", "tag": "SINGING", "segs": [{"s": "I see you in the high… and you see me in my eyes…"}]}, {"k": "line", "who": "CROWD", "tag": "", "segs": [{"d": "screaming"}, {"s": "SIENNA! SIENNA! SIENNA!"}]}, {"k": "line", "who": "SIENNA", "tag": "SINGING", "segs": [{"s": "Holding you for life… oh… forever in love…"}]}, {"k": "line", "who": "SIENNA", "tag": "SINGING", "segs": [{"s": "Ah… holding you forever… forever in love…"}]}, {"k": "line", "who": "SIENNA", "tag": "SINGING", "segs": [{"s": "When the lights go low and the whole world's calling… I only hear you, I only hear you…"}]}, {"k": "line", "who": "SIENNA", "tag": "SINGING", "segs": [{"s": "You found me in the dark… you knew my name before the stars…"}]}, {"k": "line", "who": "CROWD", "tag": "", "segs": [{"d": "screaming"}, {"s": "WE LOVE YOU, SIENNA!"}]}, {"k": "line", "who": "SIENNA", "tag": "SINGING", "segs": [{"d": "bridge, soft, almost whispered"}, {"s": "And if they ask me who I am… I'll say I'm yours… I'll say I'm free…"}]}, {"k": "act", "t": "The drums kick in. The full band explodes. Fireworks shoot up behind her. She rises from her knees as the whole arena sings the chorus back to her."}, {"k": "line", "who": "CROWD", "tag": "", "segs": [{"d": "singing together"}, {"s": "Holding you forever… forever in love!"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "into the mic, laughing, breathless"}, {"s": "Lagos! You're louder than my band!"}]}, {"k": "line", "who": "FAN IN FRONT ROW", "tag": "", "segs": [{"d": "crying"}, {"s": "I love you, Sienna! You saved my life!"}]}, {"k": "act", "t": "Sienna catches the fan's eye and presses her hand to her heart toward her. Close on Sienna's face: joy, and something else just behind it for half a second. Then the stage lights blind white."}]}, {"n": 5, "title": "\"YOU WERE UNREAL\"", "slug": "INT. BACKSTAGE CORRIDOR — AFTER THE SHOW — NIGHT", "time": "2:56–3:40", "items": [{"k": "act", "t": "Sienna walks off stage into the corridor, glowing with sweat and holding her heels in one hand. Instantly the crew mobs her: dancers in sequins, band members with guitars still strapped on, sound engineers, Tobi and Mara. Champagne pops somewhere. Everyone is hugging, shouting and jumping."}, {"k": "line", "who": "DANCER", "tag": "LOLA", "segs": [{"s": "Sienna! That last note! I forgot my own choreography!"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I saw. You turned left when the whole Lagos turned right."}]}, {"k": "line", "who": "GUITARIST", "tag": "", "segs": [{"s": "Forty thousand people singing your song, Sienna. Forty thousand!"}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "I cried twice. The second time was because I finished the biscuits."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"d": "stepping in, unusually soft"}, {"s": "You were unreal tonight."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Careful, Mara. That sounded like a compliment."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "Enjoy it. Tomorrow I'm back to being your schedule."}]}]}, {"n": 6, "title": "THE FLASHES", "slug": "EXT. EKO GRAND ARENA — VIP EXIT — NIGHT", "time": "3:40–4:11", "items": [{"k": "act", "t": "The steel exit doors swing open into chaos. A wall of white flashes. Paparazzi push against a rope line, shouting all at once, cameras held high. Fans scream behind them. A black Mercedes Maybach waits at the kerb with its back door open. Daniel and two guards form a moving wall around Sienna, now in a cream coat over the gown, sunglasses on at night. Every flash freezes her face for a split second."}, {"k": "act", "t": "PAPARAZZO 1: Sienna! Sienna! Over here! Look this way!"}, {"k": "act", "t": "PAPARAZZO 2: Who are you going home to tonight, Sienna? Who's the lucky man?"}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "Back. Give her space. Back, please."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "pausing at the car, a small wave"}, {"s": "Goodnight, Lagos. Go home safely."}]}, {"k": "act", "t": "The door shuts. Through the tinted window, the flashes keep exploding like lightning as the car pulls away."}]}, {"n": 7, "title": "\"LAGOS STOOD STILL\"", "slug": "INT. NEWS STUDIO, CHANNELS 9 → INT. SIENNA'S CAR — NIGHT — INTERCUT", "time": "4:11–5:13", "items": [{"k": "act", "t": "A bright television news set with a glass desk and a giant screen showing the arena lit by phones. A polished NEWS ANCHOR, CHIOMA BELLO, sits upright, papers squared in front of her, and turns to camera two. Behind her, the screen cuts to footage: fans crying and fainting into the arms of medics, a teenage boy shaking and sobbing \"She looked at me!\", and a crowd outside the arena still singing at midnight, scenes that recall the biggest pop stars in history."}, {"k": "line", "who": "NEWS ANCHOR", "tag": "CHIOMA", "segs": [{"s": "Good evening. Lagos stood still tonight as superstar Sienna Vale performed to a sold-out crowd of more than forty thousand fans at the Eko Grand Arena."}]}, {"k": "line", "who": "NEWS ANCHOR", "tag": "CHIOMA", "segs": [{"s": "Medics treated dozens of fans for exhaustion and emotion. Some had queued since five o'clock this morning."}]}, {"k": "line", "who": "CRYING FAN", "tag": "ON NEWS FOOTAGE", "segs": [{"s": "She's not human! That woman is not human! I've waited my whole life!"}]}, {"k": "act", "t": "INT. SIENNA'S CAR — MOVING. The city lights of Lagos slide past the window: the Third Mainland Bridge glowing over black water. Sienna sits in the back seat, gown and coat, shoes off, feet tucked up, sunglasses pushed up into her blonde hair. She watches the same broadcast on her phone, the screen lighting her face. She's smiling, a real, private, girlish smile. At the wheel is UNCLE SULE (60s), her driver, in a grey cap, glancing at her in the rear-view mirror."}, {"k": "line", "who": "UNCLE SULE", "tag": "", "segs": [{"s": "Madam, they said forty thousand. On the radio, the man said forty-five."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "The radio man always adds five thousand, Uncle Sule. He's very generous."}]}, {"k": "line", "who": "UNCLE SULE", "tag": "", "segs": [{"s": "Eight years I have driven you. From small clubs with ten people to this."}, {"d": "beat"}, {"s": "You're happy tonight. I can see it."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "looking at the phone, smiling"}, {"s": "Tonight, I'm happy."}]}, {"k": "act", "t": "She turns the phone off and watches the city go by. The car glides into the dark. Hold on her reflection in the window: blonde, grey-eyed, smiling. Then the reflection's smile slowly fades, as if a thought has crossed it. Cut to black."}, {"k": "title", "t": "THREE WEEKS LATER."}]}, {"n": 8, "title": "THE HAND", "slug": "EXT. LAGOS AWARDS VENUE, VICTORIA ISLAND — NIGHT", "time": "5:13–5:57", "items": [{"k": "act", "t": "A red carpet under a white marquee. Flashbulbs fire nonstop. A sleek black car glides up to the kerb, and the door opens. Sienna steps out in a sculpted gold gown, blonde hair swept to one side, grey eyes cool. Behind her, Tobi tumbles out of the car, wrestling with a small evening bag and a huge black umbrella that's opening by accident. Daniel walks a step behind. Photographers crowd the barrier, shouting over each other."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "I have your phone, your lipstick and three emergency biscuits."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Three?"}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "There were four. Traffic was emotional."}]}, {"k": "act", "t": "Sienna almost smiles. The photographers roar."}, {"k": "line", "who": "PHOTOGRAPHER", "tag": "DELE", "segs": [{"s": "Sienna! Here! Give us something!"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I gave you an album last month."}]}, {"k": "act", "t": "Suddenly, Dele steps through the barrier and grabs her wrist to turn her toward his lens."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Let go."}]}, {"k": "line", "who": "DELE", "tag": "", "segs": [{"s": "Just one picture. Don't be difficult."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Take your picture. Keep your hands off me."}]}, {"k": "act", "t": "Daniel moves between them in one smooth step and separates them. Nearby, a phone held up in the crowd records only this last moment."}, {"k": "line", "who": "DELE", "tag": "", "segs": [{"d": "shouting as Daniel moves him back"}, {"s": "Your fans made you!"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Then respect what they made."}]}, {"k": "act", "t": "INT. VENUE LIFT — MOMENTS LATER. Mirrored walls. The doors close and the noise vanishes. Sienna stands very still. Her wrist trembles. She presses it flat against her gown to hide it. Tobi watches her in the mirror."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"d": "softly"}, {"s": "Did he hurt you?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Fix your collar."}]}, {"k": "act", "t": "Tobi looks down. His collar is already straight. He looks back at her and says nothing."}, {"k": "act", "t": "CUT TO: a phone screen in someone's hand, replaying the cropped video in a loop: Sienna saying \"Keep your hands off me!\" The caption reads: \"SIENNA HUMILIATES PHOTOGRAPHER 😱\". Views climb in real time: 10K… 80K… 1.2M."}, {"k": "title", "t": "THE CELEBRITY HAS A SECRET"}]}, {"n": 9, "title": "ICE", "slug": "INT. SIENNA'S HOME, IKOYI — KITCHEN — LATE THAT NIGHT", "time": "5:57–6:42", "items": [{"k": "act", "t": "Midnight. The huge kitchen is dark except for the cold light of the open freezer. Sienna, still in the gold gown with her heels kicked off on the marble, presses a bag of frozen peas against her wrist. Her phone, face up on the counter, is a constant stream of notifications. Tobi stands in the doorway in his coat, car keys in hand, unwilling to leave."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "I can stay. I'll sleep on the sofa. I'm very small. You won't notice me."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Go home, Tobi. Your mother will think I kidnapped you."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "My mother thinks you're a saint. She has your poster in her kitchen."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "glancing at the phone"}, {"s": "Then tell her not to read the internet tonight."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"d": "quietly"}, {"s": "That man grabbed you, Sienna. You don't have to be funny about it."}]}, {"k": "act", "t": "She turns. For a split second, her face is completely undefended. Then the wall comes back up."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Goodnight, Tobi."}]}, {"k": "act", "t": "He nods and leaves. The front door closes. Sienna stands alone. She lifts the frozen bag and looks at the red marks of fingers on her wrist. Her breath shakes. She presses the cold bag back against it and closes her eyes."}]}, {"n": 10, "title": "THE ICE QUEEN", "slug": "INT. SIENNA'S DRESSING ROOM, IKOYI — MORNING", "time": "6:42–7:37", "items": [{"k": "act", "t": "Morning light floods a spacious, cream-coloured dressing room with rails of gowns, award statues used as bookends, and a breakfast tray on the vanity. Sienna sits cross-legged on a velvet chair in fluffy slippers and a robe, eating toast, her blonde hair in a messy bun and grey eyes tired. Tobi scrolls headlines on a tablet with the face of a man reading a death notice. Mara stands checking the schedule on her own tablet."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "\"Rich, rude and out of control.\""}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "That's three reviews. Are they charging separately?"}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "We should release the complete footage."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Release it. I'm not recording an apology for removing somebody's hand."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "This one says you hate ordinary people."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I haven't met all of them yet."}]}, {"k": "act", "t": "A STYLIST (ZARA) enters, arms full, carrying two hanging outfits."}, {"k": "line", "who": "STYLIST", "tag": "ZARA", "segs": [{"s": "Silver or blue?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Blue. Silver makes me look like an expensive refrigerator."}]}, {"k": "act", "t": "Everyone laughs. Even Mara. Then Mara pulls a stool over and sits down beside Sienna."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "A documentary could soften your image. Your house. Your family. Childhood pictures."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "My new film opens Friday. They can document that."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "People want to know you."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "They can know my work."}]}, {"k": "act", "t": "Silence. Tobi quietly turns off his tablet. As the screen dims, one last notification slides across it: \"WHAT IS SIENNA HIDING?\""}]}, {"n": 11, "title": "\"SHE MOVED HIS HAND\"", "slug": "INT. MARA'S CAR, PARKED OUTSIDE SIENNA'S HOUSE — DAY", "time": "7:37–8:24", "items": [{"k": "act", "t": "Mara sits alone in her white SUV in the driveway, engine running, AC on. On her tablet, propped against the steering wheel, she plays the full uncut footage from the awards night: Dele stepping through the barrier, his hand clamping round Sienna's wrist, Sienna twisting free. She pauses it on the hand. Her phone rings: \"BLESSING — GISTHUB BLOG.\" She answers on speaker."}, {"k": "line", "who": "BLOGGER", "tag": "BLESSING, ON PHONE", "segs": [{"s": "Mara, darling! Just one quote. \"Sienna regrets the outburst.\" Five words. Everybody's happy."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "I'm looking at the full video, Blessing. A grown man grabbed a woman's wrist on a red carpet."}]}, {"k": "line", "who": "BLOGGER", "tag": "BLESSING, ON PHONE", "segs": [{"s": "Ah, but she was rude to him—"}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "She moved his hand. That's not rude. That's a reflex."}, {"d": "beat"}, {"s": "You'll have the full footage in ten minutes. Post that, or post nothing."}]}, {"k": "act", "t": "She hangs up and sits there, breathing out slowly. Then she looks up at the house, at Sienna's window, where the curtain is closed in the middle of the day. Mara frowns, really looking at it for the first time."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"d": "to herself"}, {"s": "What are you so afraid of?"}]}]}, {"n": 12, "title": "ONE QUESTION", "slug": "INT. \"STAR TALK LAGOS\" INTERVIEW SET — AFTERNOON", "time": "8:24–9:29", "items": [{"k": "act", "t": "A glossy TV talk-show set with a curved purple sofa, studio lights and three cameras on dollies. A small crew watches from the dark. The HOST (TUNDE ALLI), polished, in a velvet blazer and with too-white teeth, sits opposite Sienna. She is immaculate in the blue outfit, legs crossed and smile camera-ready. Mara stands behind camera one with her arms folded."}, {"k": "line", "who": "HOST", "tag": "", "segs": [{"s": "Your co-star says you rehearse more than anyone."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "He talks more than anyone. We both have gifts."}]}, {"k": "act", "t": "The crew laughs. The host laughs too, then leans in. His smile stays, but his eyes sharpen."}, {"k": "line", "who": "HOST", "tag": "", "segs": [{"s": "You arrived in the industry almost fully formed. No famous family, no childhood interviews. Who were you before Sienna?"}]}, {"k": "act", "t": "Her smile holds for one beat, then slowly fades."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "A person going to auditions on buses."}]}, {"k": "line", "who": "HOST", "tag": "", "segs": [{"s": "Under the same name?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Is this an interview or a passport application?"}]}, {"k": "act", "t": "Another laugh from the crew, less comfortable this time."}, {"k": "line", "who": "HOST", "tag": "", "segs": [{"s": "Your first school? Your parents? Give us something human."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I'm sitting here breathing. That's quite human."}]}, {"k": "act", "t": "Behind camera one, Mara presses her lips together."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Ask me about the film. I spent eight months making it."}]}, {"k": "act", "t": "INT. STUDIO DRESSING ROOM — AFTER THE SHOW. Sienna walks in. She waits until the door closes, then checks the handle twice to make sure it has latched. Mara follows her in."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "You handled that well."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Then why are your hands on your hips?"}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "Because you scare sponsors when you scare presenters."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "He'll recover."}]}, {"k": "act", "t": "Her phone vibrates on the dressing table. She picks it up and reads a message we can't see. Every trace of humour leaves her face. The colour drains. Her thumb hovers over the screen. Mara notices."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "What is it?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "locking the phone, face down"}, {"s": "Nothing. Wrong number."}]}]}, {"n": 13, "title": "THE ASSIGNMENT", "slug": "INT. \"LAGOS LENS\" DIGITAL NEWSROOM, YABA — DAY", "time": "9:29–10:27", "items": [{"k": "act", "t": "An open-plan newsroom: exposed brick, standing desks, screens showing trending charts, a ring light in the corner for video reports. Young reporters type and talk on phones. ELI (30), sharp, hungry and in a denim jacket, watches the Star Talk interview on his monitor and pauses it on Sienna's falling smile. KEMI (40), his editor, unflappable, in glasses on a chain with a coffee mug in hand, drops a folder onto his desk."}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "Find an actual story."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "Nobody knows where she came from."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "You don't know. There's a difference."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "No school history. No parents. No old friends. She's built a wall."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "A wall isn't proof of a crime."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "It's proof there's something behind it."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "Usually a person trying to eat breakfast."}]}, {"k": "act", "t": "Eli smiles and is already typing."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "I'll check public interviews, early credits, people she worked with. Properly."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "And ask her team for comment. No home address, no chasing relatives."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "I'm a reporter, not a burglar."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "Good. Keep that distinction when the clicks arrive."}]}, {"k": "act", "t": "Eli opens an old, grainy clip titled \"SIENNA'S FIRST LIVE PERFORMANCE — 2017\". A younger Sienna, already blonde, sings on a tiny bar stage with fairy lights behind her. The camera jerks as a woman in the audience shouts to her friend."}, {"k": "line", "who": "WOMAN IN OLD CLIP", "tag": "", "segs": [{"d": "on video, shouting over music"}, {"s": "Ah! It's that girl from the laundry!"}]}, {"k": "act", "t": "Eli stops the clip. Rewinds it. Plays it again: \"That girl from the laundry.\" He grabs a sticky note and writes one word in thick marker, then sticks it to his screen: \"LAUNDRY?\""}]}, {"n": 14, "title": "THE FIRST BOOKING", "slug": "INT. LAGOS LENS NEWSROOM — ELI'S DESK — DAY / INT. \"BLUE NOTE LOUNGE\", SURULERE — DAY — INTERCUT", "time": "10:27–11:42", "items": [{"k": "act", "t": "Eli sits at his desk surrounded by sticky notes: \"LAUNDRY?\", \"2017 BAR\", \"FIRST CREDIT?\". A young FACT-CHECKER, ZAINAB (24), with braids and a laptop covered in stickers, sits beside him. Eli dials a number on speaker. INTERCUT: a dim, empty lounge in the daytime, chairs upside down on tables. The owner, OGA PIUS (60s), in a striped shirt, counts bottles behind the bar with the phone wedged against his shoulder."}, {"k": "line", "who": "OGA PIUS", "tag": "ON PHONE", "segs": [{"s": "Sienna Vale? Ehn, I booked her first. Before everybody. Write that one in capital letters."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "When was that, sir?"}]}, {"k": "line", "who": "OGA PIUS", "tag": "ON PHONE", "segs": [{"s": "2016. Tuesday nights. Nobody comes on Tuesday. She sang to six people and my cat."}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"d": "whispering to Eli"}, {"s": "That's a year earlier than her official bio."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "What did you pay her?"}]}, {"k": "line", "who": "OGA PIUS", "tag": "ON PHONE", "segs": [{"s": "Two thousand naira and jollof. She always took the jollof home in a nylon."}, {"d": "beat"}, {"s": "She was hungry, that girl. Not hungry for fame. Hungry, hungry."}]}, {"k": "act", "t": "Eli stops writing. He looks at the note on his screen that says \"LAUNDRY?\" and slowly peels it off."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "Did anybody ever come with her? Family? A boyfriend?"}]}, {"k": "line", "who": "OGA PIUS", "tag": "ON PHONE", "segs": [{"s": "Only one friend. A girl. She sat in the front and clapped like it was a stadium."}, {"d": "beat"}, {"s": "Why are you asking me all this? You want to finish her?"}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"d": "after a pause"}, {"s": "No, sir. I'm trying to get it right."}]}, {"k": "line", "who": "OGA PIUS", "tag": "ON PHONE", "segs": [{"s": "Then get it right."}, {"d": "click"}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"d": "after a beat"}, {"s": "So she's not a mystery heiress."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"d": "staring at the screen"}, {"s": "No. She's something harder to explain."}]}]}, {"n": 15, "title": "THE NOTE", "slug": "INT. SIENNA'S RECORDING STUDIO, LEKKI — VOCAL BOOTH / CONTROL ROOM — AFTERNOON", "time": "11:42–12:34", "items": [{"k": "act", "t": "A dim, warm recording studio: a mixing desk glowing with green and red lights, acoustic foam on the walls, and through the glass a vocal booth with a single microphone under a pop shield. FEMI KEYS (40s), her music director, in a cap and headphones round his neck, sits at the desk. Sienna stands in the booth in a hoodie, blonde hair under the hood, headphones on. Tobi sits on the studio sofa eating plantain chips."}, {"k": "line", "who": "FEMI KEYS", "tag": "", "segs": [{"d": "into the talkback mic"}, {"s": "Again from the bridge. And this time, don't sing it to the arena. Sing it to one person."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "through the speakers"}, {"s": "Which person?"}]}, {"k": "line", "who": "FEMI KEYS", "tag": "", "segs": [{"s": "That's your business. I just need to believe there's somebody."}]}, {"k": "act", "t": "Sienna closes her eyes. The piano plays. She sings."}, {"k": "line", "who": "SIENNA", "tag": "SINGING", "segs": [{"s": "And if they ask me who I am… I'll say I'm yours… I'll say I'm free…"}]}, {"k": "act", "t": "Silence in the control room. Femi takes his finger off the button. He looks at Tobi."}, {"k": "line", "who": "FEMI KEYS", "tag": "", "segs": [{"d": "to Tobi, low"}, {"s": "Fifteen years I've worked with singers. She's the only one who sings \"free\" like she's not sure she's allowed."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"d": "mouth full"}, {"s": "Maybe she's not."}]}, {"k": "act", "t": "Femi glances at him. Tobi shrugs and looks away. In the booth, Sienna opens her eyes and catches them both looking at her."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "through the speakers"}, {"s": "Was it that bad?"}]}, {"k": "line", "who": "FEMI KEYS", "tag": "", "segs": [{"d": "pressing the button, grinning"}, {"s": "It was the take. We're keeping it."}]}]}, {"n": 16, "title": "WRONG NAME", "slug": "INT. SIENNA'S REHEARSAL STUDIO, LEKKI — EVENING", "time": "12:34–13:26", "items": [{"k": "act", "t": "A big mirrored dance studio with sprung wooden floors and a wall of speakers. Eight dancers in black rehearsal clothes are frozen mid-move, sweating. Sienna, in leggings and an oversized T-shirt with her blonde hair tied up, stands at the front with a towel around her neck. Through the glass wall at the far end we can see the reception desk, where a COURIER in a red cap is signing a form."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Again from the second verse."}]}, {"k": "line", "who": "DANCER", "tag": "LOLA", "segs": [{"s": "We got it right."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "You got it early. The beat was still coming from home."}]}, {"k": "act", "t": "The dancers laugh and reset. The music starts again: the same love song from the arena, as an instrumental. Sienna sings under her breath as she dances."}, {"k": "line", "who": "SIENNA", "tag": "SINGING, SOFTLY", "segs": [{"s": "Holding you for life… forever in love…"}]}, {"k": "act", "t": "Tobi comes through the door holding a huge bouquet of deep red roses, beaming."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Someone sent flowers. There is hope for your reputation."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Flowers are not character witnesses."}]}, {"k": "act", "t": "He hands her the card. We see only its blank back as she turns it over and reads. Her whole body goes still. The music keeps playing behind her."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "not looking up"}, {"s": "Who accepted these?"}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Reception. Why?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Send them back."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "There's no return address."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Then put them somewhere I won't see them."}]}, {"k": "act", "t": "Tobi hesitates, hurt by her tone. She sees it. She softens slightly."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Please, Tobi."}]}, {"k": "act", "t": "He nods and carries the flowers out. The dancers exchange looks. LATER, in the empty studio, Daniel stands with Sienna by the window. Lagos glitters outside."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Change tomorrow's departure time. And use the side entrance."}]}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "Has someone threatened you?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I don't know yet."}]}, {"k": "act", "t": "In her fist, she folds the little card smaller and smaller until it creases, then holds it so tightly her hand shakes."}]}, {"n": 17, "title": "TWO MEN IN A CAR PARK", "slug": "EXT. REHEARSAL STUDIO CAR PARK, LEKKI — NIGHT", "time": "13:26–14:13", "items": [{"k": "act", "t": "A dark car park under orange street lamps. Daniel leans against the black SUV, checking his phone. Tobi comes out carrying the bouquet of red roses at arm's length, like something that might bite him, and drops it into a wheelie bin. He stands there looking at it."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Daniel. How long have you worked for her?"}]}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "Six years."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Have you ever seen her like that? Over flowers?"}]}, {"k": "act", "t": "Daniel puts his phone away and looks at Tobi properly for the first time."}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "I've seen her walk through a crowd of ten thousand without blinking."}, {"d": "beat"}, {"s": "I've never seen her afraid of a card."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "So what do we do?"}]}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "We do our jobs. You watch who comes near her. I watch everything else."}, {"d": "beat"}, {"s": "And when she's ready to tell us, we listen."}]}, {"k": "act", "t": "Tobi nods. As he turns, he looks back at the bin. A single red rose has fallen onto the tarmac. He stands on it as he walks away."}]}, {"n": 18, "title": "THE SMALL HOUSE", "slug": "INT. JUNE'S LIVING ROOM, SURULERE — NIGHT", "time": "14:13–15:20", "items": [{"k": "act", "t": "A small, comfortable flat: a worn green sofa, a rug, a ceiling fan clicking round, a child's crayon drawings taped to the fridge (shot so we never see a name), and a framed photo of two teenage girls laughing, turned away from camera. A knock. JUNE (32), warm, practical, in an ankara house dress with a scarf tied over her hair, opens the door. Sienna stands there in a plain hoodie and cap, carrying a stack of takeaway containers almost to her chin."}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "You brought enough for a wedding."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I missed lunch."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "So you ordered lunch for everybody who missed it since Monday?"}]}, {"k": "act", "t": "Sienna kicks off her shoes, pulls off the cap so her blonde hair falls free, and sinks onto the rug like someone finally home."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Is your little one asleep?"}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "Finally. Don't say that too loudly. Children hear confidence and wake up."}]}, {"k": "act", "t": "Sienna laughs properly for the first time in the film: head back, hand over her mouth to keep it quiet. June sits beside her and reaches for a container. Then she stops. She has seen the faint bruise on Sienna's wrist."}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "I saw the complete video."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Apparently I should have smiled while he held me."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "People always have good manners on your behalf."}]}, {"k": "act", "t": "They eat. June watches her friend pick at the food without eating it, moving rice from one side of the container to the other."}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "What's happened?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "A message. Then flowers."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "From who?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Whoever it is knows where to send them."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "Did you show Daniel?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Not the message."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "You don't have to figure this out alone before you ask for help."}]}, {"k": "act", "t": "Sienna looks toward the hallway, at the closed door where the child sleeps, at the drawings on the fridge."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I like it here. Nobody asks me to be interesting."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "You can wash the plates. That will keep you ordinary."}]}, {"k": "act", "t": "LATER. The front door. June and Sienna hug goodbye in the doorway, swaying, laughing at something. Hard cut to the outside. EXT. PUBLIC ROAD OPPOSITE — CONTINUOUS. Through the window of a parked car, a long telephoto lens points at the doorway. We see only the camera and a photographer's hands: a cheap watch and a press lanyard. The shutter fires: click-click-click-click. On the camera's little screen, the frame freezes: Sienna embracing June at the door, and behind them, through the open doorway, a child's school bag on a hook."}]}, {"n": 19, "title": "THE STORY THEY INVENTED", "slug": "INT. SIENNA'S HOME OFFICE, IKOYI — MORNING", "time": "15:20–16:06", "items": [{"k": "act", "t": "A sleek home office with a glass desk, gold records on the wall and a city view. Tobi enters slowly with a tablet, and for once he isn't joking. He slides it across the desk toward Mara, avoiding Sienna's eyes. Sienna, coffee in hand, catches the movement."}, {"k": "act", "t": "ON SCREEN (the tablet): \"SECRET FAMILY? SIENNA'S MIDNIGHT VISIT\" beside the long-lens photo of Sienna hugging June at the door."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Midnight? I was home by ten."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Accuracy left early."}]}, {"k": "act", "t": "Sienna scrolls. A second photograph: the open doorway, zoomed in. A child's school bag on a hook. Her face changes completely. The coffee cup slowly tilts in her hand."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Take that down."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "We've requested it."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Today."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "We cannot personally switch off the internet."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Then start with the person who posted it."}]}, {"k": "act", "t": "Sienna's phone rings: \"JUNE.\" She answers instantly."}, {"k": "line", "who": "JUNE", "tag": "ON PHONE", "segs": [{"d": "whispering, frightened"}, {"s": "There are two men outside. One asked which school—"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Don't answer. Daniel is coming."}]}, {"k": "line", "who": "JUNE", "tag": "ON PHONE", "segs": [{"s": "We did nothing wrong."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I know."}]}, {"k": "act", "t": "She ends the call. Tobi is already on the phone to Daniel. Sienna turns and sees Mara studying her, curious and calculating."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "What?"}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "Is there anything I need to know?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "That children are not publicity material."}]}, {"k": "act", "t": "She walks out before Mara can answer. The door swings shut. Mara sits very still, looking at the photo of the school bag on the tablet."}]}, {"n": 20, "title": "THE BRACELET", "slug": "INT. SIENNA'S DRESSING ROOM, IKOYI — DAY", "time": "16:06–16:58", "items": [{"k": "act", "t": "A tall stack of designer garment boxes and courier envelopes sits on the floor. Tobi, cross-legged among them with a clipboard, ticks off a delivery inventory, humming. He opens a separate small brown envelope, shakes it, and something slides out into his palm: a cheap, faded bracelet of plastic beads on a fraying thread, the colours washed out by years."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "This doesn't look like the designer's work."}]}, {"k": "act", "t": "Sienna, at the mirror, turns around. She sees the bracelet. Silence. The camera slowly pushes in on her face as all the blood drains from it."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "barely a whisper"}, {"s": "Who brought that?"}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "It was mixed in with the deliveries. Reception is checking."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Don't touch anything else."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Sienna?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Sorry."}, {"d": "beat"}, {"s": "Just leave it there."}]}, {"k": "act", "t": "She calls Daniel. Minutes later, DANIEL arrives with clear evidence sleeves and gloves. He bags the envelope. Sienna keeps the bracelet in its own clear sleeve and holds it in both hands."}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "We'll check the delivery log and the cameras. Show me the messages as well."}]}, {"k": "act", "t": "She hands over her phone. Then, instantly, she reaches out and takes hold of it again."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Nobody outside this room."}]}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "Only the people needed to protect you."}]}, {"k": "act", "t": "She lets go. Daniel leaves. Tobi quietly follows him out. Sienna sits alone on the floor with the faded bracelet in its plastic sleeve in her lap. Her breathing grows uneven, short and fast. Her phone buzzes: \"JUNE.\" She lets it ring once, twice, three times, then answers."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Can you talk to me about anything else? Just for a minute?"}]}, {"k": "line", "who": "JUNE", "tag": "ON PHONE", "segs": [{"d": "understanding immediately, light"}, {"s": "My landlord has painted the gate orange. I think he hates us."}]}, {"k": "act", "t": "Sienna closes her eyes and listens. Her breathing slowly, slowly evens out. The faint ghost of a smile."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Orange."}]}]}, {"n": 21, "title": "SOMEBODY BORROWED A PASS", "slug": "INT. FILM PREMIERE, IMAX LEKKI — RECEPTION HALL — NIGHT", "time": "16:58–17:57", "items": [{"k": "act", "t": "A glamorous premiere: a giant poster of Sienna's new film (\"LAST LIGHT OVER LAGOS\"), velvet ropes, waiters with trays of champagne, and celebrities posing against a sponsor wall. Sienna stands just inside the entrance in a structured emerald gown. Mara straightens Sienna's sleeve like a mother on a school morning. Tobi stands beside them in a sharp suit."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "Smile, photographs, ten minutes of conversation. Then home."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "You've described community service."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "With better shoes."}]}, {"k": "act", "t": "They move into the reception. Eli appears out of the crowd, holding a recorder down by his side, polite and eager."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "Miss Vale. Eli Okafor, Lagos Lens. I'd love an interview about your early career."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Send the questions to Mara."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "I thought we could speak like people."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "People can send questions."}]}, {"k": "act", "t": "And then she freezes. Across the hall, near an exit, out of focus, stands a guest. We cannot see a face, gender or any distinguishing feature, only a blurred shape among the crowd, still while everyone else moves. The camera holds on Sienna's face as the room's music seems to fade away."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "Sienna?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "We need to leave. Now."}]}, {"k": "act", "t": "Daniel follows her gaze. The blurred guest slips beyond the doorway and is gone. In one smooth move, Daniel guides Sienna into a staff corridor. Eli watches her vanish, perplexed, recorder still in his hand."}, {"k": "act", "t": "INT. STAFF CORRIDOR — MOMENTS LATER. Bare walls, fluorescent light, crates of champagne. Sienna leans against the wall, breathing hard. A VENUE SECURITY MANAGER jogs up to Daniel holding a tablet."}, {"k": "line", "who": "VENUE SECURITY MANAGER", "tag": "", "segs": [{"s": "Sir, one entry pass was scanned at the side door. It's assigned to a guest who confirmed this afternoon that they're in Abuja."}]}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "Keep the access records. All of them. Nobody deletes anything."}]}, {"k": "act", "t": "Nobody yet knows who used that pass. Mara turns to Sienna, really frightened for the first time."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "Tell me what you saw."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Someone who shouldn't have been there."}]}]}, {"n": 22, "title": "THE BACK SEAT", "slug": "INT. SIENNA'S CAR — MOVING — LATER THAT NIGHT", "time": "17:57–18:42", "items": [{"k": "act", "t": "Rain on the windows. Lagos smears into gold and red streaks. Sienna sits in the back seat, still in the emerald gown, shoes off, knees pulled up. Daniel sits in the front passenger seat this time, turned halfway round. Uncle Sule drives in silence, glancing in the mirror more often than usual."}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "The pass was printed in a real guest's name. Whoever used it knew the guest list."}, {"d": "beat"}, {"s": "That's not a fan, Sienna."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I know it's not a fan."}]}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"s": "Then help me. I can't guard you from a shadow."}]}, {"k": "act", "t": "A long silence. The wipers thud back and forth. Uncle Sule's eyes meet hers in the mirror."}, {"k": "line", "who": "UNCLE SULE", "tag": "", "segs": [{"d": "gently"}, {"s": "Madam. Eight years. Whatever it is, it didn't start tonight."}]}, {"k": "act", "t": "Sienna closes her eyes. Her lips move silently, as if she's counting."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "barely audible"}, {"s": "Give me until I can say it properly."}]}, {"k": "line", "who": "DANIEL", "tag": "", "segs": [{"d": "after a long beat"}, {"s": "Until then, I don't leave the house."}]}]}, {"n": 23, "title": "AN OLD JOB", "slug": "INT. \"MRS ADE'S QUICK WASH\" LAUNDRY, MUSHIN — DAY", "time": "18:42–20:01", "items": [{"k": "act", "t": "A small, steamy neighbourhood laundry with rows of washing machines, plastic baskets of folded clothes, a fan rattling on the ceiling and a radio playing Fuji music. Behind the counter, a huge old industrial dryer shudders and rattles. MRS ADE (60s), the owner, round, sharp-eyed, in an apron over her bubu, folds sheets with lightning speed. Eli sits on a plastic stool across the counter with his recorder on and her permission given."}, {"k": "line", "who": "MRS ADE", "tag": "", "segs": [{"s": "Yes, Sienna worked here. No, she didn't arrive singing in a limousine."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "What was she like?"}]}, {"k": "line", "who": "MRS ADE", "tag": "", "segs": [{"s": "Tired. Polite. Always writing on receipt paper."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "Writing what?"}]}, {"k": "line", "who": "MRS ADE", "tag": "", "segs": [{"s": "Songs. Little words. She'd sing them to the machines when she thought I wasn't listening."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "Did she ever talk about her family?"}]}, {"k": "line", "who": "MRS ADE", "tag": "", "segs": [{"s": "Did you come to interview me or collect her relatives?"}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "I'm trying to understand her."}]}, {"k": "line", "who": "MRS ADE", "tag": "", "segs": [{"s": "Then write this. When she became famous, she paid to replace that machine."}]}, {"k": "act", "t": "Right on cue, the dryer makes an enormous THUMP and shudders like it might take off. They both jump."}, {"k": "line", "who": "MRS ADE", "tag": "", "segs": [{"s": "This one is my mistake. Don't put it in the article."}]}, {"k": "act", "t": "They both laugh. Then Eli sits back and tries again."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "People say she's unkind."}]}, {"k": "line", "who": "MRS ADE", "tag": "", "segs": [{"s": "People say many things before breakfast. She used to give up her break to teach my niece songs. She also hated being late. Both can be true."}]}, {"k": "act", "t": "She reaches under the counter and pulls out an old, curled staff photograph. She looks at it for a moment. We see only the back of it. Eli leans forward eagerly. Then she pauses and holds it against her chest."}, {"k": "line", "who": "MRS ADE", "tag": "", "segs": [{"s": "I'll ask her before I let you copy this."}]}, {"k": "act", "t": "Eli looks disappointed, but he nods slowly and switches off the recorder."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "That's fair."}]}, {"k": "line", "who": "MRS ADE", "tag": "", "segs": [{"s": "It is."}, {"d": "beat"}, {"s": "And if you write that she's unkind, I'll send you my water bill."}]}]}, {"n": 24, "title": "\"NOT YET\"", "slug": "INT. SIENNA'S CAR — MOVING — EVENING / INT. MRS ADE'S LAUNDRY — EVENING — INTERCUT", "time": "20:01–21:02", "items": [{"k": "act", "t": "Lagos traffic at dusk: brake lights, hawkers weaving between cars selling plantain chips and phone chargers. Sienna sits in the back of the car with Uncle Sule at the wheel. Her phone rings: \"MAMA ADE (LAUNDRY).\" She smiles for the first time in days and answers. INTERCUT: Mrs Ade, alone in the laundry after closing, sits on a plastic chair holding the old staff photograph."}, {"k": "line", "who": "MRS ADE", "tag": "ON PHONE", "segs": [{"s": "My daughter. A young man came here asking about you."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I know, Mama."}, {"d": "beat"}, {"s": "Did he behave?"}]}, {"k": "line", "who": "MRS ADE", "tag": "ON PHONE", "segs": [{"s": "He behaved. The dryer did not."}, {"d": "beat"}, {"s": "He wants the old staff picture. The one with you and the red bucket."}]}, {"k": "act", "t": "A long pause. Sienna closes her eyes."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Not yet, Mama."}, {"d": "beat"}, {"s": "Please keep it for me."}]}, {"k": "line", "who": "MRS ADE", "tag": "ON PHONE", "segs": [{"s": "I have kept it eight years. I can keep it eight more."}, {"d": "beat"}, {"s": "Are you eating?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "laughing softly through sudden tears"}, {"s": "You and June. Everybody wants to feed me."}]}, {"k": "line", "who": "MRS ADE", "tag": "ON PHONE", "segs": [{"s": "Because you work like a machine and eat like a bird."}, {"d": "beat"}, {"s": "Go and eat."}]}, {"k": "line", "who": "UNCLE SULE", "tag": "", "segs": [{"d": "eyes in the mirror"}, {"s": "Mama Ade?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "hanging up"}, {"s": "She says I eat like a bird."}]}, {"k": "line", "who": "UNCLE SULE", "tag": "", "segs": [{"d": "handing a paper bag back over his shoulder"}, {"s": "Then eat this bird. Suya. I stopped at the junction."}]}]}, {"n": 25, "title": "EVERYBODY WANTS AN ANSWER", "slug": "INT. \"LUMIÈRE PARFUMS\" SPONSOR BOARDROOM, VICTORIA ISLAND — DAY", "time": "21:02–22:06", "items": [{"k": "act", "t": "A cool, white boardroom: a glass table, perfume bottles displayed in lit alcoves, and a campaign mood board on an easel showing a smiling family picnicking in a field. An EXECUTIVE (MR. OKONJO), slick, in a pinstripe suit, slides a glossy campaign proposal across the table. Sienna and Mara sit opposite."}, {"k": "line", "who": "EXECUTIVE", "tag": "", "segs": [{"s": "A warm family photograph would settle all this speculation."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "My friend has photographers outside her house. How does another photograph settle that?"}]}, {"k": "line", "who": "EXECUTIVE", "tag": "", "segs": [{"s": "Consumers value authenticity."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "The product is perfume."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "We can focus on the film, her music and her charity work."}]}, {"k": "line", "who": "EXECUTIVE", "tag": "", "segs": [{"s": "People want something personal."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "You can have my favourite breakfast. Leave my family out of the contract."}]}, {"k": "act", "t": "EXT. SPONSOR CAR PARK — MOMENTS LATER. Hot afternoon. Mara hurries after her across the car park, heels clicking on the concrete."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "I need to manage what is happening."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Start by believing me when I say something is unsafe."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "I do believe you."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "You believed there was a bad headline. I told you there was a frightened child."}]}, {"k": "act", "t": "Mara has no quick answer. For the first time, she just stands there."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I know I haven't made this easy. But stop asking me for a better smile."}]}, {"k": "act", "t": "Mara stands alone in the car park, watching the car pull away."}]}, {"n": 26, "title": "THE WRONG THEORY", "slug": "INT. LAGOS LENS NEWSROOM — NIGHT / INT. SIENNA'S KITCHEN, IKOYI — NIGHT — INTERCUT", "time": "22:06–23:02", "items": [{"k": "act", "t": "The newsroom is half empty at night: only a few desk lamps, the cleaner's mop bucket and the city glittering through the window. Eli stands at Kemi's glass-walled office with a printed timeline taped together into a long strip. Kemi sits with her feet on the desk, eating suya out of newspaper."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "She worked in a laundry. Her first bookings started years before the awards. I found people describing hard work, not a mysterious benefactor."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "That's a story."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "But the secret-family photograph—"}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "Shows a woman visiting a house. You haven't established a secret family."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "Her team won't explain the child."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "They shouldn't have to introduce a child to strangers to clear up your guess."}]}, {"k": "act", "t": "Eli has no answer. His laptop pings on Kemi's desk. A new email. Subject line: \"I KNEW HER BEFORE THE BLONDE HAIR.\" There is a photo attachment. He clicks it, and we see only the light of it on his face, never the image. His eyes widen."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"d": "quietly"}, {"s": "Kemi."}]}, {"k": "act", "t": "CUT TO: INT. SIENNA'S KITCHEN — SAME NIGHT. A huge white kitchen, very quiet. Tobi stands at the counter in socks, making tea with careful hospitality. Sienna sits on a bar stool with her phone face up beside her. It buzzes. She reads the message, and this time the audience sees it too."}, {"k": "act", "t": "ON SCREEN (her phone): \"YOU HAVE UNTIL FRIDAY. THEN EVERYBODY MEETS THE REAL YOU.\""}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"d": "not seeing it"}, {"s": "Tea or coffee?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Tea."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Sugar?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Tobi, please stop asking questions."}]}, {"k": "act", "t": "He steps back as if slapped. The spoon clinks against the bowl. She notices immediately."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "That was unfair. I'm sorry."}]}, {"k": "act", "t": "Tobi puts the mug down gently in front of her. Then he does something he has never done. He sits on the stool beside her."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "You can be scared here. I won't post it."}]}, {"k": "act", "t": "She looks at him, caught completely off guard. Her eyes fill. She doesn't cry. She pushes the phone across the counter, face down, toward him. It's a small act of trust."}]}, {"n": 27, "title": "INSTALMENTS", "slug": "INT. \"BANJO VOICE ACADEMY\", YABA — SMALL MUSIC ROOM — DAY", "time": "23:02–24:05", "items": [{"k": "act", "t": "A tiny upstairs music room with an old upright piano, posters of great singers on the walls and a fan stirring sheet music on the stand. MR. BANJO (70s), a vocal coach with a white beard and reading glasses on his nose, sits at the piano. Eli sits on a folding chair with his recorder off on his knee. On top of the piano is a dusty receipt book."}, {"k": "line", "who": "MR. BANJO", "tag": "", "segs": [{"s": "You've switched it off. Good. I don't like those machines."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "Her people said you were her first proper teacher."}]}, {"k": "line", "who": "MR. BANJO", "tag": "", "segs": [{"s": "Her first teacher was hunger. I was the second."}, {"d": "He opens the receipt book."}, {"s": "Look."}]}, {"k": "act", "t": "Close on the page: rows of handwritten entries. \"N.C. — ₦500. N.C. — ₦500. N.C. — ₦300 (owes 200). N.C. — ₦500.\" It goes on for pages."}, {"k": "line", "who": "MR. BANJO", "tag": "", "segs": [{"s": "Five hundred naira a lesson. She paid in pieces. Some weeks two hundred. Some weeks nothing."}, {"d": "beat"}, {"s": "She never missed one lesson. Not one."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"d": "reading"}, {"s": "N.C.?"}]}, {"k": "act", "t": "Mr. Banjo closes the book gently but firmly before Eli can look further."}, {"k": "line", "who": "MR. BANJO", "tag": "", "segs": [{"s": "Young man. Some initials belong to the person, not the newspaper."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"d": "after a pause"}, {"s": "Why did you let her pay in pieces?"}]}, {"k": "line", "who": "MR. BANJO", "tag": "", "segs": [{"s": "Because the first time she sang in this room, she sang like somebody calling for help from very far away."}, {"d": "beat"}, {"s": "You don't send a person like that away because of five hundred naira."}]}, {"k": "act", "t": "Eli sits very still. Then he picks up his recorder and puts it back in his bag without switching it on."}]}, {"n": 28, "title": "NAOMI", "slug": "INT. SIENNA'S PRIVATE OFFICE, IKOYI — NIGHT", "time": "24:05–24:59", "items": [{"k": "act", "t": "Rain streaks the tall windows. One lamp is on. Around a low coffee table sit Mara, Daniel and the lawyer, BARRISTER FUNMI OKOYE (50s), composed, in a dark suit, with a legal pad and pen. June sits on the sofa right beside Sienna, their shoulders touching. Sienna's phone lies in the middle of the table, unlocked, messages open. The lawyer takes notes quietly. Nobody speaks for a long moment."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "We can cancel Friday."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "He'll pick Saturday."}]}, {"k": "act", "t": "The word \"he\" lands in the room. Daniel and the lawyer exchange a look."}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "Tell them enough to help you."}]}, {"k": "act", "t": "Sienna stands. She walks to her desk, unlocks the bottom drawer with a small key from her necklace, and takes out a worn school exercise notebook with soft, curled edges. On the cover, in faded childish handwriting: \"N. COLE.\" She holds it a moment, then turns around."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "My name used to be Naomi."}]}, {"k": "act", "t": "Mara glances at June. June doesn't look surprised; she has always known. Mara looks back at Sienna."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "All right."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "That's all?"}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "It's a name. What matters is who is threatening you."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Someone I left a long time ago."}]}, {"k": "line", "who": "LAWYER", "tag": "FUNMI", "segs": [{"s": "We can work through the immediate threats first. You don't have to give everyone your whole history tonight."}]}, {"k": "act", "t": "Sienna exhales a long, shaky breath. Then she reaches into her pocket and places the clear sleeve with the faded bracelet on the table. She slides it forward to the middle."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I wore this the day I left. I lost it before I got out of the house."}, {"d": "beat"}, {"s": "Whoever sent it wanted me to know they remembered."}]}, {"k": "act", "t": "Silence except for the rain. Mara looks at the bracelet, then slowly reaches for her laptop, where the publicity calendar is open (premiere, photoshoot, sponsor launch), and closes it."}]}, {"n": 29, "title": "THE ROOFTOP", "slug": "EXT. SIENNA'S HOUSE — ROOFTOP TERRACE — LATER THAT NIGHT", "time": "24:59–26:00", "items": [{"k": "act", "t": "The rain has stopped. The rooftop terrace is wet and shining, with potted palms dripping and the Lagos skyline glittering across the lagoon. Sienna sits on the edge of a wet sun lounger in a blanket, the N. COLE notebook beside her. The terrace door creaks. Tobi comes out carrying two mugs of hot chocolate, walking very carefully on the wet tiles."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "I made hot chocolate. I didn't ask any questions. Not one. I'm very proud of myself."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "taking it, a small laugh"}, {"s": "You're allowed one."}]}, {"k": "act", "t": "Tobi sits on the next lounger and thinks very hard."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Do I call you Naomi now?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "after a long pause"}, {"s": "No."}, {"d": "beat"}, {"s": "Naomi was who I had to be. Sienna is who I chose."}, {"d": "beat"}, {"s": "Both of them are me. But only one of them gets to answer the door."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Okay, Sienna."}, {"d": "beat"}, {"s": "My mother changed her name too, you know. When she left my father. She said the old name had too many footsteps in it."}]}, {"k": "act", "t": "Sienna turns and looks at him, really looks at him, as if seeing him for the first time."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "You never told me that."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "You never asked me anything except where the biscuits went."}]}, {"k": "act", "t": "Sienna laughs, a real, surprised laugh that echoes over the wet rooftop. Then, quietly, she reaches over and clinks her mug against his."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Tell me about her. Your mother."}]}, {"k": "act", "t": "Tobi smiles, surprised and pleased, and starts to talk. The camera rises slowly above the two of them, two small figures on a shining rooftop, talking, with the whole of Lagos glittering behind them."}]}, {"n": 30, "title": "THE PRICE OF A STORY", "slug": "INT. LAGOS LENS NEWSROOM — KEMI'S OFFICE — DAY", "time": "26:00–27:03", "items": [{"k": "act", "t": "Daylight. The newsroom is busy outside the glass, but Kemi has closed the blinds. Eli sits across from her with the email printed out on the desk between them. Kemi reads it with her glasses on. Neither looks happy."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "He says her real name is Naomi Cole."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "A changed name isn't wrongdoing."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "He says she abandoned her family."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "That's his claim. What supports it?"}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "He has photographs of her as a child."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "That supports knowing a child. It doesn't establish what kind of adult he was."}]}, {"k": "act", "t": "Eli rereads the email. His finger stops on one line."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "He wants us to publish Friday. Says she needs to be \"brought back down.\""}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "Does that sound like a parent celebrating his daughter?"}]}, {"k": "act", "t": "Eli's excitement drains from his face. He looks at the email as if it has changed in his hands. He pulls his laptop over and, slowly and carefully, begins to type."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"d": "reading as he types"}, {"s": "\"To Sienna Vale's legal representatives. A person claiming a family relationship has contacted our outlet. No publication decision has been made. Attached is his message. We would like to ask about the verifiable claims only.\""}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"d": "quietly"}, {"s": "Good."}]}, {"k": "act", "t": "He attaches the sender's email and presses SEND. Immediately his phone, face up on the desk, starts ringing. \"UNKNOWN NUMBER.\" It rings. And rings. Eli and Kemi both stare at it. He doesn't answer. He clicks SAVE on the email and lets the phone ring out."}]}, {"n": 31, "title": "THE MAN AT THE TABLE", "slug": "INT. LAGOS LENS — INTERVIEW ROOM — DAY", "time": "27:03–28:17", "items": [{"k": "act", "t": "A small, bare interview room: a table, three chairs, a water jug and a camera on a tripod with its red recording light on. For the first time, the camera shows him clearly. VICTOR (58) sits on one side of the table. He is well groomed, with grey at the temples, a smart pressed shirt, a gold watch and a practised, pleasant smile. He looks like a respected church elder. He has agreed to an on-record interview. Eli and Kemi sit opposite him with notepads."}, {"k": "line", "who": "VICTOR", "tag": "", "segs": [{"s": "A father's love never ends. Even when his daughter forgets him."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "Are you her biological father?"}]}, {"k": "line", "who": "VICTOR", "tag": "", "segs": [{"s": "I raised her. That's what counts."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "Please answer precisely."}]}, {"k": "line", "who": "VICTOR", "tag": "", "segs": [{"s": "Stepfather."}, {"d": "beat"}, {"s": "But I did everything a father should."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "Why contact a newspaper instead of her representatives?"}]}, {"k": "line", "who": "VICTOR", "tag": "", "segs": [{"s": "They keep me away. Fame has confused her."}]}, {"k": "act", "t": "He reaches into a leather folder and slides a small, old photograph across the table. For the first time, we see NAOMI: a girl of about ten with dark hair in plaits, brown eyes and an uncertain, careful smile. It's the same face as Sienna's, younger, without the blonde or the grey. The camera holds on it in silence."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "What do you want from this interview?"}]}, {"k": "line", "who": "VICTOR", "tag": "", "segs": [{"s": "A reunion. Gratitude. People should know where she came from."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "Your email requested payment."}]}, {"k": "line", "who": "VICTOR", "tag": "", "segs": [{"s": "For my time."}]}, {"k": "act", "t": "Eli takes a second folder and lays out printouts one by one: the messages to Sienna, with unrelated private details blacked out."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "And these messages? Her representatives have provided copies for us to put to you."}]}, {"k": "act", "t": "Victor looks down. His smile disappears completely. His jaw tightens, and the warm man is suddenly gone."}, {"k": "line", "who": "VICTOR", "tag": "", "segs": [{"s": "You journalists always twist things."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "Are these your messages?"}]}, {"k": "line", "who": "VICTOR", "tag": "", "segs": [{"s": "She needed to answer me."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "\"You have until Friday.\""}, {"d": "beat"}, {"s": "Answer what?"}]}, {"k": "act", "t": "Victor stands so suddenly that his chair scrapes loudly. He looks down at them both."}, {"k": "line", "who": "VICTOR", "tag": "", "segs": [{"s": "Tell her she cannot erase me."}]}, {"k": "act", "t": "The door swings. Eli and Kemi sit in silence. The camera's red light is still on."}, {"k": "line", "who"
