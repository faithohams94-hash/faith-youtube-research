: "ELI", "tag": "", "segs": [{"d": "quietly"}, {"s": "I thought I was finding the story she was hiding."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "Now decide whether you'll help him tell it."}]}]}, {"n": 32, "title": "WHAT HAPPENED BEFORE SIENNA", "slug": "INT. SIENNA'S LIVING ROOM, IKOYI — EVENING", "time": "28:17–30:26", "items": [{"k": "act", "t": "A quiet, softly lit living room: cream sofas, the city at dusk through the windows, a cup of tea untouched on the table. There will be no flashback and no re-enactment. The camera stays on faces. Sienna sits on the sofa holding the cup in both hands without drinking. June sits close beside her. Mara sits on the armchair opposite, leaning forward, listening. The camera moves very little. Let the silences breathe."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "He was the man everyone liked. Helped neighbours. Spoke well at church. If someone needed a lift, Victor was available."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "And at home?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "At home I learnt which footsteps meant I should stay in my room."}]}, {"k": "act", "t": "Mara waits. Nobody rushes the silence. The clock ticks."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "He hurt me. Sometimes hit me. Sometimes made me feel I had no right to my own body. I told my mother. She said we needed peace in the house."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "Peace for him."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I believed there was something wrong with me. That I must be the reason. When people at school said I'd never make anything of myself, it sounded familiar."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "How did you leave?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I saved little bits of money. June's aunt let me stay. Then I worked. Cleaning. Laundry. Anything I could find. I sang whenever someone would listen."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "And when they wouldn't. My aunt knew every chorus through the bathroom wall."}]}, {"k": "act", "t": "Sienna laughs once through sudden tears. It's tiny and real."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I dyed my hair. Changed my name. The contacts came later. At first it was distance. Then it became a look I liked."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "Did you think nobody would recognise you?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I hoped he wouldn't find me. Hope isn't a security plan. I know that now."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I wasn't discovered and rescued in one afternoon. I auditioned for years. I went for lessons after work. Some months I couldn't afford them. Mrs Ade let me swap shifts. June fed me. A vocal coach let me pay in instalments."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "You did the work."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "People helped me do it. I want that part remembered too."}]}, {"k": "act", "t": "Mara rises from the armchair and comes closer, but stops short and doesn't touch her."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "May I sit here?"}]}, {"k": "act", "t": "Sienna nods. Mara sits."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "I'm sorry I kept treating your fear as a publicity problem."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Thank you."}]}, {"k": "act", "t": "They sit together, three women on a sofa as dusk turns to night. There is no music yet."}]}, {"n": 33, "title": "THE NEXT CALL", "slug": "INT. SIENNA'S PRIVATE OFFICE — NEXT MORNING", "time": "30:26–31:27", "items": [{"k": "act", "t": "Grey morning light. Barrister Funmi sits at the desk with a legal pad and documentation forms ready; she is handling this properly. Daniel stands by the door. June sits beside Sienna. Sienna's phone lies on the desk on speaker. She has agreed to one call. She takes a deep breath, nods to the lawyer, and presses call. It rings twice."}, {"k": "line", "who": "VICTOR", "tag": "ON SPEAKER", "segs": [{"s": "There she is. My famous girl."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Use my name."}]}, {"k": "line", "who": "VICTOR", "tag": "ON SPEAKER", "segs": [{"s": "Naomi, listen—"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Sienna."}]}, {"k": "line", "who": "VICTOR", "tag": "ON SPEAKER", "segs": [{"s": "You think hair and money change who you are?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "They don't change what you did."}]}, {"k": "act", "t": "A pause on the line. Long. Then his voice drops."}, {"k": "line", "who": "VICTOR", "tag": "ON SPEAKER", "segs": [{"s": "Careful. I can tell people things."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I won't send money. I won't meet you. Further contact goes through my lawyer."}]}, {"k": "line", "who": "VICTOR", "tag": "ON SPEAKER", "segs": [{"s": "After everything I gave you?"}]}, {"k": "act", "t": "Sienna's hand shakes visibly. Without a word, June slides her own hand across the desk and leaves it within reach. Sienna takes it and holds on."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "You don't get to ask for gratitude for a house I was afraid to sleep in."}]}, {"k": "line", "who": "VICTOR", "tag": "ON SPEAKER", "segs": [{"s": "Nobody will believe—"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "This call is over."}]}, {"k": "act", "t": "Silence. Nobody cheers. Sienna stares at the dead phone."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I thought saying that would make me feel brave."}]}, {"k": "line", "who": "LAWYER", "tag": "FUNMI", "segs": [{"s": "You can be frightened and still set a boundary. We'll deal with the next steps together."}]}]}, {"n": 34, "title": "THE NEXT STEPS", "slug": "MONTAGE — LAGOS — THE FOLLOWING DAYS", "time": "31:27–32:13", "items": [{"k": "act", "t": "Brief, grounded moments. No magic and no instant victory."}, {"k": "act", "t": "INT. POLICE STATION, IKOYI — DAY. Barrister Funmi and Daniel sit across from a calm female POLICE INSPECTOR, handing over a neat folder of printed messages and the bagged bracelet envelope."}, {"k": "line", "who": "INSPECTOR", "tag": "", "segs": [{"s": "Threats, harassment, an attempt to sell private material. We'll open a file and take it from here."}]}, {"k": "act", "t": "INT. EKO GRAND ARENA — SECURITY OFFICE — DAY. A venue SECURITY CHIEF reviews a whiteboard of entrances with Daniel."}, {"k": "line", "who": "SECURITY CHIEF", "tag": "", "segs": [{"s": "New passes. Photo ID at every door. Nobody borrows a name again."}]}, {"k": "act", "t": "INT. A GOSSIP BLOG OFFICE — DAY. An editor at a screen deletes a post with June's street visible in the background of a photo."}, {"k": "line", "who": "BLOG EDITOR", "tag": "", "segs": [{"d": "on the phone"}, {"s": "Yes, it's down. The complaint was valid. We've blurred everything."}]}, {"k": "act", "t": "INT. LUMIÈRE PARFUMS BOARDROOM — DAY. Mara sits opposite the same executive, without the picnic mood board this time."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "My client is being harassed. There will be no staged family reunion. If you're still with us, we'd like your support, not a photograph."}]}, {"k": "line", "who": "EXECUTIVE", "tag": "", "segs": [{"d": "after a long pause"}, {"s": "…We're still with you."}]}, {"k": "act", "t": "Nobody claps. The threat hasn't disappeared. But for the first time, the people around Sienna are moving in the same direction."}]}, {"n": 35, "title": "WHAT ELI PUBLISHES", "slug": "INT. LAGOS LENS — KEMI'S OFFICE / INT. SIENNA'S OFFICE — DAY — INTERCUT", "time": "32:13–33:17", "items": [{"k": "act", "t": "Kemi's office, blinds open again, sunlight striping the desk. Eli turns his laptop to show her a finished article: \"MAN SOUGHT PAYMENT FOR PRIVATE MATERIAL ABOUT SIENNA VALE.\" The claims are attributed, Victor's response is included, and nothing about June's child appears. Kemi reads every line with her glasses on."}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "We should also acknowledge the photograph story. We let it imply something we hadn't verified."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "Yes. Clearly, where readers will see it."}]}, {"k": "line", "who": "ELI", "tag": "", "segs": [{"s": "If we correct it, people will say we got it wrong."}]}, {"k": "line", "who": "KEMI", "tag": "", "segs": [{"s": "We did."}]}, {"k": "act", "t": "He nods slowly. He types the correction at the very top of the page and presses PUBLISH."}, {"k": "act", "t": "CUT TO: INT. SIENNA'S OFFICE. Tobi stands in the middle of the room holding his phone like a town crier holding a scroll. Sienna and Mara listen."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"d": "reading"}, {"s": "\"The presence of a child's belongings did not establish that Sienna had a child. We regret the misleading implication.\""}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "That sentence had a long journey."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "Ada Nwosu has offered an interview. Topics agreed in advance. You can take breaks. You can decline questions."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I don't want it to be a trial."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "It won't be."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "And June's home stays out of it."}]}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "Yes."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Then let me think about what I want to say."}]}, {"k": "act", "t": "She sits. The others quietly leave. Close on the blank page. Her pen touches the paper. This decision belongs to her."}]}, {"n": 36, "title": "THE BLANK PAGE", "slug": "INT. SIENNA'S HOME — DINING TABLE — NIGHT", "time": "33:17–34:01", "items": [{"k": "act", "t": "Midnight. The long dining table is covered in crumpled pages. One lamp. Sienna sits in an old hoodie, pen in hand, her blonde hair tied up. June sits opposite, sleepy, eating groundnuts from a paper cone. A fresh blank sheet lies in front of Sienna."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "reading from a draft"}, {"s": "\"To my fans, I owe you an explanation…\""}, {"d": "She stops."}, {"s": "No. I don't owe anybody an explanation. That's the point."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "That's the ninth one."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I'm trying to sound strong."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "Stop trying to sound strong. Sound like you."}, {"d": "beat"}, {"s": "What would you say to me? Right now, on this table?"}]}, {"k": "act", "t": "Sienna thinks. Then she speaks without looking at the paper."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I'd say… come to my concert. Sing loudly. Then let me go home."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"d": "quietly"}, {"s": "Write that."}]}, {"k": "act", "t": "Sienna writes it down. Then another line. Then another. June watches her friend's hand moving faster and faster across the page. She smiles, gets up quietly and puts a blanket over Sienna's shoulders without interrupting her."}]}, {"n": 37, "title": "NO SAD SONG", "slug": "INT. CHANNELS 9 — PRODUCTION OFFICE — AFTERNOON", "time": "34:01–34:52", "items": [{"k": "act", "t": "A busy TV production office with screens everywhere, rundown sheets taped to the wall and a producer's whiteboard listing \"SIENNA VALE — 8PM\". A young PRODUCER (KUNLE) with a lanyard and an iPad paces excitedly. ADA NWOSU sits calmly at a desk, reading through her own handwritten questions."}, {"k": "line", "who": "PRODUCER", "tag": "KUNLE", "segs": [{"s": "We open on the childhood photo. Full screen. Slow zoom. Then a sad piano under her first answer. The ratings will—"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "No."}]}, {"k": "line", "who": "PRODUCER", "tag": "KUNLE", "segs": [{"s": "Ada, it's the biggest interview of the year. People want to cry."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "finally looking up"}, {"s": "Then let them cry at what she chooses to say. Not at what we choose to show."}]}, {"k": "line", "who": "PRODUCER", "tag": "KUNLE", "segs": [{"s": "And if she cries?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Then we hold a wide shot and we wait."}, {"d": "beat"}, {"s": "She's not a story we're telling, Kunle. She's a woman we're listening to."}]}, {"k": "act", "t": "The producer looks at the whiteboard. Slowly, he picks up the marker and wipes out \"CHILDHOOD PHOTO — OPEN\" and \"PIANO UNDER\"."}]}, {"n": 38, "title": "THE DRIVE", "slug": "INT. SIENNA'S CAR — MOVING — EVENING", "time": "34:52–35:31", "items": [{"k": "act", "t": "Golden-hour Lagos through the window. Sienna sits in the back in her simple cream outfit, her handwritten page folded in her hands. June sits beside her. Uncle Sule drives with the radio off. Daniel sits in the front. Nobody speaks for a long time."}, {"k": "line", "who": "UNCLE SULE", "tag": "", "segs": [{"d": "eyes in the mirror"}, {"s": "Madam. You want music?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "No, Uncle Sule."}, {"d": "beat"}, {"s": "Just this."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"d": "after a while"}, {"s": "You can still change your mind."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "That's why I won't."}]}, {"k": "line", "who": "UNCLE SULE", "tag": "", "segs": [{"d": "as they pull up at the studio gate"}, {"s": "Madam. Whatever you say tonight… I'll be in the car park, listening on the radio."}, {"d": "beat"}, {"s": "Like the old days in the small clubs."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"d": "touching his shoulder"}, {"s": "Turn it up loud, Uncle Sule."}]}]}, {"n": 39, "title": "BEFORE THE CAMERAS", "slug": "INT. CHANNELS 9 TELEVISION — DRESSING ROOM — EVENING", "time": "35:31–36:12", "items": [{"k": "act", "t": "A small TV dressing room: a mirror with bulbs, a monitor showing the empty studio set, a garment rail and a \"QUIET PLEASE\" sign. Sienna sits in a simple, elegant cream outfit: no gown, no diamonds, her blonde hair loose, her grey contacts in. June sits on the small sofa. Tobi sets down a bottle of water and a packet of biscuits on the counter with a flourish."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "How many survived?"}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "All of them. Growth."}]}, {"k": "act", "t": "She laughs. Mara appears in the doorway with no clipboard and no tablet, just herself."}, {"k": "line", "who": "MARA", "tag": "", "segs": [{"s": "We can still leave."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I know. That's why I can stay."}]}, {"k": "act", "t": "A knock. The interviewer, ADA NWOSU (48), elegant, grey-streaked natural hair, a calm and trustworthy presence, waits to be invited in before she enters."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Anything you'd like me to check before we begin?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Don't put the childhood picture on the screen. I haven't agreed to that."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "We won't."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "And no sad song under my answers."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Your words are enough."}]}, {"k": "act", "t": "The FLOOR MANAGER leans in and signals \"two minutes\" with his fingers. Sienna stands. She looks once at June. June mouths something silently: \"Orange gate.\" Sienna laughs under her breath, then walks out toward the set."}]}, {"n": 40, "title": "THE BUTTON", "slug": "INT. MODEST FAMILY FLAT, IKORODU — EARLY EVENING", "time": "36:12–37:00", "items": [{"k": "act", "t": "A small, tidy flat with second-hand furniture, a ceiling fan wobbling slightly, and a pot of stew bubbling on a gas cooker in the corner. On the small table: a pile of bills, a calculator and a school exercise book. RUTH (40s), still in her nurse's-aide uniform, sits with a white school shirt and a needle, looking for a missing button. MAYA (15) rushes in from her room holding the TV remote like a microphone."}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "Mum! It's starting at eight! Sienna Vale! The real interview!"}]}, {"k": "line", "who": "RUTH", "tag": "", "segs": [{"s": "Your father isn't home yet. And this shirt has lost its button again. How do you lose a button every week?"}]}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "The button loses itself. It wants freedom."}]}, {"k": "act", "t": "Ruth laughs despite herself. Then she glances at the bills on the table, and the laugh fades. Maya notices, but pretends not to. The front door opens. BEN (40s) walks in, still in his security-company uniform, exhausted, dropping his bag by the door."}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"s": "Did I miss it?"}]}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "Two minutes! Sit, Daddy, sit!"}]}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"d": "sitting heavily"}, {"s": "Twelve hours at that gate and now I'm being ordered around in my own house."}]}, {"k": "line", "who": "RUTH", "tag": "", "segs": [{"d": "threading the needle"}, {"s": "Welcome to Maya's house. We only pay the rent."}]}, {"k": "act", "t": "Maya switches on the TV. The Channels 9 logo appears. She slides off the sofa onto the rug, as close to the screen as she can get, hugging her knees. Ruth and Ben exchange a quick, worried look over her head about the bills, then both look at the TV."}]}, {"n": 41, "title": "THE INTERVIEW", "slug": "INT. CHANNELS 9 — INTERVIEW STUDIO — EVENING", "time": "37:00–41:50", "items": [{"k": "act", "t": "Quiet lighting. Two chairs angled toward each other, a small table with two glasses of water, and a dark background with a soft warm glow. There is no studio audience and no one waiting to applaud pain. The red light on camera one comes on. Behind the cameras in the shadows stand Mara, Tobi, June and Daniel."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Thank you for coming. What do you want to explain tonight?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "The recent threats. The changed name. And why some parts of my life have stayed private. I want to speak for myself because someone else has been trying to speak for me."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Your name was Naomi Cole."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Yes. I grew up in an unsafe home. My stepfather abused me. When I asked for help inside that home, I didn't get the protection I needed."}]}, {"k": "act", "t": "She pauses. Ada waits and doesn't fill the silence."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I won't describe every incident. Saying it happened is enough for tonight."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "What helped you leave?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "A safe place offered by my friend's aunt. Money I had saved. Later, work. People who believed I could learn something and become something. Leaving didn't solve everything, but it gave me room to begin."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "And becoming Sienna?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I wanted a name that didn't make me turn around expecting trouble. The blonde hair helped me feel different. The contacts became part of the stage image. But none of that taught me to sing. I still had to practise."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "People see the awards and assume success was quick."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "They didn't see the bus journeys. Or me singing into a cheap phone and listening back thinking, \"Well, that was unfortunate.\""}]}, {"k": "act", "t": "Ada laughs gently. Behind the camera, Tobi silently laughs too."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I was terrible at some auditions. I improved. I learnt how to take useful criticism without letting every cruel person become my teacher."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "You've often let false stories circulate. Why?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Sometimes I found them funny. Sometimes they helped sell an album. Sometimes I was exhausted. There are only so many hours you can spend explaining that a man standing beside you is the lighting technician."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Did that approach work?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Until people went looking for my friend and her child. I understand now that silence leaves other people space to invent. But that still doesn't give them permission to follow a child."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Some viewers will feel hurt that they knew so little about someone they supported."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I understand feeling close to an artist. A song can carry you through a difficult year. That connection matters to me. But buying my album didn't buy access to my friend's front door."}]}, {"k": "act", "t": "She leans forward slightly and speaks to the lens now, not to Ada."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Come to the concert. Sing loudly. Tell me which song you love. Then let me go home. Let the people I love go to school, go to work, buy bread. They haven't agreed to be part of this."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Does being famous mean accepting a loss of privacy?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Some attention comes with the job. Questions about my work are fair. Criticism is fair. Grabbing me, following my car or identifying a child's school is a choice somebody makes. They can choose differently."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "And the reputation for being difficult?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Sometimes I am difficult. Ask Tobi about rehearsal schedules."}]}, {"k": "act", "t": "Cut briefly to Tobi behind the cameras, raising both eyebrows as high as they go and nodding vigorously. The crew stifles laughter."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I can be impatient. I've apologised when I've spoken unfairly to people. Being hurt doesn't excuse hurting someone else. But refusing a photograph isn't cruelty. Saying \"don't touch me\" isn't ingratitude."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "What happens now?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "My representatives are dealing with the threats. I'm getting support. I'm going back to work. Healing is something I work on. It isn't an award I win and put on a shelf."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "What about forgiveness?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "That's something I will decide privately. Nobody gets to use that word to send me back into danger."}]}, {"k": "act", "t": "Ada nods and doesn't press. She turns the last card in her hand face down and asks her final question without notes."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "What would you say to a young person watching who believes their life has already been decided?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I used to believe that. When enough people tell you that you will never become anything, you start hearing their voices even when they're not there."}]}, {"k": "act", "t": "She lifts her eyes and looks straight into the camera."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I won't promise that everything becomes easy. Find safe people. Tell someone trustworthy if you're being hurt. Keep learning when you can. Ask for help. You don't have to become famous for your life to matter."}]}, {"k": "act", "t": "A breath."}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "But don't let somebody's cruelty write your whole future. The life you're living now may not be the only life you can have."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Thank you, Sienna."}]}]}, {"n": 42, "title": "LAGOS WATCHES", "slug": "MONTAGE — ACROSS LAGOS — DURING THE BROADCAST", "time": "41:50–42:29", "items": [{"k": "act", "t": "The interview plays on screens all over the city. Quick, quiet cuts."}, {"k": "act", "t": "MRS ADE'S LAUNDRY. Mrs Ade sits on a plastic chair in front of a tiny TV propped on a washing machine, the old staff photograph in her lap. The dryer is silent for once."}, {"k": "line", "who": "MRS ADE", "tag": "", "segs": [{"d": "to the TV, softly"}, {"s": "I told that boy. Both can be true."}]}, {"k": "act", "t": "BLUE NOTE LOUNGE. Oga Pius leans on his bar, the TV above the bottles. His cat sits on the bar beside him."}, {"k": "line", "who": "OGA PIUS", "tag": "", "segs": [{"d": "to the cat"}, {"s": "You hear? Six people and you. We were the first audience."}]}, {"k": "act", "t": "BANJO VOICE ACADEMY. Mr. Banjo sits at his piano in the dark, listening on a small radio, the receipt book open on the music stand."}, {"k": "line", "who": "MR. BANJO", "tag": "", "segs": [{"d": "quietly"}, {"s": "N.C. … Paid in full."}]}, {"k": "act", "t": "A UNIVERSITY HOSTEL ROOM. The young woman who cried at the concert barrier sits on her bunk all, tidy living room: a rug, a second-hand sofa, a ceiling fan and a TV on a wooden stand. On the small table are bills, a calculator and a school exercise book. MAYA (15), in a T-shirt with her hair in cornrows, sits on the rug hugging her knees, eyes glued to the TV. Her mother RUTH (40s) sits on the sofa sewing a button back onto Maya's white school shirt. Her father BEN (40s), just home from work, still in his security-company uniform, has left his work shoes beside the sofa. On TV, Sienna smiles as Ada thanks her. The volume fades naturally as Maya speaks."}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "I'm going to be great too."}]}, {"k": "act", "t": "Ruth looks up from her needle."}, {"k": "line", "who": "RUTH", "tag": "", "segs": [{"s": "You are already somebody, sweetheart."}]}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "I know. But there are things I want to do. Things I've been scared to even say."}]}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"s": "Like what?"}]}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "Design buildings. Proper ones. Homes people feel happy coming back to."}]}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"s": "An architect?"}]}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "Yes."}]}, {"k": "act", "t": "She picks up her exercise book from the table and opens it. At the top of a page, in her own handwriting: \"WHAT I WANT TO BECOME\". Below it, the page is blank."}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "I didn't write it because I thought… with everything happening, maybe it was too much."}]}, {"k": "act", "t": "Ruth slowly sets the shirt aside. Ben looks at the bills too, then at his daughter."}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "Mum, Dad, don't worry. I know things are hard now. But I don't think they'll always be like this. We'll keep trying. I'll keep learning. One day, we'll look back at this."}]}, {"k": "act", "t": "Ben looks at Ruth. They have both been trying so hard to hide how worried they are."}, {"k": "line", "who": "RUTH", "tag": "", "segs": [{"s": "You don't have to fix everything for us, Maya."}]}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"s": "Your job is to grow. We're here to help you do that."}]}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "Then tomorrow, will you help me find out how to become an architect?"}]}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"s": "Tomorrow."}]}, {"k": "line", "who": "RUTH", "tag": "", "segs": [{"s": "After breakfast."}]}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "Dad will say after tea, then after the news, then after another tea."}]}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"s": "Architects need patient clients."}]}, {"k": "act", "t": "They all laugh. Ruth pulls Maya up onto the sofa and squeezes her in between them."}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "Did you hear what she said? She took buses to auditions."}]}, {"k": "line", "who": "RUTH", "tag": "", "segs": [{"s": "Most people take a bus somewhere before anybody notices them."}]}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "I thought people like her were just… chosen."}]}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"s": "Some doors open easily. Some take work and help. We'll find out what yours needs."}]}, {"k": "act", "t": "Maya picks up a pen. Under \"WHAT I WANT TO BECOME\", she writes in big, careful capitals: \"AN ARCHITECT\". Below it, smaller: \"ASK ABOUT SUBJECTS AND COURSES\". She underlines it twice. Her dream now has a next step."}]}, {"n": 45, "title": "AFTER BREAKFAST", "slug": "INT. \"SHARP-SHARP CYBER CAFÉ\", IKORODU — NEXT MORNING", "time": "44:45–45:41", "items": [{"k": "act", "t": "A crowded little cyber café with old desktop computers in rows, a printer humming and a hand-written sign: \"₦200 PER 30 MINUTES.\" Ben, on his day off and in a T-shirt, sits beside Maya at a computer. Maya types carefully, her exercise book open beside the keyboard. The receipt stamped \"30 MINS\" sits on the desk."}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"s": "You see? After breakfast. I kept my promise."}]}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "After breakfast, after tea and after the news."}]}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"s": "But before the second tea. Respect the effort."}]}, {"k": "act", "t": "On screen: \"How to become an architect in Nigeria\". Maya reads, her lips moving silently."}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"d": "reading"}, {"s": "\"Physics. Mathematics. Technical drawing.\""}, {"d": "beat"}, {"s": "Daddy, our school doesn't do technical drawing."}]}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"d": "leaning closer to the screen"}, {"s": "Then we ask the school. And if the school says no, we ask the church. Somebody always knows somebody."}]}, {"k": "line", "who": "MAYA", "tag": "", "segs": [{"s": "And if nobody knows anybody?"}]}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"d": "after a beat"}, {"s": "Then I'll learn technical drawing with you."}, {"d": "beat"}, {"s": "I used to draw very straight lines when I was young."}]}, {"k": "act", "t": "Maya laughs out loud. The café owner glares at them. They both duck, giggling. Maya writes in her exercise book under \"AN ARCHITECT\": \"PHYSICS. MATHS. TECHNICAL DRAWING (ASK SCHOOL).\" Then she adds: \"DADDY WILL LEARN TOO.\""}, {"k": "act", "t": "CAFÉ OWNER: Oga, five minutes left!"}, {"k": "line", "who": "BEN", "tag": "", "segs": [{"d": "standing, digging in his pocket for coins"}, {"s": "Another thirty minutes, please."}, {"d": "beat"}, {"s": "My daughter is building something."}]}]}, {"n": 46, "title": "SHE GOES HOME", "slug": "INT. SIENNA'S HOME, IKOYI — KITCHEN — LATER THAT NIGHT", "time": "45:41 — END", "items": [{"k": "act", "t": "The big white kitchen, but warm now: soft lamps, the city quiet outside. June sets two steaming bowls on the counter. Sienna walks in wearing comfortable clothes, an old T-shirt and joggers, with her blonde hair tied up loosely. Her grey contacts are out. For the first time in the film, her real brown eyes are visible, the same eyes as the girl in the photograph. Her hair stays blonde. She doesn't have to undo her chosen identity to be herself."}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "How do you feel?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Tired. Hungry. A little lighter."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "Good. There is food, and you can deal with the plates."}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "I've just done a national interview."}]}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "These are national plates."}]}, {"k": "act", "t": "Sienna bursts out laughing, a big, free laugh. Her phone on the counter starts lighting up with notifications, dozens, then hundreds. She glances at it. Then she turns it face down."}, {"k": "line", "who": "JUNE", "tag": "", "segs": [{"s": "Aren't you going to see what people are saying?"}]}, {"k": "line", "who": "SIENNA", "tag": "", "segs": [{"s": "Tomorrow. Tonight I'm eating."}]}, {"k": "act", "t": "They sit side by side, eating and laughing about nothing. No threatening message interrupts the ending."}, {"k": "act", "t": "CUT BRIEFLY TO: Maya's bedroom in Ikorodu. Her exercise book rests on top of her school bag, open to \"AN ARCHITECT\". Her school shirt hangs on the door, its button sewn back on."}, {"k": "act", "t": "CUT BACK TO: Sienna and June laughing at the kitchen counter, soft lamplight. The camera slowly pulls back through the window into the Lagos night, past the city lights, up toward the sky."}, {"k": "act", "t": "FADE OUT."}, {"k": "title", "t": "Love the work. Respect the person. Leave their family in peace."}, {"k": "title", "t": "THE CELEBRITY HAS A SECRET"}, {"k": "end", "t": "END"}]}];

function chunks(t){ return (t.match(/[^.!?…]+[.!?…]*["”’)]*\s*/g)||[t]).map(s=>s.trim()).filter(Boolean); }
function speak(text, who, myRun, onWord){
  return new Promise(async res=>{
    const [,g,p] = cast(who);
    const parts = chunks(text);
    for(const part of parts){
      if(myRun!==runId) return res(false);
      await new Promise(r=>{
        const u = new SpeechSynthesisUtterance(part.replace(/naira/gi,"nyra"));
        u.voice = who==="NARRATOR"||who==="_ACT"? VO.n : (g==="f"?VO.f:VO.m);
        u.pitch = who==="_ACT"?0.95:Math.min(2,Math.max(0.1,p));
        u.rate = (who==="_ACT"?1.08:who==="NARRATOR"?0.9:1) * speed();
        let done=false; const fin=()=>{if(!done){done=true;clearTimeout(to);r();}};
        const to=setTimeout(fin, 2500 + part.split(/\s+/).length*650/speed());
        u.onend=fin; u.onerror=fin;
        u.onboundary=e=>{ if(onWord && e.name!=="sentence") onWord(); };
        synth.speak(u);
      });
    }
    res(myRun===runId);
  });
}
const wait = (ms,myRun)=>new Promise(r=>setTimeout(()=>r(myRun===runId),ms));
const words = t => t.split(/\s+/).filter(Boolean).length;

function lineText(it){
  if(it.k==="line") return it.segs.filter(s=>s.s).map(s=>s.s).join(" ");
  if(it.k==="card") return (it.who==="ON PAPER"?"The note reads: ":it.who==="MEANWHILE"?"Meanwhile. ":"On screen: ")+it.t;
  return it.t;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function initials(w){ if(w==="NARRATOR") return "◉"; return w.replace(/^(YOUNG|DR\.|MRS\.|INSPECTOR) /,"").split(/\s+/).map(x=>x[0]).join("").slice(0,2); }

function renderItem(it,i){
  const d=document.createElement("div"); d.className="it"; d.dataset.i=i;
  if(it.k==="act"){ d.classList.add("act"); d.textContent=it.t; }
  else if(it.k==="line"){
    const [c]=cast(it.who); d.classList.add("line"); if(it.who==="NARRATOR") d.classList.add("narr");
    d.style.setProperty("--c",c);
    const body = it.segs.map(s=> s.d?`<span class="dir">(${esc(s.d)})</span> `: s.s.split(/(\s+)/).map(w=>/\S/.test(w)?`<span class="word">${esc(w)}</span>`:w).join("")+" ").join("");
    d.innerHTML=`<div class="av" aria-hidden="true">${initials(it.who)}</div><div class="bub"><div class="who">${esc(it.who)}${it.tag?`<em>${esc(it.tag)}</em>`:""}</div><div class="say">${body}</div></div>`;
  }
  else if(it.k==="card"){ d.classList.add("card"); if(it.who==="ON PAPER") d.classList.add("paper"); if(it.who==="MEANWHILE") d.classList.add("mw"); d.innerHTML=`<small>${it.who==="ON PAPER"?"WRITTEN NOTE":it.who==="MEANWHILE"?"MEANWHILE":"ON SCREEN"}</small><p>${esc(it.t)}</p>`; }
  else { d.classList.add("titlecard"); d.textContent=it.t; }
  d.addEventListener("click",()=>{ const was=playing; stop(); li=i; draw(); if(was) play(); });
  return d;
}

function drawHead(anim){
  const s=SCENES[si];
  const h=$("head"); h.className="scenehead"+(anim?" enter":"");
  h.innerHTML=`<div class="num">SCENE ${s.n} OF ${SCENES.length} · ${esc(s.time)}</div><h2>${esc(s.title)}</h2><div class="slug">${esc(s.slug)}</div>`;
}
function draw(anim){
  const s=SCENES[si], feed=$("feed");
  const have = feed.dataset.si==si ? feed.children.length : 0;
  if(feed.dataset.si!=si){ feed.innerHTML=""; feed.dataset.si=si; drawHead(true); }
  while(feed.children.length>li+1) feed.lastChild.remove();
  for(let i=feed.children.length;i<=li;i++){ const el=renderItem(s.items[i],i); if(i>=have) el.classList.add("fresh"); feed.appendChild(el); }
  [...feed.children].forEach((el,i)=>el.classList.toggle("cur",i===li));
  drawEnd(); ticks(); list();
  const cur=feed.children[li]; if(cur) cur.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  const it=s.items[li]; $("nowTxt").textContent=`Scene ${s.n} · ${it.k==="line"?it.who+": ":""}${lineText(it)}`.slice(0,140);
  store.set("si",si);
}
function atEnd(){ return li>=SCENES[si].items.length-1; }

function pollFor(n){ return $("optPolls").checked ? POLLS.find(p=>p.at===n && answers[p.id]===undefined) : null; }
function revealsFor(n){ return POLLS.filter(p=>p.rev===n && answers[p.id]!==undefined); }
function updateScore(){
  const done=POLLS.filter(p=>answers[p.id]!==undefined && seen.has(SCENES.findIndex(s=>s.n===p.rev)) && revealedOnce.has(p.id));
  const right=done.filter(p=>answers[p.id]===p.a).length;
  $("score").innerHTML=done.length?`Detective score <b>${right}/${done.length}</b>`:"";
}
let revealedOnce = new Set(store.get("rev",[]));

let countdown=null;
function drawEnd(){
  const box=$("end"); box.innerHTML=""; clearInterval(countdown);
  if(!atEnd()) return;
  const n=SCENES[si].n;
  revealsFor(n).forEach(p=>{
    revealedOnce.add(p.id); store.set("rev",[...revealedOnce]);
    const ok=answers[p.id]===p.a;
    const r=document.createElement("div"); r.className="reveal"+(ok?"":" miss");
    r.innerHTML=`<b>${ok?"YOU CALLED IT":"PLOT TWIST"}</b><div>You guessed “${esc(p.o[answers[p.id]])}”. ${esc(p.why)}</div>`;
    box.appendChild(r);
  });
  updateScore();
  const p=pollFor(n);
  if(p){
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<h3>${esc(p.q)}</h3><p>Lock in your guess. The answer comes later in the story.</p><div class="opts">${p.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div class="row"><button class="btn ghost" id="skipPoll">Skip</button><span class="count" id="cd"></span></div>`;
    box.appendChild(b);
    b.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ answers[p.id]=+o.dataset.i; store.set("ans",answers); o.classList.add("pick"); toast("Guess locked in. Keep watching…"); setTimeout(()=>{ if(playing) nextScene(true); else drawEnd(); },700); });
    $("skipPoll").onclick=()=>{ answers[p.id]=-1; store.set("ans",answers); nextScene(playing); };
    if(playing){ let t=15; $("cd").textContent=`Story continues in ${t}s`; countdown=setInterval(()=>{ t--; if($("cd")) $("cd").textContent=`Story continues in ${t}s`; if(t<=0){ clearInterval(countdown); if(answers[p.id]===undefined){answers[p.id]=-1;store.set("ans",answers);} if(playing) nextScene(true);} },1000); }
    return;
  }
  if(si<SCENES.length-1){
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<p>Up next · Scene ${SCENES[si+1].n}</p><h3>${esc(SCENES[si+1].title)}</h3><div class="row"><button class="btn" id="goNext">Continue</button></div>`;
    box.appendChild(b); $("goNext").onclick=()=>nextScene(playing);
  } else {
    const right=POLLS.filter(p=>answers[p.id]===p.a).length;
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<h3>The end</h3><p>You guessed ${right} of ${POLLS.length} twists correctly.</p><div class="row"><button class="btn" id="restart">Watch again from Scene 1</button></div>`;
    box.appendChild(b); $("restart").onclick=()=>{ answers={}; store.set("ans",answers); revealedOnce=new Set(); store.set("rev",[]); goScene(0); };
  }
}

function goScene(i, keepPlaying){ const was=keepPlaying??playing; stop(); si=Math.max(0,Math.min(SCENES.length-1,i)); li=0; seen.add(si); store.set("seen",[...seen]); draw(true); window.scrollTo({top:0}); if(was) play(); }
function nextScene(keep){ if(si<SCENES.length-1) goScene(si+1,keep); else stop(); }

async function runLoop(){
  const my=++runId;
  while(my===runId){
    const s=SCENES[si], it=s.items[li];
    const text=lineText(it);
    const useVoice = $("optVoice").checked && synth && (it.k!=="act" || $("optAct").checked);
    let ok;
    if(useVoice){
      const who = it.k==="line"? it.who : "_ACT";
      const el=$("feed").children[li]; const ws=el?[...el.querySelectorAll(".word")]:[]; let wi=0;
      ok = await speak(text, who, my, ()=>{ if(ws[wi]) ws[wi++].classList.add("spoken"); });
      if(ok) ws.forEach(w=>w.classList.add("spoken"));
      ok = ok && await wait(250/speed(),my);
    } else {
      ok = await wait(Math.max(1400, words(text)*(it.k==="act"?230:300))/speed() + 400, my);
    }
    if(!ok) return;
    if(!atEnd()){ li++; draw(); continue; }
    if(pollFor(s.n)) return; // poll handles continuation with countdown
    if(si>=SCENES.length-1){ stop(); return; }
    if(!(await wait(1800,my))) return;
    nextScene(true); return;
  }
}

let lock=null;
async function play(){ playing=true; setIcon(); try{ lock = await navigator.wakeLock?.request("screen"); }catch(e){} if(atEnd() && pollFor(SCENES[si].n)){ drawEnd(); return; } if(atEnd()&&si<SCENES.length-1){ nextScene(true); return; } drawEnd(); runLoop(); }
function stop(){ playing=false; runId++; clearInterval(countdown); if(synth) synth.cancel(); setIcon(); try{lock?.release();}catch(e){} lock=null; const c=$("cd"); if(c) c.textContent=""; }
function setIcon(){ $("playIco").innerHTML = playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>'; $("bPlay").setAttribute("aria-label",playing?"Pause":"Play"); }

function step(d){ const was=playing; stop(); const s=SCENES[si];
  if(d>0){ if(!atEnd()) li++; else if(!pollFor(s.n)) { nextScene(was); return; } }
  else { if(li>0) li--; else if(si>0){ goScene(si-1,false); li=SCENES[si].items.length-1; draw(); } }
  draw(); if(was) play(); }

function ticks(){ const t=$("ticks"); if(!t.children.length){ SCENES.forEach((s,i)=>{const b=document.createElement("button"); b.title=`Scene ${s.n}: ${s.title}`; b.setAttribute("aria-label",b.title); b.onclick=()=>goScene(i); t.appendChild(b);}); }
  [...t.children].forEach((b,i)=>{ b.className=(i===si?"now":seen.has(i)?"seen":""); }); }
function list(){ const l=$("sl"); if(!l.children.length){ SCENES.forEach((s,i)=>{ const b=document.createElement("button"); b.innerHTML=`<span class="n">${String(s.n).padStart(2,"0")}</span><span class="t">${esc(s.title)}</span><span class="tm">${esc(s.time.split("–")[0].split(" ")[0])}</span>`; b.onclick=()=>{ $("drawer").hidden=true; goScene(i); }; l.appendChild(b); }); }
  [...l.children].forEach((b,i)=>{ b.classList.toggle("now",i===si); b.classList.toggle("seen",seen.has(i)&&i!==si); }); }

let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2200); }

$("bPlay").onclick=()=> playing?stop():play();
$("bNext").onclick=()=>step(1); $("bPrev").onclick=()=>step(-1);
$("bNextS").onclick=()=>nextScene(playing); $("bPrevS").onclick=()=>goScene(si-1);
$("openList").onclick=()=>{ $("drawer").hidden=false; const n=$("sl").querySelector(".now"); n&&n.scrollIntoView({block:"center"}); };
$("closeList").onclick=()=>$("drawer").hidden=true;
$("drawer").onclick=e=>{ if(e.target.id==="drawer") $("drawer").hidden=true; };
document.addEventListener("keydown",e=>{
  if(e.target.closest("select,input")) return;
  if(e.code==="Space"){ e.preventDefault(); playing?stop():play(); }
  else if(e.key==="ArrowRight") step(1); else if(e.key==="ArrowLeft") step(-1);
  else if(e.key==="Escape") $("drawer").hidden=true;
});
document.addEventListener("visibilitychange",async()=>{ if(playing && document.visibilityState==="visible"){ try{ lock=await navigator.wakeLock?.request("screen"); }catch(e){} } });

if(si>=SCENES.length) si=0;
seen.add(si);
draw(true);
if(si>0) toast(`Welcome back. You're on Scene ${SCENES[si].n}.`);
</script>
