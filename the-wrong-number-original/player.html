ng in Halima's back garden. Mango trees, a small vegetable patch and the call to prayer drifting in from a distant mosque. Halima waters tomato plants with a green watering can. Chloe sits on the back step with a cup of tea going cold beside her. Her phone, face up on the step, starts to ring."}, {"k": "act", "t": "Chloe's phone rings: \"KUNLE.\" She looks at it. Halima, watering plants, looks at her."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "You don't have to answer."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "taking a breath"}, {"s": "I know."}, {"d": "She answers."}, {"s": "Hello, Kunle."}]}, {"k": "line", "who": "KUNLE", "tag": "ON PHONE", "segs": [{"d": "warm, reasonable"}, {"s": "Chloe. Enough of this drama. Come home. The children need their routine. I've been patient."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I've filed for divorce, Kunle."}]}, {"k": "act", "t": "Silence on the line."}, {"k": "line", "who": "KUNLE", "tag": "ON PHONE", "segs": [{"d": "the warmth gone"}, {"s": "You've what?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "My lawyer will contact your lawyer."}]}, {"k": "line", "who": "KUNLE", "tag": "ON PHONE", "segs": [{"s": "Your lawyer? With whose money?"}, {"d": "a cold laugh"}, {"s": "Chloe, you can't even choose between jollof and fried rice without calling me. And now you want to go to court? Against me?"}]}, {"k": "act", "t": "Chloe closes her eyes. Then she opens them."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "quietly, steadily"}, {"s": "You're right. I used to call you."}, {"d": "beat"}, {"s": "I don't anymore."}]}, {"k": "act", "t": "She hangs up. Her hand shakes. Halima puts down the watering can and hugs her."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "Did you hear yourself?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "a shaky laugh"}, {"s": "I did."}]}]}, {"n": 34, "title": "\"WHAT WILL PEOPLE SAY?\"", "slug": "INT. HALIMA'S SITTING ROOM — DAY — DAYS LATER", "time": "29:04–30:15", "items": [{"k": "act", "t": "Days later. The doorbell rings at Halima's house. Halima opens the door, and AUNTY BOLA, Kunle's elder sister, sweeps in wearing a huge gold gele and holding her handbag like a weapon. She doesn't wait to be offered a seat. She lowers herself onto the sofa. Chloe comes in from the kitchen, wipes her hands, greets her respectfully and sits opposite."}, {"k": "act", "t": "Halima hovers in the kitchen doorway, pretending to dry a plate."}, {"k": "line", "who": "AUNTY BOLA", "tag": "", "segs": [{"s": "Chloe, my dear. I've come in peace."}, {"d": "beat"}, {"s": "Every marriage has its troubles. You think my own husband is a saint? We endure. That's what women do."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "politely"}, {"s": "Thank you for coming, Aunty."}]}, {"k": "line", "who": "AUNTY BOLA", "tag": "", "segs": [{"s": "Divorce? In this family? Do you know what people are saying at church? That you've gone mad. That a man in Lagos is filling your head with rubbish."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "a small smile"}, {"s": "A woman, Aunty. And she never once told me to leave. She only asked if I was safe."}]}, {"k": "line", "who": "AUNTY BOLA", "tag": "", "segs": [{"s": "Safe? Kunle has never laid a finger on you!"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "calmly"}, {"s": "No, Aunty. He just laid his hand on everything else."}, {"d": "beat"}, {"s": "My money. My friends. My work. My voice."}, {"d": "beat"}, {"s": "I'm not asking anybody to understand. I'm only telling you I'm not going back."}]}, {"k": "act", "t": "Aunty Bola stares at her. She opens her mouth, then closes it. She picks up her handbag and stands."}, {"k": "line", "who": "AUNTY BOLA", "tag": "", "segs": [{"d": "at the door, quietly, not turning around"}, {"s": "You were always the clever one in this family, Chloe."}, {"d": "beat"}, {"s": "I hope it serves you better than it served me."}]}, {"k": "act", "t": "She leaves. Chloe sits very still. Halima walks over and puts a hand on her shoulder."}]}, {"n": 35, "title": "THE EDGE OF SOMETHING ENORMOUS", "slug": "INT. HALIMA'S GUEST ROOM / EMMA'S APARTMENT — FRIDAY NIGHT — INTERCUT", "time": "30:15–30:49", "items": [{"k": "act", "t": "Friday night. Halima's guest room. The children are asleep. Chloe sits by the window with her phone, the Abuja night quiet outside. In Lagos, Emma sits up in bed with her laptop open, work forgotten."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I've started divorce proceedings."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "How do you feel?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Like I'm standing at the edge of something enormous."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Do you wish you hadn't started?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "No. I'm just afraid of what comes next."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Then we'll keep talking as you go. And please let Zainab and the people there help you with the hard decisions."}]}, {"k": "act", "t": "Chloe replies with only a heart: ❤️"}, {"k": "act", "t": "In Lagos, Emma looks at the heart for a long time. She opens a drawer and takes out a printed photo she has never shown anyone: a screenshot of the very first message. \"Jollof rice or fried rice? Sorry, I forgot which one you wanted.\" She pins it to the wall above her desk."}]}, {"n": 36, "title": "THE HEARING", "slug": "INT. HIGH COURT, ABUJA — COURTROOM — DAY — YEAR FIVE", "time": "30:49–32:36", "items": [{"k": "act", "t": "Year Five. The High Court in Abuja. Heavy wooden doors swing open into a wood-panelled courtroom with a raised bench and ceiling fans turning slowly. Kunle walks in first in an expensive suit, shaking hands, confident. Chloe follows with Zainab, who carries a box file. Halima takes a seat in the public gallery. Everyone rises as the JUDGE enters and sits."}, {"k": "act", "t": "A formal courtroom. Kunle sits with his lawyer, immaculate and calm. Chloe sits with Zainab, composed but visibly nervous. Halima is in the gallery."}, {"k": "line", "who": "KUNLE'S LAWYER", "tag": "", "segs": [{"s": "My Lord, my client has always provided for his family. A beautiful home. The best schools. A driver. Everything a wife could want."}, {"d": "beat"}, {"s": "Mrs. Adeyemi left that home without warning, taking the children with her. My client simply wants his family back."}]}, {"k": "line", "who": "JUDGE", "tag": "", "segs": [{"s": "Mrs. Adeyemi. The court would like to hear from you about your experience of the marriage."}]}, {"k": "act", "t": "Chloe stands. She takes a long moment."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "My Lord, for a long time, I thought a good wife was someone who never upset her husband. So I stopped disagreeing. Then I stopped asking."}, {"d": "beat"}, {"s": "Eventually, I stopped recognising myself."}]}, {"k": "act", "t": "The courtroom is quiet."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "He's right. He provided. A beautiful house."}, {"d": "beat"}, {"s": "My daughter once drew that house for me, My Lord. She forgot to draw any windows. When I asked why, she said it was so nobody could see in and shout."}]}, {"k": "act", "t": "Kunle shifts in his seat."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I don't want to punish my husband. I want a safe and stable life for our children."}, {"d": "beat"}, {"s": "And I want the freedom to live my own life."}]}, {"k": "act", "t": "She sits down. Zainab squeezes her hand under the table, then rises."}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"s": "My Lord, the petitioner kept a contemporaneous record of the respondent's conduct. Three notebooks, two hundred and fourteen dated entries, and forty-one audio recordings. Exhibits C to F."}, {"d": "beat"}, {"s": "With the court's permission, one entry."}]}, {"k": "line", "who": "JUDGE", "tag": "", "segs": [{"s": "Proceed."}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"d": "reading"}, {"s": "\"Tuesday, 7:15 a.m. He said in front of the children, 'Your mother can't even choose between jollof and fried rice without me. That's how useless she is.' Ada cried in the car.\""}]}, {"k": "act", "t": "Silence in the courtroom. Kunle's lawyer leans over to whisper to him. Kunle stares at the notebooks on the clerk's table and, for the first time, doesn't look confident."}]}, {"n": 37, "title": "\"I AM SO TIRED\"", "slug": "INT. HALIMA'S GUEST ROOM / EMMA'S CAR, LAGOS — FRIDAY NIGHT — YEAR SIX", "time": "32:36–33:08", "items": [{"k": "act", "t": "Months pass. Hearings, adjournments, more hearings. Zainab's file grows thicker: Chloe's three blue notebooks, the voice recordings, Halima's statement and the counsellor's report. Late one Friday night in Halima's guest room, Chloe walks in, drops her handbag on the floor and lies down on the bed without taking off her shoes."}, {"k": "act", "t": "Months of hearings. Chloe's notebooks and recordings were read into the record, and Kunle's lawyer fought every page. Adjournments. Chloe lies on the bed fully dressed, too tired to change."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I am so tired."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "I know."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Everybody keeps telling me to be strong."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Then I won't tell you that today."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "What will you tell me?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Eat something. Rest if you can. Speak to Zainab about what happens next. You don't have to perform strength for me."}]}, {"k": "act", "t": "Chloe reads it twice. Then she gets up, goes to the kitchen and makes herself a plate of food. For herself."}]}, {"n": 38, "title": "\"LET'S GO HOME\"", "slug": "INT. COURTROOM → EXT. COURT STEPS, ABUJA — DAY — WEEKS LATER", "time": "33:08–33:56", "items": [{"k": "act", "t": "Weeks later. The same courtroom, packed and silent. Chloe sits beside Zainab with her hands folded tightly in her lap. Kunle sits across the aisle staring straight ahead. The Judge looks up from her papers, adjusts her glasses and begins to read."}, {"k": "line", "who": "JUDGE", "tag": "", "segs": [{"s": "Having considered the children's welfare and the evidence before this court, the marriage is dissolved. The children, Ada and Tobi Adeyemi, will primarily live with their mother, with appropriate arrangements made for their father."}]}, {"k": "act", "t": "Chloe sits completely still. Zainab gently touches her arm."}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"s": "Chloe?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "barely audible"}, {"s": "It's over?"}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"s": "This part is over. You can begin the next chapter."}]}, {"k": "act", "t": "Kunle walks past their table without looking at her. Chloe watches him go and feels, for the first time, nothing but quiet."}, {"k": "act", "t": "OUTSIDE. The sun is bright over Abuja. Ada and Tobi break away from Halima and run into Chloe's arms."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy, can we go home?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "holding both of them"}, {"s": "Yes, darling."}, {"d": "beat"}, {"s": "Let's go home."}]}, {"k": "act", "t": "THAT EVENING."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "We have a home. The children are with me. We did it."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "You did it, Chloe. You and everyone who stood beside you. I'm so proud of you."}]}, {"k": "act", "t": "Chloe reads the message three times, then laughs and cries at the same time. For the first time in years, her tears taste of relief."}]}, {"n": 39, "title": "THE HANDOVER", "slug": "EXT. HALIMA'S GATE, ABUJA — SATURDAY MORNING — WEEKS LATER", "time": "33:56–34:41", "items": [{"k": "act", "t": "A bright Saturday morning, weeks later. Kunle's black SUV pulls up outside Halima's gate and the engine idles. The gate opens. Chloe walks out holding Tobi's hand, with Ada beside her, each child carrying a small weekend bag."}, {"k": "act", "t": "Kunle's car waits at the gate for his first weekend with the children. Chloe walks Ada and Tobi out with their small bags. Kunle gets out of the car, smiling and charming."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Chloe. You look… well."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Thank you."}, {"d": "to the children"}, {"s": "Bags, water bottles, Tobi's inhaler is in the front pocket."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "lowering his voice"}, {"s": "You know, it doesn't have to be like this. I've been thinking. We could try again. For the children."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "calmly"}, {"s": "The children will be back on Sunday at six, Kunle."}, {"d": "beat"}, {"s": "Please make sure Tobi eats something that isn't sweets."}]}, {"k": "act", "t": "Kunle stares at her. He has never heard this voice before: calm, unafraid, polite and final."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "stiffly"}, {"s": "Sunday at six."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "hugging her mother"}, {"s": "Bye, Mummy."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Bye, my darling. Have fun."}]}, {"k": "act", "t": "The car drives away. Halima comes out with two cups of tea."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "How do you feel?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "watching the road"}, {"s": "Like I just made a decision."}, {"d": "beat"}, {"s": "And nobody shouted."}]}]}, {"n": 40, "title": "A ROOM OF HER OWN", "slug": "INT. CHLOE ADEYEMI INTERIORS, ABUJA — MORNING — YEAR SEVEN", "time": "34:41–35:30", "items": [{"k": "act", "t": "Year Seven. Morning in Wuse. Chloe walks up to a small shop front with a new sign above the door and stops to look at it for a moment. She takes out a key, unlocks the door and steps inside. The office smells of fresh paint."}, {"k": "act", "t": "Chloe unlocks the door of a modest office. A small sign reads \"CHLOE ADEYEMI INTERIORS.\" Her first employee, a young man called SEGUN, is setting up a laptop. Fabric samples lie on a table. A framed drawing hangs on the wall: a house with no windows, signed \"Ada, age 8.\" Beside it is Chloe's own sketch of the same house, now with big windows."}, {"k": "line", "who": "SEGUN", "tag": "", "segs": [{"s": "Good morning, madam! The printer is refusing to work again."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "laughing"}, {"s": "Of course it is."}]}, {"k": "act", "t": "Her phone buzzes."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Madam CEO! How's the empire?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "The empire currently has one employee and a printer that refuses to work."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Every empire starts somewhere. Have you tried threatening the printer?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma! 😂"}]}, {"k": "act", "t": "Later, another message."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Seriously, are you happy?"}]}, {"k": "act", "t": "Chloe looks across the office at Segun laughing with a client on the phone."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Not every day. I still worry about money. Sometimes I wake up afraid for no reason. But most mornings, I actually look forward to the day."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "That sounds like something worth celebrating."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I wish you were here."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Me too."}]}]}, {"n": 41, "title": "SEVEN YEARS, NO FACE", "slug": "INT. AI STUDIO, LAGOS — EMMA'S OFFICE — DAY — YEAR SEVEN", "time": "35:30–36:17", "items": [{"k": "act", "t": "Year Seven. Lagos. Emma now has her own office with a glass door that reads \"HEAD OF DEPARTMENT.\" She eats jollof from a takeaway pack at her desk. Bisi strolls in without knocking and leans against the door frame with her arms folded."}, {"k": "act", "t": "Emma, now running her department, eats lunch at her desk. The screenshot of the first message is still pinned above it. Bisi leans in the doorway."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "Seven years. And you've never asked for a photo?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "No."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "Not even once? She could be anybody!"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "smiling"}, {"s": "She is somebody."}, {"d": "beat"}, {"s": "I know her voice from our phone calls. I know her children's names, their school projects and which teacher Tobi hates. I know she can't sleep before a big presentation and that she still says sorry to printers."}, {"d": "beat"}, {"s": "What would a face add?"}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "Eyebrows. At least eyebrows."}]}, {"k": "act", "t": "Emma laughs."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "When we meet, we'll meet."}, {"d": "She looks at the screenshot."}, {"s": "Some things are better when you don't rush them."}]}]}, {"n": 42, "title": "MUMMY'S QUESTION", "slug": "INT. HOSPITAL WARD, IBADAN — AFTERNOON — YEAR SEVEN", "time": "36:17–37:15", "items": [{"k": "act", "t": "Ibadan. A bright hospital ward with white sheets and an open window. Emma walks in carrying a bag of oranges and a flask of pepper soup. MAMA EMMA, thin but smiling, sits up against her pillows and opens her arms. Emma pulls a chair close to the bed, sits and begins to peel."}, {"k": "act", "t": "Mama Emma, recovering and sitting up in bed, eats oranges that Emma peels for her."}, {"k": "line", "who": "MAMA EMMA", "tag": "", "segs": [{"s": "You smile at your phone like a schoolgirl. Who is he?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "laughing"}, {"s": "It's not a he, Mummy. It's my friend in Abuja. Chloe."}]}, {"k": "line", "who": "MAMA EMMA", "tag": "", "segs": [{"s": "The one you've never met?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Seven years."}]}, {"k": "line", "who": "MAMA EMMA", "tag": "", "segs": [{"d": "shaking her head"}, {"s": "You young people."}, {"d": "beat"}, {"s": "What does she give you, this woman you've never seen?"}]}, {"k": "act", "t": "Emma stops peeling. She thinks about it seriously."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "When I started, I thought I was helping her."}, {"d": "beat"}, {"s": "But Mummy, I used to come home to an empty flat and talk to nobody until Monday. Now every Friday, somebody in Abuja asks me if I've eaten."}, {"d": "beat"}, {"s": "She made me softer. I didn't know I needed that."}]}, {"k": "line", "who": "MAMA EMMA", "tag": "", "segs": [{"d": "taking her hand"}, {"s": "Then she's family."}, {"d": "beat"}, {"s": "And family should come to dinner. Tell her I said so."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "smiling"}, {"s": "I'll tell her."}]}]}, {"n": 43, "title": "STILL HERE", "slug": "MONTAGE — LAGOS AND ABUJA — YEAR EIGHT", "time": "37:15–37:50", "items": [{"k": "act", "t": "Year Eight. A sequence of ordinary Fridays in two cities: building sites, boardrooms, sofas and kitchens. The friendship has become part of everyday life."}, {"k": "act", "t": "FRIDAY, 8:07 AM. Chloe on a building site in a hard hat."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Still here ❤️"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Me too ❤️"}]}, {"k": "act", "t": "ANOTHER FRIDAY, 6:41 PM. Emma bursts out of a boardroom."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "I finally got that promotion!"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "MY GIRL!!!"}]}, {"k": "act", "t": "ANOTHER FRIDAY, 10:12 PM. Chloe on her sofa, exhausted."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Today was difficult. I don't feel like talking."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "That's okay. Sleep well, Chloe. We can talk another time."}]}, {"k": "act", "t": "ANOTHER FRIDAY, 2:19 PM."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Mummy is out of hospital and fully well. She asked who \"Rice Woman\" is. I told her you're family."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"d": "after a long pause"}, {"s": "Tell her family says hello."}]}]}, {"n": 44, "title": "\"COFFEE?\"", "slug": "INT. BUILDING SITE OFFICE, ABUJA — AFTERNOON — YEAR NINE", "time": "37:50–38:39", "items": [{"k": "act", "t": "Year Nine. A dusty building site in Abuja with concrete pillars and the sound of drills. In a site office made from a shipping container, a fan rattles on a filing cabinet and blueprints cover a long table. TUNDE BALOGUN, an architect in a rolled-up shirt with a pencil behind his ear, finishes going through the drawings with Chloe."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "So that's the ceiling heights agreed."}, {"d": "beat"}, {"s": "Would you like to get coffee?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "not looking up from the plans"}, {"s": "Coffee? As in a meeting?"}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "Not exactly."}]}, {"k": "act", "t": "Chloe looks up and raises an eyebrow."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "I was hoping for the kind where we talk about things other than ceiling heights."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "putting down her pen"}, {"s": "Tunde, I should tell you something. I've been married before. I have two children."}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "I know."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "And I'm not looking for someone to take over my life."}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"d": "smiling"}, {"s": "Good. I wouldn't know what to do with somebody else's life. I'm still trying to organise mine."}]}, {"k": "act", "t": "Chloe laughs, a real, unguarded laugh."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "One coffee."}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "One coffee."}, {"d": "beat"}, {"s": "You choose the place."}]}, {"k": "act", "t": "Chloe pauses at that, \"you choose\", and smiles."}]}, {"n": 45, "title": "\"EXCUSE ME???\"", "slug": "INT. CHLOE'S HOUSE / EMMA'S OFFICE — FRIDAY NIGHT — INTERCUT", "time": "38:39–39:36", "items": [{"k": "act", "t": "Friday night. Chloe sits on her own sofa in her own home, wrapped in a throw, phone in hand, smiling. In Lagos, Emma is still at her office desk, the building empty around her."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "There's someone."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "EXCUSE ME???"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Stop shouting through the phone."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Name. Occupation. Criminal record. Favourite rice."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Architect. Tunde. And before you ask, he likes both jollof and fried rice."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Finally. A man with sense."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma!"}]}, {"k": "act", "t": "Then Chloe becomes serious."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I'm frightened of making another mistake."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "That's understandable. Take your time. Pay attention to how he treats you, especially when you disagree. You don't have to rush anything."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I told him I'm not ready to remarry."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "What did he say?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "He said, \"Then we won't discuss marriage until you want to.\""}]}, {"k": "act", "t": "Emma smiles at her desk."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "And what did you think?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I thought it was nice to say no without being afraid of what came next."}]}]}, {"n": 46, "title": "THE BOY WHO LIKES BOTH", "slug": "INT. CHLOE'S HOUSE, ABUJA — DINING ROOM — EVENING — MONTHS LATER", "time": "39:36–40:13", "items": [{"k": "act", "t": "Months later. Evening. Chloe's dining room is warm and bright. Two pots sit in the middle of the table, one of jollof and one of fried rice. The doorbell rings. Tobi runs to open it. Tunde stands on the doorstep holding a bottle of malt and a bunch of flowers, nervous. Chloe calls everyone to sit."}, {"k": "act", "t": "Tunde's first dinner with the children. Ada (16) watches him carefully. Tobi (13) is chatty. Chloe serves two pots."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Mr. Tunde, jollof or fried rice? You have to pick. It's a test."}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"d": "seriously"}, {"s": "Both. Is that allowed?"}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"d": "to Chloe"}, {"s": "Mummy, is that allowed?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "smiling"}, {"s": "In this house, it's allowed."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "arms folded"}, {"s": "Mr. Tunde. If Mummy disagrees with you, what do you do?"}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"d": "putting down his fork"}, {"s": "I listen. Then usually I find out she's right. It's very annoying."}]}, {"k": "act", "t": "Tobi laughs. Ada studies him for a long moment."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "quietly"}, {"s": "And if she says no?"}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"d": "gently"}, {"s": "Then the answer is no."}]}, {"k": "act", "t": "Ada looks at her mother. Then, for the first time, she smiles at him."}]}, {"n": 47, "title": "\"NOT YET\"", "slug": "EXT. JABI LAKE, ABUJA — EVENING — YEAR NINE", "time": "40:13–40:58", "items": [{"k": "act", "t": "Sunset at Jabi Lake. The water glows orange and pink, and a roasted-corn seller fans her coals by the path. Couples and families stroll along the edge. Chloe and Tunde walk side by side, eating corn wrapped in paper."}, {"k": "act", "t": "Chloe and Tunde walk along the lake at sunset, eating roasted corn."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "My lease ends next month. I was thinking… maybe I could find somewhere closer to you and the children."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "stopping"}, {"s": "Tunde."}, {"d": "beat"}, {"s": "I'm not ready for that."}]}, {"k": "act", "t": "She braces herself, watching his face for the change she has spent ten years learning to see. It doesn't come."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"d": "nodding, easily"}, {"s": "Okay."}, {"d": "He takes another bite of corn."}, {"s": "Then I'll renew it. My landlord will be delighted. He thinks I'm his only tenant who pays on time."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "still watching him"}, {"s": "You're not angry?"}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "Why would I be angry?"}, {"d": "beat"}, {"s": "You told me what you want. That's the whole point of asking."}]}, {"k": "act", "t": "Chloe looks out at the lake. Then she slips her hand into his."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "quietly"}, {"s": "Thank you."}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "For what?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "For letting \"no\" be a full sentence."}]}]}, {"n": 48, "title": "THE WINDOW", "slug": "INT. CHLOE'S NEW HOUSE, ABUJA — UNFINISHED ROOM — EVENING — YEAR TEN", "time": "40:58–41:45", "items": [{"k": "act", "t": "Year Ten. Evening. The sound of crickets. Tunde leads Chloe down a corridor of her house, his hands gently over her eyes, guiding her past ladders and paint tins into a half-built room that smells of sawdust."}, {"k": "act", "t": "A half-built extension Tunde has been designing for the house. An empty frame waits for a huge window. Tunde leads Chloe in with his hands over her eyes."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "Don't look yet."}, {"d": "He takes his hands away."}, {"s": "Okay. Look."}]}, {"k": "act", "t": "Through the empty frame, the sunset pours into the room."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "gasping"}, {"s": "Tunde. It's huge."}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "The biggest window in the house."}, {"d": "beat"}, {"s": "Ada told me about her drawing. The house with no windows."}, {"d": "beat"}, {"s": "So I designed you a room that's nothing but window. A room where nobody will ever disturb you."}]}, {"k": "act", "t": "Chloe turns to him with tears in her eyes. Tunde takes a small box from his pocket. He doesn't kneel. He just holds it out."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "I know you said we wouldn't discuss marriage until you wanted to."}, {"d": "beat"}, {"s": "So I'm not asking you tonight. I'm asking you to tell me when."}]}, {"k": "act", "t": "Chloe looks at the ring, then at the window, then at him. She takes the box out of his hand."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "smiling through tears"}, {"s": "Then I'm telling you."}, {"d": "beat"}, {"s": "Now. Ask me now."}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"d": "laughing softly"}, {"s": "Chloe Adeyemi. Will you marry me?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Yes."}]}]}, {"n": 49, "title": "\"HE ASKED\"", "slug": "INT. CHLOE'S HOUSE / EMMA'S OFFICE — FRIDAY, 2:19 PM — YEAR TEN", "time": "41:45–42:10", "items": [{"k": "act", "t": "Year Ten. Friday, 2:19 PM. Chloe's kitchen is bright and full of plants. Ada (17) and Tobi (14) do homework at the island. Chloe sits at the counter, turns her hand in the sunlight to catch the sparkle, and lifts her phone."}, {"k": "act", "t": "Chloe (43) sits in her bright kitchen. Ada is 17 and Tobi 14, both doing homework. Chloe's business is thriving. She photographs her own hand and sends it: an engagement ring."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "He asked."}]}, {"k": "act", "t": "In Lagos, Emma (45) jumps out of her chair."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "AND WHAT DID YOU SAY???"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Yes, you ridiculous woman! 😂"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "I'm screaming in my office. Bisi thinks I've been fired."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "from the corridor"}, {"s": "Have you been fired?!"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "shouting back"}, {"s": "She said YES!"}]}]}, {"n": 50, "title": "\"PLEASE COME\"", "slug": "INT. CHLOE'S HOUSE / EMMA'S OFFICE — CONTINUOUS", "time": "42:10–42:42", "items": [{"k": "act", "t": "Moments later. In Lagos, Emma has shut her office door and sits with the phone in both hands. In Abuja, Chloe stands at the kitchen window, nervous, her thumb hovering over the screen."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma, I need to ask you something."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Anything."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Will you come to my wedding?"}]}, {"k": "act", "t": "Emma stops smiling. A pause."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I mean it. I want us to meet."}]}, {"k": "act", "t": "Emma looks at the message. She smiles, but her eyes are wet. Ten years. Ten years of Fridays. Ten years of knowing someone through words and a voice instead of a face."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Are you sure? What if you discover I'm a terrible person who steals food from other people's plates?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Yes?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Please come."}]}, {"k": "act", "t": "Emma wipes away a tear."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Of course I'll come."}]}]}, {"n": 51, "title": "WHAT IF?", "slug": "INT. EMMA'S APARTMENT, LAGOS — NIGHT BEFORE THE WEDDING", "time": "42:42–43:30", "items": [{"k": "act", "t": "The night before the wedding. Emma's bedroom in Lagos. An open suitcase lies on the bed, half-packed. An emerald-green outfit hangs on the wardrobe door, still in its plastic cover. Emma sits on the bed, then stands, then sits again, and finally calls Bisi."}, {"k": "act", "t": "An open suitcase. An emerald-green outfit hangs on the wardrobe door. Emma sits on the bed on the phone with Bisi."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Bisi, what if I'm not what she imagines? Ten years of messages. She thinks I'm wise. I'm a woman who eats cereal for dinner and talks to her plants."}]}, {"k": "line", "who": "BISI", "tag": "ON PHONE", "segs": [{"s": "Emma. She doesn't love your wisdom. She loves that you showed up. Every Friday. For ten years."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "quietly"}, {"s": "What if I walk in and she's disappointed?"}]}, {"k": "line", "who": "BISI", "tag": "ON PHONE", "segs": [{"s": "Then she'll be disappointed for five seconds, and then she'll hug you for five hours."}, {"d": "beat"}, {"s": "Go to sleep. Your flight is at seven."}]}, {"k": "act", "t": "Emma hangs up and looks at the screenshot of the first message, now printed and folded into her passport."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Jollof with turkey."}, {"d": "beat"}, {"s": "Here we go."}]}]}, {"n": 52, "title": "ARRIVALS", "slug": "INT. NNAMDI AZIKIWE AIRPORT, ABUJA — ARRIVALS HALL — WEDDING DAY, MORNING", "time": "43:30–44:00", "items": [{"k": "act", "t": "Wedding day morning. Nnamdi Azikiwe Airport, Abuja. The sliding doors of the arrivals hall open. Travellers stream out into the heat, and taxi drivers call out. Emma walks out pulling a small suitcase, a garment bag over her arm, and stops to take a breath."}, {"k": "act", "t": "Emma walks out of arrivals with a small suitcase and her emerald outfit in a garment bag. A TAXI DRIVER waves her over."}, {"k": "line", "who": "TAXI DRIVER", "tag": "", "segs": [{"s": "Madam, taxi? Where are you going?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "taking a deep breath"}, {"s": "To meet my best friend. For the first time."}]}, {"k": "line", "who": "TAXI DRIVER", "tag": "", "segs": [{"d": "confused"}, {"s": "For the first time? And she's your best friend?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Ten years."}]}, {"k": "line", "who": "TAXI DRIVER", "tag": "", "segs": [{"d": "grinning, opening the door"}, {"s": "Madam, this is Abuja. I've heard stranger things."}, {"d": "beat"}, {"s": "Where to?"}]}, {"k": "act", "t": "Emma looks at her phone. She types \"On my way!\", then deletes it. She types it again, and deletes it again."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "to herself"}, {"s": "No. Let her be surprised."}]}, {"k": "act", "t": "She puts the phone in her bag and gets in."}]}, {"n": 53, "title": "THE BRIDE'S ROOM", "slug": "INT. HOTEL SUITE, ABUJA — WEDDING DAY — AFTERNOON", "time": "44:00–44:52", "items": [{"k": "act", "t": "Wedding day afternoon. A hotel suite in Abuja filled with flowers, steam from an iron, and laughter from the next room. Makeup brushes and hairpins cover the dressing table. Chloe sits in front of a large mirror in her ivory dress while a makeup artist works. Halima stands behind her with the veil, and Ada watches from the window seat."}, {"k": "act", "t": "Chloe sits in front of a mirror in her ivory dress while the makeup artist finishes. Halima pins her veil. Ada (17), in a gold dress, holds the bouquet."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "You look like a queen, Chloe. A real one this time."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "checking her phone"}, {"s": "She hasn't texted today."}]}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "Who? Emma?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Every Friday for ten years, she texts. And today, nothing."}, {"d": "beat"}, {"s": "What if she changed her mind? What if she's scared? What if I'm too much?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "kneeling in front of her"}, {"s": "Mummy. You told me that when someone goes quiet, it doesn't mean the friendship has disappeared."}, {"d": "beat"}, {"s": "Aunty Friday taught you that. Remember?"}]}, {"k": "act", "t": "Chloe looks at her daughter and breathes."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "smiling"}, {"s": "When did you get so wise?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "I've been reading your messages over your shoulder since I was seven."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "gasping, laughing"}, {"s": "Ada!"}]}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"d": "laughing"}, {"s": "Come. Your husband is waiting. And so, I think, is your friend."}]}]}, {"n": 54, "title": "THE STRANGER WHO ANSWERED", "slug": "EXT. GARDEN WEDDING RECEPTION, ABUJA — EVENING", "time": "44:52–47:34", "items": [{"k": "act", "t": "Evening. A beautiful garden reception. Fairy lights hang between the trees, and round tables have white cloths and white flowers. A live band plays highlife softly. Three hundred guests in lace and agbada laugh and eat. The MC taps the microphone, and the music fades as the bride stands up."}, {"k": "act", "t": "A beautiful outdoor reception with warm evening lights, white flowers, music, and family laughing and talking. Chloe is radiant in an elegant ivory dress. Tunde sits beside her, smiling. Ada and Tobi sit nearby. Halima and Zainab are at the front table. The MC hands Chloe the microphone."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "First, thank you to everyone who came to celebrate with us."}, {"d": "She turns to Tunde."}, {"s": "And Tunde, thank you for loving the woman I am, not the woman you want me to become."}]}, {"k": "act", "t": "Guests applaud. Chloe takes a breath."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "But before we continue, there's somebody I need to introduce. Somebody very special."}, {"d": "beat"}, {"s": "Ten years ago, I sent a text message asking whether I should cook jollof rice or fried rice. Sounds silly, doesn't it?"}]}, {"k": "act", "t": "Guests laugh."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "But I wasn't laughing that afternoon. I was terrified. I'd become so afraid of upsetting my husband that even choosing what to cook felt like a test I couldn't afford to fail."}]}, {"k": "act", "t": "The garden goes quiet."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I was using a new phone. I typed one digit wrong. And the message went to a complete stranger. That stranger replied, \"Wrong receiver, but jollof rice with turkey sounds better.\""}]}, {"k": "act", "t": "Soft laughter."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "A week later, I sent another message. And she replied again. And somehow, we just kept talking."}, {"d": "beat"}, {"s": "About food, traffic, children, work, terrible bosses, broken printers and the weather. We laughed. We argued over the most ridiculous things."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "And when I finally admitted I was afraid in my own home, she didn't laugh at me. She didn't blame me. She asked whether I was safe."}]}, {"k": "act", "t": "Chloe's eyes fill with tears."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "She encouraged me to speak to people who could help me. She reminded me I was capable, even when I'd forgotten what that felt like."}, {"d": "beat"}, {"s": "She was there when I went back to designing. When I earned my first money. When I started divorce proceedings. When I was afraid of losing my children. When I opened my business. And when I met this wonderful man sitting beside me."}]}, {"k": "act", "t": "She reaches for Tunde's hand."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "But here's the part some of you may not believe."}, {"d": "She looks around the reception."}, {"s": "I have never met her."}]}, {"k": "act", "t": "The guests begin to murmur."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Ten years. Ten years of friendship, and we've never seen each other face-to-face. I asked her to come today because I couldn't imagine celebrating this moment without her."}, {"d": "Her voice trembles."}, {"s": "I want to introduce you to the woman who helped save my life. Not because she fought my battles for me. She couldn't. But because she reminded me, week after week, that I was worth fighting for."}, {"d": "beat"}, {"s": "Her name is Emma. Emma Williams."}]}, {"k": "act", "t": "Chloe looks around. Silence. No one stands. Her smile begins to falter. She looks toward the entrance. Nothing."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"d": "whispering to Zainab"}, {"s": "Where is she?"}]}]}, {"n": 55, "title": "\"STILL HERE\"", "slug": "EXT. WEDDING RECEPTION — CONTINUOUS", "time": "47:34–48:04", "items": [{"k": "act", "t": "The silence stretches. Every guest is looking around. Chloe stands at the microphone, her smile slowly fading."}, {"k": "act", "t": "Chloe's phone lies beside her bouquet. It lights up with a new message."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Still here ❤️"}]}, {"k": "act", "t": "Chloe gasps and looks up. At the back of the reception, a woman in an elegant emerald-green outfit slowly rises from her seat. Emma. She's smiling and crying."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "calling out gently"}, {"s": "Chloe?"}]}, {"k": "act", "t": "Chloe puts a hand over her mouth."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Emma?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You still haven't learned how to cook the right rice."}]}, {"k": "act", "t": "The entire reception erupts in laughter. Chloe laughs through her tears. She steps down from the platform, gathering her dress. Emma walks toward her. They stop, facing each other. Two women who have shared ten years of their lives, who know each other's fears, humour, hopes and hard days, and who have never been in the same room."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "You came."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Of course I came."}]}, {"k": "act", "t": "Chloe starts to cry."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I don't even know what to say."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Well, that's a first."}]}, {"k": "act", "t": "They laugh and embrace. Chloe holds her tightly."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Thank you."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "For what?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "For answering."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "looking into her eyes"}, {"s": "Thank you for texting back."}]}]}, {"n": 56, "title": "AUNTY FRIDAY", "slug": "EXT. WEDDING RECEPTION — CONTINUOUS", "time": "48:04–49:18", "items": [{"k": "act", "t": "Applause fills the garden. The two women hold each other in the middle of the aisle while guests wipe their eyes. Then small footsteps come running across the grass."}, {"k": "act", "t": "Ada comes forward and wraps her arms around Emma."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "You're Aunty Friday?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "laughing"}, {"s": "I suppose I am!"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy talks about you all the time."}, {"d": "beat"}, {"s": "You're the reason she started laughing again. I was seven. I remember."}]}, {"k": "act", "t": "Emma can't speak. Tobi joins the hug. For the first time, Emma sees the children whose school stories and birthdays she has followed for ten years."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "You look exactly like your texts."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "laughing through tears"}, {"s": "What does that even mean?"}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Funny."}]}, {"k": "act", "t": "Tunde approaches, smiling."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "So you're the famous Emma."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "And you're the man who likes both kinds of rice?"}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "Guilty."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I think we're going to get along."}]}, {"k": "act", "t": "The guests applaud. Chloe goes back to the microphone, still holding Emma's hand."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I want to say one last thing. Sometimes, when you're going through something terrible, you start to believe nobody cares. That nobody sees you. That nobody would understand."}, {"d": "beat"}, {"s": "But please don't give up on the possibility of kindness. Talk to someone you trust. Accept help. And if someone reaches out to you, don't underestimate what it means to listen."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Because ten years ago, one wrong digit sent my message to the wrong number. And somehow…"}, {"d": "She looks at Emma."}, {"s": "…it reached exactly the person I needed."}]}, {"k": "act", "t": "The guests stand and applaud. Emma wipes away her tears."}]}, {"n": 57, "title": "THE FIRST DANCE", "slug": "EXT. WEDDING RECEPTION — DANCE FLOOR — LATER THAT NIGHT", "time": "49:18–49:45", "items": [{"k": "act", "t": "Later that night. The band plays upbeat highlife and the dance floor is packed. Aunties are dancing, children are spinning, and Tunde is attempting a terrible shoki. At the edge of the floor, by the food table, two women stand side by side with full plates."}, {"k": "act", "t": "Music. Everyone dances. Emma and Chloe stand at the edge of the dance floor with plates of food, laughing."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "looking at her plate"}, {"s": "Your caterer made jollof AND fried rice."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I couldn't decide."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "mock horror"}, {"s": "After ten years?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "smiling"}, {"s": "No. I decided. I wanted both."}, {"d": "beat"}, {"s": "And nobody in this garden is going to tell me that's wrong."}]}, {"k": "act", "t": "Emma looks at her friend, really looks at her, then raises her plate like a toast."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "To both."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "To both."}]}, {"k": "act", "t": "They clink plates. Tunde pulls Chloe onto the dance floor. She reaches back and drags Emma in too. Halima, Ada and Tobi join. Everyone dances under the lights."}]}, {"n": 58, "title": "JOLLOF WITH TURKEY", "slug": "INT. CHLOE AND TUNDE'S KITCHEN, ABUJA — FRIDAY, 2:19 PM — ONE WEEK AFTER THE WEDDING", "time": "49:45 — END", "items": [{"k": "act", "t": "One week after the wedding. Friday afternoon. Sunlight floods a bright kitchen with a huge window and plants on every sill, a room Chloe designed herself. Soft music plays. The back door is open, and laughter drifts in from the garden."}, {"k": "act", "t": "Chloe stands in the kitchen of the home she shares with Tunde and the children. Sunlight fills the room. Music plays softly. Everything is warm, relaxed and lived-in. Tunde walks in."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "Darling, what are we having for dinner?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I haven't decided."}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "Anything you make is fine with me."}]}, {"k": "act", "t": "He kisses her cheek and leaves, humming. Chloe pauses. She remembers another kitchen. Another Friday. A woman trembling as she typed. She looks around her bright kitchen and smiles. Her phone buzzes."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Happy Friday, Rice Woman! What's cooking? 😂"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I haven't decided. Jollof or fried?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Whatever YOU want, Chloe."}]}, {"k": "act", "t": "Chloe stares at the words. Her smile widens."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Whatever I want."}]}, {"k": "act", "t": "She looks out the window. Then she types."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Jol /* Guessing games: asked at the end of scene `at`, answered when scene `rev` finishes */

const $ = id => document.getElementById(id);

const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;

["optVoice","optAct","optPolls","optSpeed"].forEach(id=>{const v=store.get(id,null); if(v!==null){ if($(id).type==="checkbox"){ if(!$(id).disabled) $(id).checked=v;} else $(id).value=v; } $(id).addEventListener("change",()=>{store.set(id,$(id).type==="checkbox"?$(id).checked:$(id).value); if(id==="optVoice"&&!$(id).checked&&synth) synth.cancel();});});
const speed = () => parseFloat($("optSpeed").value);

/* voices */
let VO = {f:null,m:null,n:null};
function pickVoices(){
  if(!synth) return;
  const vs = synth.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!vs.length) return;
  const fem=/female|samantha|karen|moira|tessa|zira|susan|hazel|serena|victoria|fiona|libby|sonia|aria|jenny|ezinne|abeo|google uk english female|natasha|catherine/i;
  const mal=/male|daniel|david|mark|alex|george|rishi|fred|guy|ryan|thomas|oliver|arthur|google uk english male|william|james/i;
  const ng = vs.filter(v=>/NG/i.test(v.lang));
  const pool = ng.length>=2?ng.concat(vs):vs;
  VO.f = pool.find(v=>fem.test(v.name)&&!/\bmale\b/i.test(v.name.replace(/female/i,""))) || pool[0];
  VO.m = pool.find(v=>mal.test(v.name)&&!/female/i.test(v.name)) || pool.find(v=>v!==VO.f) || pool[0];
  VO.n = pool.find(v=>/en-GB/i.test(v.lang)&&mal.test(v.name)&&!/female/i.test(v.name)) || VO.m;
}
if(synth){ pickVoices(); synth.onvoiceschanged = pickVoices; }

function chunks(t){ return (t.match(/[^.!?…]+[.!?…]*["”’)]*\s*/g)||[t]).map(s=>s.trim()).filter(Boolean); }
function speak(text, who, myRun, onWord){
  return new Promise(async res=>{
    const [,g,p] = cast(who);
    const parts = chunks(text);
    for(const part of parts){
      if(myRun!==runId) return res(false);
      await new Promise(r=>{
        const u = new SpeechSynthesisUtterance(part.replace(/naira/gi,"nyra"));
        u.voice = who==="NARRATOR"||who==="_ACT"? VO.n : (g==="f"?VO.f:VO.m);
        u.pitch = who==="_ACT"?0.95:Math.min(2,Math.max(0.1,p));
        u.rate = (who==="_ACT"?1.08:who==="NARRATOR"?0.9:1) * speed();
        let done=false; const fin=()=>{if(!done){done=true;clearTimeout(to);r();}};
        const to=setTimeout(fin, 2500 + part.split(/\s+/).length*650/speed());
        u.onend=fin; u.onerror=fin;
        u.onboundary=e=>{ if(onWord && e.name!=="sentence") onWord(); };
        synth.speak(u);
      });
    }
    res(myRun===runId);
  });
}
const wait = (ms,myRun)=>new Promise(r=>setTimeout(()=>r(myRun===runId),ms));
const words = t => t.split(/\s+/).filter(Boolean).length;

function lineText(it){
  if(it.k==="line") return it.segs.filter(s=>s.s).map(s=>s.s).join(" ");
  if(it.k==="card") return (it.who==="ON PAPER"?"The note reads: ":it.who==="MEANWHILE"?"Meanwhile. ":"On screen: ")+it.t;
  return it.t;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function initials(w){ if(w==="NARRATOR") return "◉"; return w.replace(/^(YOUNG|DR\.|MRS\.|INSPECTOR) /,"").split(/\s+/).map(x=>x[0]).join("").slice(0,2); }

function renderItem(it,i){
  const d=document.createElement("div"); d.className="it"; d.dataset.i=i;
  if(it.k==="act"){ d.classList.add("act"); d.textContent=it.t; }
  else if(it.k==="line"){
    const [c]=cast(it.who); d.classList.add("line"); if(it.who==="NARRATOR") d.classList.add("narr");
    d.style.setProperty("--c",c);
    const body = it.segs.map(s=> s.d?`<span class="dir">(${esc(s.d)})</span> `: s.s.split(/(\s+)/).map(w=>/\S/.test(w)?`<span class="word">${esc(w)}</span>`:w).join("")+" ").join("");
    d.innerHTML=`<div class="av" aria-hidden="true">${initials(it.who)}</div><div class="bub"><div class="who">${esc(it.who)}${it.tag?`<em>${esc(it.tag)}</em>`:""}</div><div class="say">${body}</div></div>`;
  }
  else if(it.k==="card"){ d.classList.add("card"); if(it.who==="ON PAPER") d.classList.add("paper"); if(it.who==="MEANWHILE") d.classList.add("mw"); d.innerHTML=`<small>${it.who==="ON PAPER"?"WRITTEN NOTE":it.who==="MEANWHILE"?"MEANWHILE":"ON SCREEN"}</small><p>${esc(it.t)}</p>`; }
  else { d.classList.add("titlecard"); d.textContent=it.t; }
  d.addEventListener("click",()=>{ const was=playing; stop(); li=i; draw(); if(was) play(); });
  return d;
}

function drawHead(anim){
  const s=SCENES[si];

}
function draw(anim){
  const s=SCENES[si], feed=$("feed");
  const have = feed.dataset.si==si ? feed.children.length : 0;
  if(feed.dataset.si!=si){ feed.innerHTML=""; feed.dataset.si=si; drawHead(true); }
  while(feed.children.length>li+1) feed.lastChild.remove();

function atEnd(){ return li>=SCENES[si].items.length-1; }

function pollFor(n){ return $("optPolls").checked ? POLLS.find(p=>p.at===n && answers[p.id]===undefined) : null; }
function revealsFor(n){ return POLLS.filter(p=>p.rev===n && answers[p.id]!==undefined); }
function updateScore(){
  const done=POLLS.filter(p=>answers[p.id]!==undefined && seen.has(SCENES.findIndex(s=>s.n===p.rev)) && revealedOnce.has(p.id));

}

let countdown=null;
function drawEnd(){
  const box=$("end"); box.innerHTML=""; clearInterval(countdown);
  if(!atEnd()) return;
  const n=SCENES[si].n;
  revealsFor(n).forEach(p=>{
    revealedOnce.add(p.id); store.set("rev",[...revealedOnce]);

    b.innerHTML=`<h3>The end</h3><p>You guessed ${right} of ${POLLS.length} twists correctly.</p><div class="row"><button class="btn" id="restart">Watch again from Scene 1</button></div>`;
    box.appendChild(b); $("restart").onclick=()=>{ answers={}; store.set("ans",answers); revealedOnce=new Set(); store.set("rev",[]); goScene(0); };
  }
}

function goScene(i, keepPlaying){ const was=keepPlaying??playing; stop(); si=Math.max(0,Math.min(SCENES.length-1,i)); li=0; seen.add(si); store.set("seen",[...seen]); draw(true); window.scrollTo({top:0}); if(was) play(); }
function nextScene(keep){ if(si<SCENES.length-1) goScene(si+1,keep); else stop(); }

async function runLoop(){
  const my=++runId;
  while(my===runId){
    const s=SCENES[si], it=s.items[li];
    const text=lineText(it);
    const useVoice = $("optVoice").checked && synth && (it.k!=="act" || $("optAct").checked);
    let ok;
    if(useVoice){
      const who = it.k==="line"? it.who : "_ACT";
      const el=$("feed").children[li]; const ws=el?[...el.querySelectorAll(".word")]:[]; let wi=0;
      ok = await speak(text, who, my, ()=>{ if(ws[wi]) ws[wi++].classList.add("spoken"); });
      if(ok) ws.forEach(w=>w.classList.add("spoken"));
      ok = ok && await wait(250/speed(),my);
    } else {
      ok = await wait(Math.max(1400, words(text)*(it.k==="act"?230:300))/speed() + 400, my);
    }
    if(!ok) return;
    if(!atEnd()){ li++; draw(); continue; }
    if(pollFor(s.n)) return; // poll handles continuation with countdown
    if(si>=SCENES.length-1){ stop(); return; }
    if(!(await wait(1800,my))) return;
    nextScene(true); return;
  }
}

let lock=null;
async function play(){ playing=true; setIcon(); try{ lock = await navigator.wakeLock?.request("screen"); }catch(e){} if(atEnd() && pollFor(SCENES[si].n)){ drawEnd(); return; } if(atEnd()&&si<SCENES.length-1){ nextScene(true); return; } drawEnd(); runLoop(); }
function stop(){ playing=false; runId++; clearInterval(countdown); if(synth) synth.cancel(); setIcon(); try{lock?.release();}catch(e){} lock=null; const c=$("cd"); if(c) c.textContent=""; }
function setIcon(){ $("playIco").innerHTML = playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>'; $("bPlay").setAttribute("aria-label",playing?"Pause":"Play"); }

function step(d){ const was=playing; stop(); const s=SCENES[si];
  if(d>0){ if(!atEnd()) li++; else if(!pollFor(s.n)) { nextScene(was); return; } }
  else { if(li>0) li--; else if(si>0){ goScene(si-1,false); li=SCENES[si].items.length-1; draw(); } }
  draw(); if(was) play(); }

function ticks(){ const t=$("ticks"); if(!t.children.length){ SCENES.forEach((s,i)=>{const b=document.createElement("button"); b.title=`Scene ${s.n}: ${s.title}`; b.setAttribute("aria-label",b.title); b.onclick=()=>goScene(i); t.appendChild(b);}); }
  [...t.children].forEach((b,i)=>{ b.className=(i===si?"now":seen.has(i)?"seen":""); }); }
function list(){ const l=$("sl"); if(!l.children.length){ SCENES.forEach((s,i)=>{ const b=document.createElement("button"); b.innerHTML=`<span class="n">${String(s.n).padStart(2,"0")}</span><span class="t">${esc(s.title)}</span><span class="tm">${esc(s.time.split("–")[0].split(" ")[0])}</span>`; b.onclick=()=>{ $("drawer").hidden=true; goScene(i); }; l.appendChild(b); }); }
  [...l.children].forEach((b,i)=>{ b.classList.toggle("now",i===si); b.classList.toggle("seen",seen.has(i)&&i!==si); }); }

$("bNext").onclick=()=>step(1); $("bPrev").onclick=()=>step(-1);
$("bNextS").onclick=()=>nextScene(playing); $("bPrevS").onclick=()=>goScene(si-1);
$("openList").onclick=()=>{ $("drawer").hidden=false; const n=$("sl").querySelector(".now"); n&&n.scrollIntoView({block:"center"}); };
$("closeList").onclick=()=>$("drawer").hidden=true;
$("drawer").onclick=e=>{ if(e.target.id==="drawer") $("drawer").hidden=true; };
document.addEventListener("keydown",e=>{
  if(e.target.closest("select,input")) return;
  if(e.code==="Space"){ e.preventDefault(); playing?stop():play(); }
  else if(e.key==="ArrowRight") step(1); else if(e.key==="ArrowLeft") step(-1);
  else if(e.key==="Escape") $("drawer").hidden=true;
});
document.addEventListener("visibilitychange",async()=>{ if(playing && document.visibilityState==="visible"){ try{ lock=await navigator.wakeLock?.request("screen"); }catch(e){} } });

if(si>=SCENES.length) si=0;
seen.add(si);
draw(true);
if(si>0) toast(`Welcome back. You're on Scene ${SCENES[si].n}.`);
</script>
