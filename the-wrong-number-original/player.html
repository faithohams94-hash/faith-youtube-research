<style>
/* Layout: one centred "stage" column like a lit set; scene unfolds line by line; remote-control bar pinned to the bottom. Deliberately single dark look (night-time Lagos, kerosene lamp). */
:root{
  --night:#0e1120; --stage:#161a2c; --stage2:#1d2238; --rule:#2b3150;
  --ink:#efe8db; --muted:#a3a0b4; --faint:#6e6c82;
  --lamp:#e9a23b; --lamp-ink:#1b1306; --blood:#d0525a; --ok:#7fd49a;
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --slug:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:10px 16px 8px}
.hrow{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,26px);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--rule);background:var(--stage);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--lamp)}
.score{font-family:var(--slug);font-size:12px;color:var(--muted)}
.score b{color:var(--lamp)}
.ticks{max-width:820px;margin:8px auto 0;display:grid;grid-template-columns:repeat(58,1fr);gap:2px}
.ticks button{height:6px;border:0;border-radius:2px;background:var(--rule);padding:0}
.ticks button.seen{background:color-mix(in srgb,var(--lamp) 45%,var(--rule))}
.ticks button.now{background:var(--lamp)}

main{max-width:820px;margin:0 auto;padding:24px 16px}
.scenehead{padding-block:8px 18px;border-bottom:1px dashed var(--rule);margin-bottom:18px}
.scenehead .num{font-family:var(--slug);color:var(--lamp);font-size:13px;letter-spacing:.12em}
.scenehead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.scenehead .slug{font-family:var(--slug);font-size:13px;color:var(--muted);text-transform:uppercase}
.scenehead .slug span{color:var(--faint)}
.scenehead.enter h2{animation:rise .7s ease both}
@keyframes rise{from{opacity:.2;transform:translateY(8px);letter-spacing:.04em}to{opacity:1;transform:none}}

.feed{display:flex;flex-direction:column;gap:14px}
.it{transition:opacity .3s, transform .3s;opacity:.55}
.it.cur{opacity:1}
.it.fresh{animation:appear .45s ease both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.act{font-style:italic;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 14px;max-width:62ch}
.it.cur.act{border-left-color:var(--lamp);color:var(--ink)}
.line{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--slug);font-weight:700;font-size:13px;color:var(--night);background:var(--c)}
.bub{min-width:0}
.who{font-family:var(--slug);font-weight:700;font-size:12.5px;letter-spacing:.08em;color:var(--c)}
.who em{font-style:normal;color:var(--faint);font-weight:400;margin-left:6px}
.say{background:var(--stage);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:10px 14px;margin-top:4px;font-size:17px;max-width:62ch}
.it.cur .say{border-color:var(--c);background:var(--stage2);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 8px 30px -12px color-mix(in srgb,var(--c) 50%,transparent)}
.dir{color:var(--faint);font-style:italic;font-size:14px}
.word.spoken{color:var(--c)}
.narr .say{background:transparent;border:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);border-radius:0;font-family:var(--display);font-size:20px;line-height:1.35;padding:12px 2px}
.narr .av{background:transparent;border:1px solid var(--lamp);color:var(--lamp)}
.it.cur.narr .say{box-shadow:none;background:transparent;border-color:var(--lamp)}
.card{align-self:center;text-align:center;background:#0a0c16;border:1px solid var(--blood);border-radius:12px;padding:16px 20px;max-width:520px;width:100%}
.card small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.16em;color:var(--blood);margin-bottom:6px}
.card p{margin:0;font-family:var(--slug);font-size:18px;font-weight:700}
.card.paper{background:#f1e7cf;border-color:#c9b98f;color:#2a2318}
.card.paper small{color:#8a6d2c}
.card.mw{background:transparent;border-color:var(--lamp);border-style:dashed}.card.mw small{color:var(--lamp)}
.titlecard{text-align:center;font-family:var(--display);font-size:clamp(22px,5vw,32px);color:var(--lamp);padding:28px 0;letter-spacing:.02em;text-wrap:balance}

.endbox{margin-top:26px;border:1px solid var(--rule);background:var(--stage);border-radius:16px;padding:18px}
.endbox h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.endbox p{margin:0 0 12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{background:var(--stage2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:left}
.opt:hover{border-color:var(--lamp)}
.opt.pick{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 18%,var(--stage2))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{background:var(--lamp);color:var(--lamp-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.count{font-family:var(--slug);font-size:12px;color:var(--faint)}
.reveal{margin-top:18px;border-radius:14px;padding:14px 16px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--stage))}
.reveal.miss{border-color:var(--blood);background:color-mix(in srgb,var(--blood) 10%,var(--stage))}
.reveal b{font-family:var(--slug);letter-spacing:.1em;font-size:12px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--stage) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dk{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.ctl button{background:var(--stage2);border:1px solid var(--rule);border-radius:999px;width:44px;height:44px;display:grid;place-items:center}
.ctl button:hover{border-color:var(--lamp)}
.ctl .play{width:60px;height:60px;background:var(--lamp);border:0;color:var(--lamp-ink)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl .play svg{width:26px;height:26px}
.opts2{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.opts2 label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts2 select{background:var(--stage2);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:3px 6px;font:inherit}
.nowline{font-family:var(--slug);font-size:12px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.drawer{position:fixed;inset:0;z-index:10;display:flex;justify-content:flex-end;background:rgba(5,6,12,.6)}
.drawer .pane{width:min(420px,100%);height:100%;background:var(--stage);border-left:1px solid var(--rule);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
.pane h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sl{display:flex;flex-direction:column;gap:2px}
.sl button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px}
.sl button:hover{background:var(--stage2)}
.sl button.now{background:color-mix(in srgb,var(--lamp) 16%,transparent)}
.sl .n{font-family:var(--slug);color:var(--lamp);font-size:12px}
.sl .t{min-width:0}
.sl .tm{font-family:var(--slug);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sl .seen .t::after{content:" ✓";color:var(--ok);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--night);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.hint{color:var(--faint);font-size:13px;text-align:center;margin-top:28px}
kbd{font-family:var(--slug);border:1px solid var(--rule);border-radius:4px;padding:0 4px;font-size:12px}
@media (max-width:520px){.score{display:none}.say{font-size:16px}.line{grid-template-columns:34px 1fr;gap:10px}.av{width:34px;height:34px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const SCENES = [{"n": 1, "title": "\"JOLLOF OR FRIED RICE?\"", "slug": "INT. ADEYEMI HOUSE, ABUJA — KITCHEN — FRIDAY, 2:14 PM — YEAR ONE", "time": "0:00–0:59", "items": [{"k": "act", "t": "Abuja, early afternoon. The camera glides through the gates of a large white house in Asokoro, past a manicured lawn and a parked black SUV, into a spotless kitchen. The extractor fan hums. A pot of rice simmers. A woman moves between the stove, the fridge and her children with the careful speed of someone who cannot afford a mistake."}, {"k": "act", "t": "A beautiful, expensive kitchen with marble counters, fresh flowers and everything perfect. Everything except the woman standing in it. CHLOE ADEYEMI (33) stirs a pot while ADA (7) does homework at the counter and TOBI (4) pushes a toy car across the floor. Chloe's phone rings: \"KUNLE.\""}, {"k": "line", "who": "KUNLE", "tag": "ON PHONE", "segs": [{"s": "Chloe. I hope you've started preparing my dinner."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Yes, darling. I'm just trying to remember which—"}]}, {"k": "line", "who": "KUNLE", "tag": "ON PHONE", "segs": [{"s": "You mean you've forgotten what we discussed this morning?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "No, no, I remember. I just wanted to be sure."}]}, {"k": "line", "who": "KUNLE", "tag": "ON PHONE", "segs": [{"s": "It's amazing how you can spend the whole day in this house and still not remember one simple instruction."}]}, {"k": "act", "t": "Click. Chloe stares at the phone."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "not looking up"}, {"s": "Mummy, are you in trouble?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "No, sweetheart. Mummy just forgot something."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "You always say sorry to Daddy."}]}, {"k": "act", "t": "Chloe freezes. The words land harder than they should."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Finish your homework, darling."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Mummy, I want jollof!"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "a tired smile"}, {"s": "Everybody wants something today."}]}, {"k": "act", "t": "She picks up a brand-new phone. The old one died this morning. She types Kunle's number from memory, her fingers trembling. One digit is wrong."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Jollof rice or fried rice? Sorry, I forgot which one you wanted."}]}, {"k": "act", "t": "Send. 2:17 PM. She grips the counter and waits. 2:19 PM. Buzz."}, {"k": "line", "who": "UNKNOWN", "tag": "TEXT", "segs": [{"s": "Wrong receiver, but jollof rice with turkey sounds better 😂"}]}, {"k": "act", "t": "Chloe blinks and looks at the number. Oh no. A stranger."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Wrong receiver?"}]}, {"k": "act", "t": "And for the first time all afternoon, a tiny smile escapes her. Then a car pulls up outside. A door slams. The smile vanishes."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "quietly"}, {"s": "Daddy's home early."}]}]}, {"n": 2, "title": "WRONG RECEIVER", "slug": "INT. AI PRODUCTION STUDIO, LAGOS — BREAK ROOM — SAME FRIDAY, 2:20 PM", "time": "0:59–1:42", "items": [{"k": "act", "t": "Lagos, the same afternoon. Horns blare on Admiralty Way as the camera rises to the third floor of a glass building. Inside the AI production studio, young creatives in headphones sit at glowing screens, and someone laughs in the corridor. The break room smells of takeaway jollof and coffee."}, {"k": "act", "t": "A busy, colourful studio with screens showing half-finished animated scenes. EMMA WILLIAMS (35) eats rice from a takeaway pack while reviewing a sequence on her tablet. She's grinning at her phone. BISI, her colleague, leans over."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "What's funny?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Someone just asked me whether to cook jollof or fried rice."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "And what did you say?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Jollof with turkey, obviously."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "You're advising strangers now?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Food is a serious matter, Bisi. Somebody has to help."}, {"d": "beat"}, {"s": "She sounded scared, though."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "Scared? Of rice?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "looking at the message again"}, {"s": "\"Sorry, I forgot which one you wanted.\""}, {"d": "beat"}, {"s": "Who says sorry to their own husband about rice?"}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "shrugging"}, {"s": "Lagos people say sorry for everything."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "putting the phone down"}, {"s": "Hmm."}]}, {"k": "act", "t": "A colleague calls from the door: \"Emma! The client wants the dragon to be purple now!\""}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "groaning"}, {"s": "Purple. Of course. Why not."}]}]}, {"n": 3, "title": "TOO MUCH PEPPER", "slug": "INT. ADEYEMI HOUSE — DINING ROOM — SAME NIGHT", "time": "1:42–2:20", "items": [{"k": "act", "t": "Night falls over Abuja. Inside the Adeyemi dining room, a crystal chandelier hangs over a long, polished table. The only sounds are cutlery against china and the ticking of a wall clock. Chloe sits at the far end, her back straight and her plate barely touched."}, {"k": "act", "t": "A long, polished table. Kunle eats in silence. Chloe watches every spoonful. The children eat quietly."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "putting his spoon down"}, {"s": "Chloe."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Yes, darling?"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "What is this?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Jollof rice. You said this morning—"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "I know what I said. I'm asking what this is."}, {"d": "He pushes the plate an inch away."}, {"s": "Too much pepper. Too much oil. Is it so difficult to follow one instruction?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I'm sorry. I'll make it again tomorrow. Less pepper."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "You always say tomorrow."}]}, {"k": "act", "t": "He stands and leaves the table. Ada looks at her mother's untouched plate."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Mummy, I liked it."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "squeezing her hand"}, {"s": "Thank you, baby."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"d": "mouth full"}, {"s": "Me too! Jollof is the best!"}]}, {"k": "act", "t": "Chloe laughs softly, then stops herself and looks toward the door Kunle went through."}]}, {"n": 4, "title": "THE MORNING INSPECTION", "slug": "INT. ADEYEMI HOUSE — DINING ROOM / FRONT DOOR — MONDAY, 6:45 AM", "time": "2:20–3:06", "items": [{"k": "act", "t": "Monday dawn. Pale light spreads across the marble floor of the entrance hall. Kunle comes down the staircase in a crisp suit, buttoning his cuffs, and every footstep echoes. At the bottom, his family waits in a neat line, like staff before an inspection."}, {"k": "act", "t": "Kunle, dressed for work, checks his shirt cuffs. Chloe hands him a lunch box and his briefcase. Ada and Tobi, in school uniforms, stand in a line like soldiers."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "inspecting Ada's collar"}, {"s": "Who ironed this?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I did, darling."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "It has a crease."}, {"d": "to Ada"}, {"s": "Tell your mother that a crease on your collar is a crease on my name."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "quietly"}, {"s": "Yes, Daddy."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "holding out his hand"}, {"s": "The receipts from Saturday's market."}]}, {"k": "act", "t": "Chloe hands him a small bundle of receipts. He flicks through them."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Eight thousand naira for tomatoes?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Prices have gone up, darling. Everybody is complaining."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Everybody isn't spending my money."}, {"d": "He pockets the receipts."}, {"s": "Next time, bring the change and the receipt together."}, {"d": "He kisses Tobi's head."}, {"s": "Be good, champion."}]}, {"k": "act", "t": "The door closes. Chloe exhales for the first time in ten minutes. Ada looks at her."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy, I'll iron my own collar from now on."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "kneeling, fixing it"}, {"s": "No, baby. Your collar was perfect."}, {"d": "beat"}, {"s": "It was perfect."}]}]}, {"n": 5, "title": "\"YOU SIMPLY HAVE BAD TASTE\"", "slug": "INT. ADEYEMI HOUSE — BEDROOM / INT. EMMA'S DESK, LAGOS — INTERCUT — THE NEXT FRIDAY, 2:19 PM", "time": "3:06–3:51", "items": [{"k": "act", "t": "The next Friday. Afternoon sun falls through the bedroom curtains onto a bed covered in folded laundry. Chloe works in silence. In Lagos, Emma sits at a cluttered desk covered in sticky notes, a film sequence paused on her monitor."}, {"k": "act", "t": "Chloe folds laundry on the bed. Her phone lies beside her. She scrolls back to the stranger's message and reads it again. She hesitates, then types fast before she can change her mind."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Jollof rice was the wrong option. Next time try fried rice."}]}, {"k": "act", "t": "In Lagos, Emma's phone buzzes on her desk. She grins."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "No. The person simply has bad taste 😂"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "You don't know him."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "True. But anyone who complains about good jollof is already suspicious."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "You're funny."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Only on Fridays. Monday to Thursday, I'm a very serious woman."}]}, {"k": "act", "t": "Chloe laughs. Not a polite laugh. A real, unexpected, beautiful laugh. Ada appears in the doorway."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy! You're laughing!"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "surprised at herself"}, {"s": "Yes, baby. I suppose I am."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Why?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Someone said something funny."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Who?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "looking at the phone"}, {"s": "Nobody, really. A stranger."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Can the stranger say something funny again tomorrow?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "smiling"}, {"s": "Maybe next Friday."}]}]}, {"n": 6, "title": "FRIDAY STRANGER", "slug": "INT. ADEYEMI HOUSE — BEDROOM — LATE NIGHT", "time": "3:51–4:10", "items": [{"k": "act", "t": "Late night. The house is dark except for the blue glow of a phone screen. The air conditioner hums. Kunle sleeps on his back on the far side of a wide bed. Chloe sits on the very edge, as far from him as the mattress allows."}, {"k": "act", "t": "The children are asleep. Kunle snores on the far side of the bed. Chloe sits on the edge of the bed with her phone glowing in the dark. She opens the unknown number, taps \"Add contact\" and types a name: \"FRIDAY STRANGER.\" She looks at it for a long time."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering to herself"}, {"s": "What are you doing, Chloe?"}]}, {"k": "act", "t": "Kunle shifts in his sleep."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "mumbling"}, {"s": "Who are you talking to?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "locking the phone instantly"}, {"s": "Nobody, darling. Go back to sleep."}]}, {"k": "act", "t": "She lies down, holding the phone against her chest."}]}, {"n": 7, "title": "\"WHO IS MAKING YOU SMILE?\"", "slug": "INT. ADEYEMI HOUSE — SITTING ROOM — EVENING — WEEKS LATER", "time": "4:10–4:39", "items": [{"k": "act", "t": "Early evening, weeks later. Golden light comes through the tall windows of the sitting room. The television plays the news on low. Chloe curls up on the cream sofa with her feet tucked under her, a small, rare smile on her face. Behind her, the front door opens quietly."}, {"k": "act", "t": "Chloe sits on the sofa reading a message and smiling. She doesn't notice Kunle standing in the doorway, watching."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Who is making you smile like that?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "locking the phone, too quickly"}, {"s": "Nobody. It's… a recipe group. Women share recipes."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "walking slowly toward her"}, {"s": "A recipe group."}, {"d": "beat"}, {"s": "Then why don't your recipes improve?"}]}, {"k": "act", "t": "He holds out his hand for the phone. Chloe's heart pounds. Then his own phone rings: \"CHIEF OKEKE.\" He looks at it, then at her."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "answering, suddenly warm"}, {"s": "Chief! Good evening, sir!"}]}, {"k": "act", "t": "He walks out of the room, laughing on the call. Chloe sits frozen with the phone against her chest."}, {"k": "act", "t": "She opens FRIDAY STRANGER."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I have to go. Talk next Friday."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Everything okay?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Yes. Sorry."}]}, {"k": "act", "t": "She deletes the conversation from her screen, then opens the contact and looks at the name: \"FRIDAY STRANGER.\" She doesn't delete that."}]}, {"n": 8, "title": "RICE WOMAN", "slug": "MONTAGE — LAGOS AND ABUJA — FRIDAYS OVER THREE WEEKS", "time": "4:39–5:18", "items": [{"k": "act", "t": "A sequence of Fridays. The camera cuts between two cities: yellow danfo buses crawling through Lagos traffic, wide clean Abuja roads under blue sky, Emma striding into meetings, Chloe packing lunch boxes. Each Friday, a phone lights up."}, {"k": "act", "t": "FRIDAY ONE. Lagos traffic and Abuja sunshine. Emma in a meeting, Chloe packing school lunches."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Serious question. Is pineapple on pizza a crime?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "An international offence. Who committed it?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "My daughter."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "She's young. Rehabilitation is possible."}]}, {"k": "act", "t": "FRIDAY TWO. Emma arguing with an editor over a film scene, then checking her phone and smiling."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "How was your week, Rice Woman?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Don't call me that 😂"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Then tell me your name."}]}, {"k": "act", "t": "Chloe hesitates. She looks around the empty kitchen as if someone might be watching."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Chloe."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Emma. Nice to meet you, Chloe of the disputed jollof."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Nice to meet you, Emma who gives unsolicited rice advice."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Solicited. You texted ME, madam."}]}]}, {"n": 9, "title": "THE PORTFOLIO", "slug": "INT. ADEYEMI HOUSE — BEDROOM / EMMA'S APARTMENT, LAGOS — INTERCUT — FRIDAY THREE, NIGHT", "time": "5:18–5:59", "items": [{"k": "act", "t": "Friday night. The Adeyemi house is asleep. A single bedside lamp throws a small circle of light on the carpet where Chloe sits cross-legged, her back against the wardrobe. In Lagos, Emma lies on a worn sofa in a small, cosy flat, eating cereal from the box."}, {"k": "act", "t": "Chloe sits on the bedroom floor in the dark. Emma lies on her sofa in Lagos, eating cereal for dinner."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Can I ask you something that isn't about food?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "That would be a first. Go on."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Do you think people can forget who they used to be?"}]}, {"k": "act", "t": "Emma stops chewing. She sits up."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Yes. But I don't think the old person disappears completely."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "How do you find them again?"}]}, {"k": "act", "t": "A long pause. Emma thinks carefully."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Perhaps you start by remembering one thing that used to make you happy."}]}, {"k": "act", "t": "Chloe looks up. On the top shelf of her wardrobe, behind old handbags, is a dusty folder. She stands on a chair and pulls it down. She blows off the dust. The first page reads: \"CHLOE ADEYEMI — INTERIOR DESIGN PORTFOLIO.\" Sketches of beautiful rooms, colour palettes and photographs. Her own handwriting from another life. She runs her fingers over the letters."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Hello, you."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I think I remember something."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Then that's something worth keeping."}]}, {"k": "act", "t": "Chloe holds the portfolio against her chest like something she has rescued."}]}, {"n": 10, "title": "THE FIRST CALL", "slug": "INT. ADEYEMI HOUSE — LAUNDRY ROOM / EMMA'S BALCONY, LAGOS — SATURDAY AFTERNOON", "time": "5:59–6:58", "items": [{"k": "act", "t": "Saturday afternoon. Kunle's car pulls out of the gate, golf clubs rattling in the boot. The house relaxes. In the laundry room at the back, the washing machine rumbles through its cycle. Chloe closes the door behind her and leans against it."}, {"k": "act", "t": "Kunle has gone to play golf. The washing machine rumbles. Chloe stands among piles of laundry with her phone."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Random question. Can I hear your voice? Just to prove you're not an AI. I work in an AI studio. I'm suspicious of everybody."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "😂 Okay. Once. Quickly."}]}, {"k": "act", "t": "Chloe presses call. It rings once."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "laughing"}, {"s": "Hello? Is this the famous Rice Woman?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "shy, giggling"}, {"s": "This is Chloe."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Oh! You have a lovely voice! I was expecting someone much more… guilty about rice."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "laughing"}, {"s": "And you sound exactly like your texts. Loud."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Lagos made me loud. You can't survive Third Mainland Bridge whispering."}]}, {"k": "act", "t": "They both laugh. Then a short silence."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "quietly"}, {"s": "It's strange. Hearing you. It makes you… real."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "softly"}, {"s": "I am real, Chloe. Every Friday. I'm a real person on the other side of this phone."}]}, {"k": "act", "t": "The washing machine stops. Silence. Chloe glances at the door."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I should go."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Go. Same time next Friday?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Same time next Friday."}]}]}, {"n": 11, "title": "\"SHE WOULD FORGET HER OWN HEAD\"", "slug": "INT. ADEYEMI HOUSE — DINING ROOM — FRIDAY NIGHT — NINE MONTHS LATER", "time": "6:58–7:41", "items": [{"k": "act", "t": "Nine months later. A Friday-night dinner party. The dining room glows with candles, white lilies stand in tall vases, and every chair is filled. Three businessmen in agbada and their wives in shimmering lace laugh around the table. Chloe, in a simple dress, moves silently from guest to guest with serving dishes, refilling, clearing and smiling."}, {"k": "act", "t": "A dinner party. Kunle entertains three business associates and their wives. Chloe has cooked every dish, arranged the flowers and set every glass. She moves around the table serving."}, {"k": "line", "who": "GUEST", "tag": "", "segs": [{"s": "Kunle, this egusi is excellent! Your wife should open a restaurant!"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "smiling warmly"}, {"s": "Please, don't encourage her. If you leave Chloe alone, she'd forget her own head. I have to supervise everything in this house."}]}, {"k": "act", "t": "Everyone laughs. Chloe smiles too."}, {"k": "line", "who": "GUEST'S WIFE", "tag": "", "segs": [{"s": "Chloe, didn't you study design? I remember your wedding. Those decorations!"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "brightening"}, {"s": "Yes! Interior design. I used to love—"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "cutting in smoothly"}, {"s": "That was a long time ago. Chloe's full-time job now is making sure I don't starve."}, {"d": "Laughter."}, {"s": "Darling, the dessert."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "the light going out of her face"}, {"s": "Yes, darling."}]}]}, {"n": 12, "title": "\"I THINK I'M AFRAID OF HIM\"", "slug": "INT. ADEYEMI HOUSE — BEDROOM — SAME NIGHT, LATER / INT. EMMA'S APARTMENT — INTERCUT", "time": "7:41–8:54", "items": [{"k": "act", "t": "Midnight. The last guest's car leaves through the gate. The candles have burnt down and the dirty plates are stacked in the kitchen. Upstairs in the bedroom, Kunle stands at the mirror, his reflection stern under the bright ceiling light, while Chloe hovers by the door."}, {"k": "act", "t": "The guests are gone. Kunle loosens his tie in front of the mirror."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Why did you interrupt when I was explaining the contract to Chief Okeke?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I was only answering his wife's question—"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "You always have an explanation."}]}, {"k": "act", "t": "Chloe looks down at the carpet."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I'm sorry."}]}, {"k": "act", "t": "He walks out. Chloe sits on the edge of the bed and opens FRIDAY STRANGER."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma, can I ask you something?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Anything."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Can someone make you feel useless without ever saying the word \"useless\"?"}]}, {"k": "act", "t": "In Lagos, Emma puts down her dinner."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "quietly"}, {"s": "Oh, Chloe."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Yes. How someone treats you matters as much as the words they use."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "What if everyone thinks he's wonderful?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "They're judging the person they see. You're living with the person you know."}]}, {"k": "act", "t": "A long silence. Then Chloe types the words she has never said out loud."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I think I'm afraid of my husband."}]}, {"k": "act", "t": "Emma doesn't reply immediately. She stands up and paces her living room. Then she types."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Chloe, are you and the children safe right now?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Yes. He's asleep."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "I'm glad. You don't have to decide anything tonight. But you shouldn't have to live in fear. Is there anyone in Abuja you trust enough to talk to?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I used to have friends."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Perhaps one of them is still waiting to hear from you."}]}, {"k": "act", "t": "Chloe scrolls through her contacts to a name: \"HALIMA (UNI).\" The last message between them is nearly three years old. Her thumb hovers over the call button. It hovers. It hovers."}]}, {"n": 13, "title": "\"WHO IS SHE?\"", "slug": "INT. AI STUDIO, LAGOS — EMMA'S DESK — NEXT MORNING", "time": "8:54–9:52", "items": [{"k": "act", "t": "Morning in Lagos. The studio is waking up: coffee machines hiss, monitors flicker on, and someone plays Afrobeats from a laptop. Emma sits slumped at her desk with dark circles under her eyes, staring at her phone. Bisi walks over carrying two paper cups."}, {"k": "act", "t": "Emma hasn't slept much. Bisi drops a coffee on her desk."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "You look like you edited all night."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I didn't sleep. The rice woman."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "The Abuja one? You're still texting her? It's been nine months, Emma."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "She told me last night she's afraid of her husband."}]}, {"k": "act", "t": "Bisi slowly sits down."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "serious now"}, {"s": "Emma. Be careful. You don't know these people. You don't know her. You don't even know her surname."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I know she says \"sorry\" more than anybody I've ever met."}, {"d": "beat"}, {"s": "I know she laughs like she's not allowed to."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "And what can you do from Lagos?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "quietly"}, {"s": "Listen. That's all. I can listen."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "after a pause"}, {"s": "Then listen properly. And make sure she has real people there, not just a phone."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "nodding"}, {"s": "That's exactly what I told her."}]}]}, {"n": 14, "title": "EMMA'S BIRTHDAY", "slug": "INT. EMMA'S APARTMENT, LAGOS — NIGHT — HER 36TH BIRTHDAY", "time": "9:52–10:38", "items": [{"k": "act", "t": "Night in Lagos. Emma's small apartment is quiet. Rain taps on the window. She has laid out one plate, one cupcake and one candle on a small round table. She sits down alone in front of them."}, {"k": "act", "t": "Emma sits alone at her small dining table with one cupcake and one candle. Her phone rings: \"MUMMY.\""}, {"k": "line", "who": "MAMA EMMA", "tag": "ON PHONE", "segs": [{"s": "Happy birthday, my daughter! Thirty-six!"}, {"d": "beat"}, {"s": "Emma, when are you going to bring a husband home? Your cousin Funmi has three children now."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "sighing"}, {"s": "Mummy, I have a career."}]}, {"k": "line", "who": "MAMA EMMA", "tag": "ON PHONE", "segs": [{"s": "A career won't hold your hand when you're old."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "quietly"}, {"s": "I know, Mummy."}]}, {"k": "act", "t": "She hangs up. She lights the candle and looks at it. Her phone buzzes again: a voice note from FRIDAY. She plays it. Chloe's voice is singing softly, a little off-key, in a whisper."}, {"k": "line", "who": "CHLOE", "tag": "VOICE NOTE", "segs": [{"d": "whispering, singing"}, {"s": "Happy birthday to you… happy birthday, dear Emma…"}, {"d": "She giggles."}, {"s": "Sorry, I have to whisper, the children are asleep."}, {"d": "beat"}, {"s": "You remembered my daughter's birthday last month. I wasn't going to forget yours."}, {"d": "beat"}, {"s": "Make a wish. A big one."}]}, {"k": "act", "t": "Emma laughs out loud, alone in her flat, and wipes her eyes. She blows out the candle."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering to the empty room"}, {"s": "Thank you, Rice Woman."}]}]}, {"n": 15, "title": "\"PLEASE DON'T DISAPPEAR\"", "slug": "INT. ADEYEMI HOUSE / AI STUDIO, LAGOS — INTERCUT — FRIDAY — ONE YEAR AFTER THE FIRST MESSAGE", "time": "10:38–11:34", "items": [{"k": "act", "t": "One year after the first message. A Friday. In Lagos, Emma rushes from one glass-walled meeting room to the next with a laptop under her arm, her phone face down in her pocket. In Abuja, Chloe stands alone at the kitchen counter, staring at her phone, waiting."}, {"k": "act", "t": "Emma is buried in back-to-back meetings with her phone face down. In Abuja, Chloe waits at the kitchen counter."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma? You there?"}]}, {"k": "act", "t": "One hour passes."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Sorry. You're probably busy."}]}, {"k": "act", "t": "Another hour. Chloe stares at the phone."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Forget I disturbed you."}]}, {"k": "act", "t": "In Lagos, Emma finally comes out of a meeting and turns her phone over. Three messages. Her face falls."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Chloe! I've been in meetings all day. Is everything okay?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Yes. Sorry."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "That's three apologies, and you haven't done anything wrong."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Habit, I suppose."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "You don't need to apologise for wanting to talk to your friend."}]}, {"k": "act", "t": "Chloe reads one word again and again: \"friend.\""}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Are we friends?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "After surviving almost a year of your questionable food opinions? I should think so."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Thank you."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "For what?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "For not making me feel like a burden."}]}, {"k": "act", "t": "Emma stares at her phone, deeply moved."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Chloe, friendship isn't a burden."}]}, {"k": "act", "t": "A few minutes later:"}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Same time next Friday?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "As often as life allows. And if one of us is busy, it doesn't mean the friendship has disappeared."}]}, {"k": "act", "t": "Chloe smiles. In her world, people who go quiet usually come back angry. This matters more than Emma will ever know."}]}, {"n": 16, "title": "A HOUSE WITHOUT WINDOWS", "slug": "INT. ADEYEMI HOUSE — CHILDREN'S ROOM — AFTERNOON — YEAR TWO", "time": "11:34–12:12", "items": [{"k": "act", "t": "Year Two. A school bus stops outside the gate. Ada, now eight, runs up the driveway with her backpack bouncing and a rolled-up paper in her hand, and bursts into the children's room where Chloe is folding tiny school uniforms."}, {"k": "act", "t": "Ada (8) comes home from school and proudly hands Chloe a drawing: a beautiful house surrounded by flowers, a sun and a tree. But there are no windows."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "It's beautiful, sweetheart."}, {"d": "beat"}, {"s": "But where are the windows?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "I forgot them."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "pointing to one room"}, {"s": "Even this room?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "That's your room, Mummy."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "My room?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "The one where nobody disturbs you."}, {"d": "beat"}, {"s": "So nobody can see in and shout."}]}, {"k": "act", "t": "Chloe's breath catches. Her eight-year-old has drawn her a gift: a room where her mother can finally have some peace."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "pulling her close"}, {"s": "Thank you, my darling. It's the best room I've ever seen."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy, when I grow up, I'll build you a real one."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering into her hair"}, {"s": "Maybe Mummy will build it first."}]}]}, {"n": 17, "title": "\"REMOVE THAT SORRY\"", "slug": "INT. ADEYEMI HOUSE — DINING TABLE — NIGHT / EMMA'S APARTMENT — INTERCUT", "time": "12:12–12:59", "items": [{"k": "act", "t": "Night. Everyone else is asleep. The dining-room light is on low. Chloe sits at the long table, where she usually serves, with her old portfolio open, pencils scattered around her, sketching with a concentration we haven't seen before."}, {"k": "act", "t": "Everyone is asleep. Chloe sits at the dining table with her old portfolio open, sketching a new house: light, air, big windows and doors that open onto a garden. Her phone buzzes."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Friday question. If money and fear weren't involved, what would you do tomorrow?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I'd go back to designing homes."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Then tell me about one."}]}, {"k": "act", "t": "Chloe looks at her sketch. Then she types, and types, and types."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Open-plan. Warm lighting. Adire fabric on the cushions. A reading corner by a big window, so the morning comes in before anybody wakes up. And no locks on the inside doors, because nobody in that house would need to hide."}]}, {"k": "act", "t": "In Lagos, Emma reads it and slowly sits up straight."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Look at you. I've never seen you type this much!"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Sorry 😂"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Remove that sorry immediately."}]}, {"k": "act", "t": "Chloe laughs out loud, then covers her mouth and looks at the stairs. Silence. She looks back at her sketch, picks up the pencil and writes boldly across the bottom: \"Designed by Chloe.\""}]}, {"n": 18, "title": "THE CALL TO HALIMA", "slug": "INT. ADEYEMI HOUSE — GARDEN — MORNING — YEAR THREE", "time": "12:59–13:42", "items": [{"k": "act", "t": "Year Three. Morning. Kunle's black SUV pulls out of the gate and the gate closes. Chloe steps out into the garden, barefoot on the cool grass among the hibiscus and ixora she planted years ago. Birds sing. She takes her phone out of her wrapper and stares at it."}, {"k": "act", "t": "Kunle's car has just left. Chloe stands in the garden among the flowers she planted, with her phone in her hand. \"HALIMA (UNI).\" She has stared at this name for two years. She presses call. It rings. And rings."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "She won't answer. Why would she answer?"}]}, {"k": "act", "t": "Click."}, {"k": "line", "who": "HALIMA", "tag": "ON PHONE", "segs": [{"d": "cautious"}, {"s": "…Chloe?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "her voice cracking"}, {"s": "Halima. Hi."}, {"d": "beat"}, {"s": "I'm sorry I disappeared."}]}, {"k": "line", "who": "HALIMA", "tag": "ON PHONE", "segs": [{"d": "a long pause, then warmly"}, {"s": "Chloe Adeyemi. Do you know how many times I almost drove to your house?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "crying and laughing"}, {"s": "Why didn't you?"}]}, {"k": "line", "who": "HALIMA", "tag": "ON PHONE", "segs": [{"s": "Because the last time I came, your husband told me you had a headache. For three years, you had a headache."}, {"d": "beat"}, {"s": "Are you okay?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "after a long silence"}, {"s": "Can we meet? Please."}]}, {"k": "line", "who": "HALIMA", "tag": "ON PHONE", "segs": [{"s": "Tomorrow. One o'clock. The café in Wuse 2."}, {"d": "beat"}, {"s": "And Chloe? Come. Don't send a headache."}]}]}, {"n": 19, "title": "THE FIRST STEP", "slug": "INT. CAFÉ, WUSE 2, ABUJA — DAY — YEAR THREE", "time": "13:42–15:05", "items": [{"k": "act", "t": "The next day. A bright café in Wuse 2 with potted plants, a coffee machine hissing and soft music. Chloe walks in, scanning the room nervously, clutching her handbag. In a corner, a woman in a green hijab stands up and waves. It's HALIMA. They hug awkwardly at first, then tightly, and sit."}, {"k": "act", "t": "Chloe sits across from HALIMA, her old university friend. They're halfway through lunch. So far it has been children and weather."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "…and Ahmed wants to be a pilot now. Last month it was a footballer."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "smiling"}, {"s": "Ada wants to be an architect. She draws houses every day."}]}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "Like her mother."}, {"d": "beat"}, {"s": "Chloe. Three years. You stopped answering. Then suddenly you call me and say \"please, can we meet.\""}, {"d": "gently"}, {"s": "What's going on?"}]}, {"k": "act", "t": "Chloe looks at her plate for a long moment. Then, very quietly, she begins."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "It's… Kunle. It's not one big thing. It's a thousand small things. What I cook. What I wear. Who I call. Money for groceries, and I have to explain every receipt."}, {"d": "beat"}, {"s": "I don't remember the last time I made a decision without being afraid of what he'd say."}]}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"d": "softly"}, {"s": "Chloe, why didn't you tell me?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Because I thought you'd ask why I stayed."}]}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "I'm sorry you've been carrying this alone."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Sometimes I don't even know if it's bad enough to complain about. He's never…"}, {"d": "She stops."}, {"s": "He provides. Everybody says he's a good man."}]}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"d": "taking her hand"}, {"s": "You don't have to prove your pain to me."}]}, {"k": "act", "t": "Chloe begins to cry. Not dramatically. She simply can't hold the tears back anymore."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "Who told you to call me after three years?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "a small, wet laugh"}, {"s": "A woman who answered a wrong number."}]}]}, {"n": 20, "title": "THE COUNSELLOR", "slug": "INT. COUNSELLING OFFICE, ABUJA — DAY — WEEKS LATER", "time": "15:05–16:30", "items": [{"k": "act", "t": "Weeks later. A quiet office on the second floor of a building in Garki. A potted palm stands in the corner, and soft light comes through the blinds. Chloe knocks, pushes the door open and hesitates in the doorway. The COUNSELLOR, a kind-faced woman in her fifties, rises from her chair, smiles and gestures to the seat across from her. Chloe sits on the edge of it, holding her bag on her lap."}, {"k": "act", "t": "Outside in the corridor, Halima waits on a plastic chair."}, {"k": "line", "who": "COUNSELLOR", "tag": "", "segs": [{"s": "You said something earlier I want to come back to. You said, \"I'm not sure it's bad enough.\""}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "He's never hit me. So I tell myself it isn't… real."}]}, {"k": "line", "who": "COUNSELLOR", "tag": "", "segs": [{"s": "Control doesn't need a fist, Chloe. When someone decides what you eat, what you spend, who you see and whether your dreams are \"nonsense\", that's real."}, {"d": "beat"}, {"s": "What you're feeling has a name. And you're not the only woman in this city feeling it."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "barely audible"}, {"s": "I thought it was just me. That I'm just… bad at being a wife."}]}, {"k": "line", "who": "COUNSELLOR", "tag": "", "segs": [{"s": "You've spent years being very good at surviving."}, {"d": "beat"}, {"s": "Shall we start learning what your options are? No decisions today. Just information."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "What should I do in the meantime?"}]}, {"k": "line", "who": "COUNSELLOR", "tag": "", "segs": [{"s": "One practical thing. Start keeping a record. Every time he shouts, every insult, every time he takes your card or tears up your work, write it down. The date, the time, his exact words, and who was there."}, {"d": "beat"}, {"s": "Keep it somewhere he'll never look. If you ever need it, it will speak for you."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "after a long breath"}, {"s": "Just information."}]}]}, {"n": 21, "title": "THE WORKSHOP", "slug": "INT. DESIGN WORKSHOP, ABUJA — CONFERENCE HALL — DAY", "time": "16:30–17:08", "items": [{"k": "act", "t": "A busy conference hall in a hotel in Central Abuja. A banner reads \"ABUJA INTERIOR DESIGN WORKSHOP.\" Twenty designers talk excitedly at round tables covered in fabric swatches, paint charts and mood boards. Chloe slips in through the back door, finds an empty seat in the last row and holds her portfolio against her chest like a shield."}, {"k": "act", "t": "Twenty designers sit at tables covered in fabric swatches. Chloe sits near the back, nervous, holding her portfolio. A WOMAN in bright ankara, IFEOMA, an old classmate, spots her across the room."}, {"k": "line", "who": "IFEOMA", "tag": "", "segs": [{"s": "Chloe? Chloe Adeyemi?! The girl who won the final-year prize?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "surprised"}, {"s": "Ifeoma! You remember that?"}]}, {"k": "line", "who": "IFEOMA", "tag": "", "segs": [{"s": "Remember? You designed that whole children's ward! The lecturers were fighting over you!"}, {"d": "beat"}, {"s": "Where did you disappear to?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "after a pause"}, {"s": "Marriage. Children."}, {"d": "beat"}, {"s": "Life."}]}, {"k": "line", "who": "IFEOMA", "tag": "", "segs": [{"d": "sitting beside her"}, {"s": "Well, life brought you back."}, {"d": "She taps the portfolio."}, {"s": "Can I see?"}]}, {"k": "act", "t": "Chloe slowly opens it. Ifeoma turns the pages, silent. Then she looks up."}, {"k": "line", "who": "IFEOMA", "tag": "", "segs": [{"s": "My sister is redecorating her house. She's driving me mad."}, {"d": "beat"}, {"s": "Can I give her your number?"}]}, {"k": "act", "t": "Chloe stares at her as if she has been handed a key."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Yes. Yes, please."}]}]}, {"n": 22, "title": "\"SOMEONE PAID ME\"", "slug": "INT. CLIENT'S HOME, ABUJA — LIVING ROOM — DAY — YEAR THREE", "time": "17:08–17:48", "items": [{"k": "act", "t": "Year Three. Chloe parks outside a modest bungalow in Gwarinpa and walks up the path carrying a tape measure and a folder. She stands in the living room she has spent six weeks transforming. Footsteps come down the corridor."}, {"k": "act", "t": "A beautifully redesigned living room with warm colours, adire cushions and light pouring through big windows. A CLIENT, a former university classmate's sister, walks in and gasps."}, {"k": "line", "who": "CLIENT", "tag": "", "segs": [{"s": "Chloe! This is exactly what I wanted."}, {"d": "spinning around"}, {"s": "How long have you been doing this professionally?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I trained years ago. I'm just… finding my way back."}]}, {"k": "line", "who": "CLIENT", "tag": "", "segs": [{"s": "Well, please don't stop. You're very good."}, {"d": "She hands Chloe an envelope."}, {"s": "And this is yours."}]}, {"k": "act", "t": "Chloe looks at the envelope as if it's made of gold. LATER, in her car outside, she takes a photo of the room and sends it."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Someone paid me for this."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Wait. PAID you?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Yes!"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "CHLOE!!! You actually did it!"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "It's not much money."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "I'm not celebrating the amount. I'm celebrating you."}]}, {"k": "act", "t": "Chloe presses the phone to her chest in the car and laughs and cries at the same time."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "to herself"}, {"s": "I did it."}]}]}, {"n": 23, "title": "NOW IT'S MY TURN", "slug": "INT. AI STUDIO, LAGOS — CONFERENCE ROOM / INT. EMMA'S APARTMENT — YEAR THREE, MONTHS LATER", "time": "17:48–19:09", "items": [{"k": "act", "t": "Lagos. A tense afternoon. Grey clouds hang over the studio's glass windows. In the conference room, the MANAGING DIRECTOR sits at the head of a long table and closes his laptop slowly. Emma walks in, sees his face and sits down without being asked."}, {"k": "act", "t": "The studio's managing director closes a laptop. Emma sits across from him, pale."}, {"k": "line", "who": "DIRECTOR", "tag": "", "segs": [{"s": "We lost the contract, Emma. All of it. We'll need to cut your department by six people."}, {"d": "beat"}, {"s": "I need you to choose which six."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "stunned"}, {"s": "Sir, I hired half of them. I trained them. Kemi just had a baby—"}]}, {"k": "line", "who": "DIRECTOR", "tag": "", "segs": [{"s": "I'm sorry. Friday."}]}, {"k": "act", "t": "THAT EVENING. Emma's apartment. Her phone rings: \"MUMMY.\""}, {"k": "line", "who": "MAMA EMMA", "tag": "ON PHONE", "segs": [{"d": "weak"}, {"s": "Emma, don't panic. It's just my sugar again. The doctor says I should stay in hospital for a few days."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Hospital? Mummy, I'm coming to Ibadan tomorrow—"}]}, {"k": "line", "who": "MAMA EMMA", "tag": "ON PHONE", "segs": [{"s": "You have work. Don't worry about me."}, {"d": "beat"}, {"s": "Have you eaten?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "closing her eyes"}, {"s": "Yes, Mummy."}]}, {"k": "act", "t": "She hasn't. She hangs up and sits in the dark. FRIDAY arrives. For once, Emma has no encouraging words ready."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Terrible week. No jokes today."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Do you want to talk?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Not really. I'm tired of being the person who always knows what to do."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Then don't know what to do today."}]}, {"k": "act", "t": "Emma stares at the message."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "You once told me I didn't have to earn kindness. That applies to you too."}]}, {"k": "act", "t": "Emma's eyes fill with tears."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Look at you giving me my own advice."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Somebody has to. Your advice is expensive."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "You haven't paid me a kobo."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "And I never will 😂"}]}, {"k": "act", "t": "Emma laughs through her tears. Later that evening, another message."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Have you eaten?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "No."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Jollof or fried rice?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"d": "laughing, wiping her face"}, {"s": "Don't start."}]}]}, {"n": 24, "title": "SIX NAMES", "slug": "INT. AI STUDIO, LAGOS — CONFERENCE ROOM — FRIDAY", "time": "19:09–20:15", "items": [{"k": "act", "t": "Friday morning. Emma marches down the studio corridor, past her team's desks, holding a printed spreadsheet. Her people look up nervously as she passes. She knocks once on the managing director's glass door and walks in without waiting."}, {"k": "act", "t": "Emma stands in front of the managing director with a printed spreadsheet, determined."}, {"k": "line", "who": "DIRECTOR", "tag": "", "segs": [{"s": "Emma, I asked for six names."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I know, sir. I've brought you two. And a plan."}, {"d": "She slides it across."}, {"s": "If my team takes the Nollywood animation contract we turned down last year, and I take a pay cut, we can keep four of the six."}]}, {"k": "line", "who": "DIRECTOR", "tag": "", "segs": [{"d": "surprised"}, {"s": "A pay cut? Yours?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Kemi just had a baby, sir. Daniel is supporting his whole family in Ibadan."}, {"d": "beat"}, {"s": "Somebody told me this week that I don't have to be the person who always knows what to do."}, {"d": "beat"}, {"s": "But I do know what to do about this."}]}, {"k": "act", "t": "The director reads the plan for a long time."}, {"k": "line", "who": "DIRECTOR", "tag": "", "segs": [{"d": "slowly"}, {"s": "Four out of six."}, {"d": "beat"}, {"s": "Fine. Make it work."}]}, {"k": "act", "t": "LATER. Emma texts from the stairwell, grinning."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "I saved four jobs today. Four."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Of course you did."}, {"d": "beat"}, {"s": "You keep saving people, Emma. One day somebody needs to save you back."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"d": "looking at the screen"}, {"s": "Somebody already does. Every Friday."}]}]}, {"n": 25, "title": "\"WHO GAVE YOU PERMISSION?\"", "slug": "INT. ADEYEMI HOUSE — DINING ROOM — EVENING — YEAR FOUR", "time": "20:15–21:04", "items": [{"k": "act", "t": "Year Four. Evening. Rain has just stopped, and the garden lights reflect in puddles on the driveway. Inside, the dining table is covered in design boards, fabric samples and a neatly bound proposal. The front door opens. Kunle walks in, drops his car keys in the crystal bowl and stops at the table."}, {"k": "act", "t": "Chloe has finished several small projects. She's more animated with the children and has started going to design workshops. Tonight, her proposal for a client's office is spread across the dining table. Kunle comes home and picks it up."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "What's this?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "A proposal for a client's office."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Client?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Yes. I'm taking on some design work."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "slowly"}, {"s": "And when were you planning to discuss this with me?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I was going to tell you when—"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "You think because somebody gave you a little money, you can suddenly do whatever you want?"}]}, {"k": "act", "t": "Chloe is silent."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Who put this nonsense in your head?"}]}, {"k": "act", "t": "He pushes the proposal aside. Pages slide onto the floor."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Don't forget who provides for this family."}]}, {"k": "act", "t": "Chloe looks at the pages on the floor. Then, for the first time, she doesn't apologise."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I haven't forgotten."}, {"d": "beat"}, {"s": "But I would like to work again."}]}, {"k": "act", "t": "Kunle looks at her as if a stranger has walked into his house."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "very quietly"}, {"s": "We will discuss this later."}]}, {"k": "act", "t": "He walks out. Chloe kneels and gathers her pages with shaking hands. Ada watches from the stairs."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Mummy, you didn't say sorry."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "looking up at her"}, {"s": "No, baby. I didn't."}]}]}, {"n": 26, "title": "\"MY VOICE WAS SHAKING\"", "slug": "INT. ADEYEMI HOUSE — BATHROOM / EMMA'S APARTMENT — FRIDAY NIGHT — INTERCUT", "time": "21:04–22:29", "items": [{"k": "act", "t": "Later that Friday night. The house is silent. Chloe walks quietly down the corridor, steps into the bathroom and locks the door behind her. She sits on the closed toilet lid in the soft light, takes a small blue notebook from her makeup bag and opens it on her knee. In Lagos, Emma is curled on her sofa under a blanket."}, {"k": "act", "t": "She writes in tiny, careful handwriting:"}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering as she writes"}, {"s": "\"Friday. 8:40 p.m. He threw my proposal on the floor. He said, 'Who put this nonsense in your head?' Ada was on the stairs.\""}]}, {"k": "act", "t": "She closes the notebook, slips it back into the makeup bag under the lipsticks, and picks up her phone."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I said what I wanted. My voice was shaking."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "You can be frightened and still deserve to be heard."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I thought getting stronger would mean I wasn't afraid anymore."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Perhaps sometimes it means taking a small step even while you're afraid."}, {"d": "beat"}, {"s": "But please be careful. Your safety and the children's safety come before any argument."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I've spoken to a counsellor. And Halima knows what's happening."}, {"d": "beat"}, {"s": "And I've started writing everything down. Every shout. Every insult. Dates and times. The counsellor said one day it might speak for me."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "That's brave and smart. Keep it somewhere he'd never think to look."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Under my lipsticks. He has never once looked at my lipsticks."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "I'm glad you have people there with you."}, {"d": "beat"}, {"s": "Promise me something?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "What?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "If you ever don't feel safe, you call Halima first. Not me. Somebody who can be at your door in ten minutes."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I promise."}]}, {"k": "act", "t": "Chloe looks across at her portfolio on the bathroom shelf. The journey is nowhere near over. But she can see herself starting to change."}]}, {"n": 27, "title": "THE CARD", "slug": "INT. SUPERMARKET, ABUJA — CHECKOUT — DAY — WEEKS LATER", "time": "22:29–23:09", "items": [{"k": "act", "t": "Weeks later. A busy supermarket in Wuse on a Saturday morning. Fluorescent lights hum, and a trolley wheel squeaks. Shoppers queue at every till. Chloe pushes a full trolley to the checkout while Ada and Tobi argue over a packet of biscuits."}, {"k": "act", "t": "A full trolley. Ada and Tobi stand beside Chloe. The cashier swipes her card. Beep. Declined. She tries again. Declined."}, {"k": "line", "who": "CASHIER", "tag": "", "segs": [{"s": "Madam, it's not going."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "embarrassed"}, {"s": "It must be the network. Let me call my husband."}]}, {"k": "act", "t": "She steps aside and calls. He answers on the first ring, calm."}, {"k": "line", "who": "KUNLE", "tag": "ON PHONE", "segs": [{"s": "I blocked the card."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Kunle, I'm at the checkout. The children are here. People are watching."}]}, {"k": "line", "who": "KUNLE", "tag": "ON PHONE", "segs": [{"s": "You have clients now, don't you? Let your clients buy the groceries."}, {"d": "beat"}, {"s": "Or come home and we'll discuss your \"career.\""}]}, {"k": "act", "t": "Click. Chloe stands frozen. Behind her, a queue of people stares. Tobi tugs her wrapper."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Mummy, can we still buy the biscuits?"}]}, {"k": "act", "t": "Chloe opens her handbag and takes out the envelope from her first client, the money she had been saving. She counts the notes, hands them to the cashier and pays for everything herself."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "quietly, to herself"}, {"s": "Yes, Tobi. We can buy the biscuits."}]}]}, {"n": 28, "title": "THREE FRIDAYS", "slug": "INT. EMMA'S APARTMENT / AI STUDIO, LAGOS — END OF YEAR FOUR", "time": "23:09–23:42", "items": [{"k": "act", "t": "The end of Year Four. Three Fridays in Lagos. The studio and Emma's apartment both feel emptier than usual. Each Friday at the same time, Emma looks at her phone, and each Friday the screen stays dark."}, {"k": "act", "t": "FRIDAY ONE."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Morning, Abuja. What's the food controversy today?"}]}, {"k": "act", "t": "No reply. Emma checks her phone between meetings. Nothing."}, {"k": "act", "t": "FRIDAY TWO."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Missing our usual nonsense. Hope you're okay."}]}, {"k": "act", "t": "No reply."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "Still nothing?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "trying to sound casual"}, {"s": "She's probably busy. Children. Life."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "watching her"}, {"s": "You've checked that phone forty times today."}]}, {"k": "act", "t": "FRIDAY THREE. Emma sits on her bed late at night and types slowly."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Chloe, I'm worried. You don't owe me a reply. But if you can, please let me know you're safe."}]}, {"k": "act", "t": "A whole weekend passes. On Sunday night, Emma does something she has done only a few times in four years. She calls. It rings. And rings. No answer."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering to the phone"}, {"s": "Please. Please be okay."}]}]}, {"n": 29, "title": "WHAT HAPPENED IN ABUJA", "slug": "MONTAGE — ABUJA — THOSE THREE WEEKS — FRAGMENTS", "time": "23:42–24:44", "items": [{"k": "act", "t": "Abuja, during those same three silent weeks. We see only pieces of what happens: a kitchen, a corridor at night, an office, a front door. Each moment is short and tense."}, {"k": "act", "t": "FRAGMENT ONE. A dinner table with an unfinished meal. Kunle's chair is pushed back. Chloe sits very still."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "I've cancelled the children's school trip. And your little \"client\" called. I told her you're no longer available."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "quietly"}, {"s": "You had no right."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "I have every right. This is my house. My money. My name."}, {"d": "beat"}, {"s": "You'll stop this design nonsense, or I'll stop it for you."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "standing"}, {"s": "Then I'll stop living in your house."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "laughing coldly"}, {"s": "And go where? With what?"}, {"d": "beat"}, {"s": "If you walk out of this house, don't think you'll walk back in."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "after a long silence"}, {"s": "I know."}]}, {"k": "act", "t": "FRAGMENT TWO. A suitcase beside a doorway at night. Ada, now 11, holds Tobi's hand."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Mummy, are we going on holiday?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "zipping the suitcase"}, {"s": "Something like that, my love. Somewhere quiet."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Is Daddy coming?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "after a pause"}, {"s": "Not this time."}]}, {"k": "act", "t": "FRAGMENT THREE. A legal adviser's office. Chloe sits across a desk, holding a tissue."}, {"k": "line", "who": "LEGAL ADVISER", "tag": "", "segs": [{"s": "You have rights, Mrs. Adeyemi. And so do your children. Let's write everything down. Start from the beginning."}]}, {"k": "act", "t": "FRAGMENT FOUR. Night. A front door opens. Halima stands there in her nightgown. She sees Chloe, the suitcase and the children, and immediately pulls them all into her arms."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "Come in. Come in."}, {"d": "beat"}, {"s": "You're safe here."}]}]}, {"n": 30, "title": "\"I'M STILL HERE\"", "slug": "INT. EMMA'S APARTMENT, LAGOS — MONDAY, 6:12 AM / INT. HALIMA'S GUEST ROOM, ABUJA — INTERCUT", "time": "24:44–25:59", "items": [{"k": "act", "t": "Monday dawn in Lagos. Emma's apartment is grey with early light. She stands at the bathroom mirror half-dressed for work, toothbrush in her mouth, her phone propped against the sink. In Abuja, in a small, borrowed guest room at Halima's house, Chloe sits on a narrow bed with her children asleep beside her."}, {"k": "act", "t": "Emma is getting ready for work, phone in hand, when it lights up."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I'm still here."}]}, {"k": "act", "t": "Emma sits down on the edge of her bed."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "The children and I are safe. We're staying with Halima for now."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "I'm so glad to hear from you. How are you all holding up?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Scared. Confused. I cried almost the whole night."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "I'm listening."}]}, {"k": "act", "t": "In Abuja, Chloe sits on a borrowed bed with both children asleep beside her. She types a long message. For the first time, she doesn't make it smaller than it was."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I didn't tell you, but for weeks it got worse. He took my card. He went through my things. He told the children Mummy was \"confused.\" And one night he said if I left, I'd never see them again."}, {"d": "beat"}, {"s": "I stood in the kitchen with my hands shaking and I thought, if I stay, Ada will learn this is what love looks like."}, {"d": "beat"}, {"s": "So I called Halima. Like I promised you."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"d": "through tears"}, {"s": "You kept your promise."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I don't know whether I can do this, Emma."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "You don't have to work out your whole future this week. Keep talking to the people helping you there. One day at a time, Chloe."}]}, {"k": "act", "t": "Chloe presses the phone to her chest. On the wall beside her is Halima's calendar. She takes a pen and circles the coming Friday."}]}, {"n": 31, "title": "THE BORROWED BED", "slug": "INT. HALIMA'S GUEST ROOM, ABUJA — NIGHT", "time": "25:59–26:38", "items": [{"k": "act", "t": "Night at Halima's house. The guest room is small but warm, with a ceiling fan turning slowly and a night light glowing in the corner. Ada and Tobi share one single bed under a borrowed blanket. Chloe sits on the edge, still in her day clothes."}, {"k": "act", "t": "Ada (11) and Tobi (8) lie squeezed together on one bed. Chloe sits on the edge, stroking Tobi's hair."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Mummy, is Daddy angry?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "carefully"}, {"s": "Daddy is… having big feelings. That's not your job to fix, my love."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Did I do something wrong?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "firmly, kneeling to his eye level"}, {"s": "No. Never. Not one thing."}, {"d": "beat"}, {"s": "Grown-ups made this decision. Not children."}]}, {"k": "act", "t": "Tobi nods sleepily and closes his eyes. Ada stays awake, staring at the ceiling."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Mummy?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Yes, baby?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "It's quiet here."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "softly"}, {"s": "Is that bad?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "after a long pause"}, {"s": "No."}, {"d": "beat"}, {"s": "I didn't know houses could be this quiet without being scary."}]}, {"k": "act", "t": "Chloe turns away so her daughter won't see her cry. She kisses Ada's forehead."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Go to sleep, my darling. Nobody will shout tonight."}]}]}, {"n": 32, "title": "\"I WANT MY CHILDREN\"", "slug": "INT. ZAINAB'S CHAMBERS, ABUJA — DAY — YEAR FIVE", "time": "26:38–28:17", "items": [{"k": "act", "t": "Year Five. The chambers of a law firm in Maitama, with bookshelves full of law reports and a large wooden desk. ZAINAB, Chloe's solicitor, in a navy suit, walks briskly into her office carrying a thick file and a cup of tea. Chloe is already waiting in the chair across the desk. Zainab sits, opens the file, puts on her reading glasses and looks up."}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"s": "I want to be clear with you. This may take time. Kunle could dispute what happened, and we'll need to work carefully through the evidence and the children's arrangements."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "He says he'll make sure I never see the children again."}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"s": "Threats are not court orders. We'll discuss what steps are available and what best protects you and the children."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "He knows people. Important people. Commissioners come to his house for dinner. I cook for them."}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"s": "I understand why you're worried. But let's deal with what we can establish and what we can do."}]}, {"k": "act", "t": "Chloe looks down at her hands."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "For years, he told me nobody would believe me."}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"d": "closing the file and leaning forward"}, {"s": "I'm listening to you now."}]}, {"k": "act", "t": "Chloe begins to cry. Then she wipes her eyes, opens her handbag and places three small blue notebooks on the desk, one after another. Then her phone."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I didn't only tell myself. I wrote it down."}, {"d": "beat"}, {"s": "Two years of records. Every time he shouted. Every derogatory thing he said: \"useless\", \"confused\", \"you can't even choose what to cook.\" The date, the time, his exact words, and who was in the room."}, {"d": "She taps the phone."}, {"s": "And forty-one voice recordings. His shouting, from the kitchen, the bedroom, the car."}]}, {"k": "act", "t": "Zainab slowly opens the first notebook and turns the pages. Tiny, careful handwriting. Dates. Times. Quotes. Her eyebrows rise."}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"d": "quietly"}, {"s": "Chloe. Do you know what this is?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "My diary of the worst years of my life."}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"d": "looking up"}, {"s": "It's evidence. Consistent, dated, written at the time it happened."}, {"d": "beat"}, {"s": "He told you nobody would believe you."}, {"d": "She lays her hand on the notebooks."}, {"s": "These will make them believe you."}]}]}, {"n": 33, "title": "THE CALL FROM KUNLE", "slug": "INT. HALIMA'S HOUSE — BACK GARDEN — EVENING", "time": "28:17–29:04", "items": [{"k": "act", "t": "Eveni
