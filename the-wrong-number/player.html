<style>
/* Layout: one centred "stage" column like a lit set; scene unfolds line by line; remote-control bar pinned to the bottom. Deliberately single dark look (night-time Lagos, kerosene lamp). */
:root{
  --night:#0e1120; --stage:#161a2c; --stage2:#1d2238; --rule:#2b3150;
  --ink:#efe8db; --muted:#a3a0b4; --faint:#6e6c82;
  --lamp:#e9a23b; --lamp-ink:#1b1306; --blood:#d0525a; --ok:#7fd49a;
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --slug:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:10px 16px 8px}
.hrow{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,26px);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--rule);background:var(--stage);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--lamp)}
.score{font-family:var(--slug);font-size:12px;color:var(--muted)}
.score b{color:var(--lamp)}
.ticks{max-width:820px;margin:8px auto 0;display:grid;grid-template-columns:repeat(53,1fr);gap:2px}
.ticks button{height:6px;border:0;border-radius:2px;background:var(--rule);padding:0}
.ticks button.seen{background:color-mix(in srgb,var(--lamp) 45%,var(--rule))}
.ticks button.now{background:var(--lamp)}

main{max-width:820px;margin:0 auto;padding:24px 16px}
.scenehead{padding-block:8px 18px;border-bottom:1px dashed var(--rule);margin-bottom:18px}
.scenehead .num{font-family:var(--slug);color:var(--lamp);font-size:13px;letter-spacing:.12em}
.scenehead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.scenehead .slug{font-family:var(--slug);font-size:13px;color:var(--muted);text-transform:uppercase}
.scenehead .slug span{color:var(--faint)}
.scenehead.enter h2{animation:rise .7s ease both}
@keyframes rise{from{opacity:.2;transform:translateY(8px);letter-spacing:.04em}to{opacity:1;transform:none}}

.feed{display:flex;flex-direction:column;gap:14px}
.it{transition:opacity .3s, transform .3s;opacity:.55}
.it.cur{opacity:1}
.it.fresh{animation:appear .45s ease both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.act{font-style:italic;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 14px;max-width:62ch}
.it.cur.act{border-left-color:var(--lamp);color:var(--ink)}
.line{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--slug);font-weight:700;font-size:13px;color:var(--night);background:var(--c)}
.bub{min-width:0}
.who{font-family:var(--slug);font-weight:700;font-size:12.5px;letter-spacing:.08em;color:var(--c)}
.who em{font-style:normal;color:var(--faint);font-weight:400;margin-left:6px}
.say{background:var(--stage);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:10px 14px;margin-top:4px;font-size:17px;max-width:62ch}
.it.cur .say{border-color:var(--c);background:var(--stage2);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 8px 30px -12px color-mix(in srgb,var(--c) 50%,transparent)}
.dir{color:var(--faint);font-style:italic;font-size:14px}
.word.spoken{color:var(--c)}
.narr .say{background:transparent;border:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);border-radius:0;font-family:var(--display);font-size:20px;line-height:1.35;padding:12px 2px}
.narr .av{background:transparent;border:1px solid var(--lamp);color:var(--lamp)}
.it.cur.narr .say{box-shadow:none;background:transparent;border-color:var(--lamp)}
.card{align-self:center;text-align:center;background:#0a0c16;border:1px solid var(--blood);border-radius:12px;padding:16px 20px;max-width:520px;width:100%}
.card small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.16em;color:var(--blood);margin-bottom:6px}
.card p{margin:0;font-family:var(--slug);font-size:18px;font-weight:700}
.card.paper{background:#f1e7cf;border-color:#c9b98f;color:#2a2318}
.card.paper small{color:#8a6d2c}
.card.mw{background:transparent;border-color:var(--lamp);border-style:dashed}.card.mw small{color:var(--lamp)}
.titlecard{text-align:center;font-family:var(--display);font-size:clamp(22px,5vw,32px);color:var(--lamp);padding:28px 0;letter-spacing:.02em;text-wrap:balance}

.endbox{margin-top:26px;border:1px solid var(--rule);background:var(--stage);border-radius:16px;padding:18px}
.endbox h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.endbox p{margin:0 0 12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{background:var(--stage2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:left}
.opt:hover{border-color:var(--lamp)}
.opt.pick{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 18%,var(--stage2))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{background:var(--lamp);color:var(--lamp-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.count{font-family:var(--slug);font-size:12px;color:var(--faint)}
.reveal{margin-top:18px;border-radius:14px;padding:14px 16px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--stage))}
.reveal.miss{border-color:var(--blood);background:color-mix(in srgb,var(--blood) 10%,var(--stage))}
.reveal b{font-family:var(--slug);letter-spacing:.1em;font-size:12px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--stage) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dk{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.ctl button{background:var(--stage2);border:1px solid var(--rule);border-radius:999px;width:44px;height:44px;display:grid;place-items:center}
.ctl button:hover{border-color:var(--lamp)}
.ctl .play{width:60px;height:60px;background:var(--lamp);border:0;color:var(--lamp-ink)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl .play svg{width:26px;height:26px}
.opts2{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.opts2 label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts2 select{background:var(--stage2);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:3px 6px;font:inherit}
.nowline{font-family:var(--slug);font-size:12px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.drawer{position:fixed;inset:0;z-index:10;display:flex;justify-content:flex-end;background:rgba(5,6,12,.6)}
.drawer .pane{width:min(420px,100%);height:100%;background:var(--stage);border-left:1px solid var(--rule);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
.pane h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sl{display:flex;flex-direction:column;gap:2px}
.sl button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px}
.sl button:hover{background:var(--stage2)}
.sl button.now{background:color-mix(in srgb,var(--lamp) 16%,transparent)}
.sl .n{font-family:var(--slug);color:var(--lamp);font-size:12px}
.sl .t{min-width:0}
.sl .tm{font-family:var(--slug);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sl .seen .t::after{content:" ✓";color:var(--ok);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--night);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.hint{color:var(--faint);font-size:13px;text-align:center;margin-top:28px}
kbd{font-family:var(--slug);border:1px solid var(--rule);border-radius:4px;padding:0 4px;font-size:12px}
@media (max-width:520px){.score{display:none}.say{font-size:16px}.line{grid-template-columns:34px 1fr;gap:10px}.av{width:34px;height:34px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

That is the Adeyemi standard."}, {"d": "beat"}, {"s": "A man who cannot be gentle with the weak has no business wearing a white coat."}]}, {"k": "act", "t": "Applause."}, {"k": "act", "t": "RECEPTION. Chloe hurries in with the cooler, out of breath. RITA, the secretary, looks up."}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"s": "Good afternoon, ma. Mrs. Adeyemi?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Good afternoon. Please, I've brought my husband's lunch. Is he—"}]}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"s": "He's in the board meeting, ma. Please sit down. I'll tell Dr. Kunle the moment he comes out."}]}, {"k": "act", "t": "Chloe sits on a leather sofa and holds the cooler on her lap like a baby. A TV on the wall plays a cooking show. The host laughs: \"And remember, ladies, a happy kitchen is a happy home!\" Chloe watches it without blinking."}]}, {"n": 4, "title": "\"WHO BROUGHT YOU HERE?\"", "slug": "INT. KUNLE'S OFFICE — 1:31 PM", "time": "2:45–3:47", "items": [{"k": "act", "t": "A big office with diplomas on the wall. Kunle sits down, loosening his tie. Rita knocks and enters."}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"s": "Good afternoon, sir. Your wife is in reception."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "surprised, then smiling"}, {"s": "My wife? Call her inside."}]}, {"k": "act", "t": "Chloe enters with the cooler and a nervous smile."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I brought your food, darling. It's still hot."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "not touching it"}, {"s": "What are you doing here?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "You said your food should be on your desk by one—"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Who brought you here?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "…I came."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Where is Musa?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "He went to buy fuel. You sent him the money this morning. He said thirty minutes, and I knew you were hungry, so—"}]}, {"k": "act", "t": "Kunle stands slowly. He walks to the window and looks down at the car park. His white Range Rover is parked crookedly across two spaces."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "very quietly"}, {"s": "You touched my car."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Darling, I only—"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "What did I tell you about my car, Chloe?"}, {"d": "beat"}, {"s": "What did I TELL you?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Not to drive it."}]}, {"k": "act", "t": "Rita stands frozen by the door. Kunle opens the cooler and lifts out the steaming food flask. Then he pours the jollof rice over Chloe's head. It runs down her hair, her face and her dress. Rita gasps and covers her mouth."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "calmly"}, {"s": "Now you're hot too."}, {"d": "beat"}, {"s": "Get out of my office."}]}, {"k": "act", "t": "Chloe stands there, rice falling from her hair onto the carpet. She can't breathe."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Rita, call the cleaners."}, {"d": "to Chloe"}, {"s": "And give Rita my car key. Musa will bring it home."}]}, {"k": "act", "t": "Chloe puts the key on the desk with a shaking hand and walks out past Rita, who can't look at her."}]}, {"n": 5, "title": "THE CAR PARK", "slug": "EXT. HOSPITAL CAR PARK — MOMENTS LATER", "time": "3:47–4:24", "items": [{"k": "act", "t": "Chloe stands beside the Range Rover with rice still in her hair. She can't open the door because she gave the key back. She just stands there. Footsteps run up behind her. It's RITA, holding a packet of tissues."}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"d": "breathless"}, {"s": "Madam. Madam, please, wait."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "not turning around"}, {"s": "Please. Don't look at me."}]}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"d": "handing her the tissues, her voice shaking"}, {"s": "I'm sorry, ma. I'm so sorry. I've worked for him for six years. I never knew—"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "wiping her face"}, {"s": "Nobody knows. That's how he likes it."}]}, {"k": "act", "t": "Musa's old Corolla screeches into the car park. Musa jumps out, sweating, and sees her hair."}, {"k": "line", "who": "MUSA", "tag": "", "segs": [{"d": "his hand on his head"}, {"s": "Ah! Madam! Ah, God!"}, {"d": "beat, quietly"}, {"s": "Madam, I begged you. I begged you not to touch that car."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "a broken laugh"}, {"s": "It wasn't the car, Musa."}, {"d": "beat"}, {"s": "It's never the car."}]}, {"k": "act", "t": "She gets into Musa's car. Rita watches it drive away, then looks up at Kunle's office window. He is standing there, watching too."}]}, {"n": 6, "title": "\"WHY IS THERE RICE IN YOUR HAIR?\"", "slug": "INT. ADEYEMI MANSION — BATHROOM / SITTING ROOM — AFTERNOON → NIGHT", "time": "4:24–5:10", "items": [{"k": "act", "t": "Chloe kneels over the bathtub, washing rice out of her hair and sobbing without a sound. Ada stands at the door."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy, why is there rice in your hair?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "quickly wiping her face"}, {"s": "Mummy fell in the kitchen, baby."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "You didn't go to the kitchen. You went to Daddy's office."}]}, {"k": "act", "t": "Chloe has no answer."}, {"k": "act", "t": "NIGHT. The front door opens. Kunle walks in, calm and smiling, and kisses Tobi's head. Chloe stands by the dining table with dinner served."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "sitting"}, {"s": "The food you poured on yourself today was a waste. Do you know how much rice costs now?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "I'm sorry."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Listen to me carefully. You will never, ever come to my office in my car again. Do you understand? My staff saw you drive in like a market woman."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Yes, darling."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Good."}, {"d": "tasting the soup"}, {"s": "Too much salt."}]}]}, {"n": 7, "title": "\"I WILL TELL YOUR MOTHER\"", "slug": "INT. ADEYEMI MANSION — MASTER BEDROOM — NIGHT — TWO WEEKS LATER", "time": "5:10–6:41", "items": [{"k": "act", "t": "Sounds through the door: a crash, a cry, then silence. Inside, Chloe is on the floor beside the bed holding her arm, with her lip bleeding. Kunle stands over her, breathing hard."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "I asked you a simple question. Where did the twenty thousand naira go?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "crying"}, {"s": "Ada's school trip. I told you. I showed you the receipt."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "You don't spend MY money without asking me!"}]}, {"k": "act", "t": "Chloe pulls herself up against the bed and grabs her phone."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I'm calling your mother."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "freezing"}, {"s": "What?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I'm calling Mama. I'll tell her everything you do to me. The rice. The slaps. Tonight. Everything."}]}, {"k": "act", "t": "She dials. \"MAMA KUNLE\" appears on the screen. Kunle snatches the phone and ends the call."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "low, dangerous"}, {"s": "You call my mother, and I'll send you back to your father's house in Ibadan tonight. Without the children. You'll never see Ada and Tobi again."}]}, {"k": "act", "t": "Silence. Chloe stares at him. Then something changes in his face. He sinks to his knees in front of her."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "suddenly soft, almost crying"}, {"s": "Chloe. Chloe, I'm sorry. It's the hospital. The board, the pressure. I don't know what came over me."}, {"d": "He takes her hands."}, {"s": "I'll never do it again. I swear on my father's grave. Please. Please, don't tell Mama."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "barely audible"}, {"s": "You said that last time."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "This time I mean it."}, {"d": "He kisses her hands."}, {"s": "I'm going to treat you like a queen. Watch me."}]}, {"k": "act", "t": "Her phone, on the floor, starts ringing. \"MAMA KUNLE.\" The call she cut has rung back. Kunle and Chloe both freeze. He picks it up, presses it into her hand and whispers."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Answer it. Smile."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "answering, voice trembling"}, {"s": "Good evening, Mama."}]}, {"k": "line", "who": "MAMA KUNLE", "tag": "ON PHONE", "segs": [{"s": "Chloe? You called me just now. Is everything alright, my daughter?"}]}, {"k": "act", "t": "Kunle kneels in front of her with his hands joined like a man praying, mouthing \"please.\""}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "after a long, long pause"}, {"s": "It was a pocket dial, Mama. Everything is fine."}]}, {"k": "line", "who": "MAMA KUNLE", "tag": "ON PHONE", "segs": [{"d": "a strange pause"}, {"s": "…Are you sure, Chloe? You sound like you've been crying."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "closing her eyes"}, {"s": "I'm sure, Mama. Goodnight."}]}, {"k": "act", "t": "She hangs up. Kunle exhales and kisses her hands again and again."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Thank you. Thank you, my queen. You'll never regret it."}]}, {"k": "act", "t": "Chloe stares at the wall over his shoulder. She already does."}]}, {"n": 8, "title": "THE GOOD HUSBAND", "slug": "INT. ADEYEMI MANSION — DINING ROOM — NEXT MORNING", "time": "6:41–7:21", "items": [{"k": "act", "t": "The table is laid with fresh flowers, bread and egg. Kunle is pouring tea, which he has never done in nine years. Chloe enters, with her arm wrapped. The children stare."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Good morning, my queen. Sit. I made breakfast."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "whispering to Tobi"}, {"s": "Daddy can cook?"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "laughing"}, {"s": "Daddy can do many things."}, {"d": "He slides a paper to Chloe."}, {"s": "Before I forget. My line has had no network for one week. MTN people are useless. So I bought a new SIM. Here's the number. Text me there for now."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "reading"}, {"s": "0814 333 2197."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Save it as \"Darling New.\""}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "quietly saving it"}, {"s": "Darling New."}]}, {"k": "act", "t": "He kisses her forehead and leaves for work. Chloe looks at the flowers, the bread and her wrapped arm."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy, is Daddy sick?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Why, baby?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Because he's being nice."}]}]}, {"n": 9, "title": "THE LINE THAT CAME BACK", "slug": "INT. KUNLE'S RANGE ROVER — NIGHT — PARKED OUTSIDE A LOUNGE IN WUSE 2", "time": "7:21–8:04", "items": [{"k": "act", "t": "Kunle sits in the driver's seat. NKEM (26), glamorous, is in the passenger seat, taking selfies. His phone buzzes with an SMS: \"Dear customer, your line 0803 ••• ••12 has been restored. Thank you for choosing us.\""}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "smiling"}, {"s": "My old line is back."}]}, {"k": "line", "who": "NKEM", "tag": "", "segs": [{"s": "So what happens to the new one? The one your wife texts every hour?"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "pulling the new SIM out of his second phone"}, {"s": "I'll tell her to stop using it. Or maybe I won't."}, {"d": "He laughs."}, {"s": "A dead number is a very useful thing, Nkem. When I'm with you, I'm \"unreachable.\""}]}, {"k": "line", "who": "NKEM", "tag": "", "segs": [{"s": "You're wicked."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "I'm organised."}, {"d": "He lowers the window and flicks the tiny SIM into the gutter."}, {"s": "There. Wherever that number goes now, it's not my problem."}]}, {"k": "line", "who": "NKEM", "tag": "", "segs": [{"s": "And if she texts it?"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Then she's talking to nobody."}, {"d": "beat"}, {"s": "She's used to that."}]}]}, {"n": 10, "title": "NOBODY TOUCHES MY CHILDREN", "slug": "INT. ADEYEMI MANSION — BEDROOM / STAIRCASE — FRIDAY, 7:10 AM — THREE WEEKS LATER", "time": "8:04–9:08", "items": [{"k": "act", "t": "Chloe lies in bed shivering with a fever and a wet towel on her forehead. Kunle, dressed for work, stands at the door."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Chloe. It's ten past seven. Where is my breakfast?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "weak"}, {"s": "I'm sorry, darling. I have a fever. I couldn't stand up."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "You couldn't stand up, but you could lie down."}, {"d": "sighing loudly"}, {"s": "Every day there's something. Listen. I'll eat lunch at the hospital. Bring it before one. And this time Musa drives you. If I see you behind the wheel of my car, God help you."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Please, can I call Aunty Blessing to help with the children today? Just today?"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "No. Nobody raises my children except their mother."}, {"d": "He picks up his bag."}, {"s": "Oh, and that new number, the 0814 one. It's dead. Use my old line from now on."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "coughing, eyes closed"}, {"s": "Okay."}]}, {"k": "line", "who": "ADA", "tag": "O.S.", "segs": [{"s": "Mummy! Tobi is crying! He wants you!"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "You heard me? The old line."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "already getting up for Tobi"}, {"s": "Yes, yes. I heard you."}]}, {"k": "act", "t": "He leaves. Chloe, dizzy, stumbles toward her son's cries. The instruction is already gone from her head."}]}, {"n": 11, "title": "RONKE'S LAST VOICE NOTE", "slug": "INT. EMMA'S APARTMENT, SURULERE, LAGOS — THURSDAY NIGHT", "time": "9:08–9:49", "items": [{"k": "act", "t": "A small, untidy flat. Unopened condolence cards are piled on a chair. A framed photo of RONKE (28), bald from chemotherapy and laughing anyway, sits on the table. EMMA WILLIAMS (35) sits on the floor in yesterday's clothes and presses play on her phone."}, {"k": "line", "who": "RONKE", "tag": "VOICE NOTE", "segs": [{"d": "weak, teasing"}, {"s": "Emi. Emi, are you eating? Don't lie to me. I can hear you not eating."}, {"d": "a small laugh"}, {"s": "Promise me something. When I'm gone, don't stop living just because I did. Promise."}]}, {"k": "act", "t": "The voice note ends. Emma plays it again. And again. Her phone buzzes. It's a text from MR. BAYO, her editor."}, {"k": "line", "who": "BAYO", "tag": "TEXT", "segs": [{"s": "Your piece is dead. I gave the front page to Tayo. And don't ask about salary again this month."}]}, {"k": "act", "t": "Emma puts the phone face down. She stares at Ronke's photo for a long time."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering"}, {"s": "I'm tired, Ronke."}, {"d": "beat"}, {"s": "I'm so tired."}]}, {"k": "act", "t": "She picks the phone back up and types a message to Bisi. Her thumb trembles over SEND."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Bisi, thank you for everything. I'm sorry. Please don't be angry with me."}]}, {"k": "act", "t": "Send. She turns off the lamp. Darkness. Silence."}]}, {"n": 12, "title": "\"JOLLOF OR FRIED RICE?\"", "slug": "INT. ADEYEMI MANSION — KITCHEN — FRIDAY, 2:14 PM", "time": "9:49–10:37", "items": [{"k": "act", "t": "Chloe is still feverish and sweating, with Tobi on her hip and Ada doing homework at the counter. She opens the fridge. One bowl of jollof rice. One bowl of fried rice. She freezes."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Jollof or fried? Jollof or fried? What did he say this morning?"}]}, {"k": "act", "t": "She dials Kunle. It rings and rings. No answer."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Please pick up. Please."}]}, {"k": "act", "t": "She hangs up, opens her messages and taps \"Darling New.\""}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Jollof rice or fried rice? Sorry, I forgot which one you wanted."}]}, {"k": "act", "t": "Send. 2:17 PM. She puts Tobi down and holds the edge of the counter. 2:19 PM. A reply."}, {"k": "line", "who": "UNKNOWN", "tag": "TEXT", "segs": [{"s": "Wrong receiver, but jollof rice with turkey sounds better 😂"}]}, {"k": "act", "t": "Chloe stares at the screen."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "confused"}, {"s": "Wrong receiver?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "What is it, Mummy?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I don't know. Maybe it's a fake number."}, {"d": "beat"}, {"s": "Maybe Daddy's line has a scammer on it."}]}, {"k": "act", "t": "She switches to Kunle's old contact and types fast."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Jollof or fried rice?"}]}, {"k": "act", "t": "A reply comes in seconds."}, {"k": "line", "who": "KUNLE", "tag": "TEXT", "segs": [{"s": "Fried. Musa is waiting outside. Don't be late."}]}, {"k": "act", "t": "Chloe exhales. She looks back at the stranger's message, \"jollof rice with turkey sounds better 😂\", and for one second, very small, she almost smiles."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy, you're smiling."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "the smile vanishing"}, {"s": "No, baby. Mummy has a fever. Pack your books."}]}]}, {"n": 13, "title": "THE DRUG REP", "slug": "INT. HOSPITAL — CORRIDOR OUTSIDE KUNLE'S OFFICE — 2:52 PM", "time": "10:37–11:18", "items": [{"k": "act", "t": "Chloe arrives with the cooler, pale with fever, with Musa a step behind her. Rita looks up from her desk, startled and nervous."}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"d": "standing too quickly"}, {"s": "Madam! Good afternoon. You're early. Please, sit, I'll—"}]}, {"k": "act", "t": "Kunle's office door opens. NKEM walks out, laughing and adjusting her dress, with a branded tote bag on her shoulder. She stops when she sees Chloe. They look at each other."}, {"k": "line", "who": "NKEM", "tag": "", "segs": [{"d": "smiling sweetly"}, {"s": "Good afternoon, ma."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "slowly"}, {"s": "Good afternoon."}, {"d": "beat"}, {"s": "And you are?"}]}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"d": "jumping in"}, {"s": "She's… a drug rep, ma. Pharmaceutical. She came about the new antibiotics."}]}, {"k": "line", "who": "NKEM", "tag": "", "segs": [{"d": "tapping her bag"}, {"s": "Antibiotics. Yes."}]}, {"k": "act", "t": "Nkem walks past, her perfume trailing behind her. Chloe watches her go all the way to the lift, then looks at Rita, who can't meet her eyes."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "quietly"}, {"s": "He didn't pick up my call at 2:14."}]}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"d": "barely audible"}, {"s": "He was… in a meeting, ma."}]}, {"k": "act", "t": "Kunle appears in the doorway with his tie slightly loose. He sees the cooler and smiles."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "My queen! And with Musa this time. You see? You can learn."}, {"d": "He takes the cooler."}, {"s": "Fried rice?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "looking at the lift doors"}, {"s": "Fried rice."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Good girl. Go home and rest. You look terrible."}]}, {"k": "act", "t": "He goes back in and closes the door. Chloe stands in the corridor. The perfume is still in the air."}]}, {"n": 14, "title": "THE MORNING AFTER", "slug": "INT. EMMA'S APARTMENT, SURULERE, LAGOS — FRIDAY, 2:17 PM", "time": "11:18–12:17", "items": [{"k": "act", "t": "Harsh afternoon light through the curtains. Emma lies on the floor beside the sofa, where the night left her. She is weak and dizzy, but alive. Her eyes flutter open, and she doesn't know where she is. Then her phone buzzes on the floor beside her face. She squints at the screen."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Jollof rice or fried rice? Sorry, I forgot which one you wanted."}]}, {"k": "act", "t": "Emma stares at it. A stranger. A number she doesn't know. A question about rice. She laughs, a broken, cracked laugh that turns into sobbing. Then, with shaking fingers, she types."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Wrong receiver, but jollof rice with turkey sounds better 😂"}]}, {"k": "act", "t": "Send. 2:19 PM. Pounding on the door."}, {"k": "line", "who": "BISI", "tag": "O.S.", "segs": [{"s": "EMMA! EMMA, OPEN THIS DOOR! I've been calling since midnight! EMMA!"}]}, {"k": "act", "t": "Emma crawls to the door and unlocks it. BISI bursts in and falls to her knees, grabbing Emma's face."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "sobbing"}, {"s": "What did you do? What did you DO? That message, Emma, that message!"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "barely audible"}, {"s": "I'm still here."}, {"d": "beat"}, {"s": "I don't know why. But I'm still here."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "holding her tight"}, {"s": "We're going to the hospital. Now. And then we're getting you help. Real help. I don't care what you say."}]}, {"k": "act", "t": "Emma looks at the message on the screen through her tears."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "weakly"}, {"s": "Somebody in this world is worried about rice, Bisi."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "laughing and crying"}, {"s": "That's the new SIM you bought after the funeral. A recycled line."}, {"d": "beat"}, {"s": "It carried somebody's wahala to you."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "looking at the message"}, {"s": "Or it carried somebody's rice."}]}]}, {"n": 15, "title": "\"FRIDAY STRANGER\"", "slug": "INT. CHLOE'S BEDROOM, ABUJA / INT. EMMA'S APARTMENT, LAGOS — INTERCUT — THE NEXT FRIDAY, 2:19 PM", "time": "12:17–12:58", "items": [{"k": "act", "t": "Chloe folds laundry, fever gone. She scrolls back to the stranger's message. She remembers serving the fried rice last Friday. She hesitates, then types."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "For your information, fried rice was the correct answer."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Ah. The rice woman returns. Correct according to who?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "My husband."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Then your husband simply has bad taste 😂"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "You don't know him."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "True. But anybody who rejects good jollof is already suspicious."}]}, {"k": "act", "t": "Chloe laughs out loud, a real laugh she hasn't heard from herself in years. Ada runs in."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy! You're laughing!"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "surprised at herself"}, {"s": "Yes. I suppose I am."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Who made you laugh?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "looking at the phone"}, {"s": "A stranger."}]}, {"k": "act", "t": "Later, alone, Chloe edits the contact. She deletes \"Darling New\" and types: \"FRIDAY STRANGER.\" Save."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Same time next Friday?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Only if you bring better rice opinions."}]}]}, {"n": 16, "title": "\"WHO DID YOU USE TO BE?\"", "slug": "MONTAGE — LAGOS AND ABUJA — FRIDAYS OVER TWO MONTHS", "time": "12:58–13:53", "items": [{"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Serious question. Is pineapple on pizza a crime?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "My daughter eats it."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "She's young. Rehabilitation is possible."}]}, {"k": "act", "t": "Another Friday."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "How was your week, Rice Woman?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Don't call me that 😂"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Then tell me your name."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Chloe."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Emma. Nice to meet you, Chloe of the disputed rice."}]}, {"k": "act", "t": "Another Friday, late at night. Chloe sits on the bedroom floor while Kunle snores."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma, do you think people can forget who they used to be?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Yes. But I don't think the old person disappears completely."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "How do you find her again?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Start with one thing that used to make you happy."}]}, {"k": "act", "t": "Chloe looks up at the top shelf of the wardrobe. She stands on a stool and pulls down a dusty folder: \"CHLOE ADEYEMI — INTERIOR DESIGN PORTFOLIO.\" She opens it. Sketches of beautiful rooms. Colour swatches. Her own handwriting."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I think I remember something."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Then hold on to it. Don't let anybody put it back on that shelf."}]}]}, {"n": 17, "title": "THE VOICE", "slug": "INT. CHLOE'S CAR (PARKED IN THE GARAGE), ABUJA / INT. EMMA'S BALCONY, LAGOS — FRIDAY, 9:40 PM", "time": "13:53–14:43", "items": [{"k": "act", "t": "Chloe sits in the back seat of the family Lexus in the dark garage. It's the only place in the house without ears."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Can I call you? Just once. I want to know what you sound like."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Only if you promise not to judge my Lagos accent."}]}, {"k": "act", "t": "Chloe's thumb hovers. Then she presses call. It rings once."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "warm, a little nervous"}, {"s": "Hello? Rice Woman?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "a shaky laugh"}, {"s": "You sound exactly like your texts."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Is that good or bad?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "quietly"}, {"s": "It's good."}, {"d": "beat"}, {"s": "You sound like somebody who isn't angry."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "softly"}, {"s": "Chloe… why are you whispering?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Because I'm in the garage."}, {"d": "beat"}, {"s": "It's the only room in my house where nobody listens."}]}, {"k": "act", "t": "Silence in Lagos. Then headlights sweep across the garage wall. The gate is opening. Kunle's car."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "panicking"}, {"s": "He's home. I have to go."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Chloe—"}]}, {"k": "act", "t": "Click. Chloe wipes her face, checks herself in the mirror, practises a smile and steps out of the car just as Kunle's headlights hit her."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "from his window"}, {"s": "What are you doing in the garage at this hour?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "smiling"}, {"s": "Looking for Tobi's toy, darling."}]}]}, {"n": 18, "title": "\"MY WIFE WOULD FORGET HER OWN HEAD\"", "slug": "INT. ADEYEMI MANSION — DINING ROOM — NIGHT — SIX MONTHS LATER", "time": "14:43–16:23", "items": [{"k": "act", "t": "A dinner party. Kunle hosts four business GUESTS. Chloe has cooked everything and stands serving."}, {"k": "line", "who": "GUEST", "tag": "", "segs": [{"s": "Kunle, this egusi is a masterpiece. Your wife should open a restaurant!"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "laughing"}, {"s": "Please, don't encourage her. If I leave Chloe alone, she'll forget her own head. I have to supervise everything in this house. Even the salt."}]}, {"k": "act", "t": "The guests laugh. Chloe smiles along."}, {"k": "line", "who": "GUEST", "tag": "", "segs": [{"s": "And she used to be a designer, abi? I remember the wedding brochure."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Yes, I trained in interior design. I've been thinking of taking small—"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "cutting in smoothly"}, {"s": "She's been thinking of making my life difficult."}, {"d": "laughter"}, {"s": "Chloe, darling, bring the dessert."}]}, {"k": "act", "t": "LATER. The guests are gone. Kunle loosens his tie."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "\"Small projects\"? You announced that in front of MY guests?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I was only answering the question."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "You always have an explanation."}, {"d": "He leaves."}]}, {"k": "act", "t": "Chloe sits on the edge of the bed in the dark and opens FRIDAY STRANGER."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma, can somebody make you feel useless without ever saying the word \"useless\"?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Yes. How someone treats you matters as much as the words they use."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "And what if everybody thinks he's wonderful?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "They're judging the man they see at dinner. You're living with the man you know at night."}]}, {"k": "act", "t": "A long pause. Chloe's thumb shakes."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I think I'm afraid of my husband."}]}, {"k": "act", "t": "In Lagos, Emma puts down her plate."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Chloe. Are you and the children safe right now?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Yes. He's asleep."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Then you don't have to decide anything tonight. But you shouldn't have to live afraid. Is there one person in Abuja you trust?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I used to have friends."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Maybe one of them is still waiting to hear from you."}]}]}, {"n": 19, "title": "HALIMA", "slug": "INT. CAFÉ, WUSE 2, ABUJA — DAY", "time": "16:23–17:13", "items": [{"k": "act", "t": "Chloe sits across from HALIMA, her old university friend, with sunglasses on indoors."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "Three years, Chloe. Three years, and suddenly you call me at 7 a.m. and say \"please, can we see\"?"}, {"d": "beat"}, {"s": "Take off the glasses."}]}, {"k": "act", "t": "Chloe slowly removes them. There's a faded bruise on her cheekbone. Halima goes quiet."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"d": "softly"}, {"s": "How long?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Since Tobi was born."}, {"d": "beat"}, {"s": "Sometimes I don't even know if it's bad enough to complain about."}]}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "You don't have to prove your pain to me."}, {"d": "She takes Chloe's hand."}, {"s": "Why didn't you tell me?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Because I thought you'd ask me why I stayed."}]}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"s": "I'm not asking why you stayed. I'm asking how I can help you."}, {"d": "beat"}, {"s": "Who told you to call me?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "a small smile"}, {"s": "A stranger who answered a wrong number."}]}]}, {"n": 20, "title": "THE BYLINE", "slug": "INT. THE LAGOS HERALD — NEWSROOM, IKEJA — DAY", "time": "17:13–18:56", "items": [{"k": "act", "t": "A crowded, noisy newsroom with old computers and a broken air conditioner. Emma, thinner and still fragile but working, stands at the desk of MR. BAYO ADEKOLA, the editor. He holds her printed article."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Sir, it's the hospital story. Three weeks of interviews. The patients' families are ready to go on record."}]}, {"k": "line", "who": "BAYO", "tag": "", "segs": [{"d": "tossing it into the bin"}, {"s": "Nobody wants to read sad stories about poor people, Emma."}, {"d": "beat"}, {"s": "Tayo will rewrite it. His name goes on it."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "steady"}, {"s": "Sir, that's my story. And it's been four months since we were paid."}]}, {"k": "line", "who": "BAYO", "tag": "", "segs": [{"d": "loud, so the whole newsroom hears"}, {"s": "Ten years in this office, and you're still begging for your own name on your own story? If you don't like it, the gate is open."}]}, {"k": "act", "t": "Silence in the newsroom. Emma picks her article out of the bin, smooths it flat and walks back to her desk. Bisi squeezes her hand as she passes. At her desk, Emma opens the contact she saved weeks ago: \"RICE WOMAN.\""}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Bad day. My editor binned my story in front of everybody. Ten years. I'm starting to think I'm just not good enough."}]}, {"k": "act", "t": "In Abuja, Chloe reads it at the kitchen counter."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Then write the next one. And the next one. Let them get tired before you do."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "That's my kind of advice. Where did you steal it?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "From a stranger who told me not to let anybody put my portfolio back on the shelf."}, {"d": "beat"}, {"s": "Don't let them put you in the bin, Emma."}]}, {"k": "act", "t": "Emma looks at the crumpled article for a long time. Then, slowly, she types something she has never told anyone."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Can I tell you something? Some nights I don't want to wake up, Chloe. Since my sister died."}]}, {"k": "act", "t": "In Abuja, Chloe goes completely still. She puts down the spoon."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma. Thank you for telling me. Are you safe right now?"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Yes. I'm at work. Bisi is here."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Then promise me something. Talk to a doctor. This week."}, {"d": "beat"}, {"s": "You told me to call Halima. Now I'm telling you to see somebody."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"d": "after a long pause"}, {"s": "Okay. I promise."}]}, {"k": "act", "t": "Emma opens a new document and starts typing the next story."}]}, {"n": 21, "title": "DR. IFEOMA", "slug": "INT. COUNSELLING ROOM, LAGOS — DAY — SAME WEEK", "time": "18:56–20:18", "items": [{"k": "act", "t": "A quiet room with plants and a box of tissues. DR. IFEOMA, a calm woman in her fifties, sits across from Emma. Bisi waits outside."}, {"k": "line", "who": "DR. IFEOMA", "tag": "", "segs": [{"s": "Bisi drove you here. But you're the one who walked in. That matters."}, {"d": "beat"}, {"s": "Tell me about that Thursday night."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "looking at her hands"}, {"s": "My sister fought cancer for two years. She fought for every single day. And I'm the one who gave up."}, {"d": "beat"}, {"s": "What kind of sister does that?"}]}, {"k": "line", "who": "DR. IFEOMA", "tag": "", "segs": [{"s": "A sister who's been carrying grief alone for three months, with no sleep and no salary."}, {"d": "gently"}, {"s": "Grief like that can make the dark feel like the only room in the house. It isn't."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "a small, surprised laugh"}, {"s": "That's funny. My friend in Abuja says her garage is the only room in her house where nobody listens."}]}, {"k": "line", "who": "DR. IFEOMA", "tag": "", "segs": [{"s": "Your friend in Abuja?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "A stranger. She texted me by mistake the afternoon I woke up. About rice."}, {"d": "beat"}, {"s": "She's the one who told me to come here. She said, \"You told me to call Halima. I'm telling you to see somebody.\""}]}, {"k": "line", "who": "DR. IFEOMA", "tag": "", "segs": [{"d": "smiling"}, {"s": "Then let's make sure that stranger gets to keep texting you for a very long time."}, {"d": "beat"}, {"s": "Same time next week, Emma?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "after a long pause"}, {"s": "Same time next week."}]}]}, {"n": 22, "title": "\"WHO GAVE YOU PERMISSION?\"", "slug": "INT. ADEYEMI MANSION — DINING ROOM — NIGHT — WEEKS LATER", "time": "20:18–21:01", "items": [{"k": "act", "t": "Design sketches cover the dining table. Chloe has a small paid job: a client's living room. Kunle walks in and picks up a sketch."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "What is this?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "A proposal. Halima's cousin is paying me to redesign her living room."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Paying you?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Two hundred thousand naira."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "laughing coldly"}, {"s": "You think because somebody gave you small money, you can do whatever you want?"}, {"d": "He crumples the sketch."}, {"s": "Who gave you permission?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "standing"}, {"s": "I didn't know I needed permission to use my own hands."}]}, {"k": "act", "t": "Silence. She has never answered back before. Kunle stares at her as if a stranger has walked into his house."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "quietly"}, {"s": "Who is putting this nonsense in your head?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Nobody."}, {"d": "beat"}, {"s": "Me."}]}, {"k": "act", "t": "He grabs her arm hard. She cries out. The children's door creaks open. Ada is watching."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "letting go, smiling at Ada"}, {"s": "Go back to bed, princess."}, {"d": "to Chloe, whispering"}, {"s": "We'll finish this when I come back tomorrow."}]}, {"k": "act", "t": "He walks out. Chloe holds her arm and shakes."}]}, {"n": 23, "title": "SHE IS LAUGHING", "slug": "EXT/INT. ADEYEMI MANSION — FRONT DOOR / SITTING ROOM — NEXT EVENING", "time": "21:01–21:26", "items": [{"k": "act", "t": "Kunle comes home early, expecting to find a broken woman. His key is in the lock when he hears something through the door. Laughter. Chloe's laughter, loud and free."}, {"k": "line", "who": "CHLOE", "tag": "O.S.", "segs": [{"d": "on the phone, laughing"}, {"s": "No! Emma, you didn't! You told your boss THAT?"}]}, {"k": "act", "t": "Kunle slowly pushes the door open. Chloe sits on the sofa with the phone at her ear and Tobi asleep on her lap. She sees him, and her laughter stops."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "into the phone"}, {"s": "I'll call you back."}, {"d": "She hangs up."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "calmly, putting his bag down"}, {"s": "Who was that?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Halima."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Halima."}, {"d": "He holds out his hand."}, {"s": "Open your phone."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Kunle—"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Open. It."}]}, {"k": "act", "t": "Chloe unlocks it and gives it to him. Her heart is pounding. He scrolls. The call log shows \"FRIDAY STRANGER — 47 min.\" He looks at the screen for a long time. Then he hands the phone back with a pleasant smile."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Tell Halima I said hello."}]}, {"k": "act", "t": "He goes upstairs whistling. Chloe sits frozen. That smile frightens her more than any slap."}]}, {"n": 24, "title": "3:07 A.M.", "slug": "INT. MASTER BEDROOM — 3:07 AM", "time": "21:26–22:09", "items": [{"k": "act", "t": "Darkness. Chloe sleeps on her side, her phone on the bedside table. Kunle sits up silently. He lifts her limp hand and presses her thumb onto the phone. It unlocks."}, {"k": "act", "t": "He opens the chat with FRIDAY STRANGER. Months of messages. He reads them in a whisper."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "reading"}, {"s": "\"You're living with the man you know at night.\""}, {"d": "beat"}, {"s": "\"Don't let anybody put it back on that shelf.\""}, {"d": "His jaw tightens."}, {"s": "\"Emma.\""}, {"d": "He sneers."}, {"s": "Emmanuel. A man. Of course. A man."}]}, {"k": "act", "t": "He types slowly, with a terrible calm."}, {"k": "line", "who": "KUNLE", "tag": "TEXT, AS CHLOE", "segs": [{"s": "Stop texting me. You are not my friend. You are a useless man with no home of your own, poking your nose into my marriage. My husband is a good man. I'm tired of your poison. Don't ever contact me again. Lose my number."}]}, {"k": "act", "t": "Send. Then he deletes the entire chat and blocks the number. He puts the phone back exactly where it was and lies down. In the dark, his eyes stay open."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Goodnight, Emmanuel."}]}]}, {"n": 25, "title": "\"ARE WE FIGHTING?\"", "slug": "INT. EMMA'S APARTMENT, LAGOS — 6:40 AM", "time": "22:09–22:59", "items": [{"k": "act", "t": "Emma wakes up and reaches for her phone. She reads the message once, then sits up and reads it again."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering"}, {"s": "\"A useless man\"?"}]}, {"k": "act", "t": "She calls Bisi."}, {"k": "line", "who": "BISI", "tag": "ON PHONE", "segs": [{"d": "sleepy"}, {"s": "Who died?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Bisi. Chloe sent me something at three in the morning. \"You are not my friend. Lose my number.\""}]}, {"k": "line", "who": "BISI", "tag": "ON PHONE", "segs": [{"d": "waking up"}, {"s": "Ah. What did you do?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Nothing! We were laughing yesterday. Forty-seven minutes!"}, {"d": "beat"}, {"s": "And she called me a MAN. \"A useless man with no home of your own.\" Bisi, she knows I'm a woman. We've talked on the phone."}]}, {"k": "line", "who": "BISI", "tag": "ON PHONE", "segs": [{"d": "slowly"}, {"s": "So why would she call you a man?"}]}, {"k": "act", "t": "Emma goes very still."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Unless she didn't write it."}]}, {"k": "act", "t": "She types fast."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Chloe? Are we fighting? What did I do? Please talk to me."}]}, {"k": "act", "t": "One grey tick. Not delivered. She calls. A recorded voice says: \"The number you are calling is not available at the moment.\""}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "barely audible"}, {"s": "She blocked me."}]}]}, {"n": 26, "title": "\"WHY DO YOU EVEN CARE?\"", "slug": "INT. EMMA'S APARTMENT, LAGOS — NIGHT — SAME DAY", "time": "22:59–24:21", "items": [{"k": "act", "t": "Emma sits on the floor against her sofa holding the framed photo of Ronke. Bisi has come over with food that nobody is eating."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "Emma, I have to ask. Why do you care this much? You've never even seen this woman's face. And she's blocked you."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "quietly"}, {"s": "Because you don't know what her first text was, Bisi."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "\"Jollof or fried rice.\" Everybody in Lagos knows that story."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "shaking her head"}, {"s": "You know the joke. You don't know the time."}, {"d": "beat"}, {"s": "It came at 2:17 the afternoon after that Thursday. I'd just opened my eyes on that floor."}, {"d": "She points."}, {"s": "Right there. I didn't want to be alive. And my phone buzzed, and a stranger was asking me about rice like the world still had ordinary problems in it."}]}, {"k": "act", "t": "Bisi slowly puts down her plate."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I laughed, Bisi. For the first time since Ronke's funeral."}, {"d": "Her voice breaks."}, {"s": "She doesn't even know she saved my life. She thinks I saved hers."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "her eyes wet"}, {"s": "Then tell her."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I can't. She's blocked me. Somebody called me \"a useless man\" from her phone."}, {"d": "She looks at the photo."}, {"s": "Ronke never let anybody shut a door on me."}, {"d": "beat"}, {"s": "I won't let anybody shut this one."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "sliding Emma's office phone across the floor"}, {"s": "Then don't knock on the same door. Use another number."}]}]}, {"n": 27, "title": "THE MONTH OF SILENCE", "slug": "MONTAGE — ABUJA AND LAGOS — FOUR FRIDAYS", "time": "24:21–25:08", "items": [{"k": "act", "t": "FRIDAY ONE, 2:19 PM. Chloe opens her phone. The chat with Friday Stranger is gone, and so is the contact."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "scrolling, panicking"}, {"s": "Where is it? Where did it go?"}]}, {"k": "act", "t": "She tries to call the number from memory. \"This number cannot receive calls from you.\""}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "She blocked me."}, {"d": "beat"}, {"s": "She got tired of me. Everybody gets tired of me."}]}, {"k": "act", "t": "FRIDAY TWO. Lagos. Emma sits at her desk staring at the phone, then puts it face down."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "Still nothing?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "quietly"}, {"s": "Maybe she was right. Maybe I'm just a stranger poking my nose in."}]}, {"k": "act", "t": "FRIDAY THREE. Abuja dinner table. Chloe eats in silence with her eyes down. Kunle watches her and smiles."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "You've been very quiet lately, darling."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I'm just tired."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "pleased"}, {"s": "I like it."}, {"d": "beat"}, {"s": "This is the woman I married."}]}, {"k": "act", "t": "FRIDAY FOUR. Kunle on the phone in his office, laughing with Nkem."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "She's back to normal. No more laughing on the phone. No more \"proposals.\""}, {"d": "He leans back."}, {"s": "I told you, Nkem. Every candle can be dimmed. You just have to find the right wind."}]}]}, {"n": 28, "title": "THE ARCHIVE", "slug": "INT. ADEYEMI MANSION — CHILDREN'S ROOM / KITCHEN — DAY", "time": "25:08–26:02", "items": [{"k": "act", "t": "LAGOS, THE NIGHT BEFORE. Emma sits on her bed, takes out her old SIM and puts in her office line."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "to herself"}, {"s": "If she hates me, she hates me. But I won't be ghosted by a three-in-the-morning message."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Chloe, it's Emma, from my office line. Whatever I did, I'm sorry. But that message didn't sound like you. You know I'm a woman. If you're safe, you don't have to reply. I just need you to know I'm still here."}]}, {"k": "act", "t": "ABUJA, 3 A.M. Kunle, half asleep, sees Chloe's phone light up. A new number. He reads the preview. He archives the chat, blocks the number and goes back to sleep."}, {"k": "act", "t": "THE NEXT DAY. Ada sits on her bed playing a game on Mummy's phone. She taps the wrong button and a hidden folder opens: \"ARCHIVED (1).\""}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy! Who is \"Emma\"? There's a secret message in your phone!"}]}, {"k": "act", "t": "Chloe drops the plate she's washing. It shatters. She runs and grabs the phone. She reads Emma's message, then reads it again. Her face crumbles."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "\"That message didn't sound like you.\""}, {"d": "beat"}, {"s": "What message?"}]}, {"k": "act", "t": "She scrolls with shaking hands. Then she understands. The deleted chat. The block. Three o'clock in the morning. Her husband's pleasant smile."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "her hand over her mouth"}, {"s": "Kunle."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy, are you crying because of the secret message?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "kneeling and hugging her tight"}, {"s": "No, baby. I'm crying because somebody didn't give up on Mummy."}]}]}, {"n": 29, "title": "\"IT WAS MY HUSBAND\"", "slug": "INT. HALIMA'S CAR — PARKED OUTSIDE A SUPERMARKET, ABUJA — DAY", "time": "26:02–27:10", "items": [{"k": "act", "t": "Chloe sits in Halima's car on Halima's phone, crying. Halima sits beside her and holds her hand."}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"s": "Hello? Who is this?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "barely able to speak"}, {"s": "Emma. It's me."}]}, {"k": "act", "t": "Silence on the line."}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"d": "quietly"}, {"s": "Chloe."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I never sent that message. I swear to God, I never sent it. He opened my phone while I was asleep. He used my finger. He deleted everything and blocked you."}, {"d": "sobbing"}, {"s": "I thought you left me. For a whole month, I thought you got tired of me."}]}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"d": "her voice breaking"}, {"s": "And I thought you got tired of me."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I'm so sorry."}]}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"s": "Stop. Don't you dare apologise for something HE did."}, {"d": "beat"}, {"s": "Chloe, listen to me. He called me a man. He thinks I'm a man."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "stunned"}, {"s": "What?"}]}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"s": "\"A useless man with no home of your own.\" That's what he wrote. He thinks you've been talking to a boyfriend for a year."}, {"d": "beat"}, {"s": "That's why he hasn't come for you yet. He's looking for a man."}]}, {"k": "act", "t": "Chloe and Halima look at each other in horror."}, {"k": "line", "who": "HALIMA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Chloe, that man is dangerous."}]}]}, {"n": 30, "title": "\"DIVORCE HIM\"", "slug": "INT. CHLOE'S BATHROOM, ABUJA / INT. EMMA'S CAR, LAGOS — NIGHT — INTERCUT", "time": "27:10–28:19", "items": [{"k": "act", "t": "Chloe sits on the bathroom floor with the shower running to drown out her voice, on a secret second phone Halima gave her. Emma is parked in her car in Lagos traffic."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I've been quiet for a year. I've been careful. I've said \"one day at a time.\" But Chloe, I'm going to say it plainly once, and then you can be angry with me."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Say it."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Divorce him."}]}, {"k": "act", "t": "A long silence. Only the shower running."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Divorce? Emma, this is Abuja. He's Dr. Kunle Adeyemi. He knows commissioners. Judges come to his hospital. He told me if I leave, I'll never see my children again."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "That's what men like him say so you'll never check if it's true."}, {"d": "beat"}, {"s": "Talk to a lawyer. Just talk. Talking isn't leaving. But please, don't stay because you're scared of the door."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "crying softly"}, {"s": "And if he finds out?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Then he finds out that his wife has people now."}]}, {"k": "act", "t": "A bang on the bathroom door. Chloe freezes."}, {"k": "line", "who": "KUNLE", "tag": "O.S.", "segs": [{"s": "Chloe! Who are you talking to in there?"}]}, {"k": "act", "t": "Chloe hides the phone inside a towel. Emma hears it and holds her breath in Lagos."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "steadying her voice"}, {"s": "Myself. I'm praying."}]}, {"k": "line", "who": "KUNLE", "tag": "O.S.", "segs": [{"d": "after a pause"}, {"s": "Pray faster. I want to use the bathroom."}]}]}, {"n": 31, "title": "\"WHO IS EMMANUEL?\"", "slug": "INT. ADEYEMI MANSION — SITTING ROOM — NIGHT — DAYS LATER", "time": "28:19–29:39", "items": [{"k": "act", "t": "Kunle sits on the sofa holding the second phone. He found it in the towel cupboard. Chloe stands frozen at the foot of the stairs."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "very calm"}, {"s": "A second phone. In my house."}, {"d": "He holds it up."}, {"s": "Who bought it?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Kunle, please—"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "WHO IS EMMANUEL?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "confused, terrified"}, {"s": "Who?"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Don't play with me! \"Emma\"! The man you've been whispering to for a year! The man who told you to start \"designing\"! I read everything, Chloe. Everything!"}]}, {"k": "act", "t": "He dials the only number in the second phone and puts it on speaker. It rings. Chloe covers her mouth."}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"s": "Chloe? Are you okay?"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "snarling into the phone"}, {"s": "This is her HUSBAND. Listen to me, Emmanuel. You think you can break my home from Lagos? I'm going to find you. I'm going to come to Lagos, and I'm going to deal with you like the small boy you are."}]}, {"k": "act", "t": "A pause on the line. Then a calm female voice."}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"s": "My name is Emma Williams. I'm a woman, Dr. Adeyemi. You've been jealous of the wrong person for a year."}, {"d": "beat"}, {"s": "And you're the man who pours rice on his wife and beats her when nobody's looking."}]}, {"k": "act", "t": "Kunle's face changes completely. He looks at Chloe."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "to the phone, shaken, then furious"}, {"s": "You don't know anything about my home."}]}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"s": "I know enough. You said you're coming to Lagos? Come. The Lagos Herald, Allen Avenue, Ikeja, fourth floor. I'll be waiting for you."}]}, {"k": "act", "t": "Click. Kunle slowly lowers the phone. The house is completely silent."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "quietly, to Chloe"}, {"s": "You told a stranger about the rice."}]}]}, {"n": 32, "title": "THE TICKET", "slug": "INT. HOSPITAL — RITA'S DESK / INT. HALIMA'S CAR — INTERCUT — NEXT MORNING", "time": "29:39–30:59", "items": [{"k": "act", "t": "Rita sits at her desk, glancing at Kunle's closed door. She takes out her personal phone and dials with shaking fingers. In Halima's car, Chloe answers on the secret phone."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Hello?"}]}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Madam, it's Rita. From the hospital. Please don't say my name out loud."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "alarmed"}, {"s": "Rita? What's wrong?"}]}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"s": "He told me to cancel all his appointments for tomorrow. He's bought a ticket. Abuja to Lagos, 7 a.m."}, {"d": "beat"}, {"s": "Madam, he asked me to search the internet for \"The Lagos Herald, Ikeja.\" He printed the address."}]}, {"k": "act", "t": "Chloe's hand flies to her mouth."}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"s": "And madam… he was holding his golf club when he said it. I don't know what he's going to do."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "barely breathing"}, {"s": "Why are you telling me this, Rita?"}]}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"d": "after a pause"}, {"s": "Because I cleaned that rice off the carpet, madam. And I've never forgiven myself for staying quiet."}]}, {"k": "act", "t": "She hangs up. Chloe immediately dials Emma."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Emma, he's coming. Tomorrow morning. He has your address. Please, please don't be there. Stay home. Go to Bisi's. Anywhere."}]}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"d": "a long silence"}, {"s": "Chloe. I'm the one who told him to come."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Emma, you don't know him!"}]}, {"k": "line", "who": "EMMA", "tag": "ON PHONE", "segs": [{"s": "No. But I know you."}, {"d": "beat"}, {"s": "For ten months, you've been scared alone. Tomorrow, he finds out what it feels like when somebody isn't scared of him."}]}]}, {"n": 33, "title": "FOURTH FLOOR", "slug": "INT. THE LAGOS HERALD, IKEJA — NEWSROOM RECEPTION — DAY — TWO DAYS LATER", "time": "30:59–32:18", "items": [{"k": "act", "t": "A crowded newsroom, with reporters, ringing phones and cameras everywhere. Kunle storms in, still in his white coat from the flight, and slams his hand on the reception desk."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Emma Williams. NOW."}]}, {"k": "line", "who": "SECURITY GUARD", "tag": "", "segs": [{"s": "Sir, please calm down—"}]}, {"k": "act", "t": "Emma walks out of the lift. She is calm, but her hands are folded tight to stop them shaking. Behind her, Bisi holds up her phone, already recording."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You came."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "looking her up and down"}, {"s": "So you're the \"friend.\" You're the one filling my wife's head with rubbish."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I'm the one she texted by mistake. And I'm the one she told the truth to."}, {"d": "beat"}, {"s": "I'm also a journalist, Doctor. Ten years. Say what you came to say, carefully."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "stepping closer"}, {"s": "Stay away from my family. You don't know her. You've never even seen her face."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "No, I haven't."}, {"d": "beat"}, {"s": "But I've heard her apologise four times in one message for things she didn't do. I've heard her laugh like it's illegal. And I know about the rice."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "losing control, loud enough for the whole office"}, {"s": "She is MY wife! I'll discipline her the way I like! In my house, I am the law!"}]}, {"k": "act", "t": "Silence. Fifty staff are watching. Emma turns slightly to Bisi's phone."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "very quietly"}, {"s": "Can you say that again, slowly, Doctor? For the camera."}]}, {"k": "act", "t": "Kunle sees the phone and lunges for it. The guard and two staff grab him."}, {"k": "line", "who": "SECURITY GUARD", "tag": "", "segs": [{"s": "Oga! Not here! Out! OUT!"}]}, {"k": "act", "t": "They drag him to the door. He shouts over his shoulder."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "You'll regret this! Both of you will regret this!"}]}, {"k": "act", "t": "The doors close. The office is silent. Emma's knees give way, and Bisi catches her."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "shaking"}, {"s": "Bisi, I've just faced her husband."}, {"d": "beat"}, {"s": "And I've never even seen her face."}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"d": "holding up the phone"}, {"s": "We have everything. Every word."}]}]}, {"n": 34, "title": "THE NIGHT HE CAME BACK", "slug": "INT. ADEYEMI MANSION — NIGHT — SAME DAY", "time": "32:18–33:20", "items": [{"k": "act", "t": "11:48 p.m. Headlights sweep the window. Chloe stands at the curtain. Ada is in the doorway holding Tobi's hand."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Mummy, is Daddy angry?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "calm, too calm"}, {"s": "Ada, listen to me. Take Tobi into Mummy's room. Lock the door. Don't open it for anybody but me. Do you understand?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Yes, Mummy."}]}, {"k": "act", "t": "The front door slams. Kunle's voice fills the house."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "CHLOE! You sent a woman to disgrace me in front of the whole of Lagos?!"}]}, {"k": "act", "t": "Chloe runs upstairs into the bedroom and locks it behind her. Her hands are shaking so badly she can barely press the buttons on the secret phone."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "Halima. It's tonight. Come now. Please."}]}, {"k": "line", "who": "HALIMA", "tag": "ON PHONE", "segs": [{"s": "I'm already in the car. Garba is with me. Ten minutes. Don't open that door."}]}, {"k": "act", "t": "BANG. BANG. Kunle pounds on the bedroom door."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Open this door! It's MY door! In MY house!"}]}, {"k": "act", "t": "Tobi starts crying. Ada covers his mouth gently and holds him. Chloe pulls out a suitcase she packed weeks ago and hid under the bed."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Chloe! If you make me break this door—"}]}, {"k": "act", "t": "Headlights. A car horn blasts at the gate. Then another voice, a man's, deep and loud."}, {"k": "line", "who": "GARBA", "tag": "O.S.", "segs": [{"s": "DR. ADEYEMI! It's Garba! Halima's husband! I've called the police at Asokoro station. They're on their way."}]}, {"k": "act", "t": "The banging stops. Silence."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "opening the door, suitcase in one hand and Tobi in the other"}, {"s": "Move, Kunle."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "blocking the corridor, quietly"}, {"s": "If you walk out of that gate tonight, you'll never come back."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "looking straight past him"}, {"s": "I'm not coming back."}]}, {"k": "act", "t": "She walks past him with Ada holding her dress. He doesn't touch her. Every neighbour's light is now on. The gate closes behind them."}]}, {"n": 35, "title": "THREE FRIDAYS", "slug": "INT. EMMA'S APARTMENT, LAGOS / INT. HALIMA'S GUEST ROOM, ABUJA — INTERCUT", "time": "33:20–34:10", "items": [{"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Morning, Abuja. What's the rice controversy today?"}]}, {"k": "act", "t": "No reply. The next Friday."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Chloe, after what happened in my office, I'm scared. Just one word. Please."}]}, {"k": "act", "t": "No reply. The third Friday. Emma paces her living room and calls Bisi."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "It's been three weeks, Bisi. What if he… what if I made it worse? What if I got her hurt by—"}]}, {"k": "act", "t": "Her phone buzzes. A new number."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "It's me. New number. I'm still here."}]}, {"k": "act", "t": "Emma sits down on the floor."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "The children and I are safe. We left that night. We're at Halima's."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"d": "typing through tears"}, {"s": "Thank God. Thank God. How are you holding up?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Scared. Confused. I cried the whole night."}, {"d": "beat"}, {"s": "But Emma, I slept. I slept without listening for his car."}]}]}, {"n": 36, "title": "MAMA KUNLE", "slug": "INT. HALIMA'S HOUSE, ABUJA — SITTING ROOM — DAY", "time": "34:10–35:10", "items": [{"k": "act", "t": "A knock. Halima opens the door and steps back. MAMA KUNLE (65), elegant and stern, walks in. Chloe stands up, terrified, and pulls Ada behind her."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Mama."}, {"d": "beat"}, {"s": "Please. If he sent you to bring me back—"}]}, {"k": "line", "who": "MAMA KUNLE", "tag": "", "segs": [{"s": "Sit down, Chloe."}]}, {"k": "act", "t": "Chloe sits. Mama Kunle sits opposite her and looks at her for a long time."}, {"k": "line", "who": "MAMA KUNLE", "tag": "", "segs": [{"s": "He called me last night. He said you've run away with a man from Lagos."}, {"d": "beat"}, {"s": "Then he said the man was a woman."}, {"d": "beat"}, {"s": "Then he cried. Then he shouted."}, {"d": "She removes her glasses."}, {"s": "I know that sound, Chloe. I lived with it for thirty-one years. His father."}]}, {"k": "act", "t": "Chloe's eyes fill with tears."}, {"k": "line", "who": "MAMA KUNLE", "tag": "", "segs": [{"s": "I stayed because everybody told me to stay. Pastor. My mother. My in-laws."}, {"d": "beat"}, {"s": "And I raised a boy in that house who learned that a woman is something you own."}]}, {"k": "act", "t": "She leans forward and takes Chloe's hands."}, {"k": "line", "who": "MAMA KUNLE", "tag": "", "segs": [{"s": "Don't you dare go back."}, {"d": "beat"}, {"s": "And if you need somebody to stand in that court and tell them what I know, I'm his mother. I'll stand."}]}]}, {"n": 37, "title": "\"THREATS ARE NOT COURT ORDERS\"", "slug": "INT. BARRISTER ZAINAB BELLO'S CHAMBERS, ABUJA — DAY", "time": "35:10–36:04", "items": [{"k": "act", "t": "BARRISTER ZAINAB BELLO, sharp and calm, flips through a thick file. Chloe sits across from her."}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"s": "He's filed a response. He says you abandoned the matrimonial home, you're mentally unstable, and you've been \"manipulated by a stranger on the phone.\" He wants full custody."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "trembling"}, {"s": "He said he'd make sure I never see the children again."}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"s": "Threats are not court orders, Chloe."}, {"d": "She taps the file."}, {"s": "Now. What do we have?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Emma's video from Lagos. \"I'll discipline her the way I like.\" Hospital records from when he hurt my arm. Halima."}, {"d": "beat"}, {"s": "And his mother."}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"d": "looking up sharply"}, {"s": "His own mother?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "His own mother."}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"d": "a slow smile"}, {"s": "He knows important people, Chloe. Good. Let's see how important they feel when his mother walks into that courtroom."}]}]}, {"n": 38, "title": "THE WITNESS", "slug": "INT. FEDERAL HIGH COURT, ABUJA — COURTROOM — DAY", "time": "36:04–38:45", "items": [{"k": "act", "t": "A packed courtroom. Kunle sits with his lawyer, MR. OKORO, in an expensive agbada, calm and confident. Chloe sits with Zainab. Halima and Mama Kunle are in the gallery."}, {"k": "line", "who": "MR. OKORO", "tag": "", "segs": [{"s": "My Lord, Dr. Adeyemi is one of the most respected physicians in Abuja. To prove his gentle character, we call a witness who has worked beside him for eight years. His secretary, Miss Rita Okafor."}]}, {"k": "act", "t": "Rita walks to the witness box nervously. Kunle smiles at her and gives her a small nod."}, {"k": "line", "who": "MR. OKORO", "tag": "", "segs": [{"s": "Miss Okafor, in eight years, have you ever seen Dr. Adeyemi be violent toward anyone?"}]}, {"k": "act", "t": "Rita looks
