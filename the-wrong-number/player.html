at Kunle, then at Chloe. A long pause."}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"d": "quietly"}, {"s": "Yes."}]}, {"k": "act", "t": "Gasps around the courtroom. Kunle's smile freezes."}, {"k": "line", "who": "MR. OKORO", "tag": "", "segs": [{"d": "confused"}, {"s": "I… I'm sorry?"}]}, {"k": "line", "who": "RITA", "tag": "", "segs": [{"d": "her voice getting stronger"}, {"s": "Two years ago, Mrs. Adeyemi brought his lunch to the office. She drove his car because the driver was buying fuel. He poured the hot rice on her head. In front of me. Then he told me to call the cleaners."}, {"d": "beat"}, {"s": "I cleaned that rice off the carpet myself, My Lord. I've been ashamed every day since."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "standing"}, {"s": "Rita! Are you mad?"}]}, {"k": "line", "who": "JUDGE", "tag": "", "segs": [{"s": "Sit DOWN, Dr. Adeyemi."}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"d": "rising calmly"}, {"s": "My Lord, the respondent says he's a gentle man. I'd like the court to see how gentle. Exhibit C. Recorded in Lagos."}]}, {"k": "act", "t": "The video plays on the courtroom screen. Kunle is shouting in the Lagos office: \"She is MY wife! I'll discipline her the way I like! In my house, I am the law!\""}, {"k": "act", "t": "Silence. Then Mama Kunle stands up in the gallery."}, {"k": "line", "who": "MAMA KUNLE", "tag": "", "segs": [{"s": "My Lord, I'm his mother."}, {"d": "Her voice shakes but doesn't break."}, {"s": "I'd like to speak."}]}, {"k": "line", "who": "JUDGE", "tag": "", "segs": [{"d": "after a pause"}, {"s": "Come forward, madam."}]}, {"k": "act", "t": "Mama Kunle walks slowly to the witness box. Kunle stands up."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Mama, what are you doing? Mama, sit down!"}]}, {"k": "line", "who": "MAMA KUNLE", "tag": "", "segs": [{"d": "not looking at him"}, {"s": "I sat down for thirty-one years, Kunle."}, {"d": "to the judge"}, {"s": "My Lord, my husband beat me in front of this boy until he was fifteen. And every time, I told him, \"Daddy is just tired.\""}, {"d": "beat"}, {"s": "I taught my son that a man's anger is a woman's job to manage."}, {"d": "She finally looks at Kunle."}, {"s": "I was wrong. And my daughter-in-law has paid for my lesson."}]}, {"k": "act", "t": "Kunle sits down slowly, like a man whose legs have stopped working."}, {"k": "line", "who": "MAMA KUNLE", "tag": "", "segs": [{"s": "Give those children to their mother, My Lord. So that my granddaughter never has to learn what I learned."}]}, {"k": "act", "t": "LATER. Chloe stands in the witness box. Mr. Okoro circles her like a hawk."}, {"k": "line", "who": "MR. OKORO", "tag": "", "segs": [{"s": "Mrs. Adeyemi, isn't it true that for an entire year you were secretly texting a stranger? A person you have never even met?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Yes."}]}, {"k": "line", "who": "MR. OKORO", "tag": "", "segs": [{"s": "A stranger who told you to \"divorce\" your husband. Who told you to leave a beautiful home, a respected man, a comfortable life."}, {"d": "to the judge"}, {"s": "My Lord, this woman was manipulated by a voice on a phone."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "steady"}, {"s": "May I answer, My Lord?"}]}, {"k": "line", "who": "JUDGE", "tag": "", "segs": [{"s": "Go on."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "For nine years, I lived with a man everyone could see. And I disappeared."}, {"d": "beat"}, {"s": "For one year, I talked to a woman nobody could see. And I came back."}, {"d": "She looks at Kunle."}, {"s": "So tell me, sir. Which of them was manipulating me?"}]}, {"k": "act", "t": "The courtroom is silent. Mr. Okoro opens his mouth, then closes it."}, {"k": "line", "who": "MR. OKORO", "tag": "", "segs": [{"d": "quietly"}, {"s": "No further questions, My Lord."}]}]}, {"n": 39, "title": "\"LET'S GO HOME\"", "slug": "INT. COURTROOM → EXT. COURT STEPS — DAY — WEEKS LATER", "time": "38:45–39:45", "items": [{"k": "line", "who": "JUDGE", "tag": "", "segs": [{"s": "Having considered all the evidence and the welfare of the children, this court dissolves the marriage. Primary custody of Ada and Tobi is granted to the petitioner, Mrs. Chloe Adeyemi, with supervised access for the father."}]}, {"k": "act", "t": "Chloe sits very still. Zainab touches her arm."}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"s": "Chloe?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "whispering"}, {"s": "It's over?"}]}, {"k": "line", "who": "ZAINAB", "tag": "", "segs": [{"s": "This part is over. The next part is yours."}]}, {"k": "act", "t": "Kunle walks past their table. He stops and leans down."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "low"}, {"s": "You think this is finished?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "without looking up"}, {"s": "No, Kunle. I think it's started."}]}, {"k": "act", "t": "OUTSIDE. Bright Abuja sun. Ada and Tobi break away from Halima and run into Chloe's arms."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Mummy, can we go home now?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "holding them both"}, {"s": "Yes, my darlings. Let's go home. Our own home."}]}, {"k": "act", "t": "THAT NIGHT."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "We have a home. The children are with me. We did it."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "YOU did it, Chloe. You, Halima, Zainab, his mother, Rita. Everybody who stood up."}, {"d": "beat"}, {"s": "I'm so proud of you, I'm crying in a Lagos traffic jam."}]}]}, {"n": 40, "title": "\"WHY DID YOU POUR RICE ON MUMMY?\"", "slug": "INT. HALIMA'S HOUSE — SITTING ROOM — SUPERVISED VISIT — DAY", "time": "39:45–40:40", "items": [{"k": "act", "t": "Kunle sits on Halima's sofa with expensive gifts piled next to him: a tablet, a toy car, a designer bag for Ada. Halima watches from the dining table. Tobi plays with the toy car. Ada stands in front of her father with her arms folded and doesn't touch her gift."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "smiling"}, {"s": "Princess. Don't you like the bag? It's from Dubai."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Daddy, can I ask you a question?"}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Anything, my princess."}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Why did you pour rice on Mummy?"}]}, {"k": "act", "t": "Silence. Halima puts down her cup. Kunle's smile freezes."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "carefully"}, {"s": "Who told you that? Did your mother tell you that?"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Nobody told me. I saw the rice in her hair. You thought I was too small."}, {"d": "beat"}, {"s": "I was seven. I'm nine now."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Ada, sometimes grown-ups—"}]}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "You always said a man who can't be gentle with the weak has no business wearing a white coat. I heard you practise it in the mirror."}, {"d": "Her voice shakes."}, {"s": "So why weren't you gentle with Mummy?"}]}, {"k": "act", "t": "Kunle opens his mouth. Nothing comes out. For the first time in the film, he has no answer at all. Ada picks up Tobi's hand."}, {"k": "line", "who": "ADA", "tag": "", "segs": [{"s": "Come, Tobi. Daddy's visit is finished."}]}, {"k": "act", "t": "She walks out. Kunle sits alone among his expensive gifts."}]}, {"n": 41, "title": "THE WHITE COAT", "slug": "INT. ADEYEMI SPECIALIST HOSPITAL — BOARDROOM — DAY — WEEKS LATER", "time": "40:40–41:39", "items": [{"k": "act", "t": "The same boardroom from Scene 3. Twelve board members sit in silence. Kunle stands at the head of the table, confident, in his white coat."}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"s": "Gentlemen, ladies. A private family matter has been blown out of proportion by—"}]}, {"k": "line", "who": "BOARD CHAIRMAN", "tag": "", "segs": [{"s": "Sit down, Kunle."}]}, {"k": "act", "t": "Kunle hesitates, then sits."}, {"k": "line", "who": "BOARD CHAIRMAN", "tag": "", "segs": [{"s": "We've seen the court judgment. We've seen the video from Lagos."}, {"d": "He slides a printed page across the table."}, {"s": "And we've read the minutes of your own speech in this room."}, {"d": "reading"}, {"s": "\"A man who cannot be gentle with the weak has no business wearing a white coat.\""}, {"d": "He looks up."}, {"s": "Your words, Kunle."}]}, {"k": "line", "who": "KUNLE", "tag": "", "segs": [{"d": "stiff"}, {"s": "That was about patients."}]}, {"k": "line", "who": "BOARD CHAIRMAN", "tag": "", "segs": [{"s": "Your wife was a patient in this hospital."}, {"d": "beat"}, {"s": "Twice. Under a different surname. Did you think the nurses don't talk?"}]}, {"k": "act", "t": "Kunle goes pale."}, {"k": "line", "who": "BOARD CHAIRMAN", "tag": "", "segs": [{"s": "The board has voted. Effective today, you're removed as Medical Director."}, {"d": "beat"}, {"s": "You may keep your licence. That's for the medical council to decide. But you won't lead this hospital."}]}, {"k": "act", "t": "Silence. Kunle slowly stands. He looks around the table, at faces that once applauded him, and finds nobody looking back. He walks out. At her desk, Rita doesn't look up as he passes."}]}, {"n": 42, "title": "CHLOE ADEYEMI INTERIORS", "slug": "INT. SMALL OFFICE, WUSE, ABUJA — DAY — TWO YEARS LATER", "time": "41:39–42:21", "items": [{"k": "act", "t": "A modest office. A new sign on the door reads \"CHLOE ADEYEMI INTERIORS.\" Fabric samples, sketches and one employee setting up a laptop. A happy CLIENT stands with Chloe."}, {"k": "line", "who": "CLIENT", "tag": "", "segs": [{"s": "This is exactly what I wanted. How long have you been doing this professionally?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I trained years ago. I'm just finding my way back."}]}, {"k": "line", "who": "CLIENT", "tag": "", "segs": [{"s": "Well, please don't stop. You're very good."}]}, {"k": "act", "t": "Her phone buzzes. Friday. 2:19 PM."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Madam CEO! How's the empire?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "The empire has one employee and a printer that refuses to work."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Every empire starts somewhere. Have you tried threatening the printer?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma! 😂"}, {"d": "beat"}, {"s": "I wish you were here."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Me too. One day."}]}]}, {"n": 43, "title": "THE NEW BOSS", "slug": "INT. THE LAGOS HERALD — BOARDROOM, IKEJA — DAY — SAME YEAR", "time": "42:21–43:56", "items": [{"k": "act", "t": "A new Managing Director, MRS. FOLAKE DARAMOLA, sharp and no-nonsense, sits at the head of the table with a thick folder. Mr. Bayo sits stiffly beside her. Emma enters, nervous."}, {"k": "line", "who": "MRS. DARAMOLA", "tag": "", "segs": [{"s": "Sit down, Miss Williams."}, {"d": "She opens the folder."}, {"s": "I've spent my first month reading this newspaper's archive. Do you know what I found?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "cautious"}, {"s": "No, ma."}]}, {"k": "line", "who": "MRS. DARAMOLA", "tag": "", "segs": [{"s": "Forty-one stories with your research and somebody else's name on them."}, {"d": "She looks at Bayo, who looks at the table."}, {"s": "A notebook in your desk, tracking every unpaid salary in this building for three years, with names, dates and amounts."}, {"d": "beat"}, {"s": "And the night-shift staff tell me that when Tayo's mother was in hospital, you paid the deposit from your own pocket."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "quietly"}, {"s": "Somebody had to look after them, ma."}]}, {"k": "line", "who": "MRS. DARAMOLA", "tag": "", "segs": [{"s": "Exactly. Somebody had to."}, {"d": "She closes the folder."}, {"s": "Mr. Adekola, you're relieved of your position as editor, effective today."}, {"d": "Bayo leaves without a word."}, {"s": "Miss Williams, you've been doing the job of a Human Resources department for ten years, for free. I'd like you to do it for a salary."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "stunned"}, {"s": "Ma?"}]}, {"k": "line", "who": "MRS. DARAMOLA", "tag": "", "segs": [{"s": "Head of HR and Staff Welfare. Your first job is to pay everyone what they're owed."}, {"d": "beat"}, {"s": "And your stories run under your own name from now on."}]}, {"k": "act", "t": "Emma walks out of the boardroom in a daze. In the corridor, Bisi is waiting. Emma grabs her and screams. Then she takes out her phone."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Chloe. CHLOE. They made me Head of HR. Me. The one who was nearly in the bin."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "I'M SCREAMING IN A CLIENT'S KITCHEN. You kept writing the next one!"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Because a stranger told me to let them get tired first."}, {"d": "beat"}, {"s": "They got tired, Chloe."}]}]}, {"n": 44, "title": "NOW IT'S MY TURN", "slug": "INT. EMMA'S APARTMENT, LAGOS / INT. CHLOE'S HOUSE, ABUJA — NIGHT — RONKE'S ANNIVERSARY", "time": "43:56–45:19", "items": [{"k": "act", "t": "Emma sits in the dark with untouched takeaway. Today is one year since Ronke died. Her phone buzzes."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "You've been quiet all day. I know what today is. Talk to me."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "No jokes today. I keep thinking about that Thursday. I'm scared of the dark again, Chloe."}]}, {"k": "act", "t": "In Abuja, Chloe doesn't text back. She calls. Emma answers."}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Emma. Are you safe right now?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "a long breath"}, {"s": "Yes. I called Dr. Ifeoma this afternoon. Bisi is coming over."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Good."}, {"d": "beat"}, {"s": "Then tell me about her. Not how she died. Who she was."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "surprised"}, {"s": "Nobody asks me that."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "I'm asking."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "a small laugh through tears"}, {"s": "She named her wigs. All seven. Funmi, Shade, \"Madam Senator\"… She'd wear Madam Senator to chemo and make the nurses salute her."}, {"d": "beat"}, {"s": "She used to call me \"Emi.\" She said \"Emma\" was too serious for somebody who cries at adverts."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "softly"}, {"s": "She sounds like you."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "crying now"}, {"s": "She was better than me."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "She was braver than the cancer. You're braver than the dark."}, {"d": "beat"}, {"s": "You once told me I didn't have to earn kindness. That applies to you too, Emi."}]}, {"k": "act", "t": "Emma covers her mouth. Nobody has called her that in a year."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Look at you giving me my own advice."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Somebody has to. Your advice is expensive."}, {"d": "beat"}, {"s": "Have you eaten?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "No."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Jollof or fried rice?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "laughing through her tears"}, {"s": "Don't start."}]}]}, {"n": 45, "title": "STILL HERE", "slug": "MONTAGE — LAGOS AND ABUJA — THE YEARS PASS", "time": "45:19–45:51", "items": [{"k": "act", "t": "FRIDAY, 8:07 AM."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Still here ❤️"}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Me too ❤️"}]}, {"k": "act", "t": "ANOTHER FRIDAY, 6:41 PM."}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Every single staff member got their full salary today. Every one. My first payday as HR."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "MY GIRL!!!"}]}, {"k": "act", "t": "ANOTHER FRIDAY, 10:12 PM."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Today was difficult. Kunle missed the children's visit again. I don't feel like talking."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "That's okay. Sleep well, Chloe. I'm still here tomorrow."}]}]}, {"n": 46, "title": "\"COFFEE?\"", "slug": "INT. CONSTRUCTION SITE OFFICE, ABUJA — DAY — YEAR SEVEN", "time": "45:51–46:35", "items": [{"k": "act", "t": "Blueprints cover a table. TUNDE BALOGUN, an architect with kind eyes and a hard hat under his arm, finishes a meeting with Chloe."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "That's the ceiling heights sorted."}, {"d": "beat"}, {"s": "Would you like to get coffee?"}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "suspicious"}, {"s": "Coffee? As in a meeting?"}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "Not exactly. I was hoping for the kind where we talk about something other than ceiling heights."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "Tunde, before you say anything else, I've been married before. I have two children. And I'm not looking for someone to take over my life."}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"d": "smiling"}, {"s": "Good. I wouldn't know what to do with somebody else's life. I'm still trying to organise mine."}]}, {"k": "act", "t": "Chloe laughs despite herself."}]}, {"n": 47, "title": "THE DISAGREEMENT", "slug": "INT. CHLOE ADEYEMI INTERIORS — DAY — MONTHS LATER", "time": "46:35–47:12", "items": [{"k": "act", "t": "Tunde and Chloe stand over a client's floor plan."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "I'd put the kitchen window facing east."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"s": "No. West. The client cooks in the evening. She wants the sunset."}]}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"s": "East gives morning light."}]}, {"k": "line", "who": "CHLOE", "tag": "", "segs": [{"d": "folding her arms, bracing herself"}, {"s": "West, Tunde."}]}, {"k": "act", "t": "A long pause. Chloe watches his face very carefully."}, {"k": "line", "who": "TUNDE", "tag": "", "segs": [{"d": "nodding slowly"}, {"s": "West. You're right. You know the client better than I do."}]}, {"k": "act", "t": "He moves the window on the plan and goes back to work. Chloe stares at him, then quietly takes out her phone."}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Emma. I disagreed with him today."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "And?"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "And nothing happened. He just… agreed. And made me tea."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"d": "long pause"}, {"s": "Chloe. That's what normal feels like."}]}]}, {"n": 48, "title": "\"EXCUSE ME???\"", "slug": "INT. CHLOE'S HOUSE, ABUJA / INT. EMMA'S OFFICE, LAGOS — INTERCUT — FRIDAY", "time": "47:12–47:55", "items": [{"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "There's someone."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "EXCUSE ME???"}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Stop shouting through the phone."}]}, {"k": "line", "who": "EMMA", "tag": "TEXT", "segs": [{"s": "Name. Occupation. Criminal record. Favourite rice."}]}, {"k": "line", "who": "CHLOE", "tag": "TEXT", "segs": [{"s": "Tunde.     d.style.setProperty("--c",c);
    const body = it.segs.map(s=> s.d?`<span class="dir">(${esc(s.d)})</span> `: s.s.split(/(\s+)/).map(w=>/\S/.test(w)?`<span class="word">${esc(w)}</span>`:w).join("")+" ").join("");
    d.innerHTML=`<div class="av" aria-hidden="true">${initials(it.who)}</div><div class="bub"><div class="who">${esc(it.who)}${it.tag?`<em>${esc(it.tag)}</em>`:""}</div><div class="say">${body}</div></div>`;
  }
  else if(it.k==="card"){ d.classList.add("card"); if(it.who==="ON PAPER") d.classList.add("paper"); if(it.who==="MEANWHILE") d.classList.add("mw"); d.innerHTML=`<small>${it.who==="ON PAPER"?"WRITTEN NOTE":it.who==="MEANWHILE"?"MEANWHILE":"ON SCREEN"}</small><p>${esc(it.t)}</p>`; }
  else { d.classList.add("titlecard"); d.textContent=it.t; }
  d.addEventListener("click",()=>{ const was=playing; stop(); li=i; draw(); if(was) play(); });
  return d;
}

function drawHead(anim){
  const s=SCENES[si];
  const h=$("head"); h.className="scenehead"+(anim?" enter":"");
  h.innerHTML=`<div class="num">SCENE ${s.n} OF ${SCENES.length} · ${esc(s.time)}</div><h2>${esc(s.title)}</h2><div class="slug">${esc(s.slug)}</div>`;
}
function draw(anim){
  const s=SCENES[si], feed=$("feed");
  const have = feed.dataset.si==si ? feed.children.length : 0;
  if(feed.dataset.si!=si){ feed.innerHTML=""; feed.dataset.si=si; drawHead(true); }
  while(feed.children.length>li+1) feed.lastChild.remove();
  for(let i=feed.children.length;i<=li;i++){ const el=renderItem(s.items[i],i); if(i>=have) el.classList.add("fresh"); feed.appendChild(el); }
  [...feed.children].forEach((el,i)=>el.classList.toggle("cur",i===li));
  drawEnd(); ticks(); list();
  const cur=feed.children[li]; if(cur) cur.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  const it=s.items[li]; $("nowTxt").textContent=`Scene ${s.n} · ${it.k==="line"?it.who+": ":""}${lineText(it)}`.slice(0,140);
  store.set("si",si);
}
function atEnd(){ return li>=SCENES[si].items.length-1; }

function pollFor(n){ return $("optPolls").checked ? POLLS.find(p=>p.at===n && answers[p.id]===undefined) : null; }
function revealsFor(n){ return POLLS.filter(p=>p.rev===n && answers[p.id]!==undefined); }
function updateScore(){
  const done=POLLS.filter(p=>answers[p.id]!==undefined && seen.has(SCENES.findIndex(s=>s.n===p.rev)) && revealedOnce.has(p.id));
  const right=done.filter(p=>answers[p.id]===p.a).length;
  $("score").innerHTML=done.length?`Detective score <b>${right}/${done.length}</b>`:"";
}
let revealedOnce = new Set(store.get("rev",[]));

let countdown=null;
function drawEnd(){
  const box=$("end"); box.innerHTML=""; clearInterval(countdown);
  if(!atEnd()) return;
  const n=SCENES[si].n;
  revealsFor(n).forEach(p=>{
    revealedOnce.add(p.id); store.set("rev",[...revealedOnce]);
    const ok=answers[p.id]===p.a;
    const r=document.createElement("div"); r.className="reveal"+(ok?"":" miss");
    r.innerHTML=`<b>${ok?"YOU CALLED IT":"PLOT TWIST"}</b><div>You guessed “${esc(p.o[answers[p.id]])}”. ${esc(p.why)}</div>`;
    box.appendChild(r);
  });
  updateScore();
  const p=pollFor(n);
  if(p){
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<h3>${esc(p.q)}</h3><p>Lock in your guess. The answer comes later in the story.</p><div class="opts">${p.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div class="row"><button class="btn ghost" id="skipPoll">Skip</button><span class="count" id="cd"></span></div>`;
    box.appendChild(b);
    b.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ answers[p.id]=+o.dataset.i; store.set("ans",answers); o.classList.add("pick"); toast("Guess locked in. Keep watching…"); setTimeout(()=>{ if(playing) nextScene(true); else drawEnd(); },700); });
    $("skipPoll").onclick=()=>{ answers[p.id]=-1; store.set("ans",answers); nextScene(playing); };
    if(playing){ let t=15; $("cd").textContent=`Story continues in ${t}s`; countdown=setInterval(()=>{ t--; if($("cd")) $("cd").textContent=`Story continues in ${t}s`; if(t<=0){ clearInterval(countdown); if(answers[p.id]===undefined){answers[p.id]=-1;store.set("ans",answers);} if(playing) nextScene(true);} },1000); }
    return;
  }
  if(si<SCENES.length-1){
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<p>Up next · Scene ${SCENES[si+1].n}</p><h3>${esc(SCENES[si+1].title)}</h3><div class="row"><button class="btn" id="goNext">Continue</button></div>`;
    box.appendChild(b); $("goNext").onclick=()=>nextScene(playing);
  } else {
    const right=POLLS.filter(p=>answers[p.id]===p.a).length;
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<h3>The end</h3><p>You guessed ${right} of ${POLLS.length} twists correctly.</p><div class="row"><button class="btn" id="restart">Watch again from Scene 1</button></div>`;
    box.appendChild(b); $("restart").onclick=()=>{ answers={}; store.set("ans",answers); revealedOnce=new Set(); store.set("rev",[]); goScene(0); };
  }
}

function goScene(i, keepPlaying){ const was=keepPlaying??playing; stop(); si=Math.max(0,Math.min(SCENES.length-1,i)); li=0; seen.add(si); store.set("seen",[...seen]); draw(true); window.scrollTo({top:0}); if(was) play(); }
function nextScene(keep){ if(si<SCENES.length-1) goScene(si+1,keep); else stop(); }

async function runLoop(){
  const my=++runId;
  while(my===runId){
    const s=SCENES[si], it=s.items[li];
    const text=lineText(it);
    const useVoice = $("optVoice").checked && synth && (it.k!=="act" || $("optAct").checked);
    let ok;
    if(useVoice){
      const who = it.k==="line"? it.who : "_ACT";
      const el=$("feed").children[li]; const ws=el?[...el.querySelectorAll(".word")]:[]; let wi=0;
      ok = await speak(text, who, my, ()=>{ if(ws[wi]) ws[wi++].classList.add("spoken"); });
      if(ok) ws.forEach(w=>w.classList.add("spoken"));
      ok = ok && await wait(250/speed(),my);
    } else {
      ok = await wait(Math.max(1400, words(text)*(it.k==="act"?230:300))/speed() + 400, my);
    }
    if(!ok) return;
    if(!atEnd()){ li++; draw(); continue; }
    if(pollFor(s.n)) return; // poll handles continuation with countdown
    if(si>=SCENES.length-1){ stop(); return; }
    if(!(await wait(1800,my))) return;
    nextScene(true); return;
  }
}

let lock=null;
async function play(){ playing=true; setIcon(); try{ lock = await navigator.wakeLock?.request("screen"); }catch(e){} if(atEnd() && pollFor(SCENES[si].n)){ drawEnd(); return; } if(atEnd()&&si<SCENES.length-1){ nextScene(true); return; } drawEnd(); runLoop(); }
function stop(){ playing=false; runId++; clearInterval(countdown); if(synth) synth.cancel(); setIcon(); try{lock?.release();}catch(e){} lock=null; const c=$("cd"); if(c) c.textContent=""; }
function setIcon(){ $("playIco").innerHTML = playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>'; $("bPlay").setAttribute("aria-label",playing?"Pause":"Play"); }

function step(d){ const was=playing; stop(); const s=SCENES[si];
  if(d>0){ if(!atEnd()) li++; else if(!pollFor(s.n)) { nextScene(was); return; } }
  else { if(li>0) li--; else if(si>0){ goScene(si-1,false); li=SCENES[si].items.length-1; draw(); } }
  draw(); if(was) play(); }

function ticks(){ const t=$("ticks"); if(!t.children.length){ SCENES.forEach((s,i)=>{const b=document.createElement("button"); b.title=`Scene ${s.n}: ${s.title}`; b.setAttribute("aria-label",b.title); b.onclick=()=>goScene(i); t.appendChild(b);}); }
  [...t.children].forEach((b,i)=>{ b.className=(i===si?"now":seen.has(i)?"seen":""); }); }
function list(){ const l=$("sl"); if(!l.children.length){ SCENES.forEach((s,i)=>{ const b=document.createElement("button"); b.innerHTML=`<span class="n">${String(s.n).padStart(2,"0")}</span><span class="t">${esc(s.title)}</span><span class="tm">${esc(s.time.split("–")[0].split(" ")[0])}</span>`; b.onclick=()=>{ $("drawer").hidden=true; goScene(i); }; l.appendChild(b); }); }
  [...l.children].forEach((b,i)=>{ b.classList.toggle("now",i===si); b.classList.toggle("seen",seen.has(i)&&i!==si); }); }

let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2200); }

$("bPlay").onclick=()=> playing?stop():play();
$("bNext").onclick=()=>step(1); $("bPrev").onclick=()=>step(-1);
$("bNextS").onclick=()=>nextScene(playing); $("bPrevS").onclick=()=>goScene(si-1);
$("openList").onclick=()=>{ $("drawer").hidden=false; const n=$("sl").querySelector(".now"); n&&n.scrollIntoView({block:"center"}); };
$("closeList").onclick=()=>$("drawer").hidden=true;
$("drawer").onclick=e=>{ if(e.target.id==="drawer") $("drawer").hidden=true; };
document.addEventListener("keydown",e=>{
  if(e.target.closest("select,input")) return;
  if(e.code==="Space"){ e.preventDefault(); playing?stop():play(); }
  else if(e.key==="ArrowRight") step(1); else if(e.key==="ArrowLeft") step(-1);
  else if(e.key==="Escape") $("drawer").hidden=true;
});
document.addEventListener("visibilitychange",async()=>{ if(playing && document.visibilityState==="visible"){ try{ lock=await navigator.wakeLock?.request("screen"); }catch(e){} } });

if(si>=SCENES.length) si=0;
seen.add(si);
draw(true);
if(si>0) toast(`Welcome back. You're on Scene ${SCENES[si].n}.`);
</script>
