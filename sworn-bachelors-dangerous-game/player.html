<style>
/* Layout: one centred "stage" column like a lit set; scene unfolds line by line; remote-control bar pinned to the bottom. Deliberately single dark look (night-time Lagos, kerosene lamp). */
:root{
  --night:#0e1120; --stage:#161a2c; --stage2:#1d2238; --rule:#2b3150;
  --ink:#efe8db; --muted:#a3a0b4; --faint:#6e6c82;
  --lamp:#e9a23b; --lamp-ink:#1b1306; --blood:#d0525a; --ok:#7fd49a;
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --slug:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:10px 16px 8px}
.hrow{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,26px);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--rule);background:var(--stage);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--lamp)}
.score{font-family:var(--slug);font-size:12px;color:var(--muted)}
.score b{color:var(--lamp)}
.ticks{max-width:820px;margin:8px auto 0;display:grid;grid-template-columns:repeat(42,1fr);gap:2px}
.ticks button{height:6px;border:0;border-radius:2px;background:var(--rule);padding:0}
.ticks button.seen{background:color-mix(in srgb,var(--lamp) 45%,var(--rule))}
.ticks button.now{background:var(--lamp)}

main{max-width:820px;margin:0 auto;padding:24px 16px}
.scenehead{padding-block:8px 18px;border-bottom:1px dashed var(--rule);margin-bottom:18px}
.scenehead .num{font-family:var(--slug);color:var(--lamp);font-size:13px;letter-spacing:.12em}
.scenehead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.scenehead .slug{font-family:var(--slug);font-size:13px;color:var(--muted);text-transform:uppercase}
.scenehead .slug span{color:var(--faint)}
.scenehead.enter h2{animation:rise .7s ease both}
@keyframes rise{from{opacity:.2;transform:translateY(8px);letter-spacing:.04em}to{opacity:1;transform:none}}

.feed{display:flex;flex-direction:column;gap:14px}
.it{transition:opacity .3s, transform .3s;opacity:.55}
.it.cur{opacity:1}
.it.fresh{animation:appear .45s ease both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.act{font-style:italic;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 14px;max-width:62ch}
.it.cur.act{border-left-color:var(--lamp);color:var(--ink)}
.line{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--slug);font-weight:700;font-size:13px;color:var(--night);background:var(--c)}
.bub{min-width:0}
.who{font-family:var(--slug);font-weight:700;font-size:12.5px;letter-spacing:.08em;color:var(--c)}
.who em{font-style:normal;color:var(--faint);font-weight:400;margin-left:6px}
.say{background:var(--stage);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:10px 14px;margin-top:4px;font-size:17px;max-width:62ch}
.it.cur .say{border-color:var(--c);background:var(--stage2);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 8px 30px -12px color-mix(in srgb,var(--c) 50%,transparent)}
.dir{color:var(--faint);font-style:italic;font-size:14px}
.word.spoken{color:var(--c)}
.narr .say{background:transparent;border:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);border-radius:0;font-family:var(--display);font-size:20px;line-height:1.35;padding:12px 2px}
.narr .av{background:transparent;border:1px solid var(--lamp);color:var(--lamp)}
.it.cur.narr .say{box-shadow:none;background:transparent;border-color:var(--lamp)}
.card{align-self:center;text-align:center;background:#0a0c16;border:1px solid var(--blood);border-radius:12px;padding:16px 20px;max-width:520px;width:100%}
.card small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.16em;color:var(--blood);margin-bottom:6px}
.card p{margin:0;font-family:var(--slug);font-size:18px;font-weight:700}
.card.paper{background:#f1e7cf;border-color:#c9b98f;color:#2a2318}
.card.paper small{color:#8a6d2c}
.titlecard{text-align:center;font-family:var(--display);font-size:clamp(22px,5vw,32px);color:var(--lamp);padding:28px 0;letter-spacing:.02em;text-wrap:balance}

.endbox{margin-top:26px;border:1px solid var(--rule);background:var(--stage);border-radius:16px;padding:18px}
.endbox h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.endbox p{margin:0 0 12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{background:var(--stage2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:left}
.opt:hover{border-color:var(--lamp)}
.opt.pick{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 18%,var(--stage2))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{background:var(--lamp);color:var(--lamp-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.count{font-family:var(--slug);font-size:12px;color:var(--faint)}
.reveal{margin-top:18px;border-radius:14px;padding:14px 16px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--stage))}
.reveal.miss{border-color:var(--blood);background:color-mix(in srgb,var(--blood) 10%,var(--stage))}
.reveal b{font-family:var(--slug);letter-spacing:.1em;font-size:12px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--stage) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dk{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.ctl button{background:var(--stage2);border:1px solid var(--rule);border-radius:999px;width:44px;height:44px;display:grid;place-items:center}
.ctl button:hover{border-color:var(--lamp)}
.ctl .play{width:60px;height:60px;background:var(--lamp);border:0;color:var(--lamp-ink)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl .play svg{width:26px;height:26px}
.opts2{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.opts2 label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts2 select{background:var(--stage2);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:3px 6px;font:inherit}
.nowline{font-family:var(--slug);font-size:12px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.drawer{position:fixed;inset:0;z-index:10;display:flex;justify-content:flex-end;background:rgba(5,6,12,.6)}
.drawer .pane{width:min(420px,100%);height:100%;background:var(--stage);border-left:1px solid var(--rule);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
.pane h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sl{display:flex;flex-direction:column;gap:2px}
.sl button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px}
.sl button:hover{background:var(--stage2)}
.sl button.now{background:color-mix(in srgb,var(--lamp) 16%,transparent)}
.sl .n{font-family:var(--slug);color:var(--lamp);font-size:12px}
.sl .t{min-width:0}
.sl .tm{font-family:var(--slug);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sl .seen .t::after{content:" ✓";color:var(--ok);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--night);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.hint{color:var(--faint);font-size:13px;text-align:center;margin-top:28px}
kbd{font-family:var(--slug);border:1px solid var(--rule);border-radius:4px;padding:0 4px;font-size:12px}
@media (max-width:520px){.score{display:none}.say{font-size:16px}.line{grid-template-columns:34px 1fr;gap:10px}.av{width:34px;height:34px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const SCENES = [{"n": 1, "title": "THE PRICE (COLD OPEN)", "slug": "EXT/INT. ABANDONED BOATYARD WAREHOUSE, EPE — NIGHT — HEAVY RAIN", "time": "0:00–0:45", "items": [{"k": "act", "t": "Rain pounds a rusted zinc roof. One bulb swings. EMMA sits tied to a metal chair, her blouse torn at the shoulder and her lip bleeding. A phone on an oil drum in front of her lights up. The screen reads: \"DONALD.\""}, {"k": "act", "t": "A man in a black hoodie stands in the shadows. We never see his face. A second voice, smooth and amused, comes through a speaker. This is MARCUS."}, {"k": "line", "who": "MARCUS", "tag": "V.O.", "segs": [{"s": "Answer it, Miss Reardon. Tell him the price."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "spitting blood, defiant"}, {"s": "He won't pay. Donald Irwin doesn't pay ransoms."}]}, {"k": "line", "who": "MARCUS", "tag": "V.O.", "segs": [{"d": "soft laugh"}, {"s": "Donald Irwin has never had anything worth paying for."}]}, {"k": "act", "t": "Beat."}, {"k": "line", "who": "MARCUS", "tag": "V.O.", "segs": [{"s": "Until you."}]}, {"k": "act", "t": "The phone keeps ringing. Emma stares at it with tears in her eyes. She doesn't move."}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "Three months ago, Emma Reardon didn't even know Donald Irwin's voice."}]}, {"k": "act", "t": "SMASH CUT TO BLACK."}, {"k": "title", "t": "HE CONTROLLED A BILLION-DOLLAR EMPIRE… BUT HE COULDN'T CONTROL HER"}]}, {"n": 2, "title": "THE ROOFTOP PACT", "slug": "EXT. ROOFTOP OF A FACE-ME-I-FACE-YOU BUILDING, AJEGUNLE — NIGHT — 25 YEARS AGO", "time": "0:45–1:39", "items": [{"k": "act", "t": "Three teenage boys sit on a rusty rooftop and look at the far-off lights of Victoria Island. Generators hum below. YOUNG MICHAEL holds a bottle of Fanta. YOUNG GEOFFREY has a textbook on his knees. YOUNG DONALD stares at the skyline and doesn't blink."}, {"k": "line", "who": "YOUNG MICHAEL", "tag": "", "segs": [{"s": "One day I go buy that whole Victoria Island. Every building. Even the sea."}]}, {"k": "line", "who": "YOUNG GEOFFREY", "tag": "", "segs": [{"s": "You can't buy the sea, Michael."}]}, {"k": "line", "who": "YOUNG MICHAEL", "tag": "", "segs": [{"s": "Watch me."}]}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"d": "quietly"}, {"s": "Let's make a promise. A real one."}]}, {"k": "act", "t": "The other two go quiet. Donald doesn't joke."}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"s": "One. We become successful. Two. We take care of our families. Three. We never, ever go back to this."}]}, {"k": "act", "t": "He gestures at the rooftop, the zinc and the darkness."}, {"k": "line", "who": "YOUNG MICHAEL", "tag": "", "segs": [{"s": "And four… no girls. Girls distract a man."}]}, {"k": "line", "who": "YOUNG GEOFFREY", "tag": "", "segs": [{"d": "laughing"}, {"s": "You're the only one girls talk to."}]}, {"k": "line", "who": "YOUNG MICHAEL", "tag": "", "segs": [{"s": "Exactly. I'm making a sacrifice."}]}, {"k": "act", "t": "Donald holds out his hand. Michael slaps his on top. Geoffrey adds his."}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"s": "And five. We protect each other. Whatever it costs."}]}, {"k": "line", "who": "ALL THREE", "tag": "", "segs": [{"s": "Sworn."}]}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "Three boys. One rooftop. Five promises. Twenty-five years later, they had kept four of them."}]}]}, {"n": 3, "title": "THE NIGHT THAT MADE HIM", "slug": "INT. ONE-ROOM APARTMENT, AJEGUNLE — NIGHT — FLASHBACK", "time": "1:39–2:24", "items": [{"k": "act", "t": "A kerosene lamp flickers. YOUNG DONALD, 12, does homework on the floor. His MOTHER stirs a pot and keeps glancing at the door."}, {"k": "line", "who": "MOTHER", "tag": "", "segs": [{"s": "Your papa should be home by now. It's payday. He promised us meat today."}]}, {"k": "act", "t": "A hard knock. Two POLICEMEN stand in the doorway, hats in their hands. His mother's spoon falls."}, {"k": "line", "who": "POLICEMAN", "tag": "", "segs": [{"s": "Madam… we found your husband on the road by the bus stop. Robbers. They took everything. His wages… everything."}]}, {"k": "act", "t": "His mother screams and collapses. Young Donald stands frozen. His eyes go to his father's empty chair."}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"d": "whispering to himself, shaking"}, {"s": "Never again. Nobody will ever take from me again. Never again will I be… powerless."}]}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "That night, a boy stopped crying. And he never learned how to start again."}]}]}, {"n": 4, "title": "THE KING OF THE TOWER", "slug": "INT. EVERYS CONGLOMERATE — BOARDROOM, 40TH FLOOR, VICTORIA ISLAND — DAY — PRESENT", "time": "2:24–3:17", "items": [{"k": "act", "t": "Glass walls and the Lagos lagoon below. Twelve executives sit in silence. A young MANAGER sweats through a presentation. DONALD IRWIN, 36, in a perfectly cut navy suit, sits at the head of the table. He hasn't looked up from his tablet once."}, {"k": "line", "who": "MANAGER", "tag": "", "segs": [{"s": "…so with these projections, we expect a modest growth of…"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Stop."}]}, {"k": "act", "t": "The room freezes."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Page four says eight percent. Page nine says six. Which one were you lying about?"}]}, {"k": "line", "who": "MANAGER", "tag": "", "segs": [{"s": "Sir, it's a typo—"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "A typo in a ninety-million-dollar proposal isn't a typo. It's a decision you didn't make."}, {"d": "standing"}, {"s": "Get it right, or get out of my building."}]}, {"k": "act", "t": "He walks out. ADAEZE, his PA, hurries after him. CHARLES OKAFOR, the grey-haired CFO, watches him go and narrows his eyes."}, {"k": "line", "who": "ADAEZE", "tag": "", "segs": [{"s": "Sir, your eleven o'clock—"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Cancel it. And Adaeze? Send me every departmental report from Finance Operations. Ross's team."}]}, {"k": "line", "who": "ADAEZE", "tag": "", "segs": [{"s": "Ross is going on leave today, sir."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "stops"}, {"s": "Then who's running his team?"}]}, {"k": "line", "who": "ADAEZE", "tag": "", "segs": [{"d": "checks tablet"}, {"s": "A Miss… Emma Reardon. She's been here three months."}]}, {"k": "act", "t": "Donald repeats the name silently, and his expression doesn't change."}]}, {"n": 5, "title": "THE DAUGHTER WHO SAID NO", "slug": "INT. REARDON FAMILY HOME, IKOYI — DINING ROOM — NIGHT", "time": "3:17–4:20", "items": [{"k": "act", "t": "An elegant dinner table. DR. REARDON and MRS. REARDON, both doctors, still have their hospital ID cards on lanyards. EMMA, 27, pushes jollof rice around her plate."}, {"k": "line", "who": "MRS. REARDON", "tag": "", "segs": [{"s": "Dr. Adebayo's son just finished his residency in London. Neurosurgery. Imagine."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I'm imagining, Mummy."}]}, {"k": "line", "who": "DR. REARDON", "tag": "", "segs": [{"s": "Emma, it's not too late. One phone call and you're in medical school by January. I'll pay for everything."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I don't want your money, Daddy. I have a job."}]}, {"k": "line", "who": "MRS. REARDON", "tag": "", "segs": [{"s": "You count other people's money for a man who doesn't even know your name."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "putting down her fork"}, {"s": "Then one day he'll learn it."}]}, {"k": "act", "t": "Silence. Dr. Reardon wipes his mouth slowly."}, {"k": "line", "who": "DR. REARDON", "tag": "", "segs": [{"s": "This is how it started with your brother. A dream. A guitar. And now—"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "And now you don't say his name. Six years, Daddy. James is still your son."}]}, {"k": "line", "who": "MRS. REARDON", "tag": "", "segs": [{"d": "sharp"}, {"s": "Not at this table."}]}, {"k": "act", "t": "Emma stands, takes her bag and kisses her mother's cheek anyway."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I'm not running away like James did. I'm walking. There's a difference."}]}, {"k": "act", "t": "She leaves. Her father stares at the empty chair beside him, where James's chair used to be."}]}, {"n": 6, "title": "THE MENTOR'S GIFT", "slug": "INT. EVERYS — FINANCE OPERATIONS FLOOR — MORNING", "time": "4:20–5:14", "items": [{"k": "act", "t": "An open-plan office. ROSS, 45, kind-eyed with greying temples, packs a box. Emma stands beside him, anxious. TOBI, her colleague, hovers nearby with a cup of tea."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "You'll be fine. You're the sharpest person on this floor."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Ross, I've been here three months. I can't run your department."}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "You're not running it. You're protecting it until I'm back."}, {"d": "He pulls a heavy silver fountain pen from his pocket."}, {"s": "Here. My first boss gave me this. Sign your first big win with it."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "touched"}, {"s": "Ross, I can't take—"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "You can. And remember the only rule I ever taught you."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "smiling"}, {"s": "\"Numbers don't lie. People do.\""}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "Good girl."}]}, {"k": "act", "t": "His phone buzzes on the desk. The screen shows one letter: \"D.\" He grabs it too fast, and his face goes grey."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Is everything okay?"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "forced smile"}, {"s": "It's Debby. She… needs me. Family wahala."}, {"d": "lifting the box"}, {"s": "Don't let anyone bully you, Emma. Especially not upstairs."}]}, {"k": "act", "t": "He walks to the lift. As the doors close, he looks back at her with something like regret."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"d": "sipping tea"}, {"s": "That man is hiding something."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Tobi, everybody is hiding something."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Yes, but his own is sweating."}]}]}, {"n": 7, "title": "THE EMAIL", "slug": "INT. EVERYS — EMMA'S DESK — THREE WEEKS LATER — NIGHT", "time": "5:14–5:59", "items": [{"k": "act", "t": "Montage feel. Emma is buried in files. Missed deadlines show in red on her screen. A colleague slams a folder down: \"Client is complaining again.\" Emma rubs her eyes. The clock reads 11:47 PM."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Emma, go home. Even the cleaners have gone home. The generator has gone home."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "The quarterly report is due tomorrow, Tobi. If it's bad, they'll say Ross left a girl to do a woman's job."}]}, {"k": "act", "t": "Her computer pings. A NEW EMAIL arrives. FROM: Donald Irwin, CEO."}, {"k": "act", "t": "Emma and Tobi lean toward the screen together. Emma clicks it open."}, {"k": "card", "who": "ON SCREEN", "t": "Be in my office by 10 a.m."}, {"k": "act", "t": "That's the whole message. No greeting and no signature."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"d": "whispering"}, {"s": "Ehn. Emma. Write your will."}]}]}, {"n": 8, "title": "THE FIRST MEETING", "slug": "INT. DONALD IRWIN'S OFFICE, 40TH FLOOR — 9:58 AM", "time": "5:59–7:47", "items": [{"k": "act", "t": "A huge, cold, minimalist office. Emma walks in holding her report tightly. Donald sits behind his desk reading her report, which already has red ink all over it. He doesn't look up."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Sit."}]}, {"k": "act", "t": "She sits. Ten seconds pass with only the sound of pages turning."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Miss Reardon. Did you write this, or did it happen to you?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I wrote it, sir."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Then you should apologise to it."}, {"d": "He flips pages."}, {"s": "Your forecast is optimistic. Your summary is soft. And your department has missed two deadlines in three weeks."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "My department lost its manager three weeks ago, and nobody replaced him. I'm doing two jobs on one salary."}]}, {"k": "act", "t": "He finally looks up. Their eyes meet for the first time."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Is that an excuse?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "It's a fact. You like facts, don't you? I read your interviews."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "cold"}, {"s": "Careful."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "With respect, sir, you asked me here to tear me down. You've done that. But you haven't asked me one question about the actual numbers. If you had, you'd know page eleven is the most important page in that report, and you skipped it."}]}, {"k": "act", "t": "Silence. Donald slowly turns to page eleven. His jaw tightens."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You think you can talk to me like this?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I think you'd fire me faster if I didn't."}]}, {"k": "act", "t": "A long beat. Something flickers across his face. It isn't anger. It looks closer to interest."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Get out, Miss Reardon."}]}, {"k": "act", "t": "She stands, chin high, and walks out. The door clicks shut."}, {"k": "act", "t": "Donald sits alone. He looks at page eleven. In the margin, in small, neat handwriting, she has written:"}, {"k": "card", "who": "ON PAPER", "t": "Halbrook account — 0.3% variance. Recurring? Check."}, {"k": "act", "t": "He reads it twice, then leans back. For the first time in years, Donald Irwin smiles, just slightly."}]}, {"n": 9, "title": "AFTER HOURS", "slug": "INT. EVERYS — FINANCE FLOOR — 8:30 PM — SAME DAY", "time": "7:47–8:49", "items": [{"k": "act", "t": "The floor is empty. Emma packs her bag, still shaking with anger. Footsteps echo, slow and expensive. She turns. Donald stands there with his tie loosened and her report in his hand."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "startled"}, {"s": "Sir. If you've come to fire me, you could have sent another one-line email."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Halbrook."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "…Sorry?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Page eleven. Your note. Explain it."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Every month, the Halbrook account loses a little. Point three percent. Too small for an audit to catch. But it's been happening for fourteen months. Same day. Same amount. Numbers don't lie."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "quietly"}, {"s": "People do."}]}, {"k": "act", "t": "She blinks, surprised he finished the phrase."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Investigate it. Quietly. You report to nobody but me. Not your colleagues. Not Finance. Not the CFO. Do you understand?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Why me?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Because you're the only person in this building who looked at that number and didn't look away."}, {"d": "turning to leave"}, {"s": "And Miss Reardon? Your report was still bad."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "calling after him"}, {"s": "Your email was worse!"}]}, {"k": "act", "t": "He keeps walking, but we see him smile."}]}, {"n": 10, "title": "SUYA AT MIDNIGHT", "slug": "INT. EVERYS — SMALL PRIVATE CONFERENCE ROOM — NIGHT — ONE WEEK LATER", "time": "8:49–10:01", "items": [{"k": "act", "t": "Papers cover the table. A whiteboard shows arrows and figures. Emma is barefoot, her heels under the chair, as she draws lines between numbers. The door opens. Donald walks in carrying a newspaper-wrapped parcel. The smell of suya fills the room."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You… brought suya?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You haven't left this room in six hours. Adaeze told me."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Billionaires eat suya?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "sitting down and unwrapping it"}, {"s": "I ate suya before I could spell \"billion.\" Sit."}]}, {"k": "act", "t": "They eat. For a moment, they're just two people at midnight."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "The money doesn't disappear. It moves. Every month, a little goes to a vendor called Crestline Logistics. Crestline has no trucks, no staff and no office. Just an account."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "A shell company."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "And the payments are approved inside Everys. By someone with senior access."}]}, {"k": "act", "t": "Donald stops chewing."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "How senior?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Senior enough that if I say the name out loud before I'm sure, I'll lose my job. Maybe more."}]}, {"k": "act", "t": "He studies her face."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You have pepper on your lip."}]}, {"k": "act", "t": "She wipes it, embarrassed. He laughs, a real laugh, rusty from lack of use. She stares."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You laugh?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Tell no one. I'll deny it."}]}]}, {"n": 11, "title": "THE CFO", "slug": "INT. EVERYS — RECORDS ARCHIVE, BASEMENT — DAY", "time": "10:01–10:46", "items": [{"k": "act", "t": "Long shelves of files. Emma pulls out a box labelled \"HALBROOK — 2024–2025.\" A shadow falls over her. CHARLES OKAFOR, the CFO, stands at the end of the aisle."}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "Miss Reardon. You're a long way from your desk."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "composed"}, {"s": "Just… reconciling some old accounts, sir."}]}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "Halbrook."}, {"d": "He steps closer."}, {"s": "Who authorised you to open those files?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "It's part of my department's review."}]}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "Your department's review doesn't include archive access."}, {"d": "He takes the box gently but firmly out of her hands."}, {"s": "Some files are closed for a reason. Young people should be careful what they open."}]}, {"k": "act", "t": "He walks away with the box. Emma's heart pounds. She pulls out her phone and texts:"}, {"k": "card", "who": "ON SCREEN", "t": "CFO just took the Halbrook files from me. Is that normal?"}, {"k": "act", "t": "Three dots. Then:"}, {"k": "card", "who": "ON SCREEN", "t": "Nothing about Charles is normal. Don't be alone with him."}]}, {"n": 12, "title": "THE FIRST WARNING", "slug": "INT. EMMA'S CAR — PARKED IN EVERYS BASEMENT CAR PARK — NIGHT", "time": "10:46–11:22", "items": [{"k": "act", "t": "Emma throws her bag onto the passenger seat, exhausted. Her phone buzzes. It's an UNKNOWN NUMBER."}, {"k": "card", "who": "ON SCREEN", "t": "STOP LOOKING INTO HALBROOK OR ELSE."}, {"k": "act", "t": "She freezes and looks around the dark car park. Pillars and shadows. A security light flickers. Somewhere, a car door shuts."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Who are you?"}]}, {"k": "act", "t": "She locks the doors and starts the car with trembling hands. As she drives off, a black SUV with tinted windows pulls out behind her. Its headlights are off."}]}, {"n": 13, "title": "THE PHOTOGRAPHS", "slug": "INT. DONALD'S OFFICE — NEXT MORNING", "time": "11:22–12:43", "items": [{"k": "act", "t": "Emma walks in without knocking. Adaeze tries to stop her and fails. Emma slaps her phone on Donald's desk."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "That came last night."}]}, {"k": "act", "t": "Donald reads the message. His face doesn't move. Then the phone buzzes in his hand with another message: PHOTOGRAPHS. Emma at her apartment door last night. Emma at the supermarket. Emma asleep in her car at a traffic light."}, {"k": "card", "who": "ON SCREEN", "t": "WE SEE YOU, EMMA."}, {"k": "act", "t": "Donald's knuckles go white around the phone."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You got the first message twelve hours ago, and you're only telling me now?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I handled it."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You handled it? Someone stood outside your door, Emma!"}]}, {"k": "act", "t": "It's the first time he has said her first name. Neither of them misses it."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "pressing intercom"}, {"s": "Adaeze. Two security officers on Miss Reardon. Around the clock. And a driver."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "No. Absolutely not. I'm not your property, Mr. Irwin."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You're my responsibility."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I'm my own responsibility! I didn't refuse my father's money so a different man could put me in a cage!"}]}, {"k": "act", "t": "Silence. That hit something in him."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "quietly, controlled"}, {"s": "I'm not trying to cage you. I'm trying to keep you alive. Those are not the same thing."}]}, {"k": "act", "t": "She stares at him and her anger softens."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "…One officer. And no driver. I like my car."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Two officers. And you can keep your car."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You negotiate like a criminal."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I learned from them."}]}]}, {"n": 14, "title": "THE BROTHERS", "slug": "INT. PRIVATE MEMBERS' LOUNGE, IKOYI — NIGHT", "time": "12:43–14:04", "items": [{"k": "act", "t": "A leather and whisky lounge with a jazz band playing softly. MICHAEL McCLAREN, 36, stylish and grinning, sprawls in an armchair. GEOFFREY DUROSE, 36, calm, in glasses, studies the Halbrook printouts. Donald stands at the window."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "So let me get this straight. A junior analyst insulted you in your own office, and instead of firing her, you brought her suya."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "It was a working dinner."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Geoffrey, write the date down. Donald Irwin has broken the pact."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "not looking up"}, {"s": "I wrote it down three weeks ago, when he cancelled our golf because of \"a report.\""}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Can we focus?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "taking off his glasses"}, {"s": "I am focused. Donald, this isn't theft. Thieves are greedy. They take big and run. This is patient. Small cuts, for fourteen months. Someone is bleeding Everys slowly so your quarterly numbers look weak."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Why?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Weak numbers mean a falling share price. A falling share price means your company gets cheap. And a cheap company…"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "no longer smiling"}, {"s": "…gets bought."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "A hostile takeover."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "And there's only one man in Lagos who hates you enough to wait fourteen months."}]}, {"k": "act", "t": "All three look at each other. Donald says it like a curse."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Marcus Vane."}]}]}, {"n": 15, "title": "THE MAN IN THE SHADOWS", "slug": "INT. MARCUS VANE'S MANSION, BANANA ISLAND — STUDY — NIGHT", "time": "14:04–14:57", "items": [{"k": "act", "t": "Dark wood, a fireplace and a chessboard. MARCUS VANE, 50, silver at the temples, in a silk robe, moves a white bishop. Then he picks up a burner phone and dials."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "She found Crestline."}]}, {"k": "line", "who": "VOICE ON PHONE", "tag": "distorted, male", "segs": [{"s": "I warned her. I sent the messages, like you said."}]}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Messages."}, {"d": "He chuckles."}, {"s": "Messages are for children. She's still looking."}]}, {"k": "line", "who": "VOICE ON PHONE", "tag": "", "segs": [{"s": "Please. She's just a girl. She doesn't know anything yet."}]}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Then make sure she never does. Or I'll remind you what happens to Debby."}]}, {"k": "line", "who": "VOICE ON PHONE", "tag": "", "segs": [{"d": "panicked"}, {"s": "Don't. Don't touch her. I'll handle it."}]}, {"k": "act", "t": "Marcus hangs up. He looks at the chessboard, lifts the white queen and turns it in his fingers."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Donald, Donald. You never kept anything you could lose."}, {"d": "He smiles."}, {"s": "Now you have."}]}, {"k": "act", "t": "He sets the queen down in front of the black king."}]}, {"n": 16, "title": "A VISIT TO ROSS", "slug": "INT. ROSS'S HOUSE, SURULERE — LIVING ROOM — DAY", "time": "14:57–16:00", "items": [{"k": "act", "t": "The house is half empty. There are lighter patches on the walls where pictures used to hang. Ross opens the door looking thinner, unshaven and nervous. He brightens a little when he sees Emma holding a bag of oranges."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "Emma! What are you doing here?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Checking on my mentor. You don't answer calls anymore."}]}, {"k": "act", "t": "They sit. She notices the bare walls."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Where's Debby?"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "too quickly"}, {"s": "With her sister. In Ibadan. For a while."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Ross, I need your advice. I found something at work. Halbrook. Crestline Logistics. Someone senior is—"}]}, {"k": "act", "t": "Ross's cup rattles against its saucer. He puts it down."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "Emma. Leave Halbrook alone."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You told me numbers don't lie—"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "suddenly fierce, grabbing her hand"}, {"s": "I'm telling you now. Please. Leave it. Give it to Mr. Irwin, give it to Charles, give it to anybody, but you walk away. Promise me."}]}, {"k": "act", "t": "His eyes are wet. Emma is shaken."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Ross… are you in trouble?"}]}, {"k": "act", "t": "A long pause. He lets go of her hand and forces a smile."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "I'm just an old man who worries too much. Go home, Emma."}]}, {"k": "act", "t": "As she leaves, the camera stays on Ross. He pulls a second phone from under a sofa cushion. One unread message reads: \"Tick tock.\""}]}, {"n": 17, "title": "FRAMED", "slug": "INT. EVERYS — BOARDROOM — MORNING", "time": "16:00–17:21", "items": [{"k": "act", "t": "An emergency board meeting. Emma has been called in. Charles Okafor stands at the screen with a remote in hand. Donald sits at the head of the table, unreadable."}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "At 2:14 a.m. last Tuesday, someone logged into the Halbrook ledger and moved four hundred thousand dollars to Crestline Logistics. They used this login."}]}, {"k": "act", "t": "He clicks. The screen reads: USER — E.REARDON."}, {"k": "act", "t": "Gasps around the room. Emma goes pale."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "That's not… I was asleep at 2 a.m.! Ask the security officers outside my house!"}]}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "Convenient. A junior analyst gains access to a sensitive account, and suddenly money moves under her name."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I'm the one who found the problem! Why would I report my own crime?"}]}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "To control the investigation. It's the oldest trick there is."}]}, {"k": "act", "t": "Every head turns to Donald. He stands slowly and looks at Emma for a long, painful moment."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Miss Reardon. Give me your badge."}]}, {"k": "act", "t": "Emma's face breaks. She can't believe it."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering"}, {"s": "You know I didn't do this."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Your badge. Now."}]}, {"k": "act", "t": "She unclips it with shaking fingers and puts it on the table. She walks out with her head high as tears run down her face. Charles watches her go with a satisfied look."}]}, {"n": 18, "title": "THE GAME INSIDE THE GAME", "slug": "INT. EVERYS — STAIRWELL — MOMENTS LATER", "time": "17:21–18:24", "items": [{"k": "act", "t": "Emma storms down the stairs, sobbing. A door bangs above. Donald comes running down two steps at a time and catches her arm."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Don't touch me!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Emma, listen—"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You humiliated me! In front of the entire board! I trusted you!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "That's exactly why I did it!"}]}, {"k": "act", "t": "She stops."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "lowering his voice"}, {"s": "Whoever framed you is in that building. Maybe in that room. They needed you out. Now they think they've won. And people who think they've won get careless."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "realising"}, {"s": "You… used me as bait."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I used their confidence as bait. You're not suspended. You're invisible. There's a difference."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You could have told me first!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Then your tears wouldn't have been real. And Charles would have known."}]}, {"k": "act", "t": "She slaps him. It echoes in the stairwell. He doesn't flinch."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "quietly"}, {"s": "I deserved that."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "voice cracking"}, {"s": "Yes, you did."}]}, {"k": "act", "t": "A beat. They are breathing hard and standing very close."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Go home. Keep your phone on. And Emma… I never believed it. Not for one second."}]}]}, {"n": 19, "title": "THE BROTHER AT THE DOOR", "slug": "INT. EMMA'S APARTMENT, LEKKI — EVENING", "time": "18:24–19:18", "items": [{"k": "act", "t": "Emma sits on the floor eating ice cream from the tub with mascara streaked down her face. A knock. She checks the peephole and gasps. She opens the door. JAMES REARDON, 31, stands there with a guitar case on his back and a gentle smile."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "James?!"}]}, {"k": "line", "who": "JAMES", "tag": "", "segs": [{"s": "Hello, small madam."}]}, {"k": "act", "t": "She throws herself into his arms."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Six years! Where have you been?"}]}, {"k": "line", "who": "JAMES", "tag": "", "segs": [{"s": "Playing in hotels nobody's heard of. Abuja. Accra. Cotonou."}, {"d": "beat"}, {"s": "Daddy called me."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "shocked"}, {"s": "Daddy called you?"}]}, {"k": "line", "who": "JAMES", "tag": "", "segs": [{"s": "First time in six years. He said, \"Your sister is in trouble, and she won't talk to me. Maybe she'll talk to you.\""}, {"d": "smiling sadly"}, {"s": "Then he hung up before I could answer. Typical."}]}, {"k": "act", "t": "Emma laughs through her tears."}, {"k": "act", "t": "Outside, across the street, the black SUV sits in the dark. A cigarette glows inside it."}]}, {"n": 20, "title": "THE BALCONY", "slug": "EXT. EMMA'S APARTMENT BALCONY — NIGHT", "time": "19:18–20:38", "items": [{"k": "act", "t": "Later. James plays soft guitar inside. Donald has come by and stands on the balcony with Emma. The Lekki lights spread out below them."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Why are you really here, Mr. Irwin?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Donald."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "…Why are you really here, Donald?"}]}, {"k": "act", "t": "A long pause. He looks out at the city."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "My father worked twelve hours a day. One payday, he was walking home with his wages in his pocket, and someone killed him for it. For a few thousand naira."}, {"d": "beat"}, {"s": "I was twelve. I stood in that doorway and watched my mother break. And I couldn't do anything. Nothing."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "softly"}, {"s": "Donald…"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I built an empire so I would never feel that again. Powerless."}, {"d": "He turns to her."}, {"s": "And then a stubborn analyst walked into my office, and suddenly I can't sleep, because someone is taking pictures outside her door."}]}, {"k": "act", "t": "Silence. She steps closer. He lifts his hand to her face slowly, as if he's afraid she'll vanish. Their lips are almost touching—"}, {"k": "act", "t": "CRASH! A brick smashes through the living room window. Glass explodes. The guitar stops."}, {"k": "line", "who": "JAMES", "tag": "O.S.", "segs": [{"s": "EMMA!"}]}, {"k": "act", "t": "Donald pulls Emma behind him. The brick lies on the floor with a paper tied around it. Donald unfolds it."}, {"k": "card", "who": "ON PAPER", "t": "LAST WARNING."}, {"k": "act", "t": "Outside, tyres screech away."}]}, {"n": 21, "title": "THE LOGIN", "slug": "INT. DONALD'S MANSION, LEKKI — GUEST WING — LATE NIGHT", "time": "20:38–21:41", "items": [{"k": "act", "t": "Emma, wrapped in a blanket, sits on a sofa. James paces. Michael and Geoffrey have arrived. Geoffrey has a laptop open."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "to Emma, grinning"}, {"s": "So you're the woman who broke Donald Irwin. Michael. Charmed. I've been waiting twenty-five years to meet you."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Michael."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I'm being supportive."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I traced the 2:14 login. It used Emma's password, but not Emma's computer. It came from a terminal on the 14th floor."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "The 14th floor? That's our floor. Which desk?"}]}, {"k": "act", "t": "Geoffrey hesitates and glances at Donald."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "The manager's office. Terminal 14-01."}]}, {"k": "act", "t": "Emma goes still."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "No. That's Ross's office. That's impossible. Ross is on leave. He hasn't been in the building for weeks."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "His key card says otherwise. It was swiped at 1:58 a.m."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "standing, angry"}, {"s": "Then someone stole his card! The same way they stole my password! You don't know Ross. He gave me his pen. He taught me everything!"}]}, {"k": "act", "t": "Nobody speaks."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "gently"}, {"s": "Emma—"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "No. I'll prove it."}]}]}, {"n": 22, "title": "THE DRAWER", "slug": "INT. EVERYS — ROSS'S OFFICE, 14TH FLOOR — 2 AM", "time": "21:41–22:35", "items": [{"k": "act", "t": "Dark. Emma slips in using Tobi's borrowed badge and a phone torch. She searches Ross's desk. The drawers hold files, pens and an old photo of Ross and Debby laughing. In the bottom drawer, taped underneath, she finds a small black notebook. She opens it. Inside are dates, amounts and the word \"CRESTLINE\" over and over in Ross's handwriting."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering, broken"}, {"s": "No… no, no, no…"}]}, {"k": "act", "t": "The lights SNAP ON. Emma spins around. Charles Okafor stands in the doorway."}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "Put it down, Miss Reardon."}]}, {"k": "act", "t": "Emma backs against the wall, clutching the notebook."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "terrified"}, {"s": "Stay away from me. I'll scream."}]}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"d": "holding up both hands"}, {"s": "Scream if you want. But first, look at this."}]}, {"k": "act", "t": "He slowly takes out his own phone and turns the screen toward her. It shows a photo of Ross meeting Marcus Vane in a car park, time-stamped two months ago."}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "I've been watching Ross since January. And I thought you were helping him."}]}]}, {"n": 23, "title": "THE TRUTH ABOUT CHARLES", "slug": "INT. DONALD'S OFFICE — 3 AM", "time": "22:35–23:11", "items": [{"k": "act", "t": "Donald, Emma and Charles. Coffee cups."}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "I took the Halbrook files because I didn't know who to trust. Emma was Ross's protégé. I assumed she was his partner."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "And you didn't tell me?"}]}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "You don't trust anyone, Donald. I learned from the best."}]}, {"k": "act", "t": "Emma stares at the black notebook on the desk."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "numb"}, {"s": "He told me numbers don't lie."}, {"d": "her voice cracks"}, {"s": "He forgot to mention he was one of the people."}]}]}, {"n": 24, "title": "THE CONFESSION", "slug": "EXT. ROSS'S HOUSE, SURULERE — RAIN — NIGHT", "time": "23:11–24:23", "items": [{"k": "act", "t": "Pouring rain. Emma bangs on the door. Ross opens it and sees the black notebook in her hand. His whole body sags."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Was it you? Look at me and say it wasn't you."}]}, {"k": "act", "t": "Silence. Only rain."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "breaking"}, {"s": "It was me."}]}, {"k": "act", "t": "Emma steps back as if he has hit her."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Why? Why, Ross?!"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "Debby's father borrowed money from the wrong people. Marcus Vane bought the debt. All of it. Then he came to me. Smiling. He said, \"Ross, you can pay it with information, or Debby can pay it another way.\""}, {"d": "He chokes."}, {"s": "He sent me pictures of her sleeping, Emma. Sleeping."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You framed me. You used my password!"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "He told me to! I swear I tried to stop you. The messages, the warnings… I sent them so you would quit. So you'd be safe!"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "screaming through tears"}, {"s": "You taught me everything! You gave me your pen!"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "on his knees in the rain"}, {"s": "Numbers don't lie, Emma. People do."}, {"d": "He looks up, destroyed."}, {"s": "I am the people."}]}, {"k": "act", "t": "Headlights sweep over them. A black car stops. Donald steps out into the rain with no umbrella and walks toward Ross."}]}, {"n": 25, "title": "THE DEAL", "slug": "EXT. ROSS'S HOUSE — CONTINUOUS", "time": "24:23–24:59", "items": [{"k": "act", "t": "Donald stands over Ross, who is still kneeling in the rain."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Give me one reason not to send you to Kirikiri tonight."}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "shaking"}, {"s": "Because I know when Marcus moves. The takeover bid is at the shareholders' meeting on Friday. He has a list of every board member he's bribed. And I know where he keeps Debby's father's debt papers."}]}, {"k": "act", "t": "Donald looks at Emma. She is soaked, devastated and still standing."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "barely audible"}, {"s": "Let him help. For Debby."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "to Ross"}, {"s": "You work for me now. Every word Marcus says, I hear first. If you lie to me once, just once, I'll make sure you never see daylight."}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "sobbing"}, {"s": "Thank you, sir."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Don't thank me. Thank her."}]}]}, {"n": 26, "title": "THE KING SEES THE QUEEN", "slug": "INT. MARCUS VANE'S MANSION — STUDY — NIGHT", "time": "24:59–25:35", "items": [{"k": "act", "t": "Marcus watches grainy footage on a tablet. A hidden camera shows Ross entering Donald's car."}, {"k": "line", "who": "HENCHMAN", "tag": "", "segs": [{"s": "He's switched sides, oga."}]}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"d": "calm, almost pleased"}, {"s": "Of course he has. Weak men always switch sides."}, {"d": "He swipes to a photo of Emma laughing with Donald on the balcony."}, {"s": "I've spent fifteen years looking for Donald Irwin's weakness. Money? He has too much. Fear? He buried it with his father."}, {"d": "He taps Emma's face on the screen."}, {"s": "And then he goes and falls in love."}]}, {"k": "act", "t": "He sets the tablet down."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Change of plan. Forget the boardroom. Bring me the girl."}]}]}, {"n": 27, "title": "THE PLAN", "slug": "INT. DONALD'S MANSION — STUDY — DAY", "time": "25:35–26:19", "items": [{"k": "act", "t": "Donald, Michael, Geoffrey, Charles and Ross stand around a table covered in documents."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Ross feeds Marcus fake numbers. Marcus thinks Everys is weaker than it is. He overpays for shares."}]}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"s": "Meanwhile, I freeze Crestline's accounts Friday morning. Every naira he stole comes back."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "And I make sure every camera and every journalist in Lagos is at that shareholders' meeting."}, {"d": "grinning"}, {"s": "If you're going to destroy a man, do it in good lighting."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "On Friday, I stand up in front of the shareholders and expose him. With evidence. On live television."}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "nervous"}, {"s": "Sir… Marcus doesn't lose quietly. When he loses, people get hurt."}]}, {"k": "act", "t": "Everyone looks at Ross. Donald's eyes move to the doorway, where Emma stands listening."}]}, {"n": 28, "title": "THE GARDEN", "slug": "EXT. DONALD'S MANSION — GARDEN — NIGHT", "time": "26:19–27:04", "items": [{"k": "act", "t": "Fairy lights over the pool. Emma sits on the edge with her feet in the water. Donald sits beside her and puts his expensive shoes on the grass."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Can I ask you something? Am I a project to you? The poor girl who needs saving?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "almost laughing"}, {"s": "Emma, you've never needed saving. You need someone to stand beside you and get out of your way."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "That's the most romantic thing anyone has ever said to me."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "sincere"}, {"s": "I made a promise when I was fifteen. No woman would ever distract me."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "And?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "And you are the most distracting thing that has ever happened to my life."}]}, {"k": "act", "t": "She leans in and kisses him, slowly and tenderly. The tension of the whole story breaks. They rest their foreheads together."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering"}, {"s": "After Friday, you're taking me on a real date. Not suya in a conference room."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "smiling"}, {"s": "I liked the suya."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "So did I."}]}]}, {"n": 29, "title": "FRIDAY", "slug": "INT. EVERYS — GRAND HALL — SHAREHOLDERS' MEETING — DAY", "time": "27:04–27:31", "items": [{"k": "act", "t": "Hundreds of shareholders. TV cameras. Flashing lights. Marcus Vane walks in wearing a white suit and a perfect smile and shakes hands like a man who already owns the room. Donald, at the podium, watches him."}, {"k": "act", "t": "Michael and Geoffrey are in the front row. Charles is at the side with a tablet. Ross's chair is empty."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "whispering"}, {"s": "Where's Ross?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "checking his phone"}, {"s": "He's not answering."}]}, {"k": "act", "t": "Donald's eyes go to Emma's seat. It's empty too."}]}, {"n": 30, "title": "THE MESSAGE", "slug": "INT. EVERYS — LADIES' RESTROOM — 20 MINUTES EARLIER", "time": "27:31–28:07", "items": [{"k": "act", "t": "Emma fixes her hair in the mirror. Her phone buzzes. The message is from ROSS."}, {"k": "card", "who": "ON SCREEN", "t": "Emma. They have Debby. Old Apapa wharf, Shed 9. Come alone. If you tell Donald, she dies. I'm so sorry."}, {"k": "act", "t": "Emma stares at it with her hand over her mouth. She tries to call Donald. The call goes straight to voicemail because his phone is off for the meeting. She looks at the door and then at her phone."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "to herself, terrified"}, {"s": "Ross… did you do it again?"}]}, {"k": "act", "t": "She makes a decision. She takes the silver fountain pen from her bag, scribbles on a sticky note and runs out."}]}, {"n": 31, "title": "THE NOTE", "slug": "INT. EVERYS — GRAND HALL — PRESENT", "time": "28:07–28:34", "items": [{"k": "act", "t": "Adaeze rushes to the stage and slips Donald a sticky note. It's stuck to Ross's silver fountain pen. Donald reads it."}, {"k": "card", "who": "ON PAPER", "t": "Apapa. Shed 9. Debby. Don't be angry. — E."}, {"k": "act", "t": "Donald's face drains of colour. At that exact moment, Marcus Vane looks across the hall at him, raises his glass slightly and smiles."}]}, {"n": 32, "title": "POWERLESS", "slug": "INT. EVERYS — GRAND HALL / BACKSTAGE — DAY", "time": "28:34–29:46", "items": [{"k": "act", "t": "Donald grips the podium. He goes ahead with the plan, because Emma would want him to."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Ladies and gentlemen. For fourteen months, someone has been stealing from this company to make it cheap enough to buy. That man is sitting in this room."}, {"d": "He points."}, {"s": "Marcus Vane."}]}, {"k": "act", "t": "Uproar. Cameras swing toward Marcus. Geoffrey's evidence fills the giant screen. Marcus doesn't flinch. He walks calmly to the stage, leans in close to Donald and slides his own phone across the podium."}, {"k": "act", "t": "On the screen is a VIDEO. Emma is being dragged into a white van, kicking and screaming."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"d": "whispering, smiling for the cameras"}, {"s": "Withdraw everything. Sign Everys over to me for one naira. You have until midnight. Or you'll never see her again."}]}, {"k": "act", "t": "Marcus straightens, waves at the cameras and walks out."}, {"k": "act", "t": "BACKSTAGE. Donald slams through a door and braces himself against the wall. His breathing goes ragged. FLASHBACK: the kerosene lamp, the policemen, his mother screaming."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "shaking"}, {"s": "Not again… not again…"}]}, {"k": "act", "t": "Michael and Geoffrey burst in. Michael grabs his shoulders."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Donald. Look at me. LOOK AT ME. The rooftop. Promise number five."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "We protect each other. Whatever it costs."}]}, {"k": "act", "t": "Donald looks at his brothers. His breathing slows. His eyes harden."}, {"k": "act", "t": "The door crashes open. ROSS staggers in with a bloody face and a torn shirt."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "That message wasn't from me! They took my phone this morning! They beat me and left me in a gutter on Ozumba Mbadiwe!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "grabbing him"}, {"s": "Where is she?"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "Not Apapa. Apapa is a trap. Marcus never keeps people where he says."}, {"d": "gasping"}, {"s": "He has an old boatyard in Epe. That's where he's keeping Debby. That's where Emma is."}]}]}, {"n": 33, "title": "THE PRICE (RETURN)", "slug": "INT. ABANDONED BOATYARD WAREHOUSE, EPE — NIGHT — HEAVY RAIN", "time": "29:46–30:31", "items": [{"k": "act", "t": "We are back in the cold open, now in full context. Emma is tied to the chair. Across from her, DEBBY is tied up too, crying and bruised. The phone on the oil drum rings: \"DONALD.\""}, {"k": "line", "who": "MARCUS", "tag": "V.O., through speaker", "segs": [{"s": "Answer it, Miss Reardon. Tell him the price."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "He won't pay. Donald Irwin doesn't pay ransoms."}]}, {"k": "line", "who": "MARCUS", "tag": "V.O.", "segs": [{"s": "Donald Irwin has never had anything worth paying for."}, {"d": "beat"}, {"s": "Until you."}]}, {"k": "act", "t": "The ringing stops. Emma looks at Debby."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Debby. Look at me. Ross didn't send that message, did he?"}]}, {"k": "line", "who": "DEBBY", "tag": "", "segs": [{"d": "sobbing"}, {"s": "They took his phone. He'd never… he loves you like a daughter."}]}, {"k": "act", "t": "Emma closes her eyes. Relief and heartbreak hit her together. Then she opens them and starts quietly twisting her wrists against the rope, which is rubbing on a rusted edge of the chair."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "barely audible"}, {"s": "Count the guards, Debby. Count them for me."}]}, {"k": "line", "who": "DEBBY", "tag": "", "segs": [{"s": "…Two. One by the door. One outside smoking."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Numbers don't lie."}]}]}, {"n": 34, "title": "THE STALL", "slug": "INT. MICHAEL'S RANGE ROVER, LEKKI–EPE EXPRESSWAY — NIGHT", "time": "30:31–31:07", "items": [{"k": "act", "t": "Rain and wipers. Michael drives like a madman. Geoffrey is in the back with a laptop. Donald is on the phone, and Ross sits beside him."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "on the phone, voice steady"}, {"s": "Marcus. You win. I'll sign. But I need proof she's alive."}]}, {"k": "line", "who": "MARCUS", "tag": "V.O.", "segs": [{"s": "Smart boy. Your father would be proud."}]}, {"k": "act", "t": "Donald's jaw clenches. He doesn't react."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "whispering"}, {"s": "Keep him talking. Thirty more seconds."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "And I have a drone crew shooting a film in Epe this week. Infrared cameras."}, {"d": "He presses his earpiece."}, {"s": "Tunde, get the bird in the air. Now!"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "looking up"}, {"s": "Got him. Old Ikosi boatyard. Ross was right."}]}, {"k": "act", "t": "Donald hangs up and looks at the black road ahead."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Michael. Faster."}]}]}, {"n": 35, "title": "CAUGHT", "slug": "INT. BOATYARD WAREHOUSE — NIGHT", "time": "31:07–31:43", "items": [{"k": "act", "t": "Emma's rope snaps. She quickly frees Debby. They creep toward a side door, and the guard by the main door has his back turned. Emma's hand is on the handle. Then the click of a gun behind them."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Leaving so soon?"}]}, {"k": "act", "t": "MARCUS VANE steps out of the darkness in his white suit, now speckled with rain. His men drag the women back."}]}, {"n": 36, "title": "THE TRUTH ABOUT MARCUS", "slug": "INT. BOATYARD WAREHOUSE — CONTINUOUS", "time": "31:43–32:27", "items": [{"k": "act", "t": "Marcus pulls up a crate and sits facing Emma as if they're having tea."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Why do you hate him so much?"}]}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Hate?"}, {"d": "laughs"}, {"s": "Fifteen years ago, I bid on the Lagos Port contract. My father's company. My family's name. Three generations of money. And a boy from Ajegunle, with a cheap suit and a borrowed laptop, took it from me in one meeting. They laughed at me in every club in Ikoyi."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "So this is about your pride."}]}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "This is about order. Men like him are supposed to serve men like me."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "leaning forward"}, {"s": "No. You were handed everything, and he still beat you."}, {"d": "beat"}, {"s": "That's what you can't forgive. Not him. Yourself."}]}, {"k": "act", "t": "Marcus's smile vanishes. He slaps her hard. Then, from outside—"}, {"k": "act", "t": "The low hum of a DRONE overhead."}, {"k": "act", "t": "Marcus looks up."}]}, {"n": 37, "title": "THE BROTHERS ARRIVE", "slug": "INT/EXT. BOATYARD WAREHOUSE — NIGHT", "time": "32:27–33:30", "items": [{"k": "act", "t": "The main doors burst open. Headlights flood in. Donald walks through the rain with no weapon and no fear on his face. Michael and Geoffrey are on either side of him and Ross is behind them. Sirens wail in the distance."}, {"k": "act", "t": "Marcus grabs Emma, pulls her up and presses a gun to her temple."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Stop! One more step, Irwin!"}]}, {"k": "act", "t": "Donald stops. He looks at Emma. Her eyes say, \"I'm okay.\""}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You wanted me powerless, Marcus. You've waited fifteen years to see me on my knees."}]}, {"k": "act", "t": "He slowly lowers himself to his knees in the wet concrete."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Here I am."}, {"d": "beat"}, {"s": "But look around you."}]}, {"k": "act", "t": "Marcus glances sideways. Police torches are flooding the windows. INSPECTOR BELLO's voice comes through a megaphone: \"Marcus Vane! Armed police! Drop your weapon!\""}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I'm on my knees. And I still came. That's the difference between us. Nobody would ever come for you."}]}, {"k": "act", "t": "Marcus's hand trembles. In that split second, Ross charges from the side and slams into Marcus. The gun goes off. BANG. Ross falls, clutching his shoulder."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "ROSS!"}]}, {"k": "act", "t": "Donald lunges and tackles Marcus to the ground. Michael kicks the gun away. Police pour in. Inspector Bello cuffs Marcus."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"d": "dragged away, screaming"}, {"s": "This isn't over, Irwin! You hear me?!"}]}, {"k": "line", "who": "INSPECTOR BELLO", "tag": "", "segs": [{"s": "For you, oga, it is very over."}]}]}, {"n": 38, "title": "NUMBERS DON'T LIE", "slug": "EXT. BOATYARD — AMBULANCE LIGHTS — NIGHT", "time": "33:30–33:57", "items": [{"k": "act", "t": "Rain is easing. Paramedics load Ross onto a stretcher, and Debby holds his hand. Emma runs over and kneels beside him."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "weak, smiling"}, {"s": "You're okay?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You took a bullet for me, you foolish old man."}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "I owed you more than that."}, {"d": "beat"}, {"s": "Numbers don't lie, Emma…"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "tears and a smile"}, {"s": "But people change."}]}, {"k": "act", "t": "Ross closes his eyes, smiling, as the ambulance doors shut."}, {"k": "act", "t": "Emma turns around. Donald stands behind her, soaked and shaking. She runs into his arms. He holds her as if he'll never let go."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "into her hair"}, {"s": "I thought I'd lost you."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You negotiate like a criminal. I knew you'd find me."}]}]}, {"n": 39, "title": "THE FAMILY", "slug": "INT. HOSPITAL CORRIDOR, IKOYI — DAWN", "time": "33:57–34:15", "items": [{"k": "act", "t": "Emma sits with a bandage on her cheek. DR. and MRS. REARDON rush in and hold her tightly. Then Dr. Reardon sees JAMES standing further down the corridor with his guitar case. Father and son look at each other for a long time."}, {"k": "line", "who": "DR. REARDON", "tag": "", "segs": [{"d": "voice breaking"}, {"s": "James."}]}, {"k": "line", "who": "JAMES", "tag": "", "segs": [{"s": "Daddy."}]}, {"k": "act", "t": "Dr. Reardon walks over. He hesitates, then pulls his son into his arms."}, {"k": "line", "who": "DR. REARDON", "tag": "", "segs": [{"s": "Six years. I was a fool. Both my children are braver than I am."}]}, {"k": "act", "t": "Emma watches and cries. Donald stands quietly beside her."}]}, {"n": 40, "title": "THE SECOND ROOFTOP", "slug": "EXT. EVERYS TOWER — ROOFTOP — SUNSET — SIX WEEKS LATER", "time": "34:15–34:42", "items": [{"k": "act", "t": "Golden light over the Lagos lagoon. Emma steps onto the rooftop, confused, in a white dress. Donald waits, nervous for the first time in his life."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Adaeze said there was an emergency."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "There is."}, {"d": "He breathes."}, {"s": "Twenty-five years ago, on a rooftop in Ajegunle, I made a promise that no woman would ever distract me from my ambitions."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I remember. You told me."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I've kept every promise I ever made."}, {"d": "He kneels and opens a ring box."}, {"s": "I'd like to break that one. On a rooftop. With you. Emma Reardon, will you marry me?"}]}, {"k": "act", "t": "Emma covers her mouth. A long beat. Then a stubborn smile."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "On one condition."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "smiling"}, {"s": "Of course there's a condition."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You never, ever rewrite my reports in red ink again."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "…Negotiable."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Donald!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Deal. Deal!"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "laughing and crying"}, {"s": "Yes. Yes!"}]}, {"k": "act", "t": "He slips the ring on her finger. Behind a ventilation unit, Michael and Geoffrey jump out cheering, and Michael pops a bottle of champagne."}]}, {"n": 41, "title": "THE FIRST BIG WIN", "slug": "EXT. EVERYS ROOFTOP — CONTINUOUS — SUNSET", "time": "34:42–35:00", "items": [{"k": "act", "t": "Charles, Tobi and Adaeze come up the stairs clapping. Behind them, slowly, comes ROSS, with his arm in a sling and DEBBY at his side. The laughter fades. Emma and Ross look at each other."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "quietly"}, {"s": "I didn't think I'd be welcome."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "walking to him"}, {"s": "You took a bullet for me, Ross. You're always welcome."}]}, {"k": "act", "t": "She hugs him gently around his sling. Debby wipes her eyes."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "taking an envelope from his jacket"}, {"s": "Since we're all here. Charles?"}]}, {"k": "line", "who": "CHARLES", "tag": "", "segs": [{"d": "reading it out
