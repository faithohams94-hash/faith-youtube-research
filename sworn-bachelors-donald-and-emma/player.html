<style>
/* Layout: one centred "stage" column like a lit set; scene unfolds line by line; remote-control bar pinned to the bottom. Deliberately single dark look (night-time Lagos, kerosene lamp). */
:root{
  --night:#0e1120; --stage:#161a2c; --stage2:#1d2238; --rule:#2b3150;
  --ink:#efe8db; --muted:#a3a0b4; --faint:#6e6c82;
  --lamp:#e9a23b; --lamp-ink:#1b1306; --blood:#d0525a; --ok:#7fd49a;
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --slug:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:10px 16px 8px}
.hrow{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,26px);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--rule);background:var(--stage);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--lamp)}
.score{font-family:var(--slug);font-size:12px;color:var(--muted)}
.score b{color:var(--lamp)}
.ticks{max-width:820px;margin:8px auto 0;display:grid;grid-template-columns:repeat(45,1fr);gap:2px}
.ticks button{height:6px;border:0;border-radius:2px;background:var(--rule);padding:0}
.ticks button.seen{background:color-mix(in srgb,var(--lamp) 45%,var(--rule))}
.ticks button.now{background:var(--lamp)}

main{max-width:820px;margin:0 auto;padding:24px 16px}
.scenehead{padding-block:8px 18px;border-bottom:1px dashed var(--rule);margin-bottom:18px}
.scenehead .num{font-family:var(--slug);color:var(--lamp);font-size:13px;letter-spacing:.12em}
.scenehead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.scenehead .slug{font-family:var(--slug);font-size:13px;color:var(--muted);text-transform:uppercase}
.scenehead .slug span{color:var(--faint)}
.scenehead.enter h2{animation:rise .7s ease both}
@keyframes rise{from{opacity:.2;transform:translateY(8px);letter-spacing:.04em}to{opacity:1;transform:none}}

.feed{display:flex;flex-direction:column;gap:14px}
.it{transition:opacity .3s, transform .3s;opacity:.55}
.it.cur{opacity:1}
.it.fresh{animation:appear .45s ease both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.act{font-style:italic;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 14px;max-width:62ch}
.it.cur.act{border-left-color:var(--lamp);color:var(--ink)}
.line{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--slug);font-weight:700;font-size:13px;color:var(--night);background:var(--c)}
.bub{min-width:0}
.who{font-family:var(--slug);font-weight:700;font-size:12.5px;letter-spacing:.08em;color:var(--c)}
.who em{font-style:normal;color:var(--faint);font-weight:400;margin-left:6px}
.say{background:var(--stage);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:10px 14px;margin-top:4px;font-size:17px;max-width:62ch}
.it.cur .say{border-color:var(--c);background:var(--stage2);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 8px 30px -12px color-mix(in srgb,var(--c) 50%,transparent)}
.dir{color:var(--faint);font-style:italic;font-size:14px}
.word.spoken{color:var(--c)}
.narr .say{background:transparent;border:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);border-radius:0;font-family:var(--display);font-size:20px;line-height:1.35;padding:12px 2px}
.narr .av{background:transparent;border:1px solid var(--lamp);color:var(--lamp)}
.it.cur.narr .say{box-shadow:none;background:transparent;border-color:var(--lamp)}
.card{align-self:center;text-align:center;background:#0a0c16;border:1px solid var(--blood);border-radius:12px;padding:16px 20px;max-width:520px;width:100%}
.card small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.16em;color:var(--blood);margin-bottom:6px}
.card p{margin:0;font-family:var(--slug);font-size:18px;font-weight:700}
.card.paper{background:#f1e7cf;border-color:#c9b98f;color:#2a2318}
.card.paper small{color:#8a6d2c}
.card.mw{background:transparent;border-color:var(--lamp);border-style:dashed}.card.mw small{color:var(--lamp)}
.titlecard{text-align:center;font-family:var(--display);font-size:clamp(22px,5vw,32px);color:var(--lamp);padding:28px 0;letter-spacing:.02em;text-wrap:balance}

.endbox{margin-top:26px;border:1px solid var(--rule);background:var(--stage);border-radius:16px;padding:18px}
.endbox h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.endbox p{margin:0 0 12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{background:var(--stage2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:left}
.opt:hover{border-color:var(--lamp)}
.opt.pick{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 18%,var(--stage2))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{background:var(--lamp);color:var(--lamp-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.count{font-family:var(--slug);font-size:12px;color:var(--faint)}
.reveal{margin-top:18px;border-radius:14px;padding:14px 16px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--stage))}
.reveal.miss{border-color:var(--blood);background:color-mix(in srgb,var(--blood) 10%,var(--stage))}
.reveal b{font-family:var(--slug);letter-spacing:.1em;font-size:12px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--stage) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dk{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.ctl button{background:var(--stage2);border:1px solid var(--rule);border-radius:999px;width:44px;height:44px;display:grid;place-items:center}
.ctl button:hover{border-color:var(--lamp)}
.ctl .play{width:60px;height:60px;background:var(--lamp);border:0;color:var(--lamp-ink)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl .play svg{width:26px;height:26px}
.opts2{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.opts2 label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts2 select{background:var(--stage2);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:3px 6px;font:inherit}
.nowline{font-family:var(--slug);font-size:12px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.drawer{position:fixed;inset:0;z-index:10;display:flex;justify-content:flex-end;background:rgba(5,6,12,.6)}
.drawer .pane{width:min(420px,100%);height:100%;background:var(--stage);border-left:1px solid var(--rule);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
.pane h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sl{display:flex;flex-direction:column;gap:2px}
.sl button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px}
.sl button:hover{background:var(--stage2)}
.sl button.now{background:color-mix(in srgb,var(--lamp) 16%,transparent)}
.sl .n{font-family:var(--slug);color:var(--lamp);font-size:12px}
.sl .t{min-width:0}
.sl .tm{font-family:var(--slug);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sl .seen .t::after{content:" ✓";color:var(--ok);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--night);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.hint{color:var(--faint);font-size:13px;text-align:center;margin-top:28px}
kbd{font-family:var(--slug);border:1px solid var(--rule);border-radius:4px;padding:0 4px;font-size:12px}
@media (max-width:520px){.score{display:none}.say{font-size:16px}.line{grid-template-columns:34px 1fr;gap:10px}.av{width:34px;height:34px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const SCENES = [{"n": 1, "title": "STILL SWORN", "slug": "EXT. ROOFTOP, AJEGUNLE — NIGHT — PRESENT DAY", "time": "0:00–1:00", "items": [{"k": "act", "t": "The rusty rooftop of an old face-me-I-face-you building. It is cleaned up now, with fairy lights, three leather chairs and a small table with three glasses. Below, generators hum. Far away, Victoria Island glitters. Three powerful men in expensive clothes sit where they once sat as hungry boys: DONALD IRWIN, MICHAEL McCLAREN and GEOFFREY DUROSE."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "raising his glass"}, {"s": "Twenty-three years, gentlemen. Twenty-three years, and not one woman has caught us."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Not one."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Not one."}]}, {"k": "act", "t": "They clink. Then, by tradition, Michael asks it."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Still sworn?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "a tiny pause"}, {"s": "Still sworn."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "without blinking"}, {"s": "Still sworn."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Still sworn!"}]}, {"k": "act", "t": "They drink. Donald's phone vibrates in his pocket and he doesn't check it. Michael's phone vibrates and he flips it face down. Geoffrey glances at a folded paper in his jacket and buttons the jacket."}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "Three best friends. Three promises. And that night, on the rooftop where it all began, three lies."}, {"d": "beat"}, {"s": "To understand how the most powerful men in Lagos ended up lying to each other, you have to go back to the night they made the promise."}]}]}, {"n": 2, "title": "PREAMBLE: THREE BOYS, ONE VOW", "slug": "EXT. SAME ROOFTOP, AJEGUNLE — NIGHT — TWENTY-THREE YEARS AGO", "time": "1:00–2:29", "items": [{"k": "act", "t": "Rusty zinc, no lights, no chairs. YOUNG DONALD (14), YOUNG MICHAEL (14) and YOUNG GEOFFREY (14) share one bottle of Fanta. In front of them on a flattened carton is a handwritten \"share certificate\": THREE BOYS VENTURES, CAPITAL: ₦3,000."}, {"k": "line", "who": "YOUNG MICHAEL", "tag": "", "segs": [{"s": "Three thousand naira. We're officially businessmen."}]}, {"k": "line", "who": "YOUNG GEOFFREY", "tag": "", "segs": [{"s": "We're officially boys who sold recharge cards for four months."}]}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"s": "It's a start."}, {"d": "He tears the certificate carefully into three pieces and hands one to each of them."}, {"s": "One for each of us. Nobody can ever say this company belongs to one person."}]}, {"k": "line", "who": "YOUNG MICHAEL", "tag": "", "segs": [{"s": "So what are the rules, Chairman?"}]}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"s": "One. We become successful. Two. We take care of our families. Three. We never come back to this."}, {"d": "He looks at the zinc and the darkness."}, {"s": "Never."}]}, {"k": "line", "who": "YOUNG MICHAEL", "tag": "", "segs": [{"s": "And four. No girls. Girls make men stupid. My uncle sold his shop for a girl in Ibadan. Now he sells pure water."}]}, {"k": "line", "who": "YOUNG GEOFFREY", "tag": "", "segs": [{"d": "laughing"}, {"s": "Fine. No girls. And whoever falls in love first?"}]}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"s": "He comes back to this rooftop, hands his piece of the company to the other two, and confesses. Out loud. Like a fool."}]}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"s": "And five. We protect each other. Whatever it costs."}]}, {"k": "line", "who": "YOUNG MICHAEL", "tag": "", "segs": [{"s": "Deal! Because it won't be me."}]}, {"k": "line", "who": "YOUNG GEOFFREY", "tag": "", "segs": [{"s": "It won't be me."}]}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"d": "very serious"}, {"s": "It will never be me."}]}, {"k": "act", "t": "Hands stacked together."}, {"k": "line", "who": "ALL THREE", "tag": "", "segs": [{"s": "Sworn."}]}, {"k": "act", "t": "Young Geoffrey looks down at his piece of paper, suddenly quiet."}, {"k": "line", "who": "YOUNG GEOFFREY", "tag": "", "segs": [{"s": "My father says we're moving next month. To Ikoyi. He says \"something happened\" and now we're rich."}, {"d": "beat"}, {"s": "He won't tell me what happened."}]}, {"k": "act", "t": "Michael and Donald exchange a look. Nobody knows what to say."}]}, {"n": 3, "title": "PREAMBLE: THE NIGHT THAT MADE DONALD", "slug": "INT. ONE-ROOM APARTMENT, AJEGUNLE — NIGHT — TWO YEARS EARLIER", "time": "2:29–3:35", "items": [{"k": "act", "t": "A kerosene lamp. YOUNG DONALD (12) does homework on the floor. His MOTHER, young and beautiful, stirs a pot of stew. MR. IRWIN's empty chair waits at the small table."}, {"k": "line", "who": "MOTHER", "tag": "", "segs": [{"s": "Your papa promised meat today. It's payday. The company pays at night, he said."}]}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"s": "Papa said when I'm big, I'll have a company that pays in the day. So nobody walks home in the dark."}]}, {"k": "act", "t": "A hard knock. Two POLICEMEN stand at the door, hats in their hands. The spoon falls."}, {"k": "line", "who": "POLICEMAN", "tag": "", "segs": [{"s": "Madam… your husband. By the bus stop. Robbers. They took everything he was carrying."}]}, {"k": "act", "t": "His mother screams and folds to the floor. Young Donald doesn't cry. He stares at the empty chair. The lamp flickers."}, {"k": "line", "who": "YOUNG DONALD", "tag": "", "segs": [{"d": "whispering"}, {"s": "Nobody will ever take from me again. Never again will I be powerless. Never."}]}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "That night, a boy stopped crying. Over the years, he also stopped trusting, stopped resting and stopped letting anything happen that he didn't control."}, {"d": "beat"}, {"s": "It made him rich. It also made him very, very hard to love."}]}]}, {"n": 4, "title": "PREAMBLE: BUILDING THE EMPIRE", "slug": "MONTAGE — LAGOS — TWENTY YEARS IN TWO MINUTES", "time": "3:35–4:44", "items": [{"k": "act", "t": "Quick cuts. Fifteen-year-old Donald sells recharge cards in Lagos traffic, sweating. Michael films a wedding with a borrowed camera. Geoffrey counts their money by candlelight in a notebook."}, {"k": "line", "who": "YOUNG MICHAEL", "tag": "", "segs": [{"d": "holding up a rusty yellow danfo bus key"}, {"s": "We bought a bus! An actual bus!"}]}, {"k": "line", "who": "YOUNG GEOFFREY", "tag": "", "segs": [{"s": "We bought a bus that doesn't have brakes."}]}, {"k": "act", "t": "The bus breaks down on Third Mainland Bridge in the rain. The three young men push it, laughing and crying at the same time."}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "They failed together. They recovered together. When one rose, he pulled the others up."}]}, {"k": "act", "t": "Twenty-two-year-old Donald signs a lease for a tiny logistics office. Michael's first film premieres in a half-empty cinema, and Donald and Geoffrey sit in the front row clapping like a stadium. Geoffrey, now in a suit, takes over his father's company, Durose Holdings, and looks lonely in a huge office."}, {"k": "act", "t": "Then the EVERYS CONGLOMERATE tower rises over Victoria Island. Logos appear one after another: EVERYS PORTS. EVERYS TELECOM. EVERYPAY. EVERYS EKO ATLANTIC."}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "By thirty-seven, Donald Irwin owned ports, phone networks, a fintech that moved half of Lagos's money and a skyline in Eko Atlantic. He kept every promise he made on that rooftop."}, {"d": "beat"}, {"s": "Until a girl with a red pen walked into his life."}]}]}, {"n": 5, "title": "THE MAN WHO CONTROLS EVERYTHING", "slug": "INT. EVERYS TOWER — BOARDROOM, 40TH FLOOR — DAY", "time": "4:44–5:43", "items": [{"k": "act", "t": "Glass walls over the lagoon. Twelve executives sit in silence. DONALD stands at the head of the table and doesn't sit, because sitting is for people who have time."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "The Halbrook Shipping acquisition. Where are we?"}]}, {"k": "line", "who": "EXECUTIVE", "tag": "", "segs": [{"s": "Sir, the numbers are… mostly stable—"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "\"Mostly\" is a word people use when they've stopped counting."}, {"d": "He swipes his tablet. Every phone in the room buzzes at once."}, {"s": "I've moved all your meetings to 6 a.m. tomorrow. All of them. We'll count together."}]}, {"k": "act", "t": "Groans are swallowed. He walks out. ADAEZE, his PA, matches his pace with practiced speed."}, {"k": "line", "who": "ADAEZE", "tag": "", "segs": [{"s": "Sir, your mother called. Twice. And you've scheduled lunch for 12:07 again. Nobody eats lunch at 12:07."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I do."}]}, {"k": "line", "who": "ADAEZE", "tag": "", "segs": [{"s": "Sir, with respect, you schedule your sleep."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Sleep is the only meeting nobody else attends."}, {"d": "beat"}, {"s": "Who runs Finance Operations while Ross is on leave?"}]}, {"k": "line", "who": "ADAEZE", "tag": "", "segs": [{"d": "checking"}, {"s": "A Miss Emma Reardon. Three months in the company."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Three months, running Halbrook's accounts during an acquisition."}, {"d": "cold"}, {"s": "Send me her report. Tonight."}]}]}, {"n": 6, "title": "MAMA", "slug": "INT. MAMA IRWIN'S HOUSE, IKEJA GRA — EVENING", "time": "5:43–6:36", "items": [{"k": "act", "t": "A comfortable, quiet home Donald bought for her. MAMA IRWIN (64), gentle and a little fragile, sits on a sofa shelling egusi seeds. Donald sits beside her and takes his shoes off. Here, and only here, he looks like somebody's son."}, {"k": "line", "who": "MAMA IRWIN", "tag": "", "segs": [{"s": "You came late again."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I came, Mama. That's the important part."}]}, {"k": "line", "who": "MAMA IRWIN", "tag": "", "segs": [{"s": "Your cousin Ngozi has three children. Three. Even the gateman's son is getting married."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "smiling"}, {"s": "Mama, not today."}]}, {"k": "line", "who": "MAMA IRWIN", "tag": "", "segs": [{"s": "When then? When I'm in the ground?"}, {"d": "She takes his hand."}, {"s": "Donald. I watched you build walls since you were twelve. Walls keep out thieves. But they also keep out wives."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I don't need a wife, Mama. I need control. Love is just… losing control with extra steps."}]}, {"k": "line", "who": "MAMA IRWIN", "tag": "", "segs": [{"d": "laughing softly"}, {"s": "Your father said the same thing."}, {"d": "beat"}, {"s": "Before he met me."}]}, {"k": "act", "t": "Donald laughs, but something flickers in his eyes. His phone buzzes. It's Emma Reardon's report, arriving."}]}, {"n": 7, "title": "THE DAUGHTER WHO SAID NO", "slug": "INT. REARDON FAMILY HOME, IKOYI — DINING ROOM — NIGHT", "time": "6:36–7:24", "items": [{"k": "act", "t": "Elegant. Both parents still wear their hospital lanyards. EMMA pushes jollof rice around her plate."}, {"k": "line", "who": "DR. REARDON", "tag": "", "segs": [{"s": "Emma, one phone call and you're in medical school by January. I'll pay for everything."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Daddy, I don't want your money. I have a job."}]}, {"k": "line", "who": "MRS. REARDON", "tag": "", "segs": [{"s": "You count other people's money for a man who doesn't know your name."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "putting down her fork"}, {"s": "Then one day he'll learn it."}]}, {"k": "line", "who": "DR. REARDON", "tag": "", "segs": [{"s": "This is how it started with your brother. A dream, a guitar—"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "James. His name is James. Six years, and you still can't say it."}]}, {"k": "act", "t": "Silence. Emma kisses her mother's cheek and takes her bag."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I'm not running away, Mummy. I'm walking. There's a difference."}]}, {"k": "act", "t": "She leaves. Her father looks at the empty chair where his son used to sit."}]}, {"n": 8, "title": "THE MENTOR'S GIFT", "slug": "INT. EVERYS — FINANCE OPERATIONS FLOOR, 14TH FLOOR — MORNING", "time": "7:24–8:12", "items": [{"k": "act", "t": "ROSS (45), kind and fatherly, packs a box. Emma watches, nervous. TOBI hovers with tea."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "You're the sharpest person on this floor. You'll be fine."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Ross, I've been here three months. Halbrook alone is a monster."}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "handing her a heavy silver fountain pen"}, {"s": "My first boss gave me this. Sign your first big win with it. And remember the only rule I ever taught you."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "smiling"}, {"s": "\"Numbers don't lie. People do.\""}]}, {"k": "act", "t": "His phone buzzes. The screen shows one letter: \"D.\" He snatches it, and his face goes grey."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "Debby. Family wahala."}, {"d": "He lifts the box."}, {"s": "Emma, if anything about Halbrook ever looks strange…"}, {"d": "He stops himself."}, {"s": "Never mind. Old man's worries."}]}, {"k": "act", "t": "The lift doors close on his sad eyes."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "That man is hiding something."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Tobi, everybody is hiding something."}]}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Yes, but his own is sweating."}]}]}, {"n": 9, "title": "THE EMAIL", "slug": "INT. EVERYS — EMMA'S DESK — NIGHT", "time": "8:12–8:36", "items": [{"k": "act", "t": "11:47 p.m. Files pile up, red deadline alerts glow and cold coffee sits on the desk. Emma rubs her eyes. Tobi is half asleep on a chair."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"s": "Emma, go home. Even the generator has gone home."}]}, {"k": "act", "t": "The computer pings. NEW EMAIL. FROM: Donald Irwin, CEO."}, {"k": "card", "who": "ON SCREEN", "t": "Be in my office by 10 a.m."}, {"k": "act", "t": "Nothing else."}, {"k": "line", "who": "TOBI", "tag": "", "segs": [{"d": "suddenly wide awake"}, {"s": "Ehn. Emma. Write your will. Leave me your shoes."}]}]}, {"n": 10, "title": "PAGE ELEVEN", "slug": "INT. DONALD'S OFFICE, 40TH FLOOR — 9:58 AM", "time": "8:36–10:00", "items": [{"k": "act", "t": "Cold, huge, perfect. Donald reads her report, which is already bleeding red ink. He doesn't look up."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Sit."}]}, {"k": "act", "t": "She sits. Ten seconds of pages turning."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Miss Reardon. Did you write this, or did it happen to you?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I wrote it, sir."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Then you should apologise to it. Your forecast is optimistic, your summary is soft, and you missed two deadlines."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "My department lost its manager three weeks ago and nobody replaced him. I'm doing two jobs on one salary."}]}, {"k": "act", "t": "He looks up. Their eyes meet for the first time."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Is that an excuse?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "It's a fact. You like facts, don't you? I've read your interviews."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "dangerously quiet"}, {"s": "Careful."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "With respect, sir, you've torn me apart without asking one question about the numbers. If you had, you'd know page eleven is the most important page in that report. And you skipped it."}]}, {"k": "act", "t": "Nobody has spoken to him like this in ten years. Slowly, he turns to page eleven."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Get out, Miss Reardon."}]}, {"k": "act", "t": "She stands with her chin high and walks out. The door clicks shut. Donald reads page eleven. In the margin, in small, neat handwriting:"}, {"k": "card", "who": "ON PAPER", "t": "Halbrook — 0.3% missing every month. Same day. Same amount. Who?"}, {"k": "act", "t": "He reads it three times. Then, for the first time in years, Donald Irwin smiles at something that isn't a profit."}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "He had read ten thousand reports in his life. This was the first one he would remember."}]}]}, {"n": 11, "title": "ASKING FOR A FRIEND", "slug": "INT. DONALD'S CAR, THIRD MAINLAND BRIDGE / INT. MICHAEL'S FILM SET — NIGHT — INTERCUT", "time": "10:00–10:57", "items": [{"k": "act", "t": "Donald sits in the back of his car, staring at page eleven again. He calls Michael. Michael answers on a busy film set, with lights and crew everywhere."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Chairman! You never call after 9 p.m. Who died?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Nobody died. Question. Theoretical."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I love theoretical."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "If a man can't stop thinking about… a report."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "A report."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "A report. Written by a… person. And the man reads it three times. Not for the numbers."}]}, {"k": "act", "t": "A long pause on Michael's end."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Donald. Is this \"report\" wearing heels?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "instantly"}, {"s": "Goodnight, Michael."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Donald! DONALD! Are you breaking the—"}]}, {"k": "act", "t": "Donald hangs up. On set, Michael laughs and turns around. A WOMAN'S VOICE calls from behind a trailer: \"Michael, are you coming or not?\" His smile disappears. He looks around to check that nobody heard."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "hissing toward the trailer"}, {"s": "Sophia! I said wait in the car!"}]}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "Donald thought he was the only one with something to hide."}, {"d": "beat"}, {"s": "He wasn't."}]}]}, {"n": 12, "title": "QUIETLY", "slug": "INT. EVERYS — FINANCE FLOOR — 8:30 PM", "time": "10:57–11:42", "items": [{"k": "act", "t": "The floor is empty. Emma packs up. Expensive footsteps approach. Donald stands there with her report."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "If you've come to fire me, you could have sent another one-line email."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Page eleven. Explain it."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Every month, Halbrook loses point three percent. Too small for an audit. Fourteen months running. Same day, same amount. Numbers don't lie."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "quietly"}, {"s": "People do."}]}, {"k": "act", "t": "She blinks. He finished Ross's sentence."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Investigate it. Quietly. You report to nobody but me. Not your colleagues. Not your manager. Nobody."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Why me?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Because you looked at that number and didn't look away."}, {"d": "turning to go"}, {"s": "And your report was still bad."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Your email was worse!"}]}, {"k": "act", "t": "He keeps walking and doesn't let her see him smile."}]}, {"n": 13, "title": "MALLAM ISA'S SUYA", "slug": "INT. EVERYS — SMALL CONFERENCE ROOM — MIDNIGHT — ONE WEEK LATER", "time": "11:42–12:53", "items": [{"k": "act", "t": "Papers everywhere. Emma is barefoot and drawing arrows on a whiteboard. Donald enters with a parcel wrapped in old newspaper, and the smell of suya fills the room."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You brought suya? Billionaires eat suya?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Not this suya. This is Mallam Isa's. Ebute-Metta, by the old railway yard. Best in Lagos."}, {"d": "He sits and unwraps it."}, {"s": "When I was fifteen, he gave me suya on credit for a whole year. Never wrote it down."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Did you pay him back?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I bought him a house. He still sells suya under the same umbrella. Says the trains are good for business."}, {"d": "He holds out a stick."}, {"s": "Eat."}]}, {"k": "act", "t": "They eat. For a moment, they are just two people at midnight."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "The money goes to a vendor called Crestline Logistics. No trucks. No staff. No office. And the payments are approved inside Everys by someone with senior access."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "stops chewing"}, {"s": "How senior?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Senior enough that if I say a name before I'm sure, I'm finished."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You have pepper on your lip."}]}, {"k": "act", "t": "She wipes it, embarrassed. He laughs, a real laugh, rusty from lack of use."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You laugh?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Tell nobody. I'll deny it under oath."}]}]}, {"n": 14, "title": "THE MAN IN THE WHITE SUIT", "slug": "INT. MARCUS VANE'S MANSION, BANANA ISLAND — STUDY — NIGHT", "time": "12:53–13:33", "items": [{"k": "act", "t": "Dark wood, a chessboard and an old framed photo of a trucking company sign: VANE HAULAGE, EST. 1979. MARCUS VANE (52), silver-haired and in a silk robe, makes a call on a burner phone."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "She found Crestline."}]}, {"k": "line", "who": "DISTORTED VOICE", "tag": "", "segs": [{"s": "I'll send her a warning. She'll stop."}]}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Warnings are for children."}, {"d": "He looks at the old photo."}, {"s": "Twenty years, I've waited. Halbrook bleeds, Everys's share price falls, and when it's cheap enough, I buy the boy who bought my father."}, {"d": "beat"}, {"s": "Don't fail me. Remember who holds Debby's debts."}]}, {"k": "act", "t": "He hangs up and moves a white knight across the board."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Donald Irwin has no weakness. No wife. No children. No heart."}, {"d": "He smiles."}, {"s": "Yet."}]}]}, {"n": 15, "title": "ROOFTOP NIGHT", "slug": "EXT. AJEGUNLE ROOFTOP — NIGHT — (THE COLD OPEN, CONTINUED)", "time": "13:33–14:34", "items": [{"k": "act", "t": "We are back in Scene 1, right after \"Still sworn.\" The glasses go down."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "leaning in"}, {"s": "So, Donald. Who's the report?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "There's no report."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "You called me at 9 p.m. to ask about a report \"not for the numbers.\""}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "It was a work question."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Geoffrey, he's blushing. Look at his ears."}]}, {"k": "act", "t": "Donald's phone buzzes. He glances at it. \"E. Reardon: Found something. Call me.\" He puts it away too fast."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "changing the subject, aggressive"}, {"s": "What about you, Michael? Who's \"Script Supervisor\"? She calls you eleven times a day."}]}, {"k": "act", "t": "Michael freezes."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "She… supervises scripts."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "At 2 a.m.?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Scripts don't sleep, Donald!"}]}, {"k": "act", "t": "They both turn to Geoffrey, who is already standing and buttoning his jacket."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I have an early board meeting."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "It's Saturday."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "already leaving"}, {"s": "It's an early Saturday board meeting."}]}, {"k": "act", "t": "He's gone. Michael and Donald stare at each other, each knowing the other is lying and neither able to say it."}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "That's the problem with three liars on one rooftop. Nobody can point a finger without three pointing back."}]}]}, {"n": 16, "title": "THE OTHER SECRET", "slug": "INT. DUROSE HOLDINGS — JACOB DUROSE'S OLD OFFICE — SAME NIGHT", "time": "14:34–15:10", "items": [{"k": "card", "who": "MEANWHILE", "t": "Same night. Across the lagoon."}, {"k": "act", "t": "Dust sheets cover the furniture. Geoffrey enters alone with a torch. He unlocks a drawer in his late father's desk with a small brass key. Inside is one old photograph. Two young men stand in front of a tiny office: JACOB DUROSE and another man. On the back, in faded ink: \"Jacob & Elias. Partners forever. 1998.\""}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "whispering"}, {"s": "Partners? Papa, you told me you built it alone."}]}, {"k": "act", "t": "His phone lights up with an unknown number. A woman's voice comes through when he answers."}, {"k": "line", "who": "OLIVIA", "tag": "V.O.", "segs": [{"s": "You found it, didn't you, Mr. Durose? Meet me tomorrow. Alone."}]}, {"k": "act", "t": "Click. Geoffrey stares at the photograph. Every brother has a secret now."}]}, {"n": 17, "title": "THE FIRST WARNING", "slug": "INT. EMMA'S CAR — EVERYS CAR PARK — NIGHT", "time": "15:10–15:29", "items": [{"k": "act", "t": "Emma throws her bag on the seat. Her phone buzzes with an UNKNOWN NUMBER."}, {"k": "card", "who": "ON SCREEN", "t": "STOP LOOKING INTO HALBROOK OR ELSE."}, {"k": "act", "t": "She freezes and scans the dark pillars. A security light flickers. A car door shuts somewhere."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering"}, {"s": "Who are you?"}]}, {"k": "act", "t": "She drives off. Behind her, a black SUV with its headlights off pulls out and follows."}]}, {"n": 18, "title": "\"YOU'RE MY RESPONSIBILITY\"", "slug": "INT. DONALD'S OFFICE — NEXT MORNING", "time": "15:29–17:08", "items": [{"k": "act", "t": "Emma walks in without knocking. Adaeze fails to stop her. Emma puts the phone on his desk. As Donald reads it, a second message arrives with PHOTOGRAPHS: Emma at her door, Emma at the supermarket, Emma asleep in traffic."}, {"k": "card", "who": "ON SCREEN", "t": "WE SEE YOU, EMMA."}, {"k": "act", "t": "Donald's knuckles go white."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "intercom"}, {"s": "Adaeze. Two guards on Miss Reardon. Around the clock. A driver. Armoured car. And move her into one of our serviced apartments in Eko Atlantic, tonight."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Excuse me? No. Absolutely not."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "It's not a request."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I didn't refuse my father's money so another man could put me in a cage!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "It's not a cage. It's a—"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "A cage with a nicer view is still a cage, Donald!"}]}, {"k": "act", "t": "It's the first time she has used his first name. They both hear it."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "quieter"}, {"s": "Someone stood outside your door, Emma."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Then let me decide how scared to be. One guard. My car. My apartment."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Two guards."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "One."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "…Two, and I'll stop talking about the apartment."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You negotiate like a criminal."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I learned from them."}]}, {"k": "act", "t": "She leaves. Donald stares at the door, then presses the intercom again, quietly."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Adaeze. Send someone from IT. Install location tracking on her company phone. Silently."}]}, {"k": "line", "who": "ADAEZE", "tag": "", "segs": [{"d": "after a pause"}, {"s": "Sir… she didn't agree to that."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "She'll thank me."}]}, {"k": "line", "who": "ADAEZE", "tag": "", "segs": [{"d": "softly"}, {"s": "Sir, nobody has ever thanked anybody for that."}]}, {"k": "act", "t": "He doesn't answer. Adaeze sighs and makes the call."}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "It was the kind of decision Donald had made a thousand times: quiet, fast and for her own good. He didn't know yet that it would cost him the one thing he couldn't buy back."}]}]}, {"n": 19, "title": "THE MIRROR", "slug": "INT. DONALD'S MANSION, LEKKI — MASTER BATHROOM — NIGHT", "time": "17:08–17:57", "items": [{"k": "act", "t": "Donald stands at the mirror in a white vest and practises, like a man rehearsing a lie for court."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I am not in love."}, {"d": "beat"}, {"s": "She is an employee."}, {"d": "beat"}, {"s": "A very irritating employee."}, {"d": "beat"}, {"s": "With very nice handwriting."}]}, {"k": "act", "t": "He groans and leans on the sink."}, {"k": "act", "t": "He walks to his bedside, where an old faded photo of MR. IRWIN, smiling in a driver's uniform, stands in a cheap frame among the luxury."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Papa. You died because you trusted the night. I built a whole life so I'd never trust anything I can't control."}, {"d": "beat"}, {"s": "And now there's a woman I can't control, and I can't stop thinking about her."}, {"d": "beat"}, {"s": "What do I do?"}]}, {"k": "act", "t": "The photo, of course, says nothing. Donald switches off the light. In the dark, his phone lights up: \"E. Reardon: Goodnight, Mr. Criminal.\" He smiles at the ceiling like a teenager."}]}, {"n": 20, "title": "TWO PLATES OF JOLLOF", "slug": "INT. DONALD'S MANSION — KITCHEN — NIGHT", "time": "17:57–19:12", "items": [{"k": "act", "t": "Emma and Donald have papers spread over the kitchen island, with two plates of jollof and two glasses of zobo. She's laughing at something he said. The intercom buzzes. SECURITY (V.O.): \"Sir, Mr. McClaren is at the gate. He says he's already inside.\""}, {"k": "act", "t": "The front door bangs open."}, {"k": "line", "who": "MICHAEL", "tag": "O.S.", "segs": [{"s": "CHAIRMAN! I'm hungry and my chef has abandoned me!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "panicking for the first time in his life"}, {"s": "Pantry. Now."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I'm sorry, the WHAT?"}]}, {"k": "act", "t": "He pushes her gently into the walk-in pantry and shuts the door just as Michael strolls in."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Ah! Jollof!"}, {"d": "He sees two plates."}, {"s": "Two plates?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I'm hungry twice."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "narrowing his eyes, picking up a fork"}, {"s": "Since when do you eat dinner? You schedule dinner."}, {"d": "He spots a woman's heel lying under the island. He picks it up slowly."}, {"s": "And since when do you wear a size thirty-eight heel?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "That's Adaeze's."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Adaeze wears flat shoes. She told me she'd rather die than run after you in heels."}]}, {"k": "act", "t": "Michael's phone rings. He glances at the screen, which says \"Script Supervisor\", and declines it fast. It rings again. He answers in a hiss, turning away."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "whispering"}, {"s": "Sophia, I said I'll call you back! …No, I'm not hiding you, I'm just… I'm at Donald's! …Yes, I'll bring the script!"}]}, {"k": "act", "t": "He hangs up and turns around. Donald is standing right behind him with his arms folded."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Sophia."}]}, {"k": "act", "t": "Michael lifts the size thirty-eight heel."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Adaeze."}]}, {"k": "act", "t": "A long, silent standoff. Two men, two secrets, no way out. Then, together:"}, {"k": "line", "who": "MICHAEL & DONALD", "tag": "", "segs": [{"s": "Goodnight."}]}, {"k": "act", "t": "Michael leaves, taking the plate of jollof with him. Donald opens the pantry. Emma is sitting on a bag of rice, crying with laughter."}]}, {"n": 21, "title": "THE PANTRY", "slug": "INT. DONALD'S MANSION — PANTRY / KITCHEN — CONTINUOUS", "time": "19:12–20:13", "items": [{"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "wiping her tears"}, {"s": "You hid me. In a pantry. Next to the Indomie."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "It was strategic."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Why? Why am I a secret, Donald? Are you ashamed of me?"}]}, {"k": "act", "t": "He stops smiling."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "slowly"}, {"s": "When I was fourteen, I swore on a rooftop that I'd never fall in love. Michael and Geoffrey swore too. Twenty-three years. I've never broken a promise in my life."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "quietly"}, {"s": "So what am I?"}]}, {"k": "act", "t": "He looks at her for a long time. Then he steps into the pantry."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You're the first promise I'm afraid I'll break."}]}, {"k": "act", "t": "He kisses her. Slowly, carefully, between shelves of rice and tomato tins. When they part, she smiles."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I'm not hiding in your pantry again."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Noted."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "And you owe me a shoe. Michael stole it."}]}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "That night, Donald Irwin broke the promise he'd kept for twenty-three years. And he told nobody. Not his mother. Not his brothers. Not even himself."}]}]}, {"n": 22, "title": "A VISIT TO ROSS", "slug": "INT. ROSS'S HOUSE, SURULERE — DAY", "time": "20:13–20:52", "items": [{"k": "act", "t": "The house is half empty, with pale squares on the walls where pictures used to hang. Ross is thin, unshaven and jumpy. Emma has brought oranges."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Where's Debby?"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "too fast"}, {"s": "Her sister. Ibadan."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Ross, I need advice. Halbrook. Crestline Logistics. Someone senior is—"}]}, {"k": "act", "t": "Ross's teacup rattles against its saucer."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "grabbing her hand"}, {"s": "Emma. Leave Halbrook. Please. Give it to Mr. Irwin, give it to anybody, and walk away. Promise me."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Ross, are you in trouble?"}]}, {"k": "act", "t": "He lets go and forces a smile."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "I'm just an old man who worries too much."}]}, {"k": "act", "t": "She leaves. Ross pulls a second phone from under a cushion. The message on it reads: \"She's still digging. Fix it, or Debby pays.\""}]}, {"n": 23, "title": "FRAMED", "slug": "INT. EVERYS — BOARDROOM — MORNING", "time": "20:52–21:32", "items": [{"k": "act", "t": "An emergency board meeting. The screen reads: \"LOGIN 2:14 A.M. — ₦600 MILLION MOVED TO CRESTLINE — USER: E.REARDON.\" Emma stands frozen while the board whispers."}, {"k": "line", "who": "BOARD MEMBER", "tag": "", "segs": [{"s": "A junior analyst gets access to Halbrook, and six hundred million naira disappears under her name?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I was asleep at 2 a.m.! I'm the one who FOUND the problem!"}]}, {"k": "line", "who": "BOARD MEMBER", "tag": "", "segs": [{"s": "Perfect way to control an investigation."}]}, {"k": "act", "t": "Every head turns to Donald. He looks at her for a long, painful moment. His face gives away nothing."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Miss Reardon. Your badge."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering, stunned"}, {"s": "You know I didn't do this."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Your badge. Now."}]}, {"k": "act", "t": "Her fingers shake as she unclips it. She walks out with her head high and tears falling."}]}, {"n": 24, "title": "\"YOU DECIDE EVERYTHING\"", "slug": "INT. EVERYS — STAIRWELL — MOMENTS LATER", "time": "21:32–22:25", "items": [{"k": "act", "t": "Emma runs down the stairs. Donald catches up and takes her arm."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Emma, listen. Whoever framed you is in that building. If they think they've won, they'll get careless. You're not fired. You're invisible."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "pulling away"}, {"s": "You used me as bait."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I protected you!"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You DECIDED for me! Again! The guards, the apartment, the pantry, and now this! Did it ever occur to you to ASK me? I would have played along! I would have cried on command! But you don't ask, Donald. You arrange."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Because when I ask, people say no. And then people die!"}]}, {"k": "act", "t": "His voice echoes up the stairwell. Silence."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "softly"}, {"s": "I'm not your father's night, Donald. You can't control me so it never happens again."}]}, {"k": "act", "t": "She walks away. He doesn't follow, because for once he doesn't know what to do."}]}, {"n": 25, "title": "THE TRACKER", "slug": "INT. EMMA'S APARTMENT, LEKKI — NIGHT", "time": "22:25–23:16", "items": [{"k": "act", "t": "A knock. Emma opens the door. JAMES (31) stands there with a guitar on his back."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "James?!"}]}, {"k": "line", "who": "JAMES", "tag": "", "segs": [{"s": "Daddy called me. First time in six years. He said, \"Your sister is in trouble, and she won't talk to me.\""}]}, {"k": "act", "t": "She falls into his arms. Later, they sit on the floor eating Indomie. James picks up her company phone."}, {"k": "line", "who": "JAMES", "tag": "", "segs": [{"s": "Your battery dies fast."}, {"d": "He scrolls."}, {"s": "Emma, what's \"SysLoc\"? It's been running in the background for two weeks. Location. Microphone permission. Sending to an Everys server."}]}, {"k": "act", "t": "Emma takes the phone. She looks at the app and goes pale."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "barely a whisper"}, {"s": "He tracked me."}]}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "Every guard, every driver, every locked door had been love, in the only language Donald knew. But Emma had never learned that language. And she never wanted to."}]}]}, {"n": 26, "title": "THE BREAKUP", "slug": "EXT. DONALD'S MANSION — GATE — NIGHT — HEAVY RAIN", "time": "23:16–24:33", "items": [{"k": "act", "t": "Emma stands in the rain. Donald rushes out with an umbrella, and she pushes it away. She holds up the phone with SysLoc on the screen."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Two weeks. Every step. Every street. Did you listen to my phone calls too? To my brother?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "No. I swear. It was only location. Emma, someone is taking pictures of you—"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "And so were YOU!"}]}, {"k": "act", "t": "Thunder. He has no answer."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You know what the worst part is? I was falling in love with you."}, {"d": "Her voice breaks."}, {"s": "But you don't love me, Donald. You want to own me, like a port. Like a tower. Like everything else you control."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "desperate"}, {"s": "That's not true."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Then let me go."}]}, {"k": "act", "t": "She deletes SysLoc in front of him and presses the phone into his hand."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "If you want to know where I am, ask me."}, {"d": "beat"}, {"s": "That's what people who love you do. They ask."}]}, {"k": "act", "t": "She walks into the rain. He stands there, soaked, holding a phone that can't find her any more."}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "Donald Irwin had controlled every deal of his life. It took one woman walking away in the rain to show him that the only things worth having are the ones you can't control."}]}]}, {"n": 27, "title": "GEOFFREY KNOWS", "slug": "INT. DONALD'S MANSION — STUDY — LATER THAT NIGHT", "time": "24:33–25:32", "items": [{"k": "act", "t": "Donald sits in the dark, still wet. Geoffrey lets himself in and turns on one lamp."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "You look terrible."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "not looking up"}, {"s": "Geoffrey. Can I tell you something? Something I swore…"}]}, {"k": "act", "t": "Geoffrey sits. Donald opens his mouth to confess, and the words don't come."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "…Never mind."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "quietly"}, {"s": "Good. Because I'm not here about a woman."}, {"d": "He opens his laptop."}, {"s": "The 2:14 login used Emma's password, but it came from Terminal 14-01. Ross's office. His key card was swiped at 1:58 a.m."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Ross is on leave."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "His card isn't."}, {"d": "beat"}, {"s": "And Donald, one more thing. Three weeks ago, I did something to protect Everys. Something I didn't tell you about."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "sharp"}, {"s": "What did you do?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "If anyone ever asks you to sign Everys away, sign it. Don't argue. Just sign. And call me."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "What does that even—"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "standing, buttoning his jacket"}, {"s": "You're not the only one with secrets, brother. Goodnight."}]}, {"k": "act", "t": "He leaves. Donald stares after him, completely lost."}]}, {"n": 28, "title": "THE NOTEBOOK", "slug": "INT. EVERYS — ROSS'S OFFICE — 2 AM", "time": "25:32–25:49", "items": [{"k": "act", "t": "Emma sneaks in with Tobi's borrowed badge and a phone torch. Under the bottom drawer, taped flat, she finds a black notebook full of dates and amounts, with \"CRESTLINE\" written again and again in Ross's handwriting."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "breaking"}, {"s": "No. Not you. Not you, Ross."}]}]}, {"n": 29, "title": "THE CONFESSION", "slug": "EXT. ROSS'S HOUSE, SURULERE — RAIN — NIGHT", "time": "25:49–26:47", "items": [{"k": "act", "t": "Emma bangs on the door. Ross opens it, sees the notebook and seems to shrink."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Look at me and say it wasn't you."}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "after a long silence"}, {"s": "It was me."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "WHY?!"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "Debby's father borrowed from the wrong people. Marcus Vane bought the debt. All of it. Then he came smiling. \"Pay me with information, Ross, or Debby pays another way.\""}, {"d": "sobbing"}, {"s": "He sent me photos of her sleeping, Emma. Then he took her. She's not in Ibadan. I don't know where she is."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You framed me!"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "He told me to. I sent the warnings to scare you off! To keep you SAFE!"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "You gave me your pen!"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "on his knees in the rain"}, {"s": "Numbers don't lie, Emma. People do."}, {"d": "He looks up, destroyed."}, {"s": "I'm the people."}]}, {"k": "act", "t": "Emma stands over him, shaking. Then she does what nobody expects. She crouches down in the rain."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Then stop lying. Help me get Debby back, and help me end Marcus Vane."}]}]}, {"n": 30, "title": "ON HER TERMS", "slug": "INT. DONALD'S OFFICE — MORNING", "time": "26:47–27:39", "items": [{"k": "act", "t": "Donald is at the window. The door opens. Emma walks in with Ross behind her. Donald's face moves through relief, longing and then confusion when he sees Ross."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Emma—"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "raising a hand"}, {"s": "I'm not here as your… whatever I was. I'm here as the analyst who found your thief."}, {"d": "She drops the black notebook on his desk."}, {"s": "And I'm here with my terms."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Your terms."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "One. Ross helps us, and he doesn't go to prison until Debby is safe. Two. I lead this investigation. Not you. Three. You don't decide anything about me without asking me first. Nothing."}]}, {"k": "act", "t": "A long pause. Donald Irwin has never accepted anyone's terms in his life."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "quietly"}, {"s": "And if I say no?"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Then you can catch Marcus Vane without the only person who knows how."}]}, {"k": "act", "t": "He looks at her. Then he sits down, which he never does, and he's taking the order."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "…Tell me the plan."}]}]}, {"n": 31, "title": "WHO MARCUS IS", "slug": "INT. DONALD'S OFFICE — CONTINUOUS", "time": "27:39–28:21", "items": [{"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "Marcus has waited twenty years. You bought his father's company."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Vane Haulage. It was bankrupt. I bought it fairly."}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "You bought it, and old Mr. Vane died the next year. Marcus says you killed his father with a signature."}, {"d": "beat"}, {"s": "There's more, sir. But he never told me the rest. He only says, \"Irwin doesn't even know what his own father was carrying.\""}]}, {"k": "act", "t": "Donald goes very still."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "What does that mean?"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "I don't know, sir. But he smiles every time he says it."}]}, {"k": "act", "t": "Emma looks at Donald. For the first time, she sees fear on his face."}]}, {"n": 32, "title": "THE PLAN", "slug": "INT. DONALD'S MANSION — STUDY — NIGHT", "time": "28:21–29:11", "items": [{"k": "act", "t": "Donald, Emma, Michael, Geoffrey and Ross sit around the table. Michael keeps looking from Emma to Donald with an enormous grin."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "whispering to Donald"}, {"s": "Size thirty-eight?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "whispering back"}, {"s": "Script Supervisor?"}]}, {"k": "act", "t": "They both go silent."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Ross feeds Marcus false numbers that make Everys look weak. Marcus will try to buy at Friday's shareholders' meeting. Geoffrey freezes Crestline. Michael brings every camera in Lagos."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "If you're going to destroy a man, do it in good lighting."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "And Donald exposes him live. With evidence."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "And Debby?"}]}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "quietly"}, {"s": "Marcus will move her before Friday. He always moves people where nobody looks."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "to Donald"}, {"s": "Is that okay with you?"}, {"d": "beat"}, {"s": "I'm asking."}]}, {"k": "act", "t": "Donald looks at her. Something in him breaks open."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "It's perfect. Thank you for asking."}]}, {"k": "act", "t": "Michael's jaw drops, and Geoffrey hides a smile. Donald Irwin has just said \"thank you for asking.\""}]}, {"n": 33, "title": "SUYA AND TRAINS", "slug": "EXT. MALLAM ISA'S SUYA STAND, EBUTE-METTA — NIGHT — THURSDAY", "time": "29:11–30:11", "items": [{"k": "act", "t": "Smoke and orange coals under a faded umbrella, with old train tracks behind. Emma sits on a bench beside MALLAM ISA (60s)."}, {"k": "line", "who": "MALLAM ISA", "tag": "", "segs": [{"s": "So you are the one."}, {"d": "He laughs."}, {"s": "Donald has been coming here for twenty-two years. Always alone. Last month, he ordered two."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "smiling sadly"}, {"s": "What was he like? When he was a boy?"}]}, {"k": "line", "who": "MALLAM ISA", "tag": "", "segs": [{"s": "Hungry. Proud. He would count the money in his pocket three times before he asked the price."}, {"d": "beat"}, {"s": "He has never once in his life been late to pay. But he has always been late to rest."}]}, {"k": "act", "t": "Emma laughs softly. A train horn sounds far away."}, {"k": "line", "who": "MALLAM ISA", "tag": "", "segs": [{"s": "You love him."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "I'm angry with him."}]}, {"k": "line", "who": "MALLAM ISA", "tag": "", "segs": [{"d": "turning the meat"}, {"s": "My daughter, those two are cousins."}]}, {"k": "act", "t": "Behind them, in the dark between the train sheds, the black SUV's engine starts."}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "Mallam Isa had watched a hungry boy become a billionaire. He was about to watch that billionaire's whole world taken from his bench."}]}]}, {"n": 34, "title": "TAKEN", "slug": "EXT. EBUTE-METTA STREET — CONTINUOUS", "time": "30:11–30:30", "items": [{"k": "act", "t": "Emma walks to her car holding a wrapped parcel of suya. The SUV screeches up and three masked men jump out. She screams and swings the bag. Mallam Isa runs out shouting and is shoved to the ground. Emma's phone falls in the gutter. The SUV door slams. Tyres scream."}, {"k": "act", "t": "The suya parcel lies on the road, smoke still rising."}]}, {"n": 35, "title": "FRIDAY", "slug": "INT. EVERYS — GRAND HALL — SHAREHOLDERS' MEETING — DAY", "time": "30:30–31:15", "items": [{"k": "act", "t": "Hundreds of shareholders, TV cameras and flashes. MARCUS VANE walks in wearing a white suit and an easy smile. Donald stands at the podium. Emma's seat is empty, and Donald keeps looking at it."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "into the mic"}, {"s": "Ladies and gentlemen. For fourteen months, someone has been stealing from this company to make it cheap enough to buy."}, {"d": "He points."}, {"s": "Marcus Vane."}]}, {"k": "act", "t": "Uproar. Geoffrey's evidence fills the screen. Marcus doesn't flinch. He walks up to the podium as if he owns the stage and slides his phone across to Donald."}, {"k": "act", "t": "On the screen is a VIDEO. Emma is tied to a chair in a dark shed, with bruises on her face."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"d": "smiling for the cameras, whispering"}, {"s": "Sign Everys over to me for one naira by midnight. Or you'll never see her again."}]}, {"k": "act", "t": "He waves to the crowd and leaves. Donald's hand trembles on the podium."}]}, {"n": 36, "title": "POWERLESS", "slug": "INT. EVERYS — BACKSTAGE — CONTINUOUS", "time": "31:15–32:19", "items": [{"k": "act", "t": "Donald stumbles through a door and braces himself against the wall. He can't breathe. Flashback: the kerosene lamp, the policemen, his mother on the floor."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "gasping"}, {"s": "Not again. Not again. Not again."}]}, {"k": "act", "t": "He grabs his phone and opens the tracking dashboard. \"SysLoc — DEVICE NOT FOUND. App deleted.\""}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "laughing bitterly, almost crying"}, {"s": "Of course. Of course she deleted it. Because of me."}]}, {"k": "act", "t": "Michael and Geoffrey burst in."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Donald—"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "exploding"}, {"s": "I love her!"}]}, {"k": "act", "t": "Silence."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I love her. I broke it. The vow. The rooftop. All of it. Take my share. Take the certificate. Take everything I own. Just help me find her."}, {"d": "His voice cracks."}, {"s": "Please. I've never said please to anyone in my life."}]}, {"k": "act", "t": "Michael stares at him. Then he grabs Donald's face with both hands."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "You IDIOT. You think we didn't know? You smile at your phone like a JJC in love!"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "calm, firm"}, {"s": "Rooftop. Promise number five. We protect each other. Whatever it costs."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "opening his mouth"}, {"s": "And Donald, since we're confessing, I also have to tell you—"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "sharply"}, {"s": "Not now, Michael."}]}, {"k": "act", "t": "Michael closes his mouth. His phone buzzes in his pocket. \"Script Supervisor.\" He silences it."}]}, {"n": 37, "title": "THE MESSAGE IN THE VIDEO", "slug": "INT. EVERYS — BACKSTAGE — MOMENTS LATER", "time": "32:19–33:29", "items": [{"k": "act", "t": "Ross bursts in, bloodied and panting."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"s": "They sent another video. Proof of life."}]}, {"k": "act", "t": "They crowd around the phone. Emma, tied and bruised, speaks to the camera while a masked man holds a gun to her side."}, {"k": "line", "who": "EMMA", "tag": "ON VIDEO", "segs": [{"s": "Donald. I'm alive. Do what they say."}, {"d": "She looks straight into the lens."}, {"s": "And tell Mallam Isa I'm sorry I dropped his suya. I can still smell it… even over the trains."}, {"d": "beat"}, {"s": "Read page eleven, Donald. Read it properly this time."}]}, {"k": "act", "t": "The video cuts. Everyone looks confused, except Donald."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Page eleven? Is she delirious?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "slowly, his eyes widening"}, {"s": "No. She's talking to me. In our language."}, {"d": "He paces, thinking aloud."}, {"s": "\"Smell the suya over the trains.\" She's close to Mallam Isa's, near the railway. \"Page eleven.\" Her note on page eleven was about the same day, the same amount, every month."}, {"d": "He grabs Geoffrey."}, {"s": "Halbrook's warehouse lease. Which property does Crestline rent every month?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "typing fast, then freezing"}, {"s": "Shed 11. The old Ebute-Metta railway goods yard. Two hundred metres from Mallam Isa's stand."}]}, {"k": "act", "t": "Donald closes his eyes. Then he laughs once, a broken laugh."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I tracked her for two weeks and found nothing. I listened to her once, and I found her."}]}]}, {"n": 38, "title": "SIGN IT", "slug": "INT. MICHAEL'S RANGE ROVER — NIGHT — SPEEDING", "time": "33:29–34:24", "items": [{"k": "act", "t": "Rain and wipers. Michael drives like a madman. Geoffrey has a laptop on his knees. Donald is on the phone with Marcus."}, {"k": "line", "who": "MARCUS", "tag": "V.O.", "segs": [{"s": "Have you signed?"}]}, {"k": "act", "t": "Donald looks at Geoffrey. Geoffrey nods, very calm."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "whispering"}, {"s": "Remember what I told you. Sign it."}]}, {"k": "act", "t": "A document pops up on Donald's tablet: TRANSFER OF ALL SHARES — EVERYS HOLDINGS LIMITED — TO VANE CAPITAL — CONSIDERATION: ₦1."}, {"k": "act", "t": "Donald hesitates. He's looking at twenty-three years of his life. Then he signs it without another word."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "It's done. Everys is yours. Now let her go."}]}, {"k": "line", "who": "MARCUS", "tag": "V.O.", "segs": [{"d": "delighted"}, {"s": "Twenty years."}, {"d": "beat"}, {"s": "I'll consider it."}]}, {"k": "act", "t": "Click."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "horrified"}, {"s": "Donald, you just gave away EVERYTHING!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "staring at the rain"}, {"s": "I gave away a company. I can build another one."}, {"d": "beat"}, {"s": "I can't build another Emma."}]}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "Twenty-three years earlier, a boy swore he would never be powerless again. Tonight he gave away everything he had, and for the first time in his life, he felt free."}]}]}, {"n": 39, "title": "WHAT HIS FATHER WAS CARRYING", "slug": "INT. SHED 11, RAILWAY GOODS YARD — NIGHT", "time": "34:24–36:05", "items": [{"k": "act", "t": "A huge, dark train shed with rusted carriages. Emma is tied to a chair, and DEBBY is tied up beside her. Emma has been quietly sawing her rope against a sharp edge of a rail spike for an hour. MARCUS VANE enters, triumphant, holding his phone."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "He signed. Everys Conglomerate is mine. For one naira."}, {"d": "laughing"}, {"s": "The great Donald Irwin, finally powerless."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "Why do you hate him this much?"}]}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"d": "pulling up a crate and sitting"}, {"s": "Do you know what his father did for a living? He was a driver for my father. Vane Haulage. Every payday, someone carried the workers' wages from the depot at night. Cash."}, {"d": "beat"}, {"s": "My father was too cheap to pay for a guard. So he sent a driver. Alone."}]}, {"k": "act", "t": "Emma's breath catches."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "That night, robbers stopped him. He refused to hand over the bag. Forty men's wages. Forty families. He fought them, and they killed him."}, {"d": "He smiles coldly."}, {"s": "And my father told the police the driver stole the money himself. His widow never received a kobo."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "horrified"}, {"s": "And Donald doesn't know."}]}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Twenty years later, the driver's son bought my father's company like it was a bag of rice. Never knew whose company it was."}, {"d": "leaning in"}, {"s": "So tonight, I took everything from him. The way he took everything from me."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "steady, despite her tears"}, {"s": "No. Your father stole from a dead man and lied about him. And you've spent your life trying to make the son pay for your father's sin."}, {"d": "beat"}, {"s": "You're not avenging anyone, Marcus. You're just your father, in a nicer suit."}]}, {"k": "act", "t": "Marcus's smile dies. He stands and raises his hand to strike her, and her rope snaps."}]}, {"n": 40, "title": "SHE DOESN'T WAIT TO BE SAVED", "slug": "INT. SHED 11 — CONTINUOUS", "time": "36:05–36:48", "items": [{"k": "act", "t": "Emma swings the broken chair leg and smashes the only hanging work lamp. The shed goes PITCH BLACK."}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "GET HER!"}]}, {"k": "act", "t": "Chaos and shouting. Torches swing. Emma drags Debby behind a rusted carriage. Outside, headlights flood the yard doors. A car horn blasts once, then twice. It's Donald's signal."}, {"k": "act", "t": "Through a crack, Emma sees Donald at the doors. He isn't charging in. He's waiting, looking straight at the dark corner where she's hiding, as if he knows she has a plan."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "whispering to herself, smiling through tears"}, {"s": "He's waiting. He's actually waiting."}]}, {"k": "act", "t": "She flashes Debby's phone torch twice toward the doors, their signal. Donald nods to Inspector Bello's officers, and they pour in."}, {"k": "act", "t": "Marcus grabs a gun from a henchman and aims into the dark toward Emma's torchlight. Ross, unseen until now, throws himself in front of her. BANG. Ross falls, clutching his shoulder."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "ROSS!"}]}, {"k": "act", "t": "Donald crashes into Marcus. The gun skids away. Michael kicks it under a carriage. Inspector Bello cuffs Marcus, who is still laughing."}]}, {"n": 41, "title": "THE EMPTY BOX", "slug": "INT. SHED 11 — MOMENTS LATER", "time": "36:48–37:50", "items": [{"k": "line", "who": "MARCUS", "tag": "", "segs": [{"d": "on his knees, cuffed, laughing"}, {"s": "Arrest me, then! I'll get bail by morning! And when I get out, I'll still own Everys! He signed it! On camera!"}]}, {"k": "act", "t": "Geoffrey steps forward and adjusts his glasses."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "You own Everys Holdings Limited."}]}, {"k": "line", "who": "MARCUS", "tag": "", "segs": [{"s": "Exactly!"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Three weeks ago, I moved every port, every network, every naira of EveryPay and every brick in Eko Atlantic into a new parent company."}, {"d": "beat"}, {"s": "It's called Three Boys Ventures."}, {"d": "He smiles slightly."}, {"s": "Everys Holdings Limited is an empty box, Marcus. You paid one naira for a shell. Which, I believe, is your speciality."}]}, {"k": "act", "t": "Marcus's face collapses. Donald turns slowly to Geoffrey."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You restructured my entire company… without telling me?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "You'd have tried to control it."}]}, {"k": "act", "t": "Michael bursts out laughing. Even Donald, after a moment, laughs. Then he runs to Emma."}, {"k": "line", "who": "NARRATOR", "tag": "", "segs": [{"s": "Three boys had torn one piece of paper into three. Twenty-three years later, that piece of paper had just saved all of them."}]}]}, {"n": 42, "title": "THE TRUTH ABOUT PAPA", "slug": "EXT. RAILWAY GOODS YARD — AMBULANCE LIGHTS — NIGHT", "time": "37:50–38:43", "items": [{"k": "act", "t": "Paramedics load Ross onto a stretcher, and Debby holds his hand. Emma, wrapped in a blanket, catches Ross's hand as he passes."}, {"k": "line", "who": "ROSS", "tag": "", "segs": [{"d": "weakly"}, {"s": "Numbers don't lie, Emma…"}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"s": "But people change."}, {"d": "She kisses his forehead."}, {"s": "Thank you."}]}, {"k": "act", "t": "She turns. Donald stands there in the rain, afraid to touch her, as if she might break or vanish."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "I'm asking this time."}, {"d": "beat"}, {"s": "Can I hold you?"}]}, {"k": "act", "t": "She walks into his arms."}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "into his chest"}, {"s": "Donald… Marcus told me something. About your father."}]}, {"k": "act", "t": "She tells him, and we stay on Donald's face as he hears it. Confusion becomes shock, then grief, and finally a slow, aching pride."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "barely able to speak"}, {"s": "He didn't run. He was carrying forty families' wages, and he didn't run."}, {"d": "He breaks down."}, {"s": "My whole life, I thought he died for nothing. Powerless."}]}, {"k": "line", "who": "EMMA", "tag": "", "segs": [{"d": "holding his face"}, {"s": "He wasn't powerless, Donald. He was the bravest man on that road."}, {"d": "beat"}, {"s": "You get it from him."}]}, {"k": "act", "t": "Donald Irwin, the man who stopped crying at twelve, cries in the rain in her arms."}]}, {"n": 43, "title": "THE PROPOSAL THAT WEN function pickVoices(){

  const ng = vs.filter(v=>/NG/i.test(v.lang));
  const pool = ng.length>=2?ng.concat(vs):vs;
  VO.f = pool.find(v=>fem.test(v.name)&&!/\bmale\b/i.test(v.name.replace(/female/i,""))) || pool[0];

function chunks(t){ return (t.match(/[^.!?…]+[.!?…]*["”’)]*\s*/g)||[t]).map(s=>s.trim()).filter(Boolean); }
function speak(text, who, myRun, onWord){
  return new Promise(async res=>{
    const [,g,p] = cast(who);
    const parts = chunks(text);
    for(const part of parts){
      if(myRun!==runId) return res(false);
      await new Promise(r=>{
        const u = new SpeechSynthesisUtterance(part.replace(/naira/gi,"nyra"));
        u.voice = who==="NARRATOR"||who==="_ACT"? VO.n : (g==="f"?VO.f:VO.m);
        u.pitch = who==="_ACT"?0.95:Math.min(2,Math.max(0.1,p));
        u.rate = (who==="_ACT"?1.08:who==="NARRATOR"?0.9:1) * speed();
        let done=false; const fin=()=>{if(!done){done=true;clearTimeout(to);r();}};
        const to=setTimeout(fin, 2500 + part.split(/\s+/).length*650/speed());
        u.onend=fin; u.onerror=fin;
        u.onboundary=e=>{ if(onWord && e.name!=="sentence") onWord(); };
        synth.speak(u);
      });
    }
    res(myRun===runId);
  });
}
