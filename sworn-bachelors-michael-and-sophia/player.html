<style>
/* Layout: one centred "stage" column like a lit set; scene unfolds line by line; remote-control bar pinned to the bottom. Deliberately single dark look (night-time Lagos, kerosene lamp). */
:root{
  --night:#0e1120; --stage:#161a2c; --stage2:#1d2238; --rule:#2b3150;
  --ink:#efe8db; --muted:#a3a0b4; --faint:#6e6c82;
  --lamp:#e9a23b; --lamp-ink:#1b1306; --blood:#d0525a; --ok:#7fd49a;
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --slug:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:10px 16px 8px}
.hrow{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,26px);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--rule);background:var(--stage);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--lamp)}
.score{font-family:var(--slug);font-size:12px;color:var(--muted)}
.score b{color:var(--lamp)}
.ticks{max-width:820px;margin:8px auto 0;display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.ticks button{height:6px;border:0;border-radius:2px;background:var(--rule);padding:0}
.ticks button.seen{background:color-mix(in srgb,var(--lamp) 45%,var(--rule))}
.ticks button.now{background:var(--lamp)}

main{max-width:820px;margin:0 auto;padding:24px 16px}
.scenehead{padding-block:8px 18px;border-bottom:1px dashed var(--rule);margin-bottom:18px}
.scenehead .num{font-family:var(--slug);color:var(--lamp);font-size:13px;letter-spacing:.12em}
.scenehead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.scenehead .slug{font-family:var(--slug);font-size:13px;color:var(--muted);text-transform:uppercase}
.scenehead .slug span{color:var(--faint)}
.scenehead.enter h2{animation:rise .7s ease both}
@keyframes rise{from{opacity:.2;transform:translateY(8px);letter-spacing:.04em}to{opacity:1;transform:none}}

.feed{display:flex;flex-direction:column;gap:14px}
.it{transition:opacity .3s, transform .3s;opacity:.55}
.it.cur{opacity:1}
.it.fresh{animation:appear .45s ease both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.act{font-style:italic;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 14px;max-width:62ch}
.it.cur.act{border-left-color:var(--lamp);color:var(--ink)}
.line{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--slug);font-weight:700;font-size:13px;color:var(--night);background:var(--c)}
.bub{min-width:0}
.who{font-family:var(--slug);font-weight:700;font-size:12.5px;letter-spacing:.08em;color:var(--c)}
.who em{font-style:normal;color:var(--faint);font-weight:400;margin-left:6px}
.say{background:var(--stage);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:10px 14px;margin-top:4px;font-size:17px;max-width:62ch}
.it.cur .say{border-color:var(--c);background:var(--stage2);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 8px 30px -12px color-mix(in srgb,var(--c) 50%,transparent)}
.dir{color:var(--faint);font-style:italic;font-size:14px}
.word.spoken{color:var(--c)}
.narr .say{background:transparent;border:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);border-radius:0;font-family:var(--display);font-size:20px;line-height:1.35;padding:12px 2px}
.narr .av{background:transparent;border:1px solid var(--lamp);color:var(--lamp)}
.it.cur.narr .say{box-shadow:none;background:transparent;border-color:var(--lamp)}
.card{align-self:center;text-align:center;background:#0a0c16;border:1px solid var(--blood);border-radius:12px;padding:16px 20px;max-width:520px;width:100%}
.card small{display:block;font-family:var(--slug);font-size:11px;letter-spacing:.16em;color:var(--blood);margin-bottom:6px}
.card p{margin:0;font-family:var(--slug);font-size:18px;font-weight:700}
.card.paper{background:#f1e7cf;border-color:#c9b98f;color:#2a2318}
.card.paper small{color:#8a6d2c}
.card.mw{background:transparent;border-color:var(--lamp);border-style:dashed}.card.mw small{color:var(--lamp)}
.titlecard{text-align:center;font-family:var(--display);font-size:clamp(22px,5vw,32px);color:var(--lamp);padding:28px 0;letter-spacing:.02em;text-wrap:balance}

.endbox{margin-top:26px;border:1px solid var(--rule);background:var(--stage);border-radius:16px;padding:18px}
.endbox h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.endbox p{margin:0 0 12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{background:var(--stage2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:left}
.opt:hover{border-color:var(--lamp)}
.opt.pick{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 18%,var(--stage2))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{background:var(--lamp);color:var(--lamp-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.count{font-family:var(--slug);font-size:12px;color:var(--faint)}
.reveal{margin-top:18px;border-radius:14px;padding:14px 16px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--stage))}
.reveal.miss{border-color:var(--blood);background:color-mix(in srgb,var(--blood) 10%,var(--stage))}
.reveal b{font-family:var(--slug);letter-spacing:.1em;font-size:12px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--stage) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dk{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.ctl button{background:var(--stage2);border:1px solid var(--rule);border-radius:999px;width:44px;height:44px;display:grid;place-items:center}
.ctl button:hover{border-color:var(--lamp)}
.ctl .play{width:60px;height:60px;background:var(--lamp);border:0;color:var(--lamp-ink)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl .play svg{width:26px;height:26px}
.opts2{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.opts2 label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts2 select{background:var(--stage2);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:3px 6px;font:inherit}
.nowline{font-family:var(--slug);font-size:12px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.drawer{position:fixed;inset:0;z-index:10;display:flex;justify-content:flex-end;background:rgba(5,6,12,.6)}
.drawer .pane{width:min(420px,100%);height:100%;background:var(--stage);border-left:1px solid var(--rule);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
.pane h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sl{display:flex;flex-direction:column;gap:2px}
.sl button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px}
.sl button:hover{background:var(--stage2)}
.sl button.now{background:color-mix(in srgb,var(--lamp) 16%,transparent)}
.sl .n{font-family:var(--slug);color:var(--lamp);font-size:12px}
.sl .t{min-width:0}
.sl .tm{font-family:var(--slug);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sl .seen .t::after{content:" ✓";color:var(--ok);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--night);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.hint{color:var(--faint);font-size:13px;text-align:center;margin-top:28px}
kbd{font-family:var(--slug);border:1px solid var(--rule);border-radius:4px;padding:0 4px;font-size:12px}
@media (max-width:520px){.score{display:none}.say{font-size:16px}.line{grid-template-columns:34px 1fr;gap:10px}.av{width:34px;height:34px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

hael. Six billion naira. I want the breakdown."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "No."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "We merged so we could stop hiding things from each other."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Then you go first. Geoffrey moved money last month. Who did he move it to?"}]}, {"k": "act", "t": "Geoffrey adjusts his glasses and says nothing."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Geoffrey?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "calm"}, {"s": "It's handled."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "throwing up his hands"}, {"s": "You see? Everybody has a secret except me, and I'm the one being audited!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You fired Dapo this morning. It's on every blog. That's eleven million followers who won't buy a ticket."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I've built my career on firing people who waste my time, Donald. That's what you two paid for."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "quietly"}, {"s": "We paid for a brother. Lately we're getting a stranger."}]}, {"k": "act", "t": "Silence. Michael stands and buttons his jacket."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I have a writer to deal with."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "\"Deal with\"?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "She's suing my studio. I'll crush her by lunch."}]}]}, {"n": 4, "title": "THE WOMAN WHO WASN'T IMPRESSED", "slug": "INT. McCLAREN STUDIOS — MICHAEL'S OFFICE — DAY", "time": "2:31–3:50", "items": [{"k": "act", "t": "Posters of his blockbuster films line the walls, with awards on shelves. Sophia sits in HIS chair behind HIS desk, reading her own screenplay, which has his red pen all over it. Michael walks in and stops."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "You're in my chair."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "You're in my story."}]}, {"k": "act", "t": "He blinks. Nobody talks to him like this."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Miss Bennett, I'm a busy man—"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "I know. I've been watching you be busy for six hours."}, {"d": "She holds up the script."}, {"s": "Page ninety-two. In my story, the fisherman goes to sea and never comes back. His wife stands on the beach every evening until the sun disappears. That's the last horizon."}, {"d": "beat"}, {"s": "In YOUR version, he comes back with a boat full of gold and buys a mansion in Lekki."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "People don't pay to cry, Miss Bennett. They pay to hope."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "My father didn't come back with gold. He didn't come back at all."}, {"d": "She stands."}, {"s": "You can't make his death a happy ending because it sells better."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "smiling, smooth"}, {"s": "Name your price. Fifty million. A hundred. You'll never write another word in your life."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "walking right up to him"}, {"s": "That's the problem with men like you. You think everything has a price because everything you love does."}]}, {"k": "act", "t": "She drops the script on his chest and walks to the door."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "My lawyer will call your lawyer. Have a nice day, Mr. Director."}]}, {"k": "act", "t": "The door closes. Michael stands frozen, still holding the script against his chest. Kola peeks in."}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Should I call legal?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "still staring at the door"}, {"s": "No."}]}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Sir?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Call her back."}, {"d": "beat"}, {"s": "Hire her."}]}]}, {"n": 5, "title": "THE FISHERMAN'S DAUGHTER", "slug": "INT. MAMA BENNETT'S SMALL HOUSE, BADAGRY — EVENING", "time": "3:50–4:36", "items": [{"k": "act", "t": "A tiny, neat sitting room. An old photo of a smiling fisherman hangs on the wall. MAMA BENNETT fries fish. Sophia waves a letter."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "He wants to hire me, Mama! Co-writer on set. Every day. With HIM."}]}, {"k": "line", "who": "MAMA BENNETT", "tag": "", "segs": [{"s": "The man who stole your story?"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "The most arrogant man in Nigeria. He fired an actor for being twenty minutes late."}]}, {"k": "line", "who": "MAMA BENNETT", "tag": "", "segs": [{"d": "turning the fish"}, {"s": "Your father was never late for the sea. Not one day."}, {"d": "beat"}, {"s": "He was only late for us."}]}, {"k": "act", "t": "Sophia goes quiet. She looks at the photo."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "That's exactly why I can't stand him. He's married to his work, like Papa was married to the sea."}]}, {"k": "line", "who": "MAMA BENNETT", "tag": "", "segs": [{"s": "Then go and take your story back from him."}, {"d": "beat"}, {"s": "And don't fall into his sea, my daughter."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "laughing"}, {"s": "Mama. Please. Never."}]}]}, {"n": 6, "title": "HE FORGOT TO SAY \"ACTION\"", "slug": "EXT. THE LAST HORIZON SET — BADAGRY BEACH — DAY", "time": "4:36–5:04", "items": [{"k": "act", "t": "The cameras are rolling and the crew is ready. Michael sits in his chair, and Sophia sits on a crate beside him with a notebook. The new lead actor waits in the boat."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "Sir, we're ready."}]}, {"k": "act", "t": "Michael is watching Sophia, who is mouthing the lines along with the actor and wiping a tear."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "Sir? …Sir! Everyone is waiting for \"Action.\""}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "snapping back"}, {"s": "Cut!"}]}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "Sir, we haven't started."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Then… action! Action. Yes. Action."}]}, {"k": "act", "t": "Sophia raises an eyebrow. Kola, behind them, notices everything and keeps his face blank."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "whispering"}, {"s": "The great Michael McClaren forgot how to start a scene?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "whispering back"}, {"s": "The great Michael McClaren was thinking about the ending."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "My ending?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "after a beat"}, {"s": "…I haven't decided whose ending yet."}]}]}, {"n": 7, "title": "THE MAN WHO NEVER FORGIVES", "slug": "INT. McCLAREN STUDIOS — EDITING SUITE — 2 AM", "time": "5:04–6:09", "items": [{"k": "act", "t": "Only the screens light the dark room. Michael and Sophia sit close, watching rough footage of the fishing boat sailing into the sunset. Takeaway jollof containers are on the desk."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "Why are you like this? Everyone on that set is afraid of you."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Good. Afraid people don't steal."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "Who stole from you?"}]}, {"k": "act", "t": "A long silence. He pauses the footage."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "My first film. Enugu. I was twenty-two. My producer, Chuka, my best friend in that city, took the master tape to Lagos and released it under his own name."}, {"d": "beat"}, {"s": "Then my fiancée left me for a man with a yacht."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "And?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "And I spent five years buying every company Chuka worked for and firing him from each one."}, {"d": "He smiles, but there's no warmth in it."}, {"s": "He sells phones in Alaba now."}, {"d": "beat"}, {"s": "I never forgive, Sophia. Not once. Not anybody."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "softly"}, {"s": "That's not strength, Michael. That's a scar you're proud of."}]}, {"k": "act", "t": "He turns to look at her. They're very close. Neither moves away."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "You're the only person who talks to me like that."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "You're the only person who needs it this badly."}]}, {"k": "act", "t": "He leans in. She leans in. The door bangs open."}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Sir, the investors moved the call to—"}, {"d": "He stops."}, {"s": "…Sorry. Wrong time."}]}, {"k": "act", "t": "Kola backs out. His face is blank, but he looks at Sophia a second too long."}]}, {"n": 8, "title": "\"ASKING FOR A FRIEND\"", "slug": "INT. FILM SET — BEHIND A TRAILER — NIGHT", "time": "6:09–7:04", "items": [{"k": "act", "t": "Michael is on the phone, grinning. Sophia waits beside the trailer, holding his jacket. (This is Part One, Scene 13, seen from Michael's side.)"}, {"k": "line", "who": "DONALD", "tag": "ON PHONE", "segs": [{"s": "If a man can't stop thinking about… a report. Written by a person."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Donald. Is this \"report\" wearing heels?"}]}, {"k": "line", "who": "DONALD", "tag": "ON PHONE", "segs": [{"s": "Goodnight, Michael."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "laughing into the dead line"}, {"s": "Donald! DONALD! Are you breaking the—"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "Michael, are you coming or not?"}]}, {"k": "act", "t": "Michael spins around in panic and hisses at her."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Sophia! I said wait in the car!"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "arms folded"}, {"s": "Why? Who was that?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "My brother."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "And your brother can't know I exist?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "lowering his voice"}, {"s": "Sophia. Seven years ago, on a rooftop, my brothers and I swore that none of us would ever fall in love. Whoever breaks it first has to confess like a fool and give up his share of our first company."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "slowly"}, {"s": "So I'm a secret."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "You're not a secret. You're… a strategy."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "handing him his jacket hard"}, {"s": "Then strategise your own way home."}]}]}, {"n": 9, "title": "THE FIRST EMPTY CHAIR", "slug": "INT. CANDLELIT RESTAURANT, VICTORIA ISLAND — NIGHT", "time": "7:04–7:20", "items": [{"k": "act", "t": "A beautiful table by the window. Sophia sits in a red dress, her phone face up beside a small cake with \"Happy Birthday, Sophia\" written on it. The chair opposite is empty. 8:00. 8:40. 9:30. A WAITER hovers."}, {"k": "line", "who": "WAITER", "tag": "", "segs": [{"s": "Madam, should we… still wait?"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "forcing a smile"}, {"s": "He's a director. He's always late. Just one more glass of water."}]}]}, {"n": 10, "title": "THE DEAL", "slug": "INT. McCLAREN STUDIOS — CONFERENCE ROOM — SAME NIGHT — INTERCUT", "time": "7:20–7:46", "items": [{"k": "act", "t": "Michael is on a giant video call with MR. HARGREAVES of a foreign streaming platform. His phone buzzes over and over on the table with \"Script Supervisor.\" He turns it face down."}, {"k": "line", "who": "MR. HARGREAVES", "tag": "ON SCREEN", "segs": [{"s": "Michael, we're prepared to take The Last Horizon global. Two hundred countries. But we need the happy ending. Families don't subscribe to grief."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "not even hesitating"}, {"s": "The happy ending stays. You have my word."}]}, {"k": "line", "who": "MR. HARGREAVES", "tag": "ON SCREEN", "segs": [{"s": "And the writer? I hear she's difficult."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "after a tiny pause"}, {"s": "The writer is handled."}]}, {"k": "act", "t": "The phone buzzes again. He doesn't turn it over. Kola, sitting beside him, sees the screen and says nothing."}]}, {"n": 11, "title": "\"IT WAS MY BIRTHDAY\"", "slug": "EXT. RESTAURANT — VICTORIA ISLAND — 11:15 PM", "time": "7:46–8:43", "items": [{"k": "act", "t": "Sophia walks out holding the uneaten cake. Michael's car screeches to the kerb. He jumps out with his tie loose, glowing with excitement."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Sophia! I'm sorry, I'm sorry! But listen. Two hundred countries! The Last Horizon is going GLOBAL! Do you know what this means?"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "very calm"}, {"s": "Do you know what today means?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "It means everything we—"}, {"d": "He sees the cake."}, {"s": "\"Happy Birthday, Sophia.\""}, {"d": "The excitement drains out of him."}, {"s": "…Oh, God."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "Three hours, Michael. And when you finally came, the first thing out of your mouth was a deal."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Sophia, I'll make it up to you. Tomorrow, I'll fly you anywhere. Dubai. Paris—"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "I don't want Paris! I want a man who remembers I exist when there's no camera on me!"}]}, {"k": "act", "t": "She pushes the cake into his hands."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "My father missed every birthday I ever had because the sea was always more important. I swore I'd never love a man like that."}, {"d": "Her voice breaks."}, {"s": "And look at me."}]}, {"k": "act", "t": "She gets into a taxi. Michael stands on the pavement holding a birthday cake, the most powerful director in Nigeria and completely powerless."}]}, {"n": 12, "title": "\"STILL SWORN\"", "slug": "EXT. AJEGUNLE ROOFTOP — ROOFTOP NIGHT — (PART ONE, SCENE 17)", "time": "8:43–9:26", "items": [{"k": "act", "t": "Fairy lights and three leather chairs. Michael's phone keeps lighting up in his pocket with \"Script Supervisor.\" He flips it face down."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Still sworn?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "a tiny pause"}, {"s": "Still sworn."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Still sworn."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "too loud"}, {"s": "Still sworn!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "leaning in, aggressive"}, {"s": "Who's \"Script Supervisor\", Michael? She calls you eleven times a day."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "She… supervises scripts."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "At 2 a.m.?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Scripts don't sleep, Donald! And who's YOUR \"report\"? You blush when your phone buzzes!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "That's business."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Business! Everything is \"business\" with you two! Geoffrey moves billions and says \"it's handled\"! You hide your phone like a teenager! And I'm the one on trial?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "standing, buttoning his jacket"}, {"s": "I have an early board meeting."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "It's SATURDAY!"}]}, {"k": "act", "t": "Geoffrey is gone. Donald and Michael stare at each other, two liars with nowhere left to go."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "quietly"}, {"s": "Rule four, Michael."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "just as quietly"}, {"s": "Rule four, Donald."}]}]}, {"n": 13, "title": "THE SHOE", "slug": "INT. MICHAEL'S G-WAGON — NIGHT — DRIVING (AFTER PART ONE, SCENE 22)", "time": "9:26–10:18", "items": [{"k": "act", "t": "Michael drives with one hand, eating jollof from Donald's plate. A woman's size thirty-eight heel sits on the passenger seat. He's on speakerphone with Sophia, laughing hard."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Sophia, listen! DONALD IRWIN is hiding a woman in his kitchen! I have her SHOE!"}]}, {"k": "line", "who": "SOPHIA", "tag": "ON PHONE", "segs": [{"d": "laughing despite herself"}, {"s": "The serious one? The one who schedules his lunch?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "12:07, every day! And tonight there were two plates of jollof!"}]}, {"k": "line", "who": "SOPHIA", "tag": "ON PHONE", "segs": [{"s": "So tell Geoffrey. Win your little rooftop game."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "the laugh fading"}, {"s": "I can't."}]}, {"k": "line", "who": "SOPHIA", "tag": "ON PHONE", "segs": [{"s": "Why not?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Because he heard me say your name. Donald knows about you, and I know about her. If I expose him, he exposes me."}]}, {"k": "line", "who": "SOPHIA", "tag": "ON PHONE", "segs": [{"d": "quietly"}, {"s": "So we're both somebody's secret."}, {"d": "beat"}, {"s": "Are you still angry I left on my birthday?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I'm angry I made you leave."}]}, {"k": "act", "t": "A soft silence on the line."}, {"k": "line", "who": "SOPHIA", "tag": "ON PHONE", "segs": [{"s": "That's the first nice thing you've ever said without a camera nearby."}]}]}, {"n": 14, "title": "THE RULES", "slug": "INT. MICHAEL'S TRAILER — FILM SET — NIGHT", "time": "10:18–10:52", "items": [{"k": "act", "t": "Michael paces. Sophia sits on the sofa, unimpressed."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Tomorrow, Donald and Geoffrey are visiting the set. Investor visit. So for one day, we're not… whatever we are."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "What are we pretending to be?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Enemies. You're the writer suing me. You hate me. Be cold. Be rude. Insult me if you have to."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "a slow, dangerous smile"}, {"s": "Insult you?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "…Not too much."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "Michael, I've been rehearsing for this role since the day I met you."}]}]}, {"n": 15, "title": "THE WORST ACTOR IN NIGERIA", "slug": "EXT. THE LAST HORIZON SET — DAY", "time": "10:52–11:33", "items": [{"k": "act", "t": "Donald and Geoffrey walk onto the set in suits, with Kola guiding them. Sophia is at the monitor. Michael meets them, too cheerful."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Brothers! Welcome! This is…"}, {"d": "He gestures at Sophia stiffly."}, {"s": "…that writer. The one suing us."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "ice cold, not looking up"}, {"s": "Mr. McClaren. Your continuity is a disaster, your actors sound like adverts and your shirt is an insult to fabric."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "eyebrows rising"}, {"s": "Ah."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "overacting"}, {"s": "HOW DARE YOU, madam!"}, {"d": "He steps back dramatically, trips over a camera cable and nearly falls into the monitor."}, {"s": "…I am FINE. Totally fine."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "trying not to laugh"}, {"s": "You see? He can't even walk on his own set."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "quietly, to Donald"}, {"s": "He's never tripped on a set in fifteen years."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "watching Michael closely"}, {"s": "No. He hasn't."}]}, {"k": "act", "t": "Sophia hands Michael a script page. Their fingers touch. He jumps as if it burned him."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Thank you, Sophia, my lo— my… lawyer. My lawyer will contact you."}]}, {"k": "act", "t": "Long silence. Donald folds his arms."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "\"Script Supervisor.\""}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "sweating"}, {"s": "Don't."}]}]}, {"n": 16, "title": "THE BROTHERS EXPLODE", "slug": "INT. MICHAEL'S TRAILER — MOMENTS LATER", "time": "11:33–12:41", "items": [{"k": "act", "t": "Donald shuts the door. Geoffrey leans against the wall. The three brothers are crammed into a small trailer."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "Your budget is six billion naira over, you've fired the biggest actor in Nigeria, the insurers are asking questions, and you're on set flirting with the woman who's SUING YOU?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I am not flirting!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You called her \"my love.\""}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I called her \"my lawyer\"!"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You said \"my lo—\" and then you invented a lawyer!"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "exploding"}, {"s": "And YOU? You want to talk about rule four? Halbrook is bleeding money, you're hiding a size thirty-eight heel in your kitchen, and you've got the nerve to stand in my trailer and—"}]}, {"k": "act", "t": "He stops himself. Too late. Donald goes very still."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "slowly"}, {"s": "What heel?"}]}, {"k": "act", "t": "Donald and Michael look at each other. Silence."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "cold"}, {"s": "Nothing."}, {"d": "to Michael"}, {"s": "We'll discuss your budget in the boardroom. Like businessmen."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Like brothers, you mean? Oh no, we stopped doing that."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "opening the door"}, {"s": "I'm leaving before someone says something they can't take back."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "You never say ANYTHING, Geoffrey! That's your whole personality!"}]}, {"k": "act", "t": "Geoffrey stops in the doorway without turning around."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "quietly"}, {"s": "Some of us are protecting more than a film, Michael."}]}, {"k": "act", "t": "He leaves. Donald follows. Michael kicks the trailer wall, hard."}]}, {"n": 17, "title": "THE EMAIL SHE WASN'T SUPPOSED TO SEE", "slug": "INT. McCLAREN STUDIOS — MICHAEL'S OFFICE — 1 AM", "time": "12:41–13:05", "items": [{"k": "act", "t": "Michael has given Sophia his laptop and password so she can finish the rewrites overnight while he's at the investor dinner. She's alone in the dark, typing. A new email notification slides in. It's FROM: Michael McClaren, TO: Investors, SUBJECT: The Writer."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "reading aloud, her voice slowly dying"}, {"s": "\"The writer is irrelevant. Once filming ends, the story belongs to the studio. Her name will be removed from the credits. Let her sue. She can't afford it.\""}, {"d": "beat"}, {"s": "\"— M.\""}]}, {"k": "act", "t": "She reads it again. Her hand covers her mouth. She looks at the photo of her father on her phone, then back at the screen."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "through tears"}, {"s": "\"Irrelevant.\""}]}, {"k": "act", "t": "Her jaw sets. She opens the studio's internal email folder labelled \"LAST HORIZON — CHANGES\", selects everything, attaches her original screenplay and types an address: gist@lagosgistqueen.ng."}, {"k": "act", "t": "Her finger hovers over SEND. A long pause."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "You taught me this, Michael. Betray me once…"}]}, {"k": "act", "t": "She presses SEND."}]}, {"n": 18, "title": "\"DEAD TO ME\"", "slug": "INT. McCLAREN STUDIOS — MICHAEL'S OFFICE — THE NEXT NIGHT", "time": "13:05–14:11", "items": [{"k": "act", "t": "We're back in Scene 1, continuing the moment. Rain, screens and the blogs."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "barely a whisper"}, {"s": "…I don't know."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "holding up her phone to show the email"}, {"s": "\"The writer is irrelevant.\" Did you think I'd never see it?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "reading it, confused"}, {"s": "I never wrote this."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "It's from your account, Michael!"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I was at the investor dinner! I didn't touch my phone all night!"}, {"d": "He slams the phone down."}, {"s": "But YOU went through my laptop. My private files. I gave you my password, Sophia. I've never given ANYONE my password."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "And I've never given anyone my father's story! You stole it first!"}]}, {"k": "act", "t": "Kola enters with two security guards. His face is grave."}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Sir. Mr. Hargreaves has pulled the deal. Two other investors too. And Mr. Irwin is on line one. He's… shouting."}]}, {"k": "act", "t": "Michael looks at Sophia for a long, terrible moment. Then the ruthless director comes back. His voice goes flat and cold."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Kola. Ban her from every McClaren set. Freeze her payments. Sue her for two billion naira."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "stunned"}, {"s": "Michael—"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "You know my rule."}, {"d": "He turns his back to her."}, {"s": "Betray me once, and you're dead to me."}]}, {"k": "act", "t": "Security steps forward. Sophia walks out on her own and stops at the door."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "without turning around"}, {"s": "My father died at sea, Michael. You're dying on land. You just don't know it yet."}]}, {"k": "act", "t": "She's gone. Behind Michael's back, Kola allows himself the smallest smile."}]}, {"n": 19, "title": "HE CAN'T DELETE HER", "slug": "INT. EDITING SUITE — 3 AM", "time": "14:11–14:31", "items": [{"k": "act", "t": "Michael sits alone in the dark, watching footage of Sophia at the table read, laughing, crying over her father's scene and correcting him. His finger hovers over DELETE ALL."}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"d": "in the doorway"}, {"s": "Delete it, sir. She's poison."}]}, {"k": "act", "t": "Michael doesn't move."}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Sir, you've destroyed men for less. Chuka. Dapo. A hundred others. Delete her."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "very quietly"}, {"s": "Leave me, Kola."}]}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Sir—"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "roaring"}, {"s": "LEAVE ME!"}]}, {"k": "act", "t": "Kola leaves. Michael presses PLAY again. On screen, Sophia says, \"Every evening, my mother stood on the beach until the horizon swallowed the sun.\" He mouths the words along with her."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "whispering to the screen"}, {"s": "Why can't I hate you?"}]}]}, {"n": 20, "title": "\"I STILL LOVE HIM\"", "slug": "INT. MAMA BENNETT'S HOUSE, BADAGRY — NIGHT", "time": "14:31–15:13", "items": [{"k": "act", "t": "Sophia sits on the floor with her head in her mother's lap."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "I betrayed him, Mama. I sent the emails. I wanted to hurt him the way he hurt me."}]}, {"k": "line", "who": "MAMA BENNETT", "tag": "", "segs": [{"d": "stroking her hair"}, {"s": "Hurt people throw stones, my daughter. Even good people."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "He's suing me for two billion naira."}]}, {"k": "line", "who": "MAMA BENNETT", "tag": "", "segs": [{"s": "And?"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "her voice cracking"}, {"s": "And I still love him."}, {"d": "beat"}, {"s": "What kind of fool still loves the man who's destroying her?"}]}, {"k": "line", "who": "MAMA BENNETT", "tag": "", "segs": [{"s": "The same kind who stood on that beach every evening for twenty years, waiting for a boat."}, {"d": "She smiles sadly."}, {"s": "It runs in our family."}]}, {"k": "act", "t": "Sophia's phone buzzes. It's a news alert: \"BREAKING: Confidential Last Horizon footage leaked online. Insurance cancelled. McClaren Studios in crisis.\""}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "sitting up, confused"}, {"s": "Footage? I didn't send any footage."}]}]}, {"n": 21, "title": "THE SABOTAGE GETS WORSE", "slug": "INT. McCLAREN STUDIOS — CONFERENCE ROOM — DAY", "time": "15:13–15:57", "items": [{"k": "act", "t": "Chaos. Michael, Kola, Bisi and lawyers are all there. Screens show the leaked footage everywhere."}, {"k": "line", "who": "BISI", "tag": "", "segs": [{"s": "The camera crane malfunctioned this morning, sir. It nearly fell on the crew."}]}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "And the leaked footage came from a login with Miss Bennett's credentials. There's also…"}, {"d": "He slides a paper across."}, {"s": "…a transfer. Five million naira from a studio account, to a man named Femi Bennett. Her cousin."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "staring at the paper"}, {"s": "She's banned. She has no access."}]}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Her credentials do, sir. Maybe she had a partner."}, {"d": "beat"}, {"s": "Sir, I'm sorry. She fooled all of us."}]}, {"k": "act", "t": "Michael picks up the paper. His hand is shaking."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "to himself"}, {"s": "The emails, I understand. But the crane? People could have died."}]}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Hurt women do crazy things, sir."}]}, {"k": "act", "t": "Michael looks up at Kola for a long beat. Something flickers, and then it's gone."}]}, {"n": 22, "title": "3 A.M., IN THE RAIN", "slug": "EXT. MAMA BENNETT'S GATE, BADAGRY — 3 AM — RAIN", "time": "15:57–17:01", "items": [{"k": "act", "t": "Michael stands at the gate, soaked, without an umbrella or a driver. Sophia opens the door and freezes."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "You came to serve me more court papers? At 3 a.m.?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Did you leak the footage?"}, {"d": "beat"}, {"s": "Did you touch the crane?"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "walking into the rain to face him"}, {"s": "No. I sent the emails. Only the emails. And I'm sorry. I'm sorry I did it. But I would NEVER put your crew in danger. Never."}]}, {"k": "act", "t": "He searches her face."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I've destroyed people for less than what you did. I know exactly how to ruin you. I have the lawyers, the money, the blogs."}, {"d": "His voice breaks."}, {"s": "So why am I standing in the rain outside your mother's gate at 3 a.m.?"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "softly"}, {"s": "Because you're not the man you pretend to be."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I don't know how to forgive, Sophia. I've never done it. Not once. I don't even know what it feels like."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "touching his wet face"}, {"s": "It feels like this. Like standing in the rain when you could be dry."}]}, {"k": "act", "t": "He kisses her desperately. Then he pulls away, shaking, and walks back to his car without a word. She stands in the rain, confused and heartbroken."}]}, {"n": 23, "title": "\"NOT NOW, MICHAEL\"", "slug": "INT. EVERYS — BACKSTAGE — DAY — (PART ONE, SCENE 36)", "time": "17:01–17:30", "items": [{"k": "act", "t": "Donald is pressed against the wall, wrecked. Emma has been kidnapped. Michael and Geoffrey are with him. Michael's phone buzzes with a message from \"Script Supervisor\": \"Tonight, 8pm. Same restaurant. Last chance, Michael. If you don't come, I'm leaving Lagos.\""}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "broken"}, {"s": "I love her. I broke the vow. Take my share. Just help me find her. Please."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "grabbing his face"}, {"s": "You idiot. You think we didn't know?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "We protect each other. Whatever it costs."}]}, {"k": "act", "t": "Michael looks at his phone, then at Donald, then back at the phone."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "And Donald, since we're confessing, I also have to tell you—"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "sharply"}, {"s": "Not now, Michael."}]}, {"k": "act", "t": "Michael closes his mouth. He looks at Sophia's message one last time, puts the phone away and grabs his car keys."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "to Donald"}, {"s": "My car. Let's go get her."}]}]}, {"n": 24, "title": "THE SECOND EMPTY CHAIR", "slug": "INT. THE SAME RESTAURANT, VICTORIA ISLAND — NIGHT", "time": "17:30–17:43", "items": [{"k": "act", "t": "The same table and the same window. Sophia waits, without a red dress this time, just a travel bag under the table. 8:00. 9:00. 10:30. 11:45. The candle burns down to nothing."}, {"k": "line", "who": "WAITER", "tag": "", "segs": [{"s": "Madam, we're closing."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "quietly"}, {"s": "I know."}, {"d": "She stands and looks at the empty chair."}, {"s": "He'll always choose something bigger than me."}]}, {"k": "act", "t": "She types on her phone: \"Goodbye, Michael.\" Send. She leaves the chair empty and walks out with her bag."}]}, {"n": 25, "title": "\"WHEN IS IT ME?\"", "slug": "EXT. MAMA BENNETT'S HOUSE, BADAGRY — DAWN", "time": "17:43–18:33", "items": [{"k": "act", "t": "A taxi waits, loaded with bags. Michael's car screeches up. He jumps out still wearing last night's clothes, dirty and exhausted, with a cut on his hand."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Sophia! Wait! I couldn't come last night! My brother… Donald's… someone he loves was taken. We were in a railway yard in Ebute-Metta until 4 a.m."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "turning, surprised, then softening"}, {"s": "Is she alright?"}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "She's alive. She's safe."}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "quietly"}, {"s": "I'm glad."}, {"d": "beat"}, {"s": "Then you did the right thing."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "So you'll stay?"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "No."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "stunned"}, {"s": "Sophia—"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "Last night it was your brother. And I understand. But before that it was the deal, before that the film, and before that the investors. And next time it will be your vow."}, {"d": "beat"}, {"s": "There's always something bigger, Michael. When is it ME?"}]}, {"k": "act", "t": "He has no answer. She gets into the taxi."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "And you're still suing me for two billion naira."}]}, {"k": "act", "t": "The taxi drives away. Michael stands in the dust, alone."}]}, {"n": 26, "title": "\"SOMEONE SITTING CLOSE TO YOU\"", "slug": "INT. McCLAREN STUDIOS — MICHAEL'S OFFICE — DAY", "time": "18:33–19:33", "items": [{"k": "act", "t": "Michael sits at his desk with Sophia's goodbye text open. Geoffrey enters quietly and closes the door."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "I've been looking into your sabotage. Quietly. Like I do everything."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "not looking up"}, {"s": "It's Sophia. Her credentials, her cousin, the transfer."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "Her credentials were copied from inside McClaren Studios. From a computer on this floor."}, {"d": "He sets down a printout."}, {"s": "The footage leaked from a studio terminal at a time when Sophia was in Badagry. I checked her phone records. She hasn't left her mother's house in a week."}]}, {"k": "act", "t": "Michael slowly looks up."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"s": "And the email she saw, \"the writer is irrelevant\"? It was sent from your account at 12:58 a.m. on the night of the investor dinner."}, {"d": "beat"}, {"s": "Michael, you were sitting next to me at that dinner. Your phone was in your pocket the whole night. I watched it."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "standing slowly"}, {"s": "Then who…"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "quietly"}, {"s": "The leak isn't outside, Michael."}, {"d": "He looks at the empty chair beside Michael's desk, the one Kola always sits in."}, {"s": "It's someone sitting close to you."}]}]}, {"n": 27, "title": "THE THIRD BROTHER", "slug": "INT. McCLAREN STUDIOS — MICHAEL'S OFFICE — NIGHT", "time": "19:33–20:53", "items": [{"k": "act", "t": "A trap. Michael sits casually. Kola enters with two coffees, just like every night for fifteen years."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Kola. The master copy of the film. The only one. I'm moving it to the vault at Geoffrey's bank tomorrow at 6 a.m. Nobody else knows."}]}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"s": "Good idea, sir. Safer."}]}, {"k": "act", "t": "He leaves. A moment later, Geoffrey's laptop on the side table lights up: \"Intercepted call — K. Badmus → V. Adekunle (Apex Studios).\""}, {"k": "line", "who": "KOLA", "tag": "ON RECORDING", "segs": [{"s": "Victor, the master moves at six. Get your people ready. And after this, McClaren is finished. You promised me my own studio."}]}, {"k": "act", "t": "Michael closes his eyes. Then he calls out quietly."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Kola. Come back in."}]}, {"k": "act", "t": "Kola returns and sees the laptop. His face drops."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Fifteen years. Enugu. The weddings. You carried my cameras when I couldn't afford a bus."}, {"d": "His voice is shaking."}, {"s": "Why?"}]}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"d": "bitter, all the politeness gone"}, {"s": "Fifteen years, and you never once put my name on a poster. \"A Michael McClaren film.\" Always Michael. Victor offered me my own studio. My OWN name."}, {"d": "beat"}, {"s": "You have two brothers already, Michael. Donald and Geoffrey. You never had room for a third."}]}, {"k": "act", "t": "Silence. That one landed."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "You faked the email. You framed her. You let me destroy the woman I—"}]}, {"k": "line", "who": "KOLA", "tag": "", "segs": [{"d": "smirking"}, {"s": "You did that yourself, sir. I only gave you a reason. You were always so ready to believe people betray you."}]}, {"k": "act", "t": "Michael stands. Every ruthless instinct in him rises. He walks right up to Kola, fists clenched. Then he stops."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "quietly"}, {"s": "The old Michael would spend five years ruining you."}, {"d": "He opens the door. Two POLICE OFFICERS wait outside."}, {"s": "But I've got somewhere more important to be."}]}]}, {"n": 28, "title": "THE LAST LIE ON THE ROOFTOP", "slug": "EXT. AJEGUNLE ROOFTOP — ROOFTOP NIGHT — (PART ONE, SCENE 45)", "time": "20:53–21:54", "items": [{"k": "act", "t": "Fairy lights. Donald has just confessed and handed over his piece of the certificate. Everyone is laughing. Emma waits by the stairs. Michael's phone buzzes with a message from \"Script Supervisor ❤️\": \"Where are you? You promised you'd tell them tonight.\""}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "raising his glass"}, {"s": "Well. One down."}, {"d": "turning to Geoffrey"}, {"s": "Still sworn?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "pause"}, {"s": "…Still sworn."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "too loud, his heart breaking as he says it"}, {"s": "STILL SWORN!"}]}, {"k": "act", "t": "Under the table, he turns his phone off. Donald watches him over his glass and says nothing."}, {"k": "act", "t": "LATER. Michael's apartment, 1 a.m. Sophia sits on his sofa in the dark. She's back, and his heart leaps."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Sophia! You came back. The lawsuit's gone, I cancelled it, I've been trying to tell you—"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "quietly"}, {"s": "I know. Geoffrey called me. He told me about Kola."}, {"d": "beat"}, {"s": "And then I waited for you to tell your brothers about me. Tonight. Like you promised."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "I was going to. I swear. But Donald had just confessed, and everyone was laughing, and I—"}]}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "You said \"still sworn.\""}, {"d": "Her eyes fill with tears."}, {"s": "I forgave you for the lawsuit. I forgave you for my birthday. I even forgave you for my father's ending. But I can't keep being the woman you're ashamed to be seen with."}]}, {"k": "act", "t": "She puts his spare key on the table."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"s": "You're a brilliant director, Michael. You've controlled every scene of your life."}, {"d": "beat"}, {"s": "Except the one where you choose me."}]}, {"k": "act", "t": "She walks out. This time he doesn't chase her. He sits in the dark and looks at the framed piece of the old ₦3,000 certificate on his wall."}]}, {"n": 29, "title": "THE PREMIERE", "slug": "INT. LAGOS GRAND CINEMA — PREMIERE OF \"THE LAST HORIZON\" — NIGHT", "time": "21:54–23:32", "items": [{"k": "act", "t": "Red carpet, flashing cameras and a packed hall of a thousand people. Donald and Emma sit in the front row, and Geoffrey sits beside them. In the very back row, half hidden, is Sophia, with Mama Bennett holding her hand tightly so she can't leave. Michael walks onto the stage. The crowd goes quiet."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Good evening. Tonight was supposed to be a story about a fisherman who comes home rich. That's the version I sold to the world."}, {"d": "beat"}, {"s": "It was a lie."}]}, {"k": "act", "t": "Murmurs in the hall."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "This film was written by Sophia Bennett."}, {"d": "The screen behind him reads: \"WRITTEN BY SOPHIA BENNETT.\""}, {"s": "Her father went to sea and never came back. Every evening, her mother stood on the beach until the horizon swallowed the sun. I changed that ending because I thought sadness wouldn't sell."}, {"d": "beat"}, {"s": "Tonight, you'll see the real ending."}]}, {"k": "act", "t": "In the back row, Mama Bennett squeezes Sophia's hand. Sophia is crying."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Sophia once betrayed me. And I was ready to destroy her for it, because that's who I was. A man who never forgave anybody."}, {"d": "beat"}, {"s": "But I betrayed her first. I took her father's story and sold it, and I hid her like a secret because of a promise I made with my brothers on a rooftop in Ajegunle."}]}, {"k": "act", "t": "In the front row, Donald and Geoffrey slowly turn to look at each other."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "So tonight, in front of a thousand people, two brothers and every camera in Lagos, I'm breaking that promise."}, {"d": "He looks straight at the back row."}, {"s": "I love Sophia Bennett. I've loved her since she sat in my chair and told me I was in her story."}, {"d": "beat"}, {"s": "Sophia. You asked me, \"When is it me?\""}, {"d": "His voice breaks."}, {"s": "It's you. Tonight, it's you, in front of everyone."}]}, {"k": "act", "t": "Silence. Then a woman stands up in the back row. Every head and every camera turns. Sophia walks slowly down the long aisle and stops at the foot of the stage."}, {"k": "line", "who": "SOPHIA", "tag": "", "segs": [{"d": "tears and a small smile"}, {"s": "You're late again, Mr. Director."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "kneeling at the edge of the stage"}, {"s": "I know. But for once, I'm early for something that matters."}]}, {"k": "act", "t": "She reaches up. He takes her hand and helps her onto the stage, and they kiss in front of a thousand people. The hall explodes with applause. In the front row, Emma claps hardest. Donald laughs and shakes his head. Geoffrey takes off his glasses and wipes them, slowly."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "to Geoffrey, over the noise"}, {"s": "Script Supervisor."}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "almost smiling"}, {"s": "I've known for months."}]}]}, {"n": 30, "title": "TWO DOWN", "slug": "EXT. AJEGUNLE ROOFTOP — NIGHT — ONE WEEK LATER", "time": "23:32 — END", "items": [{"k": "act", "t": "The three leather chairs and fairy lights. Michael stands before his brothers holding his framed piece of the old ₦3,000 certificate. Sophia and Emma sit on the steps, laughing and sharing suya."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "By the rules of this rooftop. I, Michael McClaren, confess. I fell in love. I broke the vow."}, {"d": "He places his piece on the table."}, {"s": "And by the way, Donald, I found your woman's shoe first. I just want that on record."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "laughing"}, {"s": "And I heard \"Sophia\" first."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"d": "serious now"}, {"s": "And brothers… no more secrets. Not about women, not about money, not about anything. My budget, my sabotage, my mistakes. Everything goes on the table. That's how we started, and that's how we finish."}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "putting his hand on Michael's shoulder"}, {"s": "Agreed. No more secrets."}]}, {"k": "act", "t": "They both turn to Geoffrey. He stands at the edge of the rooftop with his back to them, looking at the lights of Ikoyi, where his father's mansion still stands."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Geoffrey?"}]}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"s": "You heard him. No more secrets."}]}, {"k": "act", "t": "Long pause."}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "without turning"}, {"s": "Still sworn."}]}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Geoffrey…"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "turning, forcing a calm smile"}, {"s": "I said, still sworn."}]}, {"k": "act", "t": "His phone buzzes. He glances at it, and for the first time in his life, Geoffrey Durose's hand trembles. Michael and Donald see it."}, {"k": "line", "who": "DONALD", "tag": "", "segs": [{"d": "quietly"}, {"s": "Geoffrey. What's wrong?"}]}, {"k": "act", "t": "Geoffrey answers the phone and puts it to his ear. A woman's voice comes through, calm and cold."}, {"k": "line", "who": "OLIVIA", "tag": "ON PHONE", "segs": [{"s": "Mr. Durose. My name is Olivia Hart. My father died helping build the fortune you inherited."}, {"d": "beat"}, {"s": "And I think your father killed him."}]}, {"k": "act", "t": "Geoffrey slowly lowers the phone. Michael and Donald stare at him."}, {"k": "line", "who": "MICHAEL", "tag": "", "segs": [{"s": "Geoffrey. Who was that?"}]}, {"k": "line", "who": "GEOFFREY", "tag": "", "segs": [{"d": "barely a whisper"}, {"s": "…The end of my family."}]}, {"k": "title", "t": "THE SWORN BACHELORS. PART THREE: GEOFFREY × OLIVIA. \"THE SECRET OF DUROSE.\""}, {"k": "end", "t": "END"}]}];

let VO = {f:null,m:null,n:null};
function pickVoices(){
  if(!synth) return;
  const vs = synth.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!vs.length) return;
  const fem=/female|samantha|karen|moira|tessa|zira|susan|hazel|serena|victoria|fiona|libby|sonia|aria|jenny|ezinne|abeo|google uk english female|natasha|catherine/i;
  const mal=/male|daniel|david|mark|alex|george|rishi|fred|guy|ryan|thomas|oliver|arthur|google uk english male|william|james/i;
  const ng = vs.filter(v=>/NG/i.test(v.lang));
  const pool = ng.length>=2?ng.concat(vs):vs;
  VO.f = pool.find(v=>fem.test(v.name)&&!/\bmale\b/i.test(v.name.replace(/female/i,""))) || pool[0];
  VO.m = pool.find(v=>mal.test(v.name)&&!/female/i.test(v.name)) || pool.find(v=>v!==VO.f) || pool[0];
  VO.n = pool.find(v=>/en-GB/i.test(v.lang)&&mal.test(v.name)&&!/female/i.test(v.name)) || VO.m;
}
if(synth){ pickVoices(); synth.onvoiceschanged = pickVoices; }

function chunks(t){ return (t.match(/[^.!?…]+[.!?…]*["”’)]*\s*/g)||[t]).map(s=>s.trim()).filter(Boolean); }
function speak(text, who, myRun, onWord){
  return new Promise(async res=>{
    const [,g,p] = cast(who);
    const parts = chunks(text);
    for(const part of parts){
      if(myRun!==runId) return res(false);
      await new Promise(r=>{
        const u = new SpeechSynthesisUtterance(part.replace(/naira/gi,"nyra"));
        u.voice = who==="NARRATOR"||who==="_ACT"? VO.n : (g==="f"?VO.f:VO.m);
        u.pitch = who==="_ACT"?0.95:Math.min(2,Math.max(0.1,p));
        u.rate = (who==="_ACT"?1.08:who==="NARRATOR"?0.9:1) * speed();
        let done=false; const fin=()=>{if(!done){done=true;clearTimeout(to);r();}};
        const to=setTimeout(fin, 2500 + part.split(/\s+/).length*650/speed());
        u.onend=fin; u.onerror=fin;
        u.onboundary=e=>{ if(onWord && e.name!=="sentence") onWord(); };
        synth.speak(u);
      });
    }
    res(myRun===runId);
  });
}
const wait = (ms,myRun)=>new Promise(r=>setTimeout(()=>r(myRun===runId),ms));

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function initials(w){ if(w==="NARRATOR") return "◉"; return w.replace(/^(YOUNG|DR\.|MRS\.|INSPECTOR) /,"").split(/\s+/).map(x=>x[0]).join("").slice(0,2); }

function renderItem(it,i){
  const d=document.createElement("div"); d.className="it"; d.dataset.i=i;
  if(it.k==="act"){ d.classList.add("act"); d.textContent=it.t; }
  else if(it.k==="line"){
    const [c]=cast(it.who); d.classList.add("line"); if(it.who==="NARRATOR") d.classList.add("narr");
    d.style.setProperty("--c",c);
    const body = it.segs.map(s=> s.d?`<span class="dir">(${esc(s.d)})</span> `: s.s.split(/(\s+)/).map(w=>/\S/.test(w)?`<span class="word">${esc(w)}</span>`:w).join("")+" ").join("");
    d.innerHTML=`<div class="av" aria-hidden="true">${initials(it.who)}</div><div class="bub"><div class="who">${esc(it.who)}${it.tag?`<em>${esc(it.tag)}</em>`:""}</div><div class="say">${body}</div></div>`;
  }
  else if(it.k==="card"){ d.classList.add("card"); if(it.who==="ON PAPER") d.classList.add("paper"); if(it.who==="MEANWHILE") d.classList.add("mw"); d.innerHTML=`<small>${it.who==="ON PAPER"?"WRITTEN NOTE":it.who==="MEANWHILE"?"MEANWHILE":"ON SCREEN"}</small><p>${esc(it.t)}</p>`; }
  else { d.classList.add("titlecard"); d.textContent=it.t; }
  d.addEventListener("click",()=>{ const was=playing; stop(); li=i; draw(); if(was) play(); });
  return d;
}

function drawHead(anim){

  const h=$("head"); h.className="scenehead"+(anim?" enter":"");
  h.innerHTML=`<div class="num">SCENE ${s.n} OF ${SCENES.length} · ${esc(s.time)}</div><h2>${esc(s.title)}</h2><div class="slug">${esc(s.slug)}</div>`;
}
function draw(anim){
  const s=SCENES[si], feed=$("feed");
  const have = feed.dataset.si==si ? feed.children.length : 0;
  if(feed.dataset.si!=si){ feed.innerHTML=""; feed.dataset.si=si; drawHead(true); }
  while(feed.children.length>li+1) feed.lastChild.remove();
  for(let i=feed.children.length;i<=li;i++){ const el=renderItem(s.items[i],i); if(i>=have) el.classList.add("fresh"); feed.appendChild(el); }
  [...feed.children].forEach((el,i)=>el.classList.toggle("cur",i===li));
  drawEnd(); ticks(); list();
  const cur=feed.children[li]; if(cur) cur.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  const it=s.items[li]; $("nowTxt").textContent=`Scene ${s.n} · ${it.k==="line"?it.who+": ":""}${lineText(it)}`.slice(0,140);
  store.set("si",si);
}
function atEnd(){ return li>=SCENES[si].items.length-1; }

function pollFor(n){ return $("optPolls").checked ? POLLS.find(p=>p.at===n && answers[p.id]===undefined) : null; }
function revealsFor(n){ return POLLS.filter(p=>p.rev===n && answers[p.id]!==undefined); }
function updateScore(){
  const done=POLLS.filter(p=>answers[p.id]!==undefined && seen.has(SCENES.findIndex(s=>s.n===p.rev)) && revealedOnce.has(p.id));
  const right=done.filter(p=>answers[p.id]===p.a).length;
  $("score").innerHTML=done.length?`Detective score <b>${right}/${done.length}</b>`:"";
}
let revealedOnce = new Set(store.get("rev",[]));

let countdown=null;
function drawEnd(){
  const box=$("end"); box.innerHTML=""; clearInterval(countdown);
  if(!atEnd()) return;
  const n=SCENES[si].n;
  revealsFor(n).forEach(p=>{
    revealedOnce.add(p.id); store.set("rev",[...revealedOnce]);
    const ok=answers[p.id]===p.a;
    const r=document.createElement("div"); r.className="reveal"+(ok?"":" miss");
    r.innerHTML=`<b>${ok?"YOU CALLED IT":"PLOT TWIST"}</b><div>You guessed “${esc(p.o[answers[p.id]])}”. ${esc(p.why)}</div>`;
    box.appendChild(r);
  });
  updateScore();
  const p=pollFor(n);
  if(p){
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<h3>${esc(p.q)}</h3><p>Lock in your guess. The answer comes later in the story.</p><div class="opts">${p.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div class="row"><button class="btn ghost" id="skipPoll">Skip</button><span class="count" id="cd"></span></div>`;
    box.appendChild(b);
    b.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ answers[p.id]=+o.dataset.i; store.set("ans",answers); o.classList.add("pick"); toast("Guess locked in. Keep watching…"); setTimeout(()=>{ if(playing) nextScene(true); else drawEnd(); },700); });
    $("skipPoll").onclick=()=>{ answers[p.id]=-1; store.set("ans",answers); nextScene(playing); };
    if(playing){ let t=15; $("cd").textContent=`Story continues in ${t}s`; countdown=setInterval(()=>{ t--; if($("cd")) $("cd").textContent=`Story continues in ${t}s`; if(t<=0){ clearInterval(countdown); if(answers[p.id]===undefined){answers[p.id]=-1;store.set("ans",answers);} if(playing) nextScene(true);} },1000); }
    return;
  }
  if(si<SCENES.length-1){
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<p>Up next · Scene ${SCENES[si+1].n}</p><h3>${esc(SCENES[si+1].title)}</h3><div class="row"><button class="btn" id="goNext">Continue</button></div>`;
    box.appendChild(b); $("goNext").onclick=()=>nextScene(playing);
  } else {
    const right=POLLS.filter(p=>answers[p.id]===p.a).length;
    const b=document.createElement("div"); b.className="endbox";
    b.innerHTML=`<h3>The end of Part Two</h3><p>You guessed ${right} of ${POLLS.length} twists correctly.</p><div class="row"><button class="btn" id="restart">Watch again from Scene 1</button></div>`;
    box.appendChild(b); $("restart").onclick=()=>{ answers={}; store.set("ans",answers); revealedOnce=new Set(); store.set("rev",[]); goScene(0); };
  }
}

function goScene(i, keepPlaying){ const was=keepPlaying??playing; stop(); si=Math.max(0,Math.min(SCENES.length-1,i)); li=0; seen.add(si); store.set("seen",[...seen]); draw(true); window.scrollTo({top:0}); if(was) play(); }
function nextScene(keep){ if(si<SCENES.length-1) goScene(si+1,keep); else stop(); }

async function runLoop(){
  const my=++runId;
  while(my===runId){
    const s=SCENES[si], it=s.items[li];
    const text=lineText(it);
    const useVoice = $("optVoice").checked && synth && (it.k!=="act" || $("optAct").checked);
    let ok;
    if(useVoice){
      const who = it.k==="line"? it.who : "_ACT";
      const el=$("feed").children[li]; const ws=el?[...el.querySelectorAll(".word")]:[]; let wi=0;
      ok = await speak(text, who, my, ()=>{ if(ws[wi]) ws[wi++].classList.add("spoken"); });
      if(ok) ws.forEach(w=>w.classList.add("spoken"));
      ok = ok && await wait(250/speed(),my);
    } else {
      ok = await wait(Math.max(1400, words(text)*(it.k==="act"?230:300))/speed() + 400, my);
    }
    if(!ok) return;
    if(!atEnd()){ li++; draw(); continue; }
    if(pollFor(s.n)) return; // poll handles continuation with countdown
    if(si>=SCENES.length-1){ stop(); return; }
    if(!(await wait(1800,my))) return;
    nextScene(true); return;
  }
}

let lock=null;
async function play(){ playing=true; setIcon(); try{ lock = await navigator.wakeLock?.request("screen"); }catch(e){} if(atEnd() && pollFor(SCENES[si].n)){ drawEnd(); return; } if(atEnd()&&si<SCENES.length-1){ nextScene(true); return; } drawEnd(); runLoop(); }
function stop(){ playing=false; runId++; clearInterval(countdown); if(synth) synth.cancel(); setIcon(); try{lock?.release();}catch(e){} lock=null; const c=$("cd"); if(c) c.textContent=""; }
function setIcon(){ $("playIco").innerHTML = playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>'; $("bPlay").setAttribute("aria-label",playing?"Pause":"Play"); }

function step(d){ const was=playing; stop(); const s=SCENES[si];
  if(d>0){ if(!atEnd()) li++; else if(!pollFor(s.n)) { nextScene(was); return; } }
  else { if(li>0) li--; else if(si>0){ goScene(si-1,false); li=SCENES[si].items.length-1; draw(); } }
  draw(); if(was) play(); }

function ticks(){ const t=$("ticks"); if(!t.children.length){ SCENES.forEach((s,i)=>{const b=document.createElement("button"); b.title=`Scene ${s.n}: ${s.title}`; b.setAttribute("aria-label",b.title); b.onclick=()=>goScene(i); t.appendChild(b);}); }
  [...t.children].forEach((b,i)=>{ b.className=(i===si?"now":seen.has(i)?"seen":""); }); }
function list(){ const l=$("sl"); if(!l.children.length){ SCENES.forEach((s,i)=>{ const b=document.createElement("button"); b.innerHTML=`<span class="n">${String(s.n).padStart(2,"0")}</span><span class="t">${esc(s.title)}</span><span class="tm">${esc(s.time.split("–")[0].split(" ")[0])}</span>`; b.onclick=()=>{ $("drawer").hidden=true; goScene(i); }; l.appendChild(b); }); }
  [...l.children].forEach((b,i)=>{ b.classList.toggle("now",i===si); b.classList.toggle("seen",seen.has(i)&&i!==si); }); }

let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2200); }

$("bPlay").onclick=()=> playing?stop():play();
$("bNext").onclick=()=>step(1); $("bPrev").onclick=()=>step(-1);
$("bNextS").onclick=()=>nextScene(playing); $("bPrevS").onclick=()=>goScene(si-1);
$("openList").onclick=()=>{ $("drawer").hidden=false; const n=$("sl").querySelector(".now"); n&&n.scrollIntoView({block:"center"}); };
$("closeList").onclick=()=>$("drawer").hidden=true;
$("drawer").onclick=e=>{ if(e.target.id==="drawer") $("drawer").hidden=true; };
document.addEventListener("keydown",e=>{
  if(e.target.closest("select,input")) return;
  if(e.code==="Space"){ e.preventDefault(); playing?stop():play(); }
  else if(e.key==="ArrowRight") step(1); else if(e.key==="ArrowLeft") step(-1);
  else if(e.key==="Escape") $("drawer").hidden=true;
});
document.addEventListener("visibilitychange",async()=>{ if(playing && document.visibilityState==="visible"){ try{ lock=await navigator.wakeLock?.request("screen"); }catch(e){} } });

if(si>=SCENES.length) si=0;
seen.add(si);
draw(true);
if(si>0) toast(`Welcome back. You're on Scene ${SCENES[si].n}.`);
</script>
